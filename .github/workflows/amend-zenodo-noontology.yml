name: Amend Zenodo (No Ontology)

on:
  push:
    paths:
      - 'zenodo-release/noontology/amend/**'
  workflow_dispatch:

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install --quiet requests
      - name: Amend metadata
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python3 zenodo-release/noontology/amend/amend.py
