name: Build site from papers.yml

on:
  push:
    branches: [ main ]
    paths:
      - "papers.yml"
      - "cases.yml"
      - "build.py"
      - "indexnow.py"
      - "gen_knowledge_pack.py"
      - "gen_hf_dataset.py"
      - "push_hf.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install deps
        run: pip install pyyaml
      - name: Build
        run: python3 build.py
      - name: Build knowledge pack
        run: python3 gen_knowledge_pack.py
      - name: Build HF dataset files
        run: python3 gen_hf_dataset.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-build site from papers.yml"
            git push
          fi
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "HF_TOKEN not set, skip"; exit 0; fi
          pip install huggingface_hub -q
          python3 push_hf.py
      - name: Submit to IndexNow
        if: always()
        run: |
          sleep 20
          python3 indexnow.py || true
