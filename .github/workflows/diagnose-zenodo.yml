name: Diagnose Zenodo State
# 只读诊断：查概念记录下所有版本与草稿状态。不写入、不发布。
on:
  push:
    paths:
      - '.github/workflows/diagnose-zenodo.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Query Zenodo versions
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          T = os.environ["ZENODO_TOKEN"]
          H = {"Authorization": "Bearer " + T}
          API = "https://zenodo.org/api/deposit/depositions"
          for concept, name in [("23766352", "思想显影库"),
                                ("24436102", "不做本体论"),
                                ("22088570", "论纲第一篇"),
                                ("22783959", "论纲第二篇"),
                                ("22785124", "论纲第三篇")]:
              print("=" * 60)
              print(f"■ {name}  concept={concept}")
              r = requests.get(API, headers=H,
                               params={"q": f"conceptrecid:{concept}", "size": 50,
                                       "sort": "mostrecent", "all_versions": "true"},
                               timeout=90)
              print("  list HTTP", r.status_code)
              if r.status_code != 200:
                  print("  ", r.text[:200]); continue
              d = r.json()
              hits = d.get("hits", {}).get("hits") if isinstance(d, dict) else d
              print("  条数:", len(hits or []))
              for x in (hits or []):
                  m = x.get("metadata") or {}
                  print(f"  id={x.get('id')} state={x.get('state')} "
                        f"ver={m.get('version')} doi={x.get('doi')} "
                        f"files={len(x.get('files') or [])} date={m.get('publication_date')}")
                  print("     title:", (m.get("title") or "")[:70])
          PY

      - name: Dump specific records
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests
          T = os.environ["ZENODO_TOKEN"]
          H = {"Authorization": "Bearer " + T}
          for rid in ["24124184", "24466465", "24499779", "24499784", "24499789"]:
              r = requests.get(f"https://zenodo.org/api/deposit/depositions/{rid}", headers=H, timeout=60)
              if r.status_code != 200:
                  print(rid, "HTTP", r.status_code); continue
              d = r.json(); m = d["metadata"]
              print(f"{rid} | state={d.get('state')} | ver={m.get('version')} | doi={d.get('doi')} | concept={d.get('conceptrecid')}")
              print("   title:", m.get("title", "")[:90])
              print("   files:", [f.get("filename") for f in (d.get("files") or [])])
          PY
