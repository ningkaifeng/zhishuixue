name: Fix Zenodo Old Links

on:
  push:
    paths:
      - 'zenodo-fix/**'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install --quiet requests
      - name: Fix old links in Zenodo v1 records
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python3 zenodo-fix/fix_oldlinks.py
