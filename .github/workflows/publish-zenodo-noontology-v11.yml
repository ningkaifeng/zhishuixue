name: Publish Zenodo (No Ontology v1.1)

on:
  push:
    paths:
      - 'zenodo-release/noontology/v11/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: pip install --quiet requests
      - name: Publish new version
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: python3 zenodo-release/noontology/v11/publish.py
