name: Query Zenodo (one-off)
on:
  push:
    paths:
      - 'zenodo-query/**'
  workflow_dispatch:
jobs:
  q:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - run: python3 zenodo-query/query.py
