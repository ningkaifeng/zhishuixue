<noscript><div class="static-list"><h2>全部判例（42 篇）</h2><p class="stat">以下为静态目录，便于搜索引擎与未启用 JavaScript 的读者浏览。</p><ul><li><a href="cases/A-0001.html">A-0001｜业委会秘书“八个严禁”制度边界</a><span class="m"> A 基层治理 · 制度边界</span><div class="a">面对业委会秘书角色法规依据不足、职责泛化、利益冲突风险显现的困局，制度设计者不追求一步到位立法，而是以负面清单形式划出八条不可触碰的行为底线，用“方舟操作”先守住资金、信息、决策权等核心功能，为后续规范管理提供基础性制度支撑。</div><div class="k">接口：方舟（底线守护） ｜ 杠杆：划底线</div></li><li><a href="cases/A-0002.html">A-0002｜鲸鱼大楼酬金制账目困局</a><span class="m"> A 基层治理 · 账目与资金</span><div class="a">面对酬金制小区物业不公开账目、业主拒缴物业费的恶性循环，业委会秘书不直接对抗物业，而是通过强制分项公开、组建业主志愿者核查小组、建立共管账户，把道德质问转化为技术核对，以公开促信任，重建缴费意愿。</div><div class="k">接口：疏浚（源头改造） ｜ 杠杆：开信息</div></li><li><a href="cases/A-0003.html">A-0003｜长白229街坊充电桩困局</a><span class="m"> A 基层治理 · 公共收益与设施</span><div class="a">面对老旧小区新能源车充电需求激增、私拉电线安全隐患突出、电力容量不足的困局，社区工作者不禁止、不放任，而是统一规划共享充电方案，引入运营商负责安装维护收费，把个体需求转化为公共资源分配问题，在空间与电力双重约束下实现安全与刚需的平衡。</div><div class="k">接口：疏浚（源头改造） ｜ 杠杆：改路径</div></li><li><a href="cases/A-0004.html">A-0004｜九里片区“九合一”拆墙并院困局</a><span class="m"> A 基层治理 · 空间改造与合并</span><div class="a">面对九个院落拆墙并院时居民对“改后利益受损”的想象，牵头人不硬推、不投票、不搞一刀切，而是按“先做通谁、再带动谁”的次序，先立骨干示范，再一户一策回应停车、采光等具体顾虑，并以“同心亭”面对面协商、“三尺巷”式互换促成各退一步，把利益受损的想象转化为可当面交换的具体利益，适用于分歧在“改后利益分配”而非“改不改”、且有可动员骨干的场景。</div><div class="k">接口：疏浚（源头改造） ｜ 杠杆：排次序</div></li><li><a href="cases/B-0001.html">B-0001｜瞒天过海</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对对方情报网络严密、正面行动风险过高的局面，决策者不秘密行动、不正面对抗，而是把真实意图隐藏在公开常规动作中，管理对方的信号识别阈值，使其“常见则不疑”，在对方意怠窗口内完成关键部署，以最小成本实现目标。</div><div class="k">接口：信号层（祭祀逆向） ｜ 杠杆：藏信息</div></li><li><a href="cases/B-0002.html">B-0002｜围魏救赵</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对正面救援成本过高、坐视不救又危及自身存续的两难，决策者不直接赴援，而是攻击对方必救的薄弱环节，迫使其主动改变部署，以间接路线解除危机，同时保全自身实力。</div><div class="k">接口：疏浚（改变压力流向） ｜ 杠杆：改优先级</div></li><li><a href="cases/B-0003.html">B-0003｜借刀杀人</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对敌人已明、正面出手损耗巨大而第三方态度未定的局面，决策者不亲自出手、不与第三方正面结盟，而是识别并激化第三方与敌人之间的矛盾，诱导第三方出手（引友杀敌），借第三方之力削弱敌人，自己保存实力、坐收其成。</div><div class="k">接口：疏浚（转换出力者） ｜ 杠杆：借第三方</div></li><li><a href="cases/B-0004.html">B-0004｜以逸待劳</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对敌方主动进攻、锐气正盛而正面迎击损耗巨大的局面，决策者不主动出击、不消极避战，而是退守有利态势、养精蓄锐，等待对方攻势的衰减拐点（锐气耗尽、补给不济），再以逸击劳、一击致命，适用于己方有地势与时间资本、敌方劳师袭远不可持久的场景。</div><div class="k">接口：分层异步（等对方动能衰减） ｜ 杠杆：等衰减</div></li><li><a href="cases/B-0005.html">B-0005｜趁火打劫</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对敌方已陷入内乱、无暇他顾的窗口，决策者不正面强攻、不点火造势，而是识别敌方因危机暴露的存续命脉，就势出手夺取本属于敌方的利益，得手即收、不引火烧身，适用于敌方危机为“真火”、且火势不会反噬自身的场景。</div><div class="k">接口：响应缺口（趁对方响应崩溃） ｜ 杠杆：乘危机</div></li><li><a href="cases/B-0006.html">B-0006｜声东击西</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对敌方重兵防守真实目标、正面强攻受挫的局面，决策者不硬攻真目标、不真打假方向，而是制造声势逼真的假动作（声东）把敌方防守引到错误方向，再趁真实目标空虚突然转攻（击西），适用于敌方有明确防守重点、真假目标存在空间差、假信号能调动对方的场景。</div><div class="k">接口：响应错位（引导对方部署错位） ｜ 杠杆：调兵力</div></li><li><a href="cases/B-0007.html">B-0007｜无中生有</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对箭矢耗尽、正面无法补充的绝境，决策者不硬拼、不硬守，而是先用假信号（草人）骗得真利（箭），再用假信号的反复磨钝对方的警觉，最后用真动作（敢死队）乘虚突袭，适用于对方有可被反复假信号磨钝的固定响应、且真假难辨的场景。</div><div class="k">接口：响应钝化（磨钝对方敏感度） ｜ 杠杆：养脱敏</div></li><li><a href="cases/B-0008.html">B-0008｜暗渡陈仓</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">面对正面栈道断绝、对方重兵把守的困境，决策者不硬修栈道、不坐守，而是用明修栈道把对方的注意力锁死，再从偏僻的陈仓道暗渡突袭，适用于对方有明确的、可被锁定的关注点、且存在对方忽视的暗路的场景。与声东击西的区别是：声东击西是调动对方移动，暗渡陈仓是锁定对方不动。</div><div class="k">接口：响应锁定（被钉在假方向） ｜ 杠杆：铺明线</div></li><li><a href="cases/B-0009.html">B-0009｜隔岸观火</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">袁绍死后二子相争，曹操按兵不动、坐观内斗。精妙不在不动手，而在划清系统边界——看准火在“袁家子系统”里烧、自己不在其内，才敢隔岸；等二袁自耗殆尽，逐个击破。</div><div class="k">接口：结构判断（系统边界） ｜ 杠杆：划系统边界</div></li><li><a href="cases/B-0010.html">B-0010｜笑里藏刀</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">郑武公欲伐胡，不硬攻，先嫁女结亲、再当众诛杀主张伐胡的大夫关其思，让胡君认定郑国把自己当亲兄弟、从此不备，最后袭胡灭之。精妙在用两个“善意证据”主动制造“亲善”共识、解除对方戒备，而非隐藏敌意；与瞒天过海（利用已有惯性）相对，这是祭祀（共识凝聚）的正向运用。</div><div class="k">接口：祭祀（共识凝聚） ｜ 杠杆：制造亲善共识</div></li><li><a href="cases/B-0011.html">B-0011｜李代桃僵</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">刘邦被困荥阳、粮尽，损失已不可避免。部将纪信主动假扮刘邦、乘黄屋车从东门“降”，把楚军注意力全部吸走，刘邦率数十骑从西门脱身，纪信被项羽烧死。精妙在损失落点的重定向——把必然的损失精准砸在可替代的替身（阴）上、保全不可替代的核心（阳）。与围魏救赵（疏浚·压力向）、借刀杀人（疏浚·出力向）同属疏浚三向，此为损失向。</div><div class="k">接口：疏浚（损失重定向） ｜ 杠杆：改损失落点</div></li><li><a href="cases/B-0012.html">B-0012｜顺手牵羊</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">前秦苻坚号称百万大军压境，东晋谢玄仅八万兵隔淝水对峙。谢玄不正面决战，先看准微隙（苻坚骄狂、秦军厌战、大军一动就乱），再派人激苻坚“暂退一箭之地”，百万大军一退即乱，晋军乘乱追击、顺手收割辎重，把“挡住秦军”的主目标放大成“击溃秦军”。精妙在“顺手”——捕捉对方移动中露出的微隙，顺手取利，不因小失大；与趁火打劫（趁大乱取大利）相对，这是抓微隙、取微利的微缺口变体。</div><div class="k">接口：响应微隙（趁小疏忽顺手取利） ｜ 杠杆：乘微隙</div></li><li><a href="cases/B-0013.html">B-0013｜打草惊蛇</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">刘备为报关羽之仇率大军伐吴，连营数百里，陆逊兵力居下风。陆逊不全线强攻、不死守，而是先派一军攻蜀军一营、故意试探虚实，虽不利却因此摸清蜀军“依山傍林、草木茂密”的致命破绽（“吾已晓破之之术”），随即令士兵各持茅草火攻，火烧连营，大破刘备。精妙在“疑以叩实、察而后动”——用小规模试探把藏敌虚实叩出来、再对症下药；与瞒天过海（造假信号骗对方）相对，这是发试探信号读对方。</div><div class="k">接口：信号探测（发试探、读响应） ｜ 杠杆：探虚实</div></li><li><a href="cases/B-0014.html">B-0014｜借尸还魂</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">陈胜、吴广是底层戍卒，大泽乡遇雨误期、进退皆死。陈胜不自号、不硬拼，而是借两个“死人”名号——被冤杀的公子扶苏、生死不明的楚将项燕，诈称其名起兵，再以“鱼腹丹书”“篝火狐鸣”造天意，天下云集响应。精妙在“借不能用者而用之”——自己没名分，就借“死了但名望还在”的旧名号（尸）装自己的新意图（魂）；本质是祭祀·共识嫁接，借旧共识凝聚新力量。</div><div class="k">接口：祭祀·共识嫁接（借旧共识凝聚新力量） ｜ 杠杆：嫁接共识</div></li><li><a href="cases/B-0015.html">B-0015｜调虎离山</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">孙策欲取庐江，刘勋兵强且据守皖城坚城（虎＋山）。孙策不硬攻，而是顺着刘勋贪财自大的弱点，卑辞厚礼、假意示弱，诱其出兵远征上缭，把虎调离山；刘勋一离城，孙策即与周瑜奇袭皖城，并派孙贲、孙辅截断其退路，大败刘勋、夺取庐江。精妙在“疏浚·位置向”——把对手本人从其优势依托上引开，让强失去支点；与围魏救赵（压力向）、借刀杀人（出力向）、李代桃僵（损失向）并列为疏浚四向。</div><div class="k">接口：疏浚·位置向（调对手离开依托） ｜ 杠杆：引离</div></li><li><a href="cases/B-0016.html">B-0016｜欲擒故纵</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">郑庄公面对亲弟共叔段在母亲武姜撑腰下的夺位图谋，不提前动手（逼则反兵），反而松手纵容，任其一步步坐实谋反罪名，待其起兵袭郑时一举讨伐、铲除后患。精妙在“疏浚·泄势向”——不硬堵，松手让对手的势自己泄到“自毙”的绝境；与围魏救赵（压力向）、借刀杀人（出力向）、李代桃僵（损失向）、调虎离山（位置向）并列为疏浚五向。</div><div class="k">接口：疏浚·泄势向（不逼反纵，松手泄势） ｜ 杠杆：纵（松手不迫）</div></li><li><a href="cases/B-0017.html">B-0017｜抛砖引玉</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">孙膑马陵之战，面对强魏追兵、兵力悬殊，不硬拼，反以“减灶”示弱——三天灶坑十万、五万、三万，诱庞涓误信齐军溃散、轻兵急追；再在马陵险道设伏，削树皮刻字“庞涓死于此树之下”，火光一现万箭齐发，逼死庞涓、全歼魏军主力。精妙在“信号层·抛饵诱进”——抛一个精准命中对方偏见的假饵，让对方自己钻进埋伏；与瞒天过海（造信号）、打草惊蛇（探信号）并列为信号层三态。</div><div class="k">接口：信号层·抛饵诱进（抛饵诱对方上钩入伏） ｜ 杠杆：饵（减灶示弱）</div></li><li><a href="cases/B-0018.html">B-0018｜擒贼擒王</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">安史之乱，叛将尹子奇率十余万大军围睢阳，守将张巡以六七千兵力死守。张巡不摊开硬拼，直取“王”——先用“剡蒿为矢”（蒿秆当箭）诱叛军误以为其箭尽、跑去报告主帅，从而锁定尹子奇位置，再命神箭手南霁云一箭射中其左眼，叛军主将重伤、指挥失灵、收兵退还，睢阳之围暂解。精妙在“结构判断·攻其枢要”——先识王（找出指挥中枢），再擒王（拔掉枢纽），十几万大军群龙无首、不攻自乱。</div><div class="k">接口：结构判断·攻其枢要（识别并直击体系枢纽，令整体瓦解） ｜ 杠杆：王（主将／枢纽）</div></li><li><a href="cases/B-0019.html">B-0019｜釜底抽薪</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">官渡之战，曹操以两万余兵力对抗袁绍十余万大军，粮草将尽、濒临溃败。曹操采纳许攸之计，不正面硬拼，亲率五千精兵夜袭乌巢、烧毁袁绍万余车粮草，袁军断粮军心大乱，张郃高览投降，曹操乘势出击歼灭袁军七八万，袁绍仅带八百亲兵逃回河北。精妙在“断源消势”——不敌其力而消其势：对方表面强大的“力”挡不住，就断掉其“力”的源头（粮草），火一灭、水自凉。</div><div class="k">接口：断源消势（不敌其力，而消其势） ｜ 杠杆：薪（粮草／根本供给）</div></li><li><a href="cases/B-0020.html">B-0020｜浑水摸鱼</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">东汉末年天下大乱，刘备无立足之地，寄居荆州。益州牧刘璋暗弱无主，听张松、法正之劝迎刘备入川。刘备留孔明守荆州，带庞统入川，驻葭萌关厚树恩德、收拢人心，待时机成熟借“借兵回援”翻脸，庞统献三策，刘备采中策诱杀杨怀高沛、夺涪城，最终逼刘璋投降、取益州为根基，奠定三分天下。精妙在“乘乱取利”——趁天下乱、刘璋无主，把又肥又弱又无主的“鱼”摸到手。</div><div class="k">接口：乘乱取利（乘其阴乱，利其弱而无主） ｜ 杠杆：乱（对方弱而无主）</div></li><li><a href="cases/B-0021.html">B-0021｜金蝉脱壳</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">南宋开禧二年，宋将毕再遇以几千人马对抗金军数万精锐，寡不敌众、决意撤退。为免金兵追杀，毕再遇不直接撤，而是“悬羊击鼓”——把羊倒吊树上、前蹄蹬鼓，制造“宋军还在”的假象，全军在鼓声掩护下悄悄撤离。金兵听鼓声不停、见旗帜如林，两天不敢进兵，等察觉是羊击鼓，宋军早已远遁。精妙在“留壳抽身”——留一副空壳稳住对方，本体安全脱身。</div><div class="k">接口：留壳抽身（存其形，完其势，留壳稳住对方，本体脱身） ｜ 杠杆：壳（稳住对方的假象）</div></li><li><a href="cases/B-0022.html">B-0022｜关门捉贼</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">长平之战，秦将白起面对赵括亲率的四十万大军，不硬拼、不追击，而是先佯败诱敌，等赵军离开坚固营垒、深入秦境，再派奇兵截断其退路、切断粮道，把四十万赵军围成“瓮中之鳖”，围困46天、粮绝，赵括突围被射杀，赵军全军覆没。精妙在“关门困敌”——不追不赶，先关门（断退路）、再捉贼（围歼），让敌人无路可逃、一网打尽。</div><div class="k">接口：关门困敌（小敌困之，断其去路，围而歼之） ｜ 杠杆：门（退路／去路）</div></li><li><a href="cases/B-0023.html">B-0023｜远交近攻</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">战国末期，范雎向秦昭襄王献“远交近攻”——纠正穰侯魏冉“越韩魏而远攻齐”的路线，把六国按远近分层：先稳住远的齐楚燕（远交），集中力量蚕食近的韩魏（近攻），得寸则寸、得尺则尺，由近及远各个击破，最终一统天下。精妙在“边界划定”——把存续边界划到统一天下的全局未来，才有远近可分。</div><div class="k">接口：动力调控·压力错峰（把多个对手按远近分层、分批处理压力） ｜ 杠杆：远近分层</div></li><li><a href="cases/B-0024.html">B-0024｜假道伐虢</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">春秋时，晋献公欲吞并相邻的虢、虞两个小国，二者唇齿相依、互为犄角。大夫荀息献“假道伐虢”——用屈产良马、垂棘美璧贿赂贪财的虞公，借虞国通道伐虢，灭虢后回师顺手灭了虞国，一石二鸟。精妙在“借道渗透”——借中间人的路／名义作跳板，先打真目标，回头把借道者也一并吞掉（唇亡齿寒）。</div><div class="k">接口：借道渗透（借路为名，渗入力量，先达真目标，回头吞掉借道者） ｜ 杠杆：道（借路／借名义）</div></li><li><a href="cases/B-0025.html">B-0025｜偷梁换柱</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">秦始皇沙丘病危，赵高扣压遗诏、拉李斯入伙、伪诏赐死扶苏与蒙恬，秘不发丧以保外观——先识出体系的承重件（合法性来源＋军方执行者），再用自己人替换，使秦帝国在支撑已被抽走、外观却毫无变化的情况下自行崩塌。</div><div class="k">接口：结构判断·偷换承重（辨出承重件，替换，使体系外观不变而支撑已失） ｜ 杠杆：梁（承重件）</div></li><li><a href="cases/B-0026.html">B-0026｜指桑骂槐</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">春秋时，吴王阖闾令孙武操练 180 名宫女以试兵法。宫女嬉笑不听号令，孙武三令五申无效后，斩了担任左右队长的吴王两名宠妃，杀一儆百；再操练，宫女进退整齐、令行禁止。精妙在“立威树纪”——惩戒一个最不能罚的典型，把“违令必惩”的预期传导给全体，用最小代价建立号令的权威。</div><div class="k">接口：立威树纪（惩戒典型，确立规则权威） ｜ 杠杆：典型（杀鸡儆猴的“鸡”）</div></li><li><a href="cases/B-0027.html">B-0027｜假痴不癫</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">三国时，曹爽夺司马懿兵权后，司马懿装病不朝，装成病入膏肓、神志不清，骗过曹爽派来试探的李胜；曹爽放松警惕后，司马懿趁其陪皇帝外出扫墓、京城防备空虚之机发动政变，诛曹爽、独揽大权。精妙在“藏锋”——伪装无害、静不露机，把真实意图与实力藏起来，等对手放松、时机一到，后发制人。</div><div class="k">接口：藏锋（藏巧于拙，伪装无害，静不露机，待时后发） ｜ 杠杆：伪装（假痴的壳）</div></li><li><a href="cases/B-0028.html">B-0028｜上屋抽梯</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">战国齐魏之战，孙膑针对庞涓“悍勇而轻齐”的认知，用“减灶”逐日减少军灶数目（十万→五万→三万），制造齐军大量逃亡的假象诱庞涓轻敌冒进；庞涓弃步军率轻锐追击，夜至马陵道，孙膑伏万弩断其退路，庞涓自刎、太子申被俘，魏国自此衰落。</div><div class="k">接口：设饵断梯（假之以便，诱其上屋，断其援应，陷之死地） ｜ 杠杆：梯（上屋的凭借＋退身的凭借）</div></li><li><a href="cases/B-0029.html">B-0029｜树上开花</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">东汉虞诩赴任武都，遭数千羌军拦截而兵少，先扬言“上书请兵”诱羌人分兵，再日夜兼行、令吏士各作两灶日增倍之，用“增灶”制造援军已到的假象，羌人误判汉军兵力而不敢追击，虞诩得以安全通过；与孙膑“减灶示弱”相反，此为“增灶示强”的虚张声势。</div><div class="k">接口：借局布势（借局布势，力小势大，以弱示强） ｜ 杠杆：势（借来的声势／假象）</div></li><li><a href="cases/B-0030.html">B-0030｜反客为主</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">东汉末年，渤海太守袁绍（客位）暗约公孙瓒南下攻冀制造危机，再遣荀谌三问游说，冀州牧韩馥自认不如、遣子送印绶让位，袁绍不费一兵一卒得冀州、反客为主；核心是乘对方疏漏插足、渐进握住“主机（权柄）”，把客位变成主位。</div><div class="k">接口：乘隙夺主（乘对方疏漏插足，渐进握住主机，把客位变主位） ｜ 杠杆：主机（冀州牧的名分与权柄）</div></li><li><a href="cases/B-0031.html">B-0031｜美人计</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">春秋末吴越争霸，越王勾践夫椒战败后卧薪尝胆，深知吴国兵强将智不可力敌，用文种之计选苎萝山鬻薪女西施、郑旦，教以歌舞容步三年，进献吴王夫差；夫差好色纳之，建馆娃宫沉湎酒色、疏远并赐死伍子胥，吴政荒废，越乘虚伐吴、转败为胜。</div><div class="k">接口：伐情（兵强者攻其将，将智者伐其情） ｜ 杠杆：情（夫差的意志／霸主锐气）</div></li><li><a href="cases/B-0032.html">B-0032｜空城计</a><span class="m"> B 历史判例 · 博弈决策</span><div class="a">蜀汉第一次北伐，街亭失守后诸葛亮孤守西城，兵少将寡而司马懿大军压境。诸葛亮辨出这局的承重件不是城墙，而是对手脑中“诸葛亮从不弄险”的既有判断，反用这条判断——大开城门、藏起旌旗、登楼焚香抚琴，把“城空”如实亮出来，令多疑的司马懿疑中生疑、以为有伏兵而退。此计零成本、零战力，赌注是全部家底，只可作权宜缓兵，不可作常策。</div><div class="k">接口：以虚示虚（虚者虚之，亮出真弱，令多疑者疑中生疑） ｜ 杠杆：疑（对手心中的既有判断反过来咬他自己）</div></li><li><a href="cases/B-0033.html">B-0033｜反间计</a><span class="m"> B 历史判例 · 博弈决策（反间离隙／瓦解内外信任）</span><div class="a">楚汉相争，项羽围刘邦于荥阳，割地求和不成。陈平辨出项羽&quot;意忌信谗&quot;且封赏吝啬、骨鲠之臣不过范增数人，遂用四万斤金纵反间：先散布钟离眛通敌谣言，再趁项羽使者来汉，故意先盛礼款待、又佯称&quot;以为是亚父使者&quot;改以粗食，使者回报后项羽大疑范增，范增怒而请辞，未至彭城疽发背死。反间计是让敌人自己拔掉自己的智囊。</div><div class="k">接口：反间离隙（因敌之间而间之，借敌方既有猜忌，令其自毁长城） ｜ 杠杆：敌方内部既有猜忌（君疑臣之旧隙）</div></li><li><a href="cases/B-0034.html">B-0034｜苦肉计</a><span class="m"> B 历史判例 · 博弈决策（自害取信／以身换信）</span><div class="a">春秋吴国，阖闾杀吴王僚夺位，僚之子庆忌勇武无敌、逃亡卫国图谋复仇，阖闾无法正面除掉。要离献苦肉计：请阖闾断其右手、杀其妻子焚尸于市，制造&quot;负罪出奔&quot;的假象，投奔庆忌。庆忌见其真残、妻子真死，信其&quot;与吴王有仇&quot;，纳为心腹。三月后渡江，要离顺风以矛刺死庆忌。苦肉计是用真实牺牲换取信任，代价不可逆。</div><div class="k">接口：自害取信（人不自害，受害必真；以真实自我牺牲换取敌方信任） ｜ 杠杆：敌方「受害必真」的判断常理</div></li><li><a href="cases/B-0035.html">B-0035｜连环计</a><span class="m"> B 历史判例 · 博弈决策（使敌自累／两计扣用）</span><div class="a">赤壁之战，曹操率大军南下，孙刘联军兵少不能力敌。周瑜黄盖用连环计：曹军北方士卒不习水战，曹操下令战船首尾相连以稳军心，正是&quot;自累&quot;；黄盖诈降，以数十艘装满薪草膏油的蒙冲斗舰，借东南风纵火，一船着火、全营连烧，烧尽北船。连环计是&quot;一计累敌、一计攻敌&quot;，让敌人自己捆住自己，再乘势而击。</div><div class="k">接口：使敌自累（将多兵众，不可以敌，使其自累，以杀其势） ｜ 杠杆：敌方自累结构（连锁战船——一烧全烧）</div></li><li><a href="cases/C-0001.html">C-0001｜OpenAI 解雇风波</a><span class="m"> C 企业管理 · 组织治理</span><div class="a">2023 年 OpenAI 董事会以&quot;沟通破裂&quot;为由解雇 CEO Sam Altman，引发员工与投资者全体反弹、Altman 数日内复职。这篇判例显影这场失败决策：董事会以为在&quot;换一个高管&quot;，实际上在&quot;拔掉缝合点&quot;——动手前没问清 Altman 是&quot;可替换零件&quot;还是&quot;承重墙&quot;。适用：动关键人物前，先判断他是&quot;结构缝合点&quot;还是&quot;可替换部件&quot;。</div><div class="k">接口：祭祀（承重误判） ｜ 杠杆：辨节点</div></li><li><a href="cases/C-0002.html">C-0002｜DeepSeek 开源决策</a><span class="m"> C 企业管理 · 战略抉择</span><div class="a">DeepSeek 在算力受限、资本受限的条件下，选择把最强模型完全开源，而非跟随行业闭源惯例。核心判断是：闭源护城河短暂，开源能建立生态引力；只赚&quot;六倍利润&quot;、不追求最大化，开源与商业可持续不冲突。结果 R1 成为全球最受欢迎开源模型，公司首轮融资估值约 520 亿美元。</div><div class="k">接口：疏浚（开源造河道） ｜ 杠杆：放技术</div></li><li><a href="cases/E-0001.html">E-0001｜双轨告知：隐私与生命的制度接口</a><span class="m"> E 宏观案例 · 权责边界</span><div class="a">面对「旧版行政拦截失效、上位法告知与保密两条规则内部裂缝、感染者隐私保护反被用作隐瞒传播挡箭牌、一线医生告知与否两头受罚」的制度死结，地方立法者不放开隐私、也不继续依赖自觉，而以「特定对象最小披露＋机构代为告知＋公众不公开」的三段式接口，把公共卫生介入从灰色地带变成有边界的明确入口。</div><div class="k">接口：疏浚（从堵到疏） ｜ 杠杆：代为告知</div></li></ul></div></noscript>

  DATA.forEach(function(c){ if(c[key]) set[c[key]] = 1; });
  var el = document.getElementById(sel);
  Object.keys(set).sort().forEach(function(v){

}
function render(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var fc = document.getElementById('fc').value, fs = document.getElementById('fs').value, fi = document.getElementById('fi').value;
  var out = DATA.filter(function(c){
    if(fc && c.category !== fc) return false;
    if(fs && c.scene !== fs) return false;
    if(fi && c.interface !== fi) return false;
    if(q){
      var hay = [c.num,c.title,c.category,c.scene,c.interface,c.lever,c.abstract,(c.concepts||[]).map(function(o){return o.name;}).join(' ')].join(' ').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  document.getElementById('stat').textContent = '匹配 ' + out.length + ' 篇';
  var pages = Math.max(1, Math.ceil(out.length / PAGE));
  if(page > pages) page = pages;
  var slice = out.slice((page-1)*PAGE, page*PAGE);
  document.getElementById('list').innerHTML = slice.map(function(c){
    var con = (c.concepts||[]).map(function(o){return o.anchor?('<a class="cl" href="/glossary.html#'+o.anchor+'">'+esc(o.name)+'</a>'):('<span class="cl">'+esc(o.name)+'</span>');}).join('、');
    return '<div class="card"><a class="t" href="'+esc(c.url)+'">'+esc(c.num)+'｜'+esc(c.title)+'</a>'
      + '<div class="m">'+esc(c.category)+' · '+esc(c.scene)+' · '+esc(c.date)+'</div>'
      + '<p class="a">'+esc(c.abstract)+'</p>'
      + '<div class="k"><b>接口：</b>'+esc(c.interface)+' ｜ <b>杠杆：</b>'+esc(c.lever)+(con?(' ｜ <b>关联概念：</b>'+con):'')+'</div></div>';
  }).join('');
  document.getElementById('pinfo').textContent = page + ' / ' + pages;
  document.getElementById('cnt').textContent = DATA.length;
  document.getElementById('cnt2').textContent = DATA.length;
}
function init(){
  fill('fc','category'); fill('fs','scene'); fill('fi','interface');
  ['q','fc','fs','fi'].forEach(function(id){
    document.getElementById(id).addEventListener('input', function(){ page = 1; render(); });
  });
  document.getElementById('clr').addEventListener('click', function(){
    document.getElementById('q').value = ''; document.getElementById('fc').value = '';
    document.getElementById('fs').value = ''; document.getElementById('fi').value = ''; page = 1; render();
  });
  document.getElementById('prev').addEventListener('click', function(){ if(page > 1){ page--; render(); } });
  document.getElementById('next').addEventListener('click', function(){ page++; render(); });
  render();
}
fetch('cases-index.json').then(function(r){return r.json();}).then(function(d){ DATA = d.cases || []; init(); })
  .catch(function(){ document.getElementById('list').innerHTML = '<p>案例数据加载失败，请刷新页面重试。</p>'; });
</script>
</body>
