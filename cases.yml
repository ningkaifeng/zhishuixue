    concepts: ["疏浚"]
    keywords: ["调虎离山", "疏浚", "位置向", "引离", "决策显影库", "宁凯峰"]
    abstract: "孙策欲取庐江，刘勋兵强且据守皖城坚城（虎＋山）。孙策不硬攻，而是顺着刘勋贪财自大的弱点，卑辞厚礼、假意示弱，诱其出兵远征上缭，把虎调离山；刘勋一离城，孙策即与周瑜奇袭皖城，并派孙贲、孙辅截断其退路，大败刘勋、夺取庐江。精妙在“疏浚·位置向”——把对手本人从其优势依托上引开，让强失去支点；与围魏救赵（压力向）、借刀杀人（出力向）、李代桃僵（损失向）并列为疏浚四向。"
    elements:
      - k: "情境"
        v: |
          这是一场攻坚取舍，边界画在“孙策—刘勋”之间。孙策想取庐江（郡治皖城，长江、淮水环绕的战略要地），但庐江太守刘勋收容了袁术余部，兵力骤增到数万，又据守坚城。

          这一局的特殊在于——刘勋的强不是它自己强，是它“站在山上”才强：数万兵马＋皖城坚城地利，如虎添翼。问题不是“怎么硬攻下皖城”，而是“怎么让刘勋离开他的城”。虎在山上打不动，把虎引下山来，才有机会。
      - k: "信号"
        v: |
          · 刘勋“有主而势大”——据坚城、有实力，正面硬拼讨不到便宜。

          · 刘勋贪财自大——“非利不来趋”：他只认“对我有利”才动，硬的不吃，只有“利”牵得动他。

          · 刘勋刚收容袁术余部，兵力骤增却粮草不继——他正有“往外找补给”的需求，这是诱饵的着力点。
      - k: "排除"
        v: |
          · 排除“正面强攻皖城”——刘勋据坚城、兵势大，强攻等于硬撼山上的虎（“下政攻城，若攻坚则自取败亡”），代价大且未必啃得下。

          · 排除“绕过庐江、先打别处”——庐江是长江淮水交汇的战略要地，不拿下它，孙策后方始终不安。

          · 排除“直接劝降或威逼”——刘勋贪财自大，硬的不吃、也吃不下；只有顺着他的“利”字，才牵得动。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。其结构为：

          · 第一步：选饵——孙策看准刘勋“贪财自大”，又正缺粮草往外找补给，决定以“利”作饵。

          · 第二步：卑辞厚礼——孙策派人给刘勋送厚礼、极力吹捧（“功名远播”），并假装弱小求救，劝刘勋出兵去打上缭（富庶之地），许诺甘愿做他的外援。

          · 第三步：诱虎离山——刘勋被厚礼甜言冲昏头，不听刘晔“孙策乘虚来袭”的劝阻，亲率数万兵马出征上缭。

          · 第四步：趁虚袭城——孙策趁刘勋后方空虚，与周瑜率两万兵马奇袭皖城；同时派孙贲、孙辅在彭泽截断刘勋的退路。

          · 第五步：收网——刘勋到上缭扑了个空（守将坚壁清野、只留空城），回军途中在彭泽遭孙贲、孙辅截击，大败，走投无路投奔曹操。
      - k: "预期"
        v: |
          可核验目标：把刘勋的主力调离皖城，趁虚夺取皖城。
          防御目标：即便刘勋半路识破回援，孙策已在彭泽布置截击，其退路已断。
          核心问题解决：把“硬攻坚城”的死结，转化为“把虎调离山、再取空城”。
      - k: "修正"
        v: |
          · 专属失败模式：饵不够香、虎不上钩——若刘勋不贪财，或听进刘晔的劝阻，虎不离山，孙策的“调”就落空。

          · 扳回：一次调不动，不能硬调（硬攻＝硬撼山上的虎），得从“虎想要什么”上加码——孙策见刘勋一度犹豫，果然再放风说自己要远征江夏，让刘勋彻底放下戒心，虎这才下山。

          · 修正回路：始终回到“诱”这个支点——调虎离山的命门不在“虎有多强”，在“虎贪什么”（诱饵对不对它的胃口）。
    effect: |-
      把刘勋的主力调离皖城，趁虚夺取皖城
    reusable_condition: |-
      “对手据险／依托优势、正面强攻代价大、且对手有可被利诱的欲望”的场景
    non_applicable: |-
      “对手无优势依托”（可直接强攻）、或“对手不贪利／不上钩”（调不动）的情形
    source_note: |
      · 计名与原文：出自《三十六计》“待天以困之，用人以诱之，往蹇来返。”

      · 按语：“兵书曰：‘下政攻城’。若攻坚，则自取败亡矣。敌既得地利，则不可争其地。且敌有主而势大：有主，则非利不来趋；势大，则非天人合用，不能胜。”

      · 历史案例：孙策取庐江（皖城之战，建安四年/公元199年），见《三国志·吴书·孙策传》，并见裴松之注引《江表传》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“攻城”，是“把人从城里调出来”——对手的强，强在他“站在自己的地盘上”（虎＋山）；我方不碰他的强，而是用他“想要的东西”（利）把他从地盘上引开，强就还原成了普通。

      与治水学的接口：疏浚·位置向（调对手离开依托）——不是改变压力流向（围魏救赵）、不是换出力者（借刀杀人）、不是重定向损失（李代桃僵），而是把对手本人从他的优势依托上引开，让它的强失去支点。

      区别：调虎离山与声东击西（B-0006，响应错位）都涉及“调动对手”，但声东击西调的是对方的“部署方向”（兵力调到错误方向、对手本人未动），调虎离山调的是对方“本人／主力离开根据地”——一个调“兵”，一个调“人”。

      一个值得注意的点：调虎离山有两个前提——虎要有“山”（对手有优势依托），虎要有“欲”（对手有可被牵动的欲望）。虎无山，此计无用；虎无欲，此计不动。所以这一计的命门不在“虎多强”，在“识透虎贪什么”。

      适用边界：适用于“对手据险／依托优势、正面强攻代价大、且对手有可被利诱的欲望”的场景；不适用于“对手无优势依托”（可直接强攻）、或“对手不贪利／不上钩”（调不动）的情形。

  - id: "B-0016"
    num: "B-0016"
    title: "欲擒故纵"
    card_title: "B-0016｜欲擒故纵"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-11"
    source: "《三十六计·第十六计（攻战计）》；《左传·隐公元年》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/OkTre"
    interface: "疏浚·泄势向（不逼反纵，松手泄势）"
    lever: "纵（松手不迫）"
    concepts: ["疏浚"]
    keywords: ["欲擒故纵", "疏浚", "泄势向", "决策显影库", "宁凯峰"]
    abstract: "郑庄公面对亲弟共叔段在母亲武姜撑腰下的夺位图谋，不提前动手（逼则反兵），反而松手纵容，任其一步步坐实谋反罪名，待其起兵袭郑时一举讨伐、铲除后患。精妙在“疏浚·泄势向”——不硬堵，松手让对手的势自己泄到“自毙”的绝境；与围魏救赵（压力向）、借刀杀人（出力向）、李代桃僵（损失向）、调虎离山（位置向）并列为疏浚五向。"
    elements:
      - k: "情境"
        v: |
          郑庄公是郑国的国君，但这国君当得憋屈：母亲武姜因为生他时难产受了惊吓，一直不喜欢他，反倒偏爱小儿子共叔段，一心要扶小儿子上位。共叔段有母亲撑腰，被封在京邑，势力一天天做大，明摆着要夺位。

          郑庄公卡在一个两难里：动手吧，那是自己的亲弟弟，背后还站着亲妈，先动手会背上“不孝不友”的骂名，国人也不会向着自己；不动手吧，弟弟的刀子一天比一天磨得亮，迟早要捅到自己身上。
      - k: "信号"
        v: |
          · 共叔段在京邑修城，规模大大超出礼制——大夫祭仲第一个来报：这是僭越，是祸根。

          · 共叔段开始吞并西边、北边的边境城池，一路扩张到廪延。

          · 再往后，共叔段修缮兵器、囤积粮草、备好兵车，要偷袭国都。

          · 最要命的一条：母亲武姜约好了做内应，到时就打开城门放弟弟进城。

          郑庄公的判断是：弟弟的野心在一步步坐实，但还没到“罪名板上钉钉”的那一刻。
      - k: "排除"
        v: |
          · 排除“提前动手”——谋士祭仲、公子吕、子封三番五次催他“早做安排、现在就可以动手”（“不如早为之所，无使滋蔓”），郑庄公全都按下了。

          · 理由一（逼则反兵）：弟弟的罪还没坐实，母亲还在背后站着，这时候动手，会逼得弟弟和母亲狗急跳墙、拼死反扑——逼得太紧，对方必定回身反扑。

          · 理由二（名分站不住）：先动手，自己名分上站不住，会“无生民心”——国人会同情弟弟、离心自己。

          于是他选了一条反直觉的路：不逼，反而纵。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。其结构为：

          · 第一步：纵——不阻止、不敲打、不提醒，任由共叔段一步步把坏事做绝、把野心摊到明面上。

          · 第二步：等——别人劝他管一管，他只回一句“多行不义必自毙，子姑待之”：坏事干多了，自己就会走到绝路，你等着看。他等的，是弟弟彻底“坐实”的那一刻。

          · 第三步：收——共叔段正式起兵偷袭国都、武姜打开城门做内应，郑庄公一听，说“可矣”——行了，可以动手了。

          · 第四步：擒——名正言顺发兵讨伐，京邑的百姓早就不满共叔段，纷纷倒戈，共叔段一路败退，最后逃亡。
      - k: "预期"
        v: |
          可核验目标：让弟弟自己走到“谋反”这条绝路上、罪名彻底坐实，再名正言顺地一举铲除。
          防御目标：全程不先动手、不落“残害手足”的口实，把“师出有名”牢牢握在自己手里。
          核心问题解决：把“该不该对亲弟弟动手、动手会不会失民心”的两难，转化为“等弟弟自己把罪名送上门”。
      - k: "修正"
        v: |
          · 专属失败模式：纵过头——“纵”的分寸极难拿捏：纵得太少，对方不暴露；纵得太狠，事态失控、代价外溢。

          · 代价：郑庄公纵得太彻底，把母亲武姜也一起卷了进来（她做了内应），事后母子决裂，他赌气发誓“不及黄泉，无相见也”，最后还得靠颍考叔掘地道“隧而相见”才勉强修复关系。

          · 更重的代价：《春秋》用一个“克”字记这件事，明明白白在讽刺他——“讥失教也”。他身为兄长，本可以管教弟弟，却故意放任弟弟一步步走向灭亡。目的达到了，但“失教”这个道德污点，史笔给他记在了账上。
    effect: |-
      让弟弟自己走到“谋反”这条绝路上、罪名彻底坐实，再名正言顺地一举铲除
    reusable_condition: |-
      “对手有持续作恶／膨胀的内部动因、我方不宜先动手（名分或实力上）”的场景
    non_applicable: |-
      “对手并无自我膨胀的动因”（纵了也不动）或“事态一旦纵容会失控外溢、代价无法承受”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第十六计：“逼则反兵，走则减势。紧随勿迫，累其气力，消其斗志，散而后擒，兵不血刃。需，有孚，光。”

      · 历史案例：郑伯克段于鄢，见《左传·隐公元年》（鲁隐公元年／公元前722年）。

      · 引用词组出处：“多行不义必自毙”出自《左传·隐公元年》郑庄公语；“需，有孚，光”出自《周易·需卦》。

      · 计文按语另载“七擒七纵”（诸葛亮收孟获，《三国志·蜀书·诸葛亮传》裴松之注引《汉晋春秋》）与“石勒除王浚”两例，本篇主案例取郑伯克段。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“擒”，是“先松手”——你逼得越紧，对方越要拼命反扑（“逼则反兵”）；你松开手，对方的气势反而在“没人拦”里自己泄掉（“走则减势”）。所以命门不在“怎么擒”，在“敢不敢先纵”。

      与治水学的接口：疏浚·泄势向（不逼反纵，松手泄掉对手的势）——治水不堵洪水，而是开闸让水自然流走，水就闹不起来了。郑庄公不堵弟弟的野心，反而松手任其膨胀，弟弟的“势”就在“没人拦”中一路泄到“谋反自毙”的绝境。

      杠杆落点：纵（松手不迫）。

      区别：与分层异步（B-0004 以逸待劳）一字之差——以逸待劳是“被动等”（我不动，等你自然疲惫），欲擒故纵是“主动松”（我主动放手，创造条件让你松懈膨胀），一静一动。

      一个值得注意的点：欲擒故纵还有另一支——“七擒七纵”孟获，那一路的“纵”不是为了泄势，而是为了收心（让对方心悦诚服、不再反叛），那是往“祭祀（共识凝聚）”方向去的。本篇主案例取郑伯克段的“纵以待其自溃”，落点定在疏浚·泄势向。

      适用边界：适用于“对手有持续作恶／膨胀的内部动因、我方不宜先动手（名分或实力上）”的场景；不适用于“对手并无自我膨胀的动因”（纵了也不动）或“事态一旦纵容会失控外溢、代价无法承受”的情形。

  - id: "B-0017"
    num: "B-0017"
    title: "抛砖引玉"
    card_title: "B-0017｜抛砖引玉"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-12"
    source: "《三十六计·第十七计（攻战计）》；《史记·孙子吴起列传》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/sVecn"
    interface: "信号层·抛饵诱进（抛饵诱对方上钩入伏）"
    lever: "饵（减灶示弱）"
    concepts: ["祭祀"]
    keywords: ["抛砖引玉", "信号层", "抛饵诱进", "决策显影库", "宁凯峰"]
    abstract: "孙膑马陵之战，面对强魏追兵、兵力悬殊，不硬拼，反以“减灶”示弱——三天灶坑十万、五万、三万，诱庞涓误信齐军溃散、轻兵急追；再在马陵险道设伏，削树皮刻字“庞涓死于此树之下”，火光一现万箭齐发，逼死庞涓、全歼魏军主力。精妙在“信号层·抛饵诱进”——抛一个精准命中对方偏见的假饵，让对方自己钻进埋伏；与瞒天过海（造信号）、打草惊蛇（探信号）并列为信号层三态。"
    elements:
      - k: "情境"
        v: |
          战国中期，齐国军师孙膑与魏国大将庞涓是一对宿敌——同门师兄弟，庞涓曾嫉妒孙膑的才能、设计陷害他，孙膑逃到齐国。公元前342年，魏国攻韩，韩国向齐国求救，齐以田忌为将、孙膑为军师出兵。

          这一局是明显的以弱对强：魏军倾国而出、兵强马壮，齐军兵力弱，又素有“怯战”的名声。正面硬拼，必败无疑，只能靠“骗”和“诱”。
      - k: "信号"
        v: |
          · 魏军（三晋之兵）素来强悍，打心眼里看不起齐军，认定“齐军怯懦”——这是庞涓脑子里根深蒂固的偏见。

          · 庞涓骄矜自用、急于求成：桂陵之战他刚败过一次，此刻憋着劲儿要复仇立功，越急越容易轻敌。

          · 庞涓会“数灶”——他会清点齐军扎营留下的炉灶数量，来推断齐军兵力。

          孙膑的判断是：庞涓“齐军怯懦”这个偏见，就是我方能利用的着力点——只要抛出一个“齐军真的在溃散”的假象，他一定会信。
      - k: "排除"
        v: |
          · 排除“正面硬拼”——魏强齐弱，硬拼等于送死。

          · 排除“真的一路溃散撤退”——那等于把韩国的求救抛下，战略目的落空。

          · 排除“用旌旗金鼓虚张声势”——按语里叫它“疑似法”：似是而非、真假难辨，骗得了生手，骗不了庞涓这种老将，反而会打草惊蛇、被一眼识破。

          专属排除理由：“疑似”不如“类同”——要骗庞涓，不能给“模棱两可”的信号，得给一个“符合他既有预期”的信号：他早就认定齐军怯懦，那就给他一个“齐军正在溃散”的假象，让他的偏见自己说服自己。
      - k: "行动"
        v: |
          · 抛砖——减灶示弱：齐军进魏境后，第一天挖十万个灶，第二天减到五万，第三天只剩三万。三天时间，炉灶少了一大半，制造出“齐军逃亡过半、溃不成军”的假象。

          · 咬钩：庞涓数完灶，大喜过望——“我早就知道齐军是胆小鬼，进我魏境才三天，兵就逃了一大半”。于是抛下步兵主力，只带轻锐精锐，日夜兼程追赶齐军。

          · 引玉——马陵设伏：孙膑算准庞涓的行军速度和路线，在马陵道（沟深林密、道路狭窄的险地）设下埋伏：削去路旁大树的树皮，在露出的白木上刻下“庞涓死于此树之下”，命一万弓弩手埋伏两侧，约定“一见火光就万箭齐发”。

          · 收网：庞涓追至马陵，见断木阻塞道路，不疑有诈，反以为是齐军设障逃命；又见树上刻字，举火照看——火光一现，齐军万箭齐发，魏军大乱，庞涓自知中计，拔剑自刎。齐军乘胜全歼魏军主力，俘虏魏太子申。
      - k: "预期"
        v: |
          可核验目标：抛“减灶”这块“砖”（示弱假象），精准命中庞涓“齐军怯懦”的偏见，让他主动抛下主力、轻兵急追，自己钻进马陵这个“口袋”。
          防御目标：以“火光”做引信，在马陵险道一举收网。
          以小换大：几个灶坑的假象，几乎零成本，换来全歼魏军主力、逼死宿敌庞涓。
      - k: "修正"
        v: |
          · 专属失败模式：“砖”不对胃口就引不动——若庞涓不轻敌、或肯仔细侦察（而非只数灶），减灶的假象一戳就破。

          · 硬边界一：砖必须“类同”——减灶之所以成，是因为它精准符合庞涓“齐军怯懦”的既有偏见。命门不在“砖多香”，在“砖是不是对方本来就愿意相信的那个”。

          · 硬边界二：玉必须“兜得住”——孙膑的胜不只靠“减灶”，更靠“马陵设伏”这层兜底。饵抛了、对方也扑上来了，但口袋没张好，“玉”就接不住，反而前功尽弃。
    effect: |-
      抛“减灶”这块“砖”（示弱假象），精准命中庞涓“齐军怯懦”的偏见，让他主动抛下主力、轻兵急追，自己钻进马陵这个“口袋”
    reusable_condition: |-
      “对手有可被利用的贪念/偏见、我方不宜硬拼”的场景
    non_applicable: |-
      “对手不贪/不轻敌、或会仔细侦察”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第十七计：“类以诱之，击蒙也。”

      · 计文按语：“诱敌之法甚多，最妙之法，不在疑似之间，而在类同，以固其惑。以旌旗金鼓诱敌者，疑似也；以老弱粮草诱敌者，则类同也……又如孙膑减灶而诱杀庞涓。”

      · 历史案例：孙膑减灶诱庞涓，马陵之战，见《史记·孙子吴起列传》。

      · 引用词组出处：“击蒙”出自《周易·蒙卦》。

      · 按语另载“楚伐绞”（屈瑕不护樵夫，以小利诱绞人出城）一例，本篇主案例取孙膑减灶。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“硬打”，是“放饵”——对方想相信什么、想要什么，就抛什么给他，让他自己顺着饵钻进你张好的口袋。

      与治水学的接口：信号层·抛饵诱进（抛小利/假象作饵，诱对方上钩入伏）——孙膑抛的饵是“减灶”（示弱假象），精准命中庞涓“齐军怯懦”的偏见，庞涓就自己轻兵急追、钻进了马陵的伏击圈。

      杠杆落点：饵（减灶示弱）。

      信号层三态：瞒天过海（B-0001）是“造信号”——造假象让对方看不见（遮蔽）；打草惊蛇（B-0013）是“探信号”——发试探读对方（探测）；抛砖引玉是“抛饵信号”——抛诱饵让对方动起来（诱导）。造／探／饵，三态闭合。

      一个补充：按语里“楚伐绞”是抛砖引玉的另一型——抛“小利”（樵夫柴草）诱对方出城，跟孙膑抛“假象”（减灶示弱）同属“类同诱敌”，但一个是“利诱”、一个是“示弱”。本篇主案例取孙膑减灶，因为减灶这块“砖”更能体现“类同”的精髓——饵要像对方想看到的。

      适用边界：适用于“对手有可被利用的贪念/偏见、我方不宜硬拼”的场景；不适用于“对手不贪/不轻敌、或会仔细侦察”的情形。

  - id: "B-0018"
    num: "B-0018"
    title: "擒贼擒王"
    card_title: "B-0018｜擒贼擒王"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-13"
    source: "《三十六计·第十八计（攻战计）》；《资治通鉴·唐纪》（张巡守睢阳）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/phI5i"
    interface: "结构判断·攻其枢要（识别并直击体系枢纽，令整体瓦解）"
    lever: "王（主将／枢纽）"
    concepts: ["结构判断"]
    keywords: ["擒贼擒王", "结构判断", "攻其枢要", "决策显影库", "宁凯峰"]
    abstract: "安史之乱，叛将尹子奇率十余万大军围睢阳，守将张巡以六七千兵力死守。张巡不摊开硬拼，直取“王”——先用“剡蒿为矢”（蒿秆当箭）诱叛军误以为其箭尽、跑去报告主帅，从而锁定尹子奇位置，再命神箭手南霁云一箭射中其左眼，叛军主将重伤、指挥失灵、收兵退还，睢阳之围暂解。精妙在“结构判断·攻其枢要”——先识王（找出指挥中枢），再擒王（拔掉枢纽），十几万大军群龙无首、不攻自乱。"
    elements:
      - k: "情境"
        v: |
          安史之乱，至德二年（757年），叛将尹子奇率十余万大军围攻睢阳。睢阳是通往江南的咽喉，一旦失守，叛军可长驱江南、切断大唐最后的财赋粮草根基。

          守将张巡与太守许远合兵，城内守军仅六七千人，兵力悬殊近二十倍。这一局没有退路：睢阳不能失，但正面硬拼，六七千对十几万，必败无疑。
      - k: "信号"
        v: |
          · 叛军的“强”是整体性的——十几万大军，靠的是“指挥中枢”（尹子奇这个主将）在统摄；中枢一乱，再多的兵也是散沙。

          · “王”不除，睢阳必破——只要尹子奇还在发号施令，叛军就能一波波组织进攻。

          · 但尹子奇藏在乱军之中，张巡不认识他、找不到他——“擒王”的第一道坎，是“识王”。

          张巡的判断是：这一局的胜负手，不在“能杀多少兵”，在“能不能干掉那个指挥中枢”——主将一倒，十几万人就“群龙无首”、不攻自乱。
      - k: "排除"
        v: |
          · 排除“正面硬拼、跟大军消耗”——六七千对十几万，消耗战必败。

          · 排除“贪小利、多杀几个兵”——按语说这是“取小遗大”：斩几个偏将、杀几千小兵，动摇不了叛军根本，对士卒是便宜、对将领是拖累、对主帅是祸害。舍了胜负不管、只图小胜，等于“纵虎归山”。

          · 排除“看旗帜找王”——按语明说“擒王之法，不可图辨旌旗”：只盯着帅旗找王，是找不到的，尹子奇不会傻到挂个大旗让你射。

          专属排除理由：“取小遗大”是最大的陷阱。兵力悬殊的局里，最诱人的就是“看得见的战果”（多杀几个敌人），但那补不回大局。必须放弃“摊开打”，把全部力量锁到“一个点”上——王。
      - k: "行动"
        v: |
          · 第一步——识王（剡蒿为矢）：张巡不认识尹子奇，怎么办？他命士兵把蒿秆削尖当箭，射向叛军。叛军中箭者一看是蒿秆（不是真箭），以为张巡箭尽，纷纷跑去向主帅报告这个“重大发现”。张巡在城头紧盯着——那个被一群士兵簇拥着、俯身查看“箭”的人，就是尹子奇。

          · 第二步——擒王（南霁云射眼）：张巡锁定尹子奇后，命神箭手南霁云搭箭拉满，一箭正中尹子奇左眼。主将重伤，叛军指挥大乱，收兵退还，睢阳之围暂解。
      - k: "预期"
        v: |
          可核验目标：用“蒿秆”逼出王、用“一箭”射倒王——尹子奇一倒，叛军“群龙无首”，组织不起有效进攻，围城自解。
          防御目标：在兵力悬殊的绝境里，不把力量浪费在“杀小兵”上，集中锁定一个中枢。
          以小博大：一根蒿秆加一箭，换来主将重伤、围城暂解。
      - k: "修正"
        v: |
          · 硬边界一：擒王能解一时之围，解不了长期之围——尹子奇只是被射伤左眼（“几获之”，差点抓住，但没死），收军退还后又重整旗鼓，把睢阳围得更死。睢阳最终因粮尽援绝陷落，张巡、许远、南霁云殉国。所以“擒王”的效力是“破坏指挥、争取时间”，不是“彻底消灭对方”——王没死，体系就能重建。

          · 硬边界二：“识王”才是这一计真正的难点——王不会挂个牌子让你认，你得先“看出谁是王”。张巡用“蒿秆”逼王现身，是“识王”的高明一招；但若识错了王（射了个偏将），就白费力气。

          · 专属失败模式：王没死，虎归山。“几获之”却没抓住，等于放虎归山——尹子奇重伤后卷土重来，反而把睢阳围得更死。擒王必须“擒实”（抓住或杀掉），只伤不擒，后患更大。
    effect: |-
      用“蒿秆”逼出王、用“一箭”射倒王——尹子奇一倒，叛军“群龙无首”，组织不起有效进攻，围城自解
    reusable_condition: |-
      “对方体系高度依赖单一枢纽、且我方能识别并够得着这个枢纽”的场景
    non_applicable: |-
      “对方去中心化、没有单一王可擒”或“王可识不可及”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第十八计：“摧其坚，夺其魁，以解其体。龙战于野，其道穷也。”

      · 引用词组出处：“射人先射马，擒贼先擒王”出自杜甫《前出塞》；“龙战于野，其道穷也”出自《周易·坤卦》上六。

      · 计文按语：“擒王之法，不可图辨旌旗，而当察其阵中之首动。昔张巡与尹子奇战……剡蒿为矢，中者喜谓巡矢尽，走白子奇，乃得其状，使霁云射之，中其左目，几获之，子奇乃收军退还。”

      · 历史案例：张巡守睢阳、射尹子奇，见《资治通鉴·唐纪》（安史之乱，至德二年／公元757年）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“多杀敌”，是“打中枢”——不跟整个系统缠斗，而是先“看出”维系这个系统的关键节点（王）在哪，再集中力量打掉它。

      与治水学的接口：结构判断·攻其枢要（识别并直击对方体系的枢纽节点，令整体瓦解）——张巡先“识王”（蒿秆逼尹子奇现身），再“擒王”（南霁云一箭射眼），十几万叛军主将一倒，围城自解。

      杠杆落点：王（主将／枢纽）。

      结构判断家族两态：隔岸观火（B-0009）是“结构判断·被动观察”——不介入，看对方系统内部矛盾自己发酵、自己崩；擒贼擒王是“结构判断·主动打击”——识别出对方系统的枢纽，主动把它拔掉。一观一打，同源异用。

      一个值得注意的点：擒王分两步——①识王（结构判断：找出谁是指挥中枢，不能只认旗帜、要察“阵中之首动”）；②擒王（定向打击枢纽）。张巡的“剡蒿为矢”是“识王”的妙招，也是这一计真正的技术含量所在。

      适用边界：适用于“对方体系高度依赖单一枢纽、且我方能识别并够得着这个枢纽”的场景；不适用于“对方去中心化、没有单一王可擒”或“王可识不可及”的情形。

  - id: "B-0019"
    num: "B-0019"
    title: "釜底抽薪"
    card_title: "B-0019｜釜底抽薪"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-14"
    source: "《三十六计·第十九计（混战计）》；《三国志·魏书·武帝纪》（官渡之战）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/K2hiz"
    interface: "断源消势（不敌其力，而消其势）"
    lever: "薪（粮草／根本供给）"
    concepts: ["疏浚"]
    keywords: ["釜底抽薪", "断源消势", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "官渡之战，曹操以两万余兵力对抗袁绍十余万大军，粮草将尽、濒临溃败。曹操采纳许攸之计，不正面硬拼，亲率五千精兵夜袭乌巢、烧毁袁绍万余车粮草，袁军断粮军心大乱，张郃高览投降，曹操乘势出击歼灭袁军七八万，袁绍仅带八百亲兵逃回河北。精妙在“断源消势”——不敌其力而消其势：对方表面强大的“力”挡不住，就断掉其“力”的源头（粮草），火一灭、水自凉。"
    elements:
      - k: "情境"
        v: |
          东汉建安五年（公元200年），曹操与袁绍在官渡对峙。袁绍坐拥青冀幽并四州，拥兵十余万、粮草充足，纸面实力全面碾压；曹操的兖州、豫州连年征战、民生凋敝，前线兵力不足三万，粮草仅能维持数月。

          曹操陷入双重困境：正面打不过，粮草又快耗尽，一度想退回许昌。硬拼必败，退又等于放弃翻盘。
      - k: "信号"
        v: |
          · 袁绍的“强”是表面的“力”——十几万大军、兵多粮足，正面锐不可当；但这股“力”有来源，全靠河北调来的粮草撑着。

          · 袁绍的粮草集中在乌巢（大本营以北四十里），守将淳于琼嗜酒无备、防守空虚——这是“薪”的位置，也是它的软肋。

          · 关键情报来自许攸：袁绍谋士许攸因家人犯法被抓，一怒投奔曹操，把“乌巢屯粮、守卫空虚”的核心情报和盘托出。

          曹操的判断是：袁绍的“力”（十几万大军）挡不住，但袁绍的“势”（粮草供给）可以断——烧了乌巢的粮草，十几万大军就成了“无源之水、无本之木”，不战自溃。
      - k: "排除"
        v: |
          · 排除“正面硬拼”——兵力悬殊，硬拼等于送死。

          · 排除“退回许昌”——荀彧写信劝他坚守待机：退回去就是放弃翻盘，战局转折点就在眼前。

          · 排除“跟袁绍打消耗战”——自己粮草将尽，拖不起，耗下去必死。

          专属排除理由：“扬汤止沸”不如“釜底抽薪”。跟袁绍正面拼、或一勺一勺舀开水来止沸（扬汤），都是治标不治本。袁绍的强在“粮草”（薪），必须绕过他的强，直捣他的“源”——乌巢粮草。
      - k: "行动"
        v: |
          · 第一步——识薪：许攸投奔曹操，献上“袁绍军粮辎重万余车皆屯于乌巢、守将淳于琼嗜酒无备”的核心情报，曹操由此锁定“薪”的位置和软肋。

          · 第二步——抽薪：留曹洪、荀攸守大营，曹操亲率五千精兵，打着袁绍的旗号，人衔枚、马勒口，连夜抄小路奔袭乌巢。途中遇袁军盘问，诈称“袁公派来加强乌巢守备”，骗过盘查；到乌巢后立刻四面放火，把袁绍囤积的一万多车粮草全部烧毁。

          · 收网：袁绍闻讯，没有优先救粮，反而命张郃、高览强攻曹营（分兵失策），结果曹营久攻不下；张郃得知乌巢粮草尽失，带兵投降曹操。曹操乘势全线出击，袁军军心大乱、四散溃逃，曹操歼灭袁军七八万，袁绍只带八百亲兵逃回河北，从此一蹶不振。
      - k: "预期"
        v: |
          可核验目标：烧掉乌巢粮草，让袁绍十几万大军断粮、军心大乱、不战自溃。
          防御目标：不在正面与十几万大军纠缠，避其“力”、断其“势”，把胜负手从“兵力”转到“粮草”。
          以小博大：五千精兵的一场夜袭，换袁绍十万大军不战而败，奠定统一北方的基础。
      - k: "修正"
        v: |
          · 硬前提一：先得“识薪”——釜底抽薪的前提是“知道对方的薪在哪、守备如何”。曹操靠许攸的情报才精准锁定乌巢；没有这份情报，就抽不到薪。

          · 硬前提二：抽薪要快、要彻底——曹操拒绝了部下“分兵阻援”的建议，集中全力烧粮，才一举成功；分兵或烧不干净，袁绍大军就还有救。

          · 专属失败模式：薪抽不净，火还能再烧——只烧一半、或对方还有后备补给，十几万大军就还能撑。所以釜底抽薪要“断根”（彻底切断供给），而不是“扬汤”（治标）。
    effect: |-
      烧掉乌巢粮草，让袁绍十几万大军断粮、军心大乱、不战自溃
    reusable_condition: |-
      “对方表面强大但依赖可切断的单一供给（粮草／资金／关键资源），且我方能识别并够得着这个供给”的场景
    non_applicable: |-
      “对方供给多元化、切断一处不伤根本”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第十九计：“不敌其力，而消其势，兑下乾上之象。”

      · 计文按语：“水沸者，力也，火之力也，阳中之阳也，锐不可当；薪者，火之魄也，即力之势也，阴中之阴也，近而无害；故力不可当而势犹可消。”

      · 引用词组出处：“抽薪止沸”语出北齐魏收《为侯景叛移梁朝文》；“兑下乾上”出自《周易·履卦》。

      · 历史案例：官渡之战曹操火烧乌巢，见《三国志·魏书·武帝纪》（建安五年/公元200年）。

      · 按语另载吴汉坚卧不动、薛长儒攻心夺气两例（属“攻心夺气”一型），本篇主案例取官渡之战烧乌巢（属“断粮断源”一型）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“硬拼”，是“断源”——对方表面强大的“力”（水沸腾、十几万大军）你挡不住，但“力”是有来源的，靠“薪”（柴火／粮草）撑着。不碰“力”，直接抽掉“薪”，火一灭，水就凉了（势自消）。

      与治水学的接口：断源消势（不敌其力，而消其势）——曹操不正面抵挡袁绍的十几万大军，而是夜袭乌巢烧掉其粮草，十万大军断粮、军心大乱、不战自溃。

      杠杆落点：薪（粮草／根本供给）。

      “攻其要害”一族两态：擒贼擒王（B-0018，攻其枢要）是“断头”——打击协调中枢（谁在指挥）；釜底抽薪（断源消势）是“断粮”——切断能量供给（靠什么撑）。一个断“头”、一个断“粮”，同源异用，都属“攻其要害”一族。

      一个值得注意的点：抽薪也分两步——①“识薪”（找出对方力量的来源／根本，曹操靠许攸的情报锁定乌巢）；②“抽薪”（彻底切断供给，曹操集中五千精兵烧粮、不分兵）。“识薪”与擒贼擒王的“识王”异曲同工，都是这一计真正的技术含量。

      适用边界：适用于“对方表面强大但依赖可切断的单一供给（粮草／资金／关键资源），且我方能识别并够得着这个供给”的场景；不适用于“对方供给多元化、切断一处不伤根本”的情形。
  - id: "B-0020"
    num: "B-0020"
    title: "浑水摸鱼"
    card_title: "B-0020｜浑水摸鱼"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-15"
    source: "《三十六计·第二十计（混战计）》；《三国志·蜀书·先主传》《三国志·蜀书·庞统传》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/Zx9X2"
    interface: "乘乱取利（乘其阴乱，利其弱而无主）"
    lever: "乱（对方弱而无主）"
    concepts: ["响应缺口"]
    keywords: ["浑水摸鱼", "乘乱取利", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "东汉末年天下大乱，刘备无立足之地，寄居荆州。益州牧刘璋暗弱无主，听张松、法正之劝迎刘备入川。刘备留孔明守荆州，带庞统入川，驻葭萌关厚树恩德、收拢人心，待时机成熟借“借兵回援”翻脸，庞统献三策，刘备采中策诱杀杨怀高沛、夺涪城，最终逼刘璋投降、取益州为根基，奠定三分天下。精妙在“乘乱取利”——趁天下乱、刘璋无主，把又肥又弱又无主的“鱼”摸到手。"
    elements:
      - k: "情境"
        v: |
          东汉末年，天下大乱、群雄割据。刘备一直寄人篱下，先后投靠公孙瓒、吕布、曹操、袁绍、刘表，始终没有自己的地盘。赤壁之战后，刘备虽在荆州立足，但荆州是借东吴的，地处曹操、孙权的夹缝，不是长久之计。

          益州牧刘璋暗弱无主——懦弱、没主见、摇摆不定，正怕张鲁和曹操来犯，在张松、法正的怂恿下，迎刘备入川相助。

          刘备卡在一个两难里：益州富庶、是成就大业的根基，但刘璋是同宗，取之会“失信于天下”；不取，益州迟早被别人占去。
      - k: "信号"
        v: |
          · 天下大乱、数力冲撞，益州刘璋“弱而无主”——懦弱、没主见、摇摆不定，正是按语里说的“无主之鱼”。

          · 刘璋主动邀刘备入川，等于亲手把益州的门户敞开——这是“水浑”的窗口，请神容易送神难。

          · 庞统点破关键：荆州“荒残、人物流失、东有孙权北有曹操”，久居必被动；益州“户口百万、土地肥沃、物产丰饶”，才是成就大业的根基。

          刘备的判断是：益州这条“鱼”又肥、又弱、又无主，正是“浑水摸鱼”的绝佳对象——趁天下乱、刘璋无主，取益州为根基。
      - k: "排除"
        v: |
          · 排除“继续寄居荆州”——荆州残破、强敌环伺，久居必被动。

          · 排除“一入川就动手”——庞统、法正劝刘备在涪城会面时“鸿门宴”袭杀刘璋，刘备否了：初入他国、恩信未立，贸然动手会失信于天下、激起益州反抗。

          · 排除“真的去帮刘璋打张鲁”——那是真帮忙，把自己的兵力耗在别人的地盘上，坐失取益州的机会。

          专属排除理由：“水不浑，摸不到鱼”。一入川就袭杀刘璋，水还不够浑（恩信未立、人心未附），动手只会失信于天下、激起反抗，反而摸不到鱼。必须先把水搅浑、或等水浑——驻下不动、广施恩德、收拢人心，等“恩信已立、时机成熟”，再翻脸取之。
      - k: "行动"
        v: |
          · 第一步——进浑水：应刘璋之邀，留诸葛亮、关羽守荆州，带庞统、黄忠、魏延率兵入川。

          · 第二步——搅浑水：驻葭萌关，不急着攻张鲁，而是厚树恩德、收拢人心，在益州积累声望和实力。

          · 第三步——摸鱼：后来曹操攻东吴，刘备借“回援荆州”向刘璋借精兵三万，刘璋只拨老弱四千。刘备借此翻脸，庞统献上中下三策，刘备采中策——诱杀刘璋大将杨怀、高沛，吞并其兵，夺涪城，与刘璋彻底决裂。

          · 第四步——收网：调诸葛亮、张飞、赵云入川，一路势如破竹，逼刘璋投降，取益州（巴蜀四十一州），奠定三分天下的根基。
      - k: "预期"
        v: |
          可核验目标：取益州为根基，成就“跨有荆益、三分天下”的霸业。

          防御目标：先在益州“厚树恩德”站稳脚跟（把水搅得更浑），等时机成熟再翻脸，避免“失信于天下”的提前翻脸。

          以小博大：借刘璋之邀入川，几乎不费刀兵入益州腹地，再顺势取之。
      - k: "修正"
        v: |
          · 硬边界一：时机窗口有限——水不会一直浑，鱼不会一直晕。刘备在涪城“鸿门宴”时犹豫（没听庞统袭杀刘璋），错失一次“一网打尽”的机会；后来翻脸硬打，代价变大——庞统命丧落凤坡。

          · 硬边界二：搅浑水有道德成本——刘备“趁乱取同宗兄弟的地盘”，背上了“失信于天下”的负担，受降时还要握着刘璋的手流泪说“不是我不行仁义，实在是形势所迫”。

          · 专属失败模式：水浑了，鱼却没摸到。刘备若一直“厚树恩德”不动手（沉吟不去），或动手太早（恩信未立就翻脸），都会失败。庞统警告“若沉吟不去，将致大困，不可久矣”——摸鱼要果断，拖久了水会澄清、鱼会清醒。
    effect: |-
      取益州为根基，成就“跨有荆益、三分天下”的霸业
    reusable_condition: |-
      “局势动荡、对方弱而无主、且取利窗口短促”的场景
    non_applicable: |-
      “水清无鱼、局势明朗、对方有主心骨”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第二十计：“乘其阴乱，利其弱而无主。随，以向晦入宴息。”

      · 引用词组出处：“随，以向晦入宴息”出自《周易·随卦》。

      · 计文按语：“动荡之际，数力冲撞，弱者依违无主，敌蔽而不察，我随而取之……是鱼，混战之际，择此而取之。如刘备之得荆州、取西川，皆此计也。”

      · 历史案例：刘备取西川，见《三国志·蜀书·先主传》《三国志·蜀书·庞统传》。

      · 浑水摸鱼，又作“混水摸鱼”。原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“硬取”，是“趁乱取利”——对方“弱而无主”（力量虚弱、摇摆不定、没有主心骨），趁局势混乱，顺手把利益取走，就像趁水浑、鱼晕头转向辨不清方向，一伸手就摸到了。

      与治水学的接口：乘乱取利（乘其阴乱，利其弱而无主）——刘备趁天下大乱、刘璋暗弱无主，取益州为根基。

      杠杆落点：乱（对方“弱而无主”的混乱状态）。

      趁乱取利两态：趁火打劫（B-0005，响应缺口）是“趁火”——对方遭遇灾难性崩溃（堤坝决口），趁机取大利；浑水摸鱼是“趁浑”——局势混乱、对方无主摇摆，趁机取利。一个趁“火”（灾难），一个趁“浑”（无主之乱）。

      一个值得注意的点：浑水摸鱼还有“主动搅浑”的延伸用法（主动制造混乱再取利），但计文本义是“乘其阴乱”（利用已有的乱）。本篇主案例取刘备取西川——“乱”是天下大乱、“无主”是刘璋暗弱，都是既成的，刘备只是“趁”。

      适用边界：适用于“局势动荡、对方弱而无主、且取利窗口短促”的场景；不适用于“水清无鱼、局势明朗、对方有主心骨”的情形。
  - id: "B-0021"
    num: "B-0021"
    title: "金蝉脱壳"
    card_title: "B-0021｜金蝉脱壳"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-16"
    source: "《三十六计·第二十一计（混战计）》；《宋史·毕再遇传》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/3T5zA"
    interface: "留壳抽身（存其形，完其势，留壳稳住对方，本体脱身）"
    lever: "壳（稳住对方的假象）"
    concepts: ["响应缺口"]
    keywords: ["金蝉脱壳", "留壳抽身", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "南宋开禧二年，宋将毕再遇以几千人马对抗金军数万精锐，寡不敌众、决意撤退。为免金兵追杀，毕再遇不直接撤，而是“悬羊击鼓”——把羊倒吊树上、前蹄蹬鼓，制造“宋军还在”的假象，全军在鼓声掩护下悄悄撤离。金兵听鼓声不停、见旗帜如林，两天不敢进兵，等察觉是羊击鼓，宋军早已远遁。精妙在“留壳抽身”——留一副空壳稳住对方，本体安全脱身。"
    elements:
      - k: "情境"
        v: |
          南宋开禧二年（1206年），宋将毕再遇率军与金兵对垒，打了几次胜仗。金兵调集数万精锐骑兵，要与宋军决战。此时宋军只剩几千人马，寡不敌众，硬拼必败。

          毕再遇决定撤退以保存实力，但难题摆在眼前：金军兵临城下，一旦察觉宋军撤退，必定追杀，宋军会损失惨重。
      - k: "信号"
        v: |
          · 金兵一直盯着宋营的“鼓声”——宋军交战时总擂鼓（威慑敌人、鼓舞士气），金兵已形成“鼓声不停＝宋军还在”的判断习惯。

          · 鼓声一停，金兵就察觉宋军撤退，立刻追杀。

          · 更要紧的是，金兵之前被宋军“疲兵之计”搅过——整夜听鼓声不得安宁，已经“习惯”了这鼓声，甚至开始“不予理会”。

          毕再遇的判断是：金兵“听鼓辨敌”，鼓声是“宋军还在”的信号。只要留一个“会自己敲鼓”的壳，让鼓声继续响，宋军就能在金兵眼皮底下悄悄撤走。
      - k: "排除"
        v: |
          · 排除“硬拼决战”——几千对几万，必败。

          · 排除“直接撤退”——鼓声一停、旗帜一撤，金兵立刻察觉、追杀，宋军损失惨重。

          · 排除“留人断后”——留少量人断后等于送死，且人少了鼓声气势不够，骗不过金兵。

          专属排除理由：“走而不示走”。金蝉脱壳的关键，是撤得让敌人看不出来。直接撤（示走），金兵就追杀；必须“留壳”——悬羊击鼓，制造“宋军还在”的假象，让金兵“敌不动”（不敢贸然进兵），宋军才能安全脱身。
      - k: "行动"
        v: |
          · 第一步——留壳：暗中作好撤退部署，命士兵找来几十只羊，把羊后腿绑住、倒吊在树上，羊前蹄下放几十面战鼓。羊被倒吊难受，前蹄乱蹬，把鼓敲得“咚咚”响。

          · 第二步——抽身：在鼓声掩护下，毕再遇率全军悄悄撤离，营中旗帜原封不动。

          · 结果：金兵见宋营旗帜如林、鼓声日夜不停，以为宋军还在，不敢进兵。两天后，金兵见宋营毫无动静，派人侦察，才发现击鼓的是一群羊，宋军早已无影无踪。
      - k: "预期"
        v: |
          可核验目标：让全军在鼓声掩护下安全撤离，不被金兵察觉、追杀。

          防御目标：留下“宋军还在”的假象，让金兵“敌不动”（不敢进兵），为撤离争取时间。

          以小博大：几十只羊加几十面鼓，换来几千人马安然撤离。
      - k: "修正"
        v: |
          · 硬边界一：壳要够“真”——鼓声从“人敲”变成“羊敲”，气势、节奏其实有差别。毕再遇能骗两天，靠的是金兵已被“疲兵之计”搅过、习惯了鼓声、甚至“不予理会”。金兵警觉一点、早点派人侦察，“羊击鼓”就露馅。

          · 硬边界二：脱身要快、要静——金蝉脱壳“谋成于密，败于泄”，全过程要在敌人不知不觉中进行。毕再遇是暗中部署、趁鼓声掩护悄悄撤离；动静一大、或撤得慢，就露馅。

          · 专属失败模式：壳破了，身没脱。若金兵提前察觉（鼓声异常、或派人侦察），“羊击鼓”的壳就破了，宋军还在撤离途中就会被追上。金蝉脱壳的命门，在“壳要撑到身走远”——壳一提前破，身就危险了。
    effect: |-
      让全军在鼓声掩护下安全撤离，不被金兵察觉、追杀
    reusable_condition: |-
      “局势不利、必须撤离，但直接撤会被追杀”的场景
    non_applicable: |-
      “对方高度警觉、假象撑不住”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第二十一计：“存其形，完其势；友不疑，敌不动。巽而止蛊。”

      · 引用词组出处：“巽而止蛊”出自《周易·蛊卦》。

      · 历史案例：毕再遇悬羊击鼓，见《宋史·毕再遇传》。

      · 计文按语另载诸葛亮病逝五丈原、姜维以木像反旗鸣鼓退司马懿，及檀道济量沙充粮两例，本篇主案例取毕再遇悬羊击鼓。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“慌不择路的逃跑”，是“有准备的转移”——要撤、要转移的时候，别把“我要走了”露出来，留下一副“空壳”（假象／外形）稳住对方，让本体（主力）趁机悄悄脱身。毕再遇用“悬羊击鼓”（羊蹄敲鼓）留下“宋军还在”的壳，宋军主力在鼓声掩护下安全撤离。

      与治水学的接口：留壳抽身（存其形，完其势，留壳稳住对方，本体脱身）。

      杠杆落点：壳（稳住对方的假象）。

      “明暗分离”家族三态：声东击西（B-0006）是“明线调动（引开）＋暗线攻击”；暗渡陈仓（B-0008）是“明线锁定（钉住）＋暗线攻击”；金蝉脱壳是“明线稳住（壳）＋暗线脱身（走）”。三计同构（明线＋暗线），区别在暗线的性质——声东击西、暗渡陈仓的暗线是“打”（攻击），金蝉脱壳的暗线是“走”（脱身）。

      一个值得注意的点：金蝉脱壳是“走而不示走”——按语说它“非徒走也，盖为分身之法也”：留一副壳、抽走本体，去保全实力或袭击别处。

      适用边界：适用于“局势不利、必须撤离，但直接撤会被追杀”的场景；不适用于“对方高度警觉、假象撑不住”的情形。
  - id: "B-0022"
    num: "B-0022"
    title: "关门捉贼"
    card_title: "B-0022｜关门捉贼"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-17"
    source: "《三十六计·第二十二计（混战计）》；《史记·白起王翦列传》（长平之战）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/v5b88"
    interface: "关门困敌（小敌困之，断其去路，围而歼之）"
    lever: "门（退路／去路）"
    concepts: ["方舟"]
    keywords: ["关门捉贼", "关门困敌", "方舟", "决策显影库", "宁凯峰"]
    abstract: "长平之战，秦将白起面对赵括亲率的四十万大军，不硬拼、不追击，而是先佯败诱敌，等赵军离开坚固营垒、深入秦境，再派奇兵截断其退路、切断粮道，把四十万赵军围成“瓮中之鳖”，围困46天、粮绝，赵括突围被射杀，赵军全军覆没。精妙在“关门困敌”——不追不赶，先关门（断退路）、再捉贼（围歼），让敌人无路可逃、一网打尽。"
    elements:
      - k: "情境"
        v: |
          战国后期，公元前260年，秦赵长平之战。赵将廉颇坚壁固守，秦军久攻不下。秦王采纳范雎的离间计，赵王中计，用“纸上谈兵”的赵括换下了廉颇。赵括一到任，就改变廉颇坚守不战的策略，主张主动出击。

          秦将白起面对的是一道选择题：赵括亲率四十万大军来攻，正面硬拼伤亡大；但白起要的不是“击退”，是“全歼”——击退会放虎归山，全歼才能一劳永逸。所以这一局的关键，不在“打赢”，在“关门”（让赵军无路可逃）。
      - k: "信号"
        v: |
          · 赵括“纸上谈兵”、鲁莽轻敌——容易被“小胜”勾着走，可“诱敌深入”。

          · 赵军四十万大军一旦离开坚固营垒，就失去了依托，从“啃不动的硬敌”变成“可围之敌”。

          · 长平一带地形，利于设伏、断后、合围。

          白起的判断是：赵括轻敌冒进，正好“诱敌深入”——等赵军离开营垒、深入秦境，再“关门”（断其退路、切其粮道），把四十万赵军围成“瓮中之鳖”，一举歼灭。
      - k: "排除"
        v: |
          · 排除“正面硬拼”——赵军四十万、且依托营垒，硬拼伤亡大。

          · 排除“只击退、不围歼”——击退赵军，它退回营垒、卷土重来；按语说“恐其逸而为他人所得”，放走它，它又成威胁。

          · 排除“穷追败敌”——按语“逸者不可复追，恐其诱也”：追击败退的敌人，怕中诱敌之计；且贼“有脱逃之机，势必死斗”。

          专属排除理由：“捉贼必关门”。白起要的不是“赢一场”，是“全歼”，所以不能“追”（追会中诱敌计、会让贼拼命死斗），而要先“关门”（断其退路、围起来），让赵军无路可逃，再从容歼灭。
      - k: "行动"
        v: |
          · 第一步——开门诱敌：白起佯装败退，让赵括取得几次小胜。赵括得意忘形，率四十万大军追击“败退”的秦军，一路追到秦军营垒，离开了自己的坚固营垒、深入秦境。

          · 第二步——关门断路：赵军深入后，白起派两支奇兵：一支二万五千人迂回赵军后方，攻占故关，切断赵军与邯郸的联系和粮道（关门）；另一支五千骑兵插入赵军先头部队与主营之间，把赵军分割成两段。

          · 第三步——围歼捉贼：赵括发现中计被围，下令就地扎营、待机突围。白起分兵几路死死围困，多次击退赵军突围。赵军被围四十六天，粮绝，“士兵杀人相食”，赵括拼命突围被射杀，四十万赵军几乎全军覆没，赵国从此一蹶不振。
      - k: "预期"
        v: |
          可核验目标：围歼赵军主力，而非击退——全歼才能一劳永逸。

          防御目标：诱敌深入、断其退路、切其粮道，把赵军围成“瓮中之鳖”，围困到粮绝。

          以小博大：用“关门”（包围）而非“硬拼”，以最小代价换来“全歼”而非“击退”。
      - k: "修正"
        v: |
          · 硬边界一：关门只关得住“弱敌”——按语说“关弱不关强”。白起能关门围住赵军，是因为赵军“深入无依托、粮道被断”后，已经成了“弱敌”。若关门关的是“强敌”（依托完整、粮草充足），反而会被它从里面打破，落得“墙倒门破”。

          · 硬边界二：门要关得严——若门关不紧、让赵军突围，就前功尽弃。白起是“分兵几路死死围困、多次击退突围”，才把门关严。

          · 专属失败模式：门没关严，贼破门而出。若赵军在被围初期（粮未尽、气未馁时）集中兵力突围，而包围圈有缺口，四十万赵军就可能破围而出。关门捉贼的命门，在“门要关得严、关得及时”——门一漏，贼就跑了。
    effect: |-
      围歼赵军主力，而非击退——全歼才能一劳永逸
    reusable_condition: |-
      “敌人已深入我方优势区域、孤立无援、且可围而歼之”的场景
    non_applicable: |-
      “敌人依托完整、粮草充足（关不住）”或“敌人势大、围不住”的情形
    source_note: |
      · 计名与原文：出自《三十六计》第二十二计：“小敌困之。剥，不利有攸往。”

      · 引用词组出处：“剥，不利有攸往”出自《周易·剥卦》；“一人投命，足惧千夫”出自《吴子·励士》。

      · 历史案例：长平之战白起围歼赵括，见《史记·白起王翦列传》（公元前260年）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“打赢一场”，是“全歼”——对付敌人（尤其是机动灵活的小股／游兵），别追、别赶（追会中诱敌之计，赶会放虎归山），而是“关门”，断它的去路、把它围起来，让它无路可逃，再一网打尽。白起先诱赵括深入，再派奇兵截断赵军退路、切断粮道，把四十万赵军围成“瓮中之鳖”，围困四十六天、粮绝，一举全歼。

      与治水学的接口：关门困敌（小敌困之，断其去路，围而歼之）。

      杠杆落点：门（退路／去路）。

      一个值得注意的点：这是治水学里少见的“堵”式操作——但与鲧“堵洪水”（全局堵、堵不住）相反，关门捉贼是“局部堵”（对“小敌”围而歼之，堵小不堵大）。前提是“关弱不关强”——门关的是“弱敌”，关“强敌”反会被它从里面打破。

      对照：关门捉贼和“欲擒故纵”（B-0016）正好相反——欲擒故纵是“松手放”（不逼、泄势），关门捉贼是“关门堵”（断退路、围歼）。一个“放”、一个“关”。

      适用边界：适用于“敌人已深入我方优势区域、孤立无援、且可围而歼之”的场景；不适用于“敌人依托完整、粮草充足（关不住）”或“敌人势大、围不住”的情形。

  - id: "B-0023"
    num: "B-0023"
    title: "远交近攻"
    card_title: "B-0023｜远交近攻"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-18"
    source: "《三十六计·第二十三计（混战计）》；《战国策·秦策三》（范雎献远交近攻）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/bjV8q"
    interface: "动力调控·压力错峰（把多个对手按远近分层、分批处理压力）"
    lever: "远近分层"
    concepts: ["动力层"]
    keywords: ["远交近攻", "动力调控", "压力错峰", "边界划定", "决策显影库", "宁凯峰"]
    abstract: "战国末期，范雎向秦昭襄王献“远交近攻”——纠正穰侯魏冉“越韩魏而远攻齐”的路线，把六国按远近分层：先稳住远的齐楚燕（远交），集中力量蚕食近的韩魏（近攻），得寸则寸、得尺则尺，由近及远各个击破，最终一统天下。精妙在“边界划定”——把存续边界划到统一天下的全局未来，才有远近可分。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：秦国的存续边界划在“统一天下”——是整体未来全方位规划，不是眼前一城一地的物质利益。这个宽边界一旦划定，“远／近”才有意义。

          第二层·威胁识别：秦昭襄王正打算“越韩魏而远攻齐”——这是权臣穰侯魏冉的路线：跨过邻近的韩、魏，劳师远征去打东边的齐国。派兵少了打不赢，派兵多了，打赢了也守不住千里之外的地，只会让韩、魏坐收渔利。

          第三层·现状约束：地理卡住了手脚（形禁势格）——远敌够不着、拿到也占不住；近敌（韩、魏）才是卧榻之侧的心腹之患。
      - k: "信号"
        v: |
          · 范雎一句点破远攻的荒谬：“王不如远交而近攻，得寸则王之寸，得尺亦王之尺也。今舍此而远攻，不亦谬乎？”

          · 越过去打远的，赢了也拿不到一寸地，反而便宜了近处的对手。

          · 韩、魏地处中原，是天下之枢——近，且是必争之地；齐、楚、燕距离远，暂时够不着、也拿不下。
      - k: "排除"
        v: |
          · 排除“越近攻远”——跨过韩魏去伐齐，劳师远征，胜亦不能守，反而让韩魏坐收渔利。

          · 排除“近者交之”——按语说“近者交之，反使变生肘腋”：跟身边的强邻称兄道弟，变乱就在卧榻之侧发生。

          专属排除理由（适用条件）：远交近攻是“全局未来”尺度下的战略；若系统边界只划在眼前物质利益／局部，则此计不成立。宋朝“联金灭辽”“联蒙灭金”翻车的根源，正是边界划窄了——把“远交”当成了眼前结盟，而不是全局未来的一步分治。
      - k: "行动"
        v: |
          · 第一步——识远近：把六国按地理远近分成两层：韩、魏是“近”（天下之枢，必争之地），齐、楚、燕是“远”（暂时够不着）。

          · 第二步——远交：外交稳住远国：主动交好齐国，联姻笼络燕国，稳住楚国，重金贿赂、离间收买，绝不让它们跟韩、魏抱团。

          · 第三步——近攻：集中兵力先啃近的：攻魏取怀邑、邢丘，攻韩取成皋、荥阳，把韩国国土“断而为三”，得寸则寸、得尺则尺，由近及远滚动蚕食。
      - k: "预期"
        v: |
          先拿下韩、魏这个天下枢纽，再北慑赵、南伐楚，最后平齐——由近及远、各个击破，像蚕吃桑叶一样，一轮一轮吃掉，最终一统天下。
      - k: "修正"
        v: |
          · 硬边界：“远交”的“远”只是暂时够不着的狼，不是朋友。远交只是避免树敌过多的暂时性外交权术，近敌一旦被吃掉，远敌就变成新近敌，必须及时把“交”翻成“攻”、滚动推进。

          · 专属失败模式：错把“远交”当长期和好，或交错了对象（交了个比近敌更凶的）。宋朝联金灭辽（致靖康之耻）、联蒙灭金（致亡国）——灭掉近敌后，自己被更凶的“远友”吞掉。
    effect: |-
      先拿下韩、魏这个天下枢纽，再北慑赵、南伐楚，最后平齐——由近及远、各个击破，最终一统天下
    reusable_condition: |-
      “系统边界划在全局未来、多对手有远近之分、远敌暂时够不着”的场景
    non_applicable: |-
      “系统边界只划在眼前物质利益／局部（边界划窄，此计即失效）”的情形
    source_note: |
      · 计文原文：“形禁势格，利从近取，害以远隔。上火下泽。”

      · 语出《战国策·秦策三》范雎：“王不如远交而近攻，得寸则王之寸，得尺亦王之尺也。”

      · 按语：“混战之局，纵横捭阖之中，各自取利。远不可攻，而可以利相结；近者交之，反使变生肘腋。范雎之谋，为地理之定则，其理甚明。”

      · 引用词组出处：“上火下泽”出自《易经·睽卦》。

      · 反面案例：宋朝“联金灭辽”（致靖康之耻）、“联蒙灭金”（致亡国）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“搞外交”，而是“压力错峰”——把多个对手按远近分层，远的先用外交稳住（暂缓处理），近的集中力量吃掉，一轮一轮由近及远滚动，避免同时面对所有对手。范雎先稳住齐、楚、燕（远交），再集中兵力蚕食韩、魏（近攻），得寸则寸、得尺则尺。

      与治水学的接口：动力调控·压力错峰（空间/对象维）。

      注：它不同于“分层异步”（时间维，指动力与规则传导的时间差），也不同于“以逸待劳”（时间维，等对方衰竭）。“远交近攻”是空间与对象维度的错开，是把系统无法一次性承受的多股动力，按空间远近分批处理。

      认识论映射：边界划定——范雎先帮秦昭王把系统边界从“眼前利益”拉大到“统一天下”，才谈得上远／近之分、才谈得上远交近攻。三层决策链：先看边界（认识论），再定机制（动力学·压力错峰），最后选工具（祭祀稳住远国＋疏浚集中打近）。

      尺度提示：三十六计从本体论、认识论、方法论到工具层，各维度都有智慧，同一个计在不同尺度落在不同层。本判例取国家尺度：主接口锁动力学层的“压力错峰”，认识论层映射“边界划定”；换到个人尺度是另一套解释。读此计先问尺度，别把它钉死在某一层。
  - id: "B-0024"
    num: "B-0024"
    title: "假道伐虢"
    card_title: "B-0024｜假道伐虢"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-19"
    source: "《三十六计·第二十四计（混战计）》；《左传·僖公二年／五年》（荀息假道伐虢）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/QonIc"
    interface: "借道渗透（借路为名，渗入力量，先达真目标，回头吞掉借道者）"
    lever: "道（借路／借名义）"
    concepts: ["疏浚"]
    keywords: ["假道伐虢", "借道渗透", "对象维", "借刀杀人", "决策显影库", "宁凯峰"]
    abstract: "春秋时，晋献公欲吞并相邻的虢、虞两个小国，二者唇齿相依、互为犄角。大夫荀息献“假道伐虢”——用屈产良马、垂棘美璧贿赂贪财的虞公，借虞国通道伐虢，灭虢后回师顺手灭了虞国，一石二鸟。精妙在“借道渗透”——借中间人的路／名义作跳板，先打真目标，回头把借道者也一并吞掉（唇亡齿寒）。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：晋献公要向南扩张，真正的目标是虢国。但晋、虢之间隔着一个虞国，虞、虢两个小国唇齿相依、互为犄角——打虢，虞会出兵相助；打虞，虢也会来救。动一个，另一个就动。

          第二层·威胁识别：这是一局“一石二鸟”——晋国骨子里要的是虢、虞两个小国，但两个目标互为表里，正面硬打会被夹击。

          第三层·现状约束：虞公贪财短视、可收买；大夫宫之奇清醒，喊出“唇亡齿寒”，但虞公不听——于是有了“借道”这道缝隙。
      - k: "信号"
        v: |
          · 荀息点破关键：“以屈产之乘，与垂棘之璧，假道于虞以伐虢。”

          · 虞公贪图宝物，且心存侥幸（“晋是大国、与我同宗，借条路走走无妨”）。

          · 这个“侥幸”正是可乘之隙：中间人可收买、可欺，真实目标与中间人都够得着。
      - k: "排除"
        v: |
          · 排除“直接硬打”——虞、虢唇齿相依、互为犄角，打一个，另一个必然来救，正面硬打会被夹击。

          · 排除“光靠说辞”——按语说“非巧言可诳”，对处在困境中的小国，光说好话没用，得用实物（宝物）＋“不会害你”的承诺，稳住它的侥幸心。

          专属排除理由（适用条件）：假道伐虢只在“中间人可收买／可欺，且真实目标与中间人都够得着”时成立。若中间人识破（宫之奇的“唇亡齿寒”），或中间人太强、借道反被夹击，则不适用。
      - k: "行动"
        v: |
          · 第一步——送宝借道：用屈产良马、垂棘美璧贿赂贪财的虞公，名义是“只借路伐虢，不害虞国”。荀息对晋献公说：宝物只是暂时存放在虞国府库，等灭了虞国，一切不都回来了。

          · 第二步——假道伐虢：晋军借虞国通道，出其不意灭了虢国（真目标）；期间还让虞公出兵打头阵，加深它卷入。

          · 第三步——回师灭虞：班师时驻军虞都附近，以“打猎／演习”为名，里应外合顺手灭了虞国（借道者），宝物原样收回——“马则吾马，齿亦老矣”。
      - k: "预期"
        v: |
          一石二鸟：先借道灭虢（第一目标），回头灭虞（借道者），两个小国先后吞并——宝物只是“暂存”虞国府库，终究物归原主。
      - k: "修正"
        v: |
          · 硬边界：“假道”必须借得成——道要通、中间人要肯借。一旦中间人把门关上，整个局就断了。

          · 专属失败模式：“借道者”没被吃掉，或借道者提前识破、联合真目标反制。宫之奇的“唇亡齿寒”正是这道防线——虞公若听进去、拒绝借道，晋国就无从下口；若虞虢联手，晋国反被夹击。命门在“道要借得成、吞得掉”。
    effect: |-
      一石二鸟：先借道灭虢（第一目标），回头灭虞（借道者），两个小国先后吞并——宝物只是“暂存”虞国府库，终究物归原主
    reusable_condition: |-
      “中间人可收买／可欺，且真实目标与中间人都够得着”的场景
    non_applicable: |-
      “中间人识破（唇亡齿寒）、或中间人太强、借道反被夹击”的情形
    source_note: |
      · 计文原文：“两大之间，敌胁以从，我假以势。困，有言不信。”

      · 语出《左传·僖公二年》荀息：“以屈产之乘，与垂棘之璧，假道于虞以伐虢。”

      · 按语：“假地用兵之举，非巧言可诳……我则诳之以不害，利其幸存之心，速得全势，彼将不能自阵，故不战而灭之矣。”

      · 引用词组出处：“唇亡齿寒”出自《左传·僖公五年》宫之奇：“虢，虞之表也；虢亡，虞必从之……谚所谓‘辅车相依，唇亡齿寒’者，其虞、虢之谓也。”；“困，有言不信”出自《易经·困卦》。

      · 原文与史实以传世文献为准。
    recorder_note: |
      接口角度（对象维·借道渗透）：假道伐虢的本质是“借道”——借一个中间人（虞国）的通道／名义作跳板，把力量渗透进去，先打真实目标（虢），回头把借道者（虞）也一并吞掉。杠杆落在“道”（借路／借名义），是一石二鸟的梯次蚕食。

      分层标注·认识论映射：系统边界划在“虢、虞两个都要吃”，不单是伐虢；边界一旦划到“两个都要”，“借道”才成为必然。

      分层标注·工具映射：祭祀（送宝稳住虞公的侥幸心）＋疏浚（借虞国通道把兵力引向虢）。

      与借刀杀人的关系：借刀杀人（B-0003，借力／换出力者）与假道伐虢（借道／换通道）同源，都是对象维的“借”；但假道伐虢多一层“反客为主”——借完道，把出借者也一并吞掉。

      一句话结构：不是“我要打谁”，而是“谁的路能让我走到谁”——找一条能通到真目标的路，先借来用，用完连路一起收。
  - id: "B-0025"
    num: "B-0025"
    title: "偷梁换柱"
    card_title: "B-0025｜偷梁换柱"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-20"
    source: "《三十六计·第二十五计（并战计）》；《史记·秦始皇本纪》《史记·李斯列传》（沙丘之变）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/vIzTo"
    interface: "结构判断·偷换承重（辨出承重件，替换，使体系外观不变而支撑已失）"
    lever: "梁（承重件）"
    concepts: ["结构判断"]
    keywords: ["偷梁换柱", "结构判断", "偷换承重", "决策显影库", "宁凯峰"]
    abstract: "秦始皇沙丘病危，赵高扣压遗诏、拉李斯入伙、伪诏赐死扶苏与蒙恬，秘不发丧以保外观——先识出体系的承重件（合法性来源＋军方执行者），再用自己人替换，使秦帝国在支撑已被抽走、外观却毫无变化的情况下自行崩塌。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：秦帝国的权力交接系统。公元前210年，秦始皇第五次南巡途中病重。这个系统的边界划在“始皇死后，谁来继承皇位、谁来撑起这个帝国”。

          第二层·威胁识别（承压者与承重件）：承压者是秦帝国的继承系统，实质是“扶苏—蒙恬”这组支撑；它最怕失去的不是皇位，而是合法性来源与执行力同时被抽走。真正决定存亡的不是皇帝本人，而是三样承重件——遗诏（立扶苏）、符玺（发令的凭据）、以及扶苏（长子声望）＋蒙恬（三十万边军）这对支撑。这三样一撤，帝国骨架就空。

          第三层·现状约束：遗诏与玉玺都在赵高手里（掌符玺）；李斯是唯一能起草合法诏书的丞相；而扶苏、蒙恬远在北边监军——承重件全部处在“可被替换”的位置上。
      - k: "信号"
        v: |
          可辨识判据（出现什么迹象，说明这是“换梁”而不是普通人事变动／噪音）：

          ① 承重件被“自己人”替换，而不是被敌人替换；

          ② 关键文书（遗诏／任命／授权）的发出口径变了，但程序外观完整无缺；

          ③ 知情者范围被人为收窄（秘不发丧、只有两三人知道真相）；

          ④ 承重件被调离原岗位，调动理由是“皇帝诏令”，而无人能核实。

          四条中满足三条以上，即可判定为“换梁”。

          本案例的信号链：始皇死讯被封锁 → 遗诏扣压不发 → 使者持诏去边关 → 扶苏接诏即自尽（“父赐子死，尚安复请”），蒙恬疑而不肯死、被囚。
      - k: "排除"
        v: |
          · 排除“直接杀”——明杀扶苏、蒙恬，朝野皆知是赵高所为，会激起兵变与宗室反弹（那是“擒贼擒王”，不是偷梁换柱）。

          · 排除“公开废立”——公开废长立幼，名不正言不顺，立刻引发合法性危机。

          · 这条排除在什么条件下不成立（可反用）：上面两条排除之所以成立，依赖三个条件同时具备——（a）文书权在赵高手里（符玺＋诏书起草）；（b）关键同谋（李斯）肯配合；（c）承重件（扶苏、蒙恬）远在边关、不在朝中。缺任何一条，“换梁”就换不成，只能退回“明杀”或“明废”。反过来说，谁想用此计，先检查这三条在不在。
      - k: "行动"
        v: |
          · 第一步【结构动作】识梁：先辨出体系的承重件是什么（不是皇帝本人，而是“合法性来源＋关键执行者”），以及这些承重件此刻在谁手里。这一步可迁移到任何组织：找那个“一撤就塌”的支点，不是找那个“看起来最大”的。

          · 第二步【具体手段】控接口：赵高掌符玺，扣压遗诏不发；拉李斯入伙（唯一能起草合法诏书的丞相）。这一幕的本场景手段是“扣诏＋拉丞相”，其结构含义是“控制承重件的接口”——谁掌握文书与授权，谁就能换梁。

          · 第三步【具体手段】换梁：伪造诏书立胡亥为太子，另发诏书赐死扶苏、蒙恬。

          · 第四步【结构动作】保外观：秘不发丧，车队照常行进（以鲍鱼掩尸臭），朝廷与军队的日常运转如常。这一步可迁移：换梁之后必须维持“外观不变”，否则对方立刻察觉。

          · 第五步【结构动作】待自塌：扶苏死、蒙恬死，两根柱子撤掉，只剩胡亥＋赵高，体系失去支撑，自己塌。

          · 第六步【结构动作·计文所载】乘之：塌了之后谁接手——换梁者占据空出的支撑位。计文“待其自败，而后乘之”，沙丘之变里赵高“乘”的是权力本身：胡亥即位后，赵高任郎中令、掌内廷，成为空出的支撑位的实际占有者。
      - k: "预期"
        v: |
          预期（当时的）：胡亥即位、赵高掌权、扶苏与蒙恬已除、朝野无异动。

          可核验判据：外观不变（皇帝、朝廷、军队照旧运转）＋承重件已换（合法继承人与军方支撑撤掉）＋新体系无支撑。三个同时成立，才算“换梁”成功；只做到第一个，是换了隔断墙。
      - k: "修正"
        v: |
          · 硬边界：偷梁换柱的前提是“识梁”。找错梁，换掉的是隔断墙——房子照样立着，等于白换。这与 B-0019 釜底抽薪的“识薪”同构：抽薪要先识薪，换梁要先识梁。

          · 失效早期信号（出现什么迹象，就该收手或换招）：① 有人开始追问诏书真伪——说明文书权垄断正在失效；② 知情者外泄，或知情人数超出可控范围——“换梁”的隐蔽性正在破；③ 承重件本身有反制能力（如扶苏手握重兵、蒙恬不肯死）——梁换不掉，反被反噬；④ 出现“借死者之名”的第三方（如陈胜吴广借“公子扶苏”名义起事）——说明换梁已引起体系反弹。出现①②，应停止“替换”、转入明面处置或收手；出现③，说明梁选错了——那不是可换的梁。

          · 专属失败模式：换了隔断墙而非承重墙（换了个不重要的人或程序，体系照常运转，白忙一场）；或换梁中途被察觉，对方先动手（扶苏若起兵、蒙恬若反抗，“换梁”立即变成“明杀”，而明杀又回到“会激起反弹”的困局）。

          · 结构后果（事后，非当事人预期）：承重件（扶苏、蒙恬）撤掉，新体系（胡亥＋赵高）失去支撑，从内部崩塌——秦二世三年而亡。这是“待自塌”的实际结果，不是赵高当时的目标。
    effect: |-
      预期（当时的）：胡亥即位、赵高掌权、扶苏与蒙恬已除、朝野无异动——让帝国在不被察觉的情况下失去支撑
    reusable_condition: |-
      “文书权在己方、关键同谋肯配合、承重件远离中枢且无即时反制能力”的情形
    non_applicable: |-
      “文书权不在己方／关键同谋不配合／承重件在朝中且有反制能力”的情形
    source_note: |
      · 计文原文：“频更其阵，抽其劲旅，待其自败，而后乘之。曳其轮也。”

      · 按语：“阵有纵横，天衡为梁，地轴为柱。梁柱以精兵为之，故观其阵，则知精兵之所有。共战他敌时，频更其阵，暗中抽换其精兵，或竟代其为梁柱；势成阵塌，遂兼其兵。并此敌以击他敌之首策也。”

      · 引用词组出处：“曳其轮，义无咎也”出自《易经·既济》卦。

      · 历史案例：赵高沙丘之变（公元前210年），见《史记·秦始皇本纪》《史记·李斯列传》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      接口角度（结构判断·偷换承重）：偷梁换柱的本质是“识梁→控接口→换梁→保外观→待自塌→乘之”——认准体系的承重件，把它替换掉，外观不动，让对方在支撑已失的情况下自己塌，最后换梁者占据空出的支撑位。杠杆落在“梁”（承重件）。

      按宪章中性原则，接口名用“替换”，不用“暗中替换”——“不使对方察觉”是结构特征，不是价值判断。

      分层标注·认识论映射：系统边界不划在“表面谁最大”（皇帝、朝廷），而划在“这个体系靠什么撑着”（合法性来源＋关键执行者）。边界划错，就会把隔断墙当承重墙。

      分层标注·动力学映射：不是“压力错峰”（B-0023，空间/对象维），也不是“分层异步”（时间维），而是“结构替换”：不改变压力流向，而是把承重的柱子换掉，让体系在动力学上失去承重。

      分层标注·工具映射：具体手段是“扣诏＋拉丞相＋伪诏＋秘不发丧”；可迁移的结构动作是“识梁→控接口→换梁→保外观→待自塌→乘之”。

      跨承载迁移说明：计文本指军阵换梁柱（“天衡为梁，地轴为柱，梁柱以精兵为之”）；本判例为跨承载迁移（军阵→权力结构）。迁移成立的理由：两种承载中，“梁柱”指同一结构位置——一撤即塌的支撑件。这一步本身即演示换承载物测试的用法。

      与相邻判例的分野（它不是什么）：与 B-0018 擒贼擒王相比：擒贼擒王是“砍掉头”（认准枢要、拔掉，对方会察觉）；偷梁换柱是“换掉”（认准承重件、替换，外观不变）。一个是拔，一个是换。与 B-0011 李代桃僵相比：李代桃僵换的是“损失落点”（让谁挨打）；偷梁换柱换的是“承重件”（体系靠什么撑）。与 B-0021 金蝉脱壳相比：金蝉脱壳换的是“自己”（留个壳，自己走）；偷梁换柱换的是“对方”（把对方的承重件换掉）。

      一句话记：擒贼擒王是砍掉头，李代桃僵是换人挨打，金蝉脱壳是自己变壳，偷梁换柱是把对方的承重墙悄悄换掉——房子外观不变，却忽然塌了。

      结构判断·三态：观察态＝隔岸观火（B-0009，不动手，看它自己崩）；打击态＝擒贼擒王（B-0018，认准枢要、拔掉）；替换态＝偷梁换柱（B-0025，认准承重件、替换，外观不动）。注：“枢要”（指挥中枢，拔掉就散）与“承重”（支撑结构，换掉就塌）是两个不同的结构位置，接口词分开，避免两篇混成一类。

  - id: "B-0026"
    num: "B-0026"
    title: "指桑骂槐"
    card_title: "B-0026｜指桑骂槐"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-21"
    source: "《三十六计·第二十六计（并战计）》；《史记·孙子吴起列传》（吴宫教战）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/q5y8d"
    interface: "立威树纪（惩戒典型，确立规则权威）"
    lever: "典型（杀鸡儆猴的“鸡”）"
    concepts: ["规则层"]
    keywords: ["指桑骂槐", "规则层", "立威树纪", "决策显影库", "宁凯峰"]
    abstract: "春秋时，吴王阖闾令孙武操练 180 名宫女以试兵法。宫女嬉笑不听号令，孙武三令五申无效后，斩了担任左右队长的吴王两名宠妃，杀一儆百；再操练，宫女进退整齐、令行禁止。精妙在“立威树纪”——惩戒一个最不能罚的典型，把“违令必惩”的预期传导给全体，用最小代价建立号令的权威。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：吴国军队的“号令—服从”系统。吴王阖闾召见孙武，令其操练 180 名宫女以试兵法——这是“号令能否让一群从不把将令当回事的人令行禁止”的边界。

          第二层·威胁识别（承压者与承重件）：承压者是孙武，最怕失去“号令的效力”——宫女不服从且无法处置，他的将领资格就立不住。体系的承重件是“号令的效力（军纪）”：部队靠令行禁止支撑，号令一失效，就是散沙。

          第三层·现状约束：宫女懒散惯了、把操练当儿戏；且违令者是吴王宠妃（最不能罚的人），罚不罚得动，是这局最硬的一处。
      - k: "信号"
        v: |
          可辨识判据（出现什么迹象，说明“该用惩戒”而不是继续讲道理／利诱）：

          ① 号令已经讲清（将无过），士兵仍不从（兵之过）——规则已传达、却被无视；

          ② 利诱反而引起怀疑——按语“若策之不行，而利诱之，又反启其疑”，此时利诱失效；

          ③ 违令者中有“最不能罚的人”——罚他，威慑传导最远。

          三条同时出现，判定为“该立威”而非“再申令”。

          本案例信号链：第一次鼓响，宫女嬉笑不动 → 孙武自责“将之过”、三令五申 → 第二次仍嬉笑 → 第三次仍违令 → 孙武判定“已讲清、仍不从”，转惩戒。
      - k: "排除"
        v: |
          · 排除“逐个说服／利诱”——对 180 人逐个做工作成本极高，且利诱会“反启其疑”（按语）。

          · 排除“只讲不罚”——已经三令五申仍无效，再讲等于承认号令无牙齿。

          · 这条排除在什么条件下不成立（可反用）：上面两条排除成立，依赖“号令已讲清”和“利诱已试过”两个前提。若号令根本没讲清（将之过），或还有利诱空间，则应先讲清／先利诱，而不是直接惩戒。反过来，判断该不该立威，先看这两个前提在不在。
      - k: "行动"
        v: |
          · 第一步【结构动作】识“不服之源”：判断部队为什么不从——是“规则没传达”（将之过）还是“规则被无视”（兵之过）。可迁移到任何管理：先分清“没讲清”还是“讲了不听”，两者处置完全不同。

          · 第二步【具体手段】立军令、摆刑具：孙武三令五申、摆下刑具、设执法官，把“违令必惩”的规则先立起来，堵住“没讲清”的口实。

          · 第三步【结构动作】选“典型”：选最有分量、最不能罚的违令者（吴王宠妃、左右队长）作惩戒对象。可迁移：惩戒示范对象要选“动了它会震动全体”的那个。

          · 第四步【具体手段】斩典型：三次违令后，斩两名队长（宠妃），无视吴王求情（“将在外，君命有所不受”）。

          · 第五步【结构动作】立威生效：再操练，宫女令行禁止、鸦雀无声——威慑传导到全体。
      - k: "预期"
        v: |
          预期（当时的）：宫女令行禁止、号令生效，孙武证明自己能练兵、取得将位。

          可核验判据：惩戒一个（或少数）典型 → 其余人无一人敢违令 → 号令从此生效。三个同时成立，才算“立威”成功；只惩戒没传导，是白杀。
      - k: "修正"
        v: |
          · 硬边界：指桑骂槐只在“惩戒对象有足够分量、且惩戒者有处置权”时成立。若“鸡”没分量（罚了也无人怕），或惩戒者无权（君命可废将令），此计失效。

          · 失效早期信号（出现即处置）：① 斩典型后其余人仍违令——说明“鸡”选得没分量，威慑没传导，应换更硬的典型或换思路；② 上面强令赦免——说明惩戒权会被废，应争取授权或收手；③ 惩戒者无“将在外”的授权——立不了威，应先拿到处置权再动。

          · 专属失败模式：杀鸡猴不怕（典型没分量，白杀一场）；或杀鸡被上面拦住（将令被君命否决，立威失败反失势）。

          · 结构后果（事后，非当事人预期）：孙武立威成功，吴王虽不悦其斩宠妃、但仍认可其能，拜为将，后助吴国强盛——这是后果，不是孙武当时的目标。
    effect: |-
      预期（当时的）：宫女令行禁止、号令生效，孙武证明自己能练兵、取得将位
    reusable_condition: |-
      “号令已讲清、利诱已试过仍不从，且违令者中有足够分量、惩戒者有处置权”的情形
    non_applicable: |-
      “号令未讲清（将之过）／还有利诱空间／惩戒对象没分量／惩戒者无权（君命可废将令）”的情形
    source_note: |
      · 计文原文：“大凌小者，警以诱之。刚中而应，行险而顺。”

      · 按语：“率数未服者以对敌，若策之不行，而利诱之，又反启其疑，于是故为自误，责他人之失，以暗警之。警之者，反诱之也。此盖以刚险驱之也。或曰：此遣将之法也。”

      · 引用词组出处：“刚中而应，行险而顺”出自《易经·师》卦；“将在外，君命有所不受”出自《史记·孙子吴起列传》。

      · 历史案例：孙武吴宫教战，见《史记·孙子吴起列传》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      接口角度（立威树纪）：指桑骂槐的本质是“杀鸡儆猴”——惩戒一个最有分量的典型，把“违令必惩”的预期传导给全体，确立“号令”这个规则的权威。杠杆落在“典型”（杀鸡儆猴的“鸡”）。

      分层标注·认识论映射：系统边界划在“号令—服从”，不是“讲道理”，而是“立规则的效力”。

      分层标注·动力学映射：不是“压力错峰”（B-0023）、不是“结构替换”（B-0025），而是“规则确立”：用惩戒示范，把“号令”从纸上条文变成人人不敢碰的实线。

      分层标注·工具映射：具体手段“斩宠妃、设刑具、三令五申”；可迁移结构动作“识不服之源→立规则→选典型→惩戒→立威生效”。

      与相邻判例的分野（它不是什么）：与 B-0013 打草惊蛇相比：打草惊蛇是“探信号”（发试探、读响应，只观察不动手）；指桑骂槐是“惩戒典型”（动手惩罚）。一个是探，一个是惩。与 B-0018 擒贼擒王相比：擒贼擒王打的是“敌人”的枢纽；指桑骂槐惩戒的是“自己队伍里”的典型，整肃内部。与 B-0001 瞒天过海相比：瞒天过海是“造信号遮蔽”（隐蔽真实意图）；指桑骂槐的信号是“公开的警示”（公开惩戒、杀一儆百）。

      一句话记：杀鸡儆猴——重点不是杀鸡，是儆猴；惩戒对象的“分量”决定威慑的“传导距离”。
  - id: "B-0027"
    num: "B-0027"
    title: "假痴不癫"
    card_title: "B-0027｜假痴不癫"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-22"
    source: "《三十六计·第二十七计（并战计）》；《晋书·宣帝纪》（司马懿装病）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/WmpCS"
    interface: "藏锋（藏巧于拙，伪装无害，静不露机，待时后发）"
    lever: "伪装（假痴的壳）"
    concepts: ["祭祀"]
    keywords: ["假痴不癫", "藏锋", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "三国时，曹爽夺司马懿兵权后，司马懿装病不朝，装成病入膏肓、神志不清，骗过曹爽派来试探的李胜；曹爽放松警惕后，司马懿趁其陪皇帝外出扫墓、京城防备空虚之机发动政变，诛曹爽、独揽大权。精妙在“藏锋”——伪装无害、静不露机，把真实意图与实力藏起来，等对手放松、时机一到，后发制人。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：曹魏的“权力—警觉”系统。曹爽用明升暗降剥夺司马懿兵权，司马懿称病不朝、处在曹爽监视之下——边界划在“如何在政敌眼皮底下藏住实力、等时机翻盘”。

          第二层·威胁识别（承压者与承重件）：承压者是司马懿，最怕失去“性命与家族存续”——一旦被识破仍清醒、有野心，就会被清除。承重件是“伪装（假痴的壳）”：靠这层“无害”的壳保命藏锋；壳一破，机锋暴露，性命不保。

          第三层·现状约束：司马懿实力已被剥夺、正面对抗必败；曹爽专权且多疑，派亲信李胜试探虚实——这是“必须藏、且藏得住”的局面。
      - k: "信号"
        v: |
          可辨识判据（出现什么迹象，说明“假痴已生效”而不是“对方仍设防”）：

          ① 对手派来试探的人被你的“假痴”骗过，回去报告“你无害”；
          ② 对手说出“他一死我就放心了”这类放松警惕的话；
          ③ 对手撤掉对你的监视、不再设防。

          三条同时出现，判定“藏锋已成功”。

          本案例信号链：曹爽派李胜试探 → 司马懿装神志不清（侍女喂药、汤水流出、把“荆州”听成“并州”）→ 李胜回禀“司马懿命不久矣、神志不清”→ 曹爽“喜不自胜，说：只要这老头一死，我就没什么好担心的了”。
      - k: "排除"
        v: |
          · 排除“正面争权”——兵权已被夺、实力不足，硬拼必被清除。

          · 排除“公开示强”——露锋芒等于提醒曹爽“你有威胁”，加速被杀。

          · 这条排除在什么条件下不成立（可反用）：上面两条排除成立，依赖“实力不足以正面对抗、且对手会因你无害而放松”两个前提。若你本可正面硬拼（不该藏而藏，错失战机），或对手无论如何都要除你（不信你的假痴），则不该用此计。反过来，用不用“藏”，先看这两个前提在不在。
      - k: "行动"
        v: |
          · 第一步【结构动作】识“危”：判断当前是不是“实力不足、受制于人”的局面——若是，硬拼必败，必须藏。可迁移：先判断“能不能打、该不该打”，不能打就该藏。

          · 第二步【具体手段】装病示弱：司马懿称病不朝，装成病入膏肓、神志不清——侍女喂药、汤水顺口流出、把“荆州”听成“并州”。

          · 第三步【结构动作】藏锋：把真实意图与实力藏起来，只展示“无害”，让对方确认“你没威胁”。可迁移：让对方对你形成“无害”的稳定判断。

          · 第四步【具体手段】等时机：趁曹爽陪皇帝曹芳外出扫墓、京城防备空虚，发动政变，占据兵营、武库，逼太后废曹爽。

          · 第五步【结构动作】后发制人：时机一到，一击致命——诛曹爽一族，独揽大权。
      - k: "预期"
        v: |
          预期（当时的）：曹爽放松警觉、司马懿保住性命并等到翻盘时机。

          可核验判据：对手放松警觉（不再设防）→ 自己安全存续 → 等到可翻盘的时机。三个同时成立，才算“藏锋”成功；只装没等到，是白忍。
      - k: "修正"
        v: |
          · 硬边界：假痴不癫只在“实力不足、且对手会因你无害而放松”时成立。若对手无论如何都要除你，或你本可硬拼却装傻，此计不适用。

          · 失效早期信号（出现即处置）：① 试探者识破伪装（李胜若起疑）——假痴被看穿，应立即收手或换路；② 对手不试探、直接动手——假痴无用，别再装；③ 自己忍不住露机（按语“若假癫，则不但露机，则乱动而群疑”）——装过头反而暴露，该收敛。

          · 专属失败模式：假痴被识破（壳破了，暴露后立刻被清除）；或假痴变“真痴”——装久了真失去锐气、错失时机（按语反例：姜维九伐中原，明知不可为而妄为，是“真痴”，故破灭）。

          · 结构后果（事后，非当事人预期）：司马懿装病成功、诛曹爽、独揽大权，为司马氏代魏奠基——这是后果，不是他装病时对外展示的目标。
    effect: |-
      预期（当时的）：曹爽放松警觉、司马懿保住性命并等到翻盘时机
    reusable_condition: |-
      “实力不足、受制于人，且对手会因你无害而放松”的情形
    non_applicable: |-
      “对手无论如何都要除你（不信你的假痴）／你本可正面硬拼却装傻（错失战机）”的情形
    source_note: |
      · 计文原文：“宁伪作不知不为，不伪作假知妄为。静不露机，云雷屯也。”

      · 按语：“假作不知而实知，假作不为而实不可为，或将有所为。司马懿之假病昏以诛曹爽……姜维九伐中原，明知不可为而妄为之，则似痴矣，所以破灭。兵书曰：故善战者之胜也，无智名，无勇功。当其机未发时，静屯似痴；若假癫，则不但露机，则乱动而群疑。故假痴者胜，假癫者败。”

      · 引用词组出处：“云雷，屯”出自《易经·屯》卦。

      · 历史案例：司马懿装病赚曹爽，见《晋书·宣帝纪》（高平陵之变，公元249年）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      接口角度（藏锋）：假痴不癫的本质是“藏巧于拙、用晦而明”——在实力不足、受制于人时，故意伪装成“无害”，把真实意图与锋芒藏起来，静不露机，等对手放松、时机一到，后发制人。杠杆落在“伪装（假痴的壳）”。挂载：藏锋→P1（信号层·遮蔽）。

      分层标注·认识论映射：系统边界划在“此刻能不能打”：不能打，就先把“真实状态”划到边界之外藏起来，只让对手看见“无害”。

      分层标注·动力学映射：不是“压力错峰”（B-0023）、不是“结构替换”（B-0025），而是“动能隐藏”：把真实动能（意图、实力）压住不释放，等对方动能（警觉）衰减后，再一次性释放。（注：此为分析视角，与治水历挂载 P1 是两套系统，不混。）

      分层标注·工具映射：具体手段“装病、装神志不清、听错地名”；可迁移结构动作“识危→示弱→藏锋→等时机→后发制人”。

      与相邻判例的分野（它不是什么）：与 B-0001 瞒天过海相比：瞒天过海藏的是“一次行动”（渡海、偷渡），假痴不癫藏的是“一种状态”（自己这个人／锋芒）——一个是藏动作，一个是藏状态，二者合为“遮蔽两态”。与 B-0021 金蝉脱壳相比：金蝉脱壳是“留个壳、自己走”（脱身），假痴不癫是“装傻、留在原地等时机”（蛰伏）——一个是走，一个是留。与 B-0008 暗渡陈仓相比：暗渡陈仓是“明线做假动作、暗线打真目标”，假痴不癫是“整体装傻、静待时机”——一个是两线并进，一个是整体藏锋。

      一句话记：假痴者胜，假癫者败——装傻要装得“静”，装过头、乱动，就露馅了。
  - id: "B-0028"
    num: "B-0028"
    title: "上屋抽梯"
    card_title: "B-0028｜上屋抽梯"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-23"
    source: "《三十六计·第二十八计（并战计）》；《史记·孙子吴起列传》（马陵之战）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/UJ7ye"
    interface: "设饵断梯（假之以便，诱其上屋，断其援应，陷之死地）"
    lever: "梯（上屋的凭借＋退身的凭借）"
    concepts: ["方舟"]
    keywords: ["上屋抽梯", "设饵断梯", "方舟", "决策显影库", "宁凯峰"]
    abstract: "战国齐魏之战，孙膑针对庞涓“悍勇而轻齐”的认知，用“减灶”逐日减少军灶数目（十万→五万→三万），制造齐军大量逃亡的假象诱庞涓轻敌冒进；庞涓弃步军率轻锐追击，夜至马陵道，孙膑伏万弩断其退路，庞涓自刎、太子申被俘，魏国自此衰落。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：齐魏争霸的战场。孙膑要解决的边界是“如何把庞涓从魏军主力里单独钓出来”——正面打不赢，只能造一个让庞涓自己走进去的“屋”。

          第二层·威胁识别（承压者与承重件）：承压者是庞涓，最怕的是“齐军主力尚在、自己反被诱入伏击”。承重件是“灶数”——灶坑数量是他判断齐军兵力的唯一依据，也是齐军能操纵的唯一信号。

          第三层·现状约束：魏军（“三晋之兵”）素来悍勇、打心眼里瞧不起齐军（“齐号为怯”）；齐军正面硬拼不占优，庞涓求胜心切、急于回援立功。
      - k: "信号"
        v: |
          孙膑判断庞涓会上钩，依据三条（满足三条即判定“可诱”）：

          1. 灶数递减——入魏境第一日十万灶、第二日五万灶、第三日三万灶，两天递减七成（阈值：减灶幅度大到足以读出“逃亡过半”）。
          2. 认知标签——“齐号为怯”，庞涓先入为主认定齐军胆小，见减灶不假思索往“逃亡”上套。
          3. 追击动作——庞涓“行三日，大喜”，亲口说“我固知齐军怯，入吾地三日，士卒亡者过半矣”，随即弃步军、率轻锐“倍日并行”追击。

          信号链：减灶（假信号）→ 庞涓读成“齐军逃亡过半”（误读）→ 弃步军轻锐追击（冒进）→ 脱离主力、无暇侦察。
      - k: "排除"
        v: |
          孙膑没有选择正面硬拼（齐军实力不占优），也没有选择就地死守（庞涓回援后齐军将腹背受敌）。他排除的正是“示强”——对悍勇的魏军示强，只会招来正面决战。

          何时不成立：若庞涓谨慎（先派斥候核实齐军实际兵力再追），减灶即被识破；若魏军不上钩，齐军退入魏境便成孤军深入。
      - k: "行动"
        v: |
          1.【结构动作】设饵——减灶示弱，把真实兵力藏进“逐日递减”的灶数里，专门喂庞涓的“怯齐”认知。

          2.【结构动作】诱深——齐军佯退，行军路线直指马陵（道狭、旁多阻隘，是预设的伏击口袋）。

          3.【结构动作】断梯——马陵道设伏，孙膑算准庞涓“暮当至马陵”，令善射者万人夹道埋伏。

          4.【具体手段】点火为号——斫白道旁大树，书“庞涓死于此树之下”，与伏兵约定“暮见火举而俱发”。
      - k: "预期"
        v: |
          孙膑设局时的预判：庞涓看到灶数递减，会认定齐军怯战、逃亡过半，于是弃步军、率轻锐昼夜追击；其暮当至马陵，见树字必举火照看，火光一起、万弩齐发，庞涓难逃。
      - k: "修正"
        v: |
          硬边界：此计能否成立，取决于庞涓是否“轻齐”且“求胜心切”。换一个谨慎持重、不急于追击的对手，减灶就诱不动。

          失效早期信号：庞涓若派斥候核实齐军实际兵力（减灶≠逃亡），或魏军前哨发现马陵道有埋伏迹象，此计即破。

          处置：孙膑的“减灶”是量着庞涓的性格做的（素悍勇而轻齐），这是“因势利导”，不是通用招数；对手换了，饵也得换。

          专属失败模式：① 梯断得太早——庞涓尚未深入就察觉退路被断，及时回撤，伏击落空；② 饵不够诱人——庞涓不上钩，减灶被识破，齐军反成孤军。

          结构后果（事后）：魏军主力被歼、太子申被俘，魏国自此衰落、齐国崛起，孙膑名显天下。
    effect: |-
      孙膑设局时的预判：庞涓看到灶数递减，会认定齐军怯战、逃亡过半，于是弃步军、率轻锐昼夜追击；其暮当至马陵，见树字必举火照看，火光一起、万弩齐发，庞涓难逃
    reusable_condition: |-
      “对手轻己且求胜心切、且其判断依据可被你操纵（如灶数＝兵力）”的情形
    non_applicable: |-
      “对手谨慎持重、会派斥候核实，或不上钩、不急于追击”的情形
    source_note: |
      马陵之战见《史记·孙子吴起列传》：“使齐军入魏地为十万灶，明日为五万灶，又明日为三万灶。”“庞涓行三日，大喜，曰：‘我固知齐军怯，入吾地三日，士卒亡者过半矣。’乃弃其步军，与其轻锐倍日并行逐之。”“孙子度其行，暮当至马陵……令齐军善射者万弩，夹道而伏，期曰‘暮见火举而俱发’。”“庞涓自知智穷兵败，乃自刭，曰：‘遂成竖子之名！’”

      计名出典为刘琦登楼求计（《三国志·蜀书·诸葛亮传》）：“琦乃将亮游观后园，共上高楼。饮宴之间，令人去梯，因谓亮曰：‘今日上不至天，下不至地，言出子口，入于吾耳，可以言未？’亮答曰：‘君不见申生在内而危，重耳在外而安乎！’”原指刘琦请诸葛亮上高楼、令人去梯逼问自安之计。

      计文“假之以便，唆之使前，断其援应，陷之死地”见《三十六计》。《孙子·九地篇》另有“帅兴之期，如登高而去其梯”的自断退路用法（破釜沉舟／背水一战）。“百里而趣利者蹶上将”一句出自《孙子兵法·军争篇》。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（设饵断梯）：本计的接口在“断梯”——先递梯子让他上（设饵给便利），等他上了屋，抽梯断其退路。杠杆落在“梯（上屋的凭借＋退身的凭借）”。挂载：设饵断梯→P11（方舟·筑）。与 B-0022 关门捉贼的区别只在“有没有设饵”这一步：关门是等贼进来直接围（无诱），抽梯是先诱其上、再断其退（有诱）。

      分层标注·认识论映射：边界划定——孙膑先把陷阱（“屋”）划在马陵道，再诱庞涓入界；不先定“屋”，就无所谓“上屋”与“抽梯”。（注：此为分析视角，与治水历挂载 P11 是两套系统，不混。）

      分层标注·动力学映射：先开后堵——“假之以便”是给对方开一个压力释放的假通道（利使之前），“断其援应”是在对方动能进入后切断其压力来源，时间上先开后堵。

      分层标注·工具映射：主结构动作＝方舟·筑（抽梯断退路，把人困在屋上）；辅助信号动作＝设饵（减灶造假利诱其上屋）；具体手段＝减灶、斫树书字、万弩夹道、举火为号。

      与相邻判例的分野（它不是什么）：与 B-0022 关门捉贼相比：一个是无诱围合（等贼进来关门），一个是设饵诱入再断退（先递梯再抽梯）。与 B-0024 假道伐虢相比：假道是“借”路／借名，借完还要回头吞掉借道者（反客为主）；抽梯是“诱”——设饵给便利，诱入即断、当场吃掉，不涉借出方的回头清算。与 B-0016 欲擒故纵相比：欲擒故纵是松手放走以泄其势（一放），上屋抽梯是设饵诱入以断其退（一收）。

      一句话记：先递梯子让他上，再抽梯子断他退——梯子递得越像真的，抽的时候他越无路可走。
  - id: "B-0029"
    num: "B-0029"
    title: "树上开花"
    card_title: "B-0029｜树上开花"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-24"
    source: "《三十六计·第二十九计（并战计）》；《后汉书·虞诩传》（增灶示强）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/EsZya"
    interface: "借局布势（借局布势，力小势大，以弱示强）"
    lever: "势（借来的声势／假象）"
    concepts: ["祭祀"]
    keywords: ["树上开花", "借局布势", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "东汉虞诩赴任武都，遭数千羌军拦截而兵少，先扬言“上书请兵”诱羌人分兵，再日夜兼行、令吏士各作两灶日增倍之，用“增灶”制造援军已到的假象，羌人误判汉军兵力而不敢追击，虞诩得以安全通过；与孙膑“减灶示弱”相反，此为“增灶示强”的虚张声势。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：东汉安帝时羌人寇武都，邓太后以虞诩有将帅之略、迁为武都太守。数千羌军在陈仓崤谷拦截虞诩，而虞诩兵力寡少——边界划在“如何以弱兵安全穿过羌人重围”。

          第二层·威胁识别（承压者与承重件）：承压者是虞诩，最怕的是“被羌人识破兵少、趁虚追击围歼”。承重件是“灶数”——羌人判断汉军兵力强弱的唯一依据，也是虞诩唯一能操纵的信号。

          第三层·现状约束：敌众我寡，走慢了容易被追上，正面硬拼必败；只能让羌人“不敢追”，才能安全通过。
      - k: "信号"
        v: |
          虞诩判断羌人会被骗过，依据三条（满足三条即判定“可示强”）：

          1. 先扬言请兵——停军不进，宣言“上书请兵，须到当发”，先给羌人种下“援兵将至”的预期，诱羌人分兵去邻县劫掠。
          2. 灶数日增——令吏士各作两灶、日增倍之（阈值：灶数翻倍幅度大到足以读出“援军陆续赶到、兵力日增”）。
          3. 速进使敌不测——日夜兼行百余里（“徐行则易为所及，速进则彼所不测”），快行军让羌人来不及核实虚实。

          信号链：扬言请兵（造“援兵将至”预期）→ 羌人分兵（兵力分散）→ 速进＋增灶（强化“援兵已到、兵多行速”假象）→ 羌人不敢逼。
      - k: "排除"
        v: |
          虞诩没有选择“减灶”（孙膑用过、示弱诱敌），也没有选择缓行待援。他排除的正是“示弱”——己方兵少，再示弱等于请羌人来追。

          何时不成立：若羌人谨慎（派探子核实汉军实际兵力，或不顾增灶执意追击），增灶即被识破；若己方本就兵多、目标是诱敌深入，则增灶反而不如减灶（“孙膑见弱，吾今示强，势有不同故也”）。
      - k: "行动"
        v: |
          1.【结构动作】借局——停军不进、扬言“上书请兵，须到当发”，先造一个“援兵将至”的预期，让羌人放松戒备、分兵劫掠。

          2.【结构动作】布势——日夜兼行百余里，令吏士各作两灶、日增倍之，用“灶数翻倍”这个信号制造“援兵已到、兵多行速”的声势。

          3.【结构动作】示强——把“增灶”这朵假花粘在“行军”这棵真树上，让羌人误判汉军实力，不敢追击。
      - k: "预期"
        v: |
          虞诩设局时的预判：羌人见灶数日增，必以为武都郡兵已来迎接（援兵到了），我军人数既多、行动又快，他们必然不敢追我。
      - k: "修正"
        v: |
          硬边界：此计只在“敌众我寡、需示强自保”时成立。若己方兵多、需诱敌，反而要“减灶”（孙膑）；“孙膑见弱，吾今示强，势有不同故也”。

          失效早期信号：羌人若派探子核实灶数与实际兵力的对应关系（如宿营炊烟、粮草消耗），或识破“增灶是假象”，就会恢复追击。

          处置：增灶是针对“兵少、须示强”的形势；势不足则增之，势过实则减之，量敌而用。

          专属失败模式：① 势造得不够——灶数增幅太小，羌人不信援兵已到，照追不误；② 势造得过头——增灶过于夸张，羌人反而起疑、识破虚张。

          结构后果（事后）：虞诩安全抵达武都，后以不满三千兵破万余羌军（强弩勿发、潜发小弩示弱，再二十强弩共射一人），筑营壁百八十所、招还流亡，武都一郡遂安。
    effect: |-
      虞诩设局时的预判：羌人见灶数日增，必以为武都郡兵已来迎接（援兵到了），我军人数既多、行动又快，他们必然不敢追我
    reusable_condition: |-
      “敌众我寡、需示强自保（让对手高估你）”的情形
    non_applicable: |-
      “己方兵多、需诱敌（应减灶示弱）；或对手谨慎、会派探子核实虚实”的情形
    source_note: |
      虞诩增灶见《后汉书·虞诩传》：“羌乃率众数千，遮诩于陈仓、崤谷，诩即停军不进，而宣言上书请兵，须到当发。羌闻之，乃分抄傍县，诩因其兵散，日夜进道，兼行百余里。令吏士各作两灶，日增倍之，羌不敢逼。”或问曰：“孙膑减灶而君增之……何也？”诩曰：“虏众多，吾兵少。徐行则易为所及，速进则彼所不测。虏见吾灶日增，必谓郡兵来迎。众多行速，必惮追我。孙膑见弱，吾今示强，势有不同故也。”

      辅案例张飞据水断桥见《三国志·张飞传》：“使飞将二十骑拒后。飞据水断桥，瞋目横矛曰：‘身是张益德也，可来共决死！’敌皆无敢近者。”（裴松之注引《云别传》有“曳柴扬尘”制造大军假象之说）。

      计文“借局布势，力小势大。鸿渐于陆，其羽可用为仪也”见《三十六计》。“强弱，形也”一句出自《孙子兵法·势篇》。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（借局布势）：本计的接口在“借局布势”——把“假花”粘在“真树”上，借外部局面布成声势，力小势大。杠杆落在“势（借来的声势／假象）”。挂载：借局布势→P1（信号层·造势）。

      分层标注·认识论映射：边界划定——把“真实实力”与“对外声势”切开，弱小时只让对手看见声势。（注：此为分析视角，与治水历挂载 P1 是两套系统，不混。）

      分层标注·动力学映射：借势——借外部动能（增灶假象、扬尘环境）放大己方动能，错开对手的判断。

      分层标注·工具映射：主结构动作＝信号层·造势（增灶造假声势）；具体手段＝扬言请兵、速进、各作两灶日增倍之、曳柴扬尘。

      与相邻判例的分野（它不是什么）：与 B-0028 上屋抽梯（孙膑减灶）相比：一个减灶示弱诱敌，一个增灶示强退敌，正好相反。与 B-0001 瞒天过海（藏动作）相比：一个是“藏”（隐藏真实），一个是“显”（虚张声势），一藏一显。与 B-0027 假痴不癫（藏锋·藏状态）相比：一个装弱（示弱蛰伏），一个扮强（示强吓退），一弱一强。

      一句话记：树上本无花，剪彩粘上去，不细看的人分不出真假。

  - id: "B-0030"
    num: "B-0030"
    title: "反客为主"
    card_title: "B-0030｜反客为主"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-25"
    source: "《三十六计·第三十计（并战计）》；《三国志·袁绍传》（智取冀州）"
    license: "CC BY 4.0"
    planet_url: "待填"
    interface: "乘隙夺主（乘对方疏漏插足，渐进握住主机，把客位变主位）"
    lever: "主机（冀州牧的名分与权柄）"
    concepts: ["结构判断"]
    keywords: ["反客为主", "乘隙夺主", "结构判断", "决策显影库", "宁凯峰"]
    abstract: "东汉末年，渤海太守袁绍（客位）暗约公孙瓒南下攻冀制造危机，再遣荀谌三问游说，冀州牧韩馥自认不如、遣子送印绶让位，袁绍不费一兵一卒得冀州、反客为主；核心是乘对方疏漏插足、渐进握住“主机（权柄）”，把客位变成主位。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：汉末群雄割据，袁绍是渤海太守（客位），地盘狭小、粮草还要仰仗冀州牧韩馥；韩馥是冀州牧（主位），本是袁氏旧吏，却忌惮袁绍声望、削减其供给。边界划在“如何以客位渐进夺主位”。

          第二层·威胁识别（承压者与承重件）：承压者是韩馥，最怕“冀州被公孙瓒攻破、自己无兵可守、身家不保”。承重件是冀州牧的“名分与权柄”（印绶）——韩馥让出印绶即失主位，袁绍得印绶即成主。

          第三层·现状约束：冀州兵强，袁绍军“饥乏”，正面强攻必败；韩馥素来怯懦、无决断，是“可吓、可让”的对象。
      - k: "信号"
        v: |
          袁绍判断韩馥会让位，依据四条（满足四条即判定“可逼让”）：

          1. 公孙瓒南下、韩馥军安平战败（阈值：冀州主力受创，韩馥恐慌）。

          2. 荀谌三问，韩馥三次“我不如”（阈值：韩馥已自认不如袁绍，心理先让位）。

          3. 部下耿武、沮授、赵浮等劝阻，韩馥不听（阈值：韩馥已决意让位，只差台阶）。

          4. 韩馥遣子送冀州印绶给袁绍（阈值：让位落地，主位易手）。

          信号链：公孙瓒南下（外部危机）→ 韩馥恐慌（心理松动）→ 荀谌三问（强化“不如袁绍”）→ 部下劝阻被拒（决意让位）→ 遣子送印绶（袁绍得主位）。
      - k: "排除"
        v: |
          袁绍没有选择硬攻冀州（“冀州兵强，我军饥乏”，攻不下，且袁绍连立足之地都怕失去），也没有选择继续当渤海太守苦熬（粮草仰人鼻息、处处受韩馥制约）。他排除的正是“强夺”——对兵强的冀州强攻必败，只能让韩馥“主动让”。

          何时不成立：此排除依赖三个条件同时成立——（a）韩馥怯懦可吓、（b）公孙瓒可引、（c）袁绍声望足以让韩馥“自认不如”。缺一则强攻或苦熬反而成为必选。
      - k: "行动"
        v: |
          1.【结构动作】争客位——袁绍本是渤海太守（客），且挟袁氏四世三公的声望，是韩馥“忌惮又不敢动”的客。

          2.【结构动作】乘隙——逢纪献策：暗中邀公孙瓒南下攻冀，制造冀州危机（隙）。

          3.【具体手段】引狼逼主——写信给公孙瓒，公孙瓒“以讨董为名”南下实袭冀州，韩馥军安平战败、冀州震动。

          4.【结构动作】插足——派高干、荀谌、辛评面见韩馥，以“为将军解忧”之名介入冀州内政。

          5.【具体手段】三问逼让——荀谌三问（宽厚仁义／临危决断／累世恩德），韩馥三次自认不如，再点明“公孙瓒压境＋袁绍东进”夹击之势，劝其让冀州。

          6.【结构动作】握机——韩馥遣子送印绶，袁绍接印、领冀州牧，反客为主。
      - k: "预期"
        v: |
          袁绍设局时的预判：公孙瓒南下，韩馥必慌；再派人游说，韩馥（素怯懦）必让位；袁绍不费一兵一卒，得冀州全境。
      - k: "修正"
        v: |
          硬边界：此计只对“主位者怯懦、且客位者声望足以压倒主位者”的格局成立。若韩馥能采纳赵浮那类主战派的主张，袁绍军“连一斗粮食都没有”，十日即破，此计必败。

          失效早期信号：韩馥若采纳赵浮“旬日可破袁绍”的劝谏、拒不让位；或韩馥识破“公孙瓒是袁绍引来的”。

          处置：此计成在韩馥“怯懦”。换一个能拍板的主位者，此计不成立——得另换“强攻”或“蛰伏”。

          专属失败模式：① 主位者不怯懦——韩馥若听赵浮，袁绍反被灭；② 插足过早暴露——袁绍图冀州若被韩馥提前识破，韩馥会先发制人。

          结构后果（事后）：袁绍领冀州，一跃成河北最强诸侯，奠定官渡前基业；韩馥让位后疑惧，投张邈后自杀——让位者反被“让贤”的名分反噬。
    effect: |-
      袁绍设局时的预判：公孙瓒南下，韩馥必慌；再派人游说，韩馥（素怯懦）必让位；袁绍不费一兵一卒，得冀州全境
    reusable_condition: |-
      “主位者怯懦、客位者声望足以压倒主位者（自认不如）”的格局
    non_applicable: |-
      “主位者能拍板、采纳主战派主张；或客位者的意图被提前识破”的情形
    source_note: |
      袁绍取冀州见《三国志·袁绍传》（参《后汉书·袁绍传》《资治通鉴·卷六十》）：逢纪献计“可暗约公孙瓒南下袭冀，馥必惊恐，再遣辩士陈说利害”；荀谌游说韩馥，三问“宽厚仁义”“临危决断”“累世恩德”，韩馥三次自认不如；部下耿武、闵纯、沮授及赵浮、程涣劝阻，赵浮称“袁绍军连一斗粮食都没有……旬日之间必土崩瓦解”，韩馥不听，遂“遣子赍冀州印绶送绍”。计文“乘隙插足，扼其主机，渐之进也”见《三十六计》；按语五步“第一步争客位、第二步乘隙、第三步插足、第四步握机、第五步成为主”见同书。“渐之进也”出自《周易·渐卦》彖辞。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（乘隙夺主）：本计的接口在“乘隙夺主”——乘对方疏漏插足进去，渐进握住主机，把客位变成主位。杠杆落在“主机（冀州牧的名分与权柄）”。挂载：乘隙夺主→P0（结构判断·占据）。

      分层标注·认识论映射：边界划定——把“客／主”的权属边界显影出来，反客为主是这条边界的渐进漂移（客位渐次越过边界、坐实主位）。（注：此为分析视角，与治水历挂载 P0 是两套系统，不混。）

      分层标注·动力学映射：渐之进也——权柄不是一次性夺取，而是随时间累积的蚕食；外部危机（公孙瓒）与内部说服（荀谌）分头施压，错开韩馥的抵抗。

      分层标注·工具映射：主结构动作＝结构判断·占据（渐进握住主机，不是攻、不是换）；具体手段＝引狼逼主、三问逼让。

      与相邻判例的分野（它不是什么）：① 与 B-0018 擒贼擒王（攻其枢要）相比：擒贼擒王是“拔掉”别人的枢纽（攻），反客为主是“自己成为”枢纽（占），一攻一占；② 与 B-0025 偷梁换柱（偷换承重）相比：偷梁换柱是“换掉”承重件（暗中替换），反客为主是“渐进占据”主位（明面让贤），一换一占；③ 与 B-0020 浑水摸鱼（乘乱取利）相比：浑水摸鱼是趁乱捞一把（取利就走），反客为主是乘隙扎根（占位不走），一取一占。

      一句话记：客人的位子先坐稳，再一点点把主人的钥匙拿过来。

  - id: "B-0031"
    num: "B-0031"
    title: "美人计"
    card_title: "B-0031｜美人计"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-26"
    source: "《三十六计·第三十一计（败战计）》；《吴越春秋·勾践阴谋外传》（西施入吴）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/lG98n"
    interface: "伐情（兵强者攻其将，将智者伐其情）"
    lever: "情（夫差的意志／霸主锐气）"
    concepts: ["结构判断"]
    keywords: ["美人计", "伐情", "结构判断", "决策显影库", "宁凯峰"]
    abstract: "春秋末吴越争霸，越王勾践夫椒战败后卧薪尝胆，深知吴国兵强将智不可力敌，用文种之计选苎萝山鬻薪女西施、郑旦，教以歌舞容步三年，进献吴王夫差；夫差好色纳之，建馆娃宫沉湎酒色、疏远并赐死伍子胥，吴政荒废，越乘虚伐吴、转败为胜。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：春秋末吴越争霸。越国夫椒战败、勾践入吴为奴三年后归国，卧薪尝胆图复仇；可吴国兵强将智，正面力敌毫无胜算——边界划在“如何瓦解强吴的中枢意志”。

          第二层·威胁识别（承压者与承重件）：承压者是夫差（吴王），最怕的是“霸业崩、身死国灭”。承重件是夫差的“志”（励精图治的霸主锐气）——这份锐气一旦被佚掉，吴政荒废，中枢自萎。

          第三层·现状约束：夫差淫而好色，太宰伯嚭佞而掌政，是可乘之情；越国无力速胜，只能耗时间换对方中枢的自我瓦解。
      - k: "信号"
        v: |
          勾践判断夫差会上钩，依据四条（满足四条即判定“可伐情”）：

          1. 夫差淫而好色（阈值：好色是其先验弱点，可投其所好）。

          2. 夫差纳西施、郑旦大悦，称“越贡二女乃勾践尽忠于吴之证”，不听伍子胥谏（阈值：好色压过理智）。

          3. 夫差大兴土木，建馆娃宫、姑苏台，沉湎酒色、不问朝政（阈值：志已被佚）。

          4. 夫差疏远并赐死伍子胥（阈值：忠良被清除，中枢已腐）。

          信号链：夫差好色（先验弱点）→ 纳西施（入局）→ 沉湎酒色、建宫室（佚志）→ 疏远赐死伍子胥（增下怨）→ 吴政荒废、中枢自萎 → 越乘虚伐吴。
      - k: "排除"
        v: |
          勾践没有选择正面复仇（吴国兵强将智，越国无力速胜），也没有选择割地、纳币帛讨好（按语明言“事之以土地，以增其势”“事之以币帛，以增其富”，俱是下策）。他排除的正是“硬碰”与“厚赂”——硬碰打不过，厚赂只会养肥对手。

          何时不成立：此排除依赖三个条件同时成立——（a）夫差好色可乘、（b）伍子胥的谏言不被采纳、（c）越国耗得起十余年的时间。缺一则只能改走他路。
      - k: "行动"
        v: |
          1.【结构动作】识情——判断夫差淫而好色、吴国兵强将智不可力敌，把攻击面从“力”划到“情”。

          2.【具体手段】选女教习——得苎萝山鬻薪之女西施、郑旦，“饰以罗縠，教以容步，习于土城”，三年学服。

          3.【结构动作】伐情——命范蠡进献西施、郑旦，兼以重宝，佚其志、弱其体。

          4.【具体手段】增其下怨——借西施受宠离间夫差与伍子胥，夫差疏远并赐死伍子胥，忠良离心。

          5.【结构动作】乘虚——吴中枢已萎，越兴师伐吴，一举灭吴、转败为胜。
      - k: "预期"
        v: |
          勾践设局时的预判：夫差好色，纳西施必沉湎；吴政荒废、忠良离心之后，越国可乘虚复仇、反败为胜。
      - k: "修正"
        v: |
          硬边界：此计只在“对方中枢有好色、贪欲等可乘之情”且“己方无力正面取胜”时成立。若夫差不好色，或伍子胥的谏言被采纳，此计失效。

          失效早期信号：夫差纳伍子胥“夏亡以妹喜、殷亡以妲己、周亡以褒姒”之谏、拒收西施；或收了西施却仍勤政不辍。

          处置：伐情是佚志，不是速胜——西施入吴到灭吴相隔十余年，急躁则前功尽弃，须以时间为成本。

          专属失败模式：① 中枢不惑——夫差不沉迷，美人计落空；② 伐情反被识破——伍子胥点破这是美人计，若夫差采纳，勾践反招祸。

          结构后果（事后）：吴灭、夫差自杀，越国转败为胜；但伐情也留下道德争议——“家国兴亡自有时，世人何苦咎西施”。
    effect: |-
      夫差好色，纳西施必沉湎；吴政荒废、忠良离心之后，越国可乘虚复仇、反败为胜
    reusable_condition: |-
      “对方中枢有好色、贪欲等可乘之情，且己方无力正面取胜、耗得起时间”的格局
    non_applicable: |-
      “对方中枢不沉迷（不好色）、忠良谏言被采纳、或己方耗不起十余年时间”的情形
    source_note: |
      美人计原文“兵强者，攻其将；将智者，伐其情。将弱兵颓，其势自萎。利用御寇，顺相保也”见《三十六计》第三十一计；按语“惟事之以美人，以佚其志，以弱其体，以增其下之怨。如勾践以西施重宝取悦夫差，乃可转败为胜”见同书。

      勾践献西施、郑旦见《吴越春秋·勾践阴谋外传》：“得苎萝山鬻薪之女曰西施、郑旦，饰以罗縠，教以容步，习于土城，临于都巷，三年学服而献于吴”；伍子胥谏“夏亡以妹喜，殷亡以妲己，周亡以褒姒……贤士国之宝，美女国之咎”，夫差不听。另见《越绝书》。“利用御寇，顺相保也”出自《周易·渐卦》。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（伐情）：本计的接口在“伐情”——兵强将智不可力敌时，改从“情”这条线攻击中枢，佚其志、弱其体、增其下怨，使中枢自萎、其势自溃。杠杆落在“情（夫差的意志／霸主锐气）”。挂载：伐情→结构判断家族·腐化态（P0）。

      分层标注·认识论映射：边界划定——把攻击面从“力”这条线划到“情”这条线：硬碰打不过，就换一个能打得进去的面。（注：此为分析视角，与治水历挂载是两套系统，不混。）

      分层标注·动力学映射：佚志弱体——持续腐蚀，不是一次性击垮：佚志（消磨意志）→弱体（拖垮身体）→增怨（离心离德）→其势自萎，动能是一点点漏掉的。

      分层标注·工具映射：主结构动作＝结构判断·腐化（识情→伐情→乘虚）；具体手段＝选女教习三年、进献西施郑旦、离间赐死伍子胥。

      与相邻判例的分野（它不是什么）：① 与 B-0018 擒贼擒王（攻其枢要）相比：擒贼擒王是物理攻杀中枢（兵攻），美人计是情感腐化中枢（情攻），一刀一糖；② 与 B-0019 釜底抽薪（断源消势）相比：釜底抽薪是断其外部供给（断粮），美人计是腐其内部中枢（伐情），一断一腐；③ 与 B-0030 反客为主（乘隙夺主）相比：反客为主是占据主位（自己上位），美人计是腐化主位（让主自己垮），一占一腐。

      一句话记：打不过他的兵，就磨软他的心。
  - id: "B-0032"
    num: "B-0032"
    title: "空城计"
    card_title: "B-0032｜空城计"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-27"
    source: "《三十六计·第三十二计（败战计）》；《三国演义》第九十五回（文学虚构，史源见信源备注）"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/9I5gU"
    interface: "以虚示虚（虚者虚之，亮出真弱，令多疑者疑中生疑）"
    lever: "疑（对手心中的既有判断反过来咬他自己）"
    concepts: ["祭祀"]
    keywords: ["空城计", "以虚示虚", "信号层", "决策显影库", "宁凯峰"]
    abstract: "蜀汉第一次北伐，街亭失守后诸葛亮孤守西城，兵少将寡而司马懿大军压境。诸葛亮辨出这局的承重件不是城墙，而是对手脑中“诸葛亮从不弄险”的既有判断，反用这条判断——大开城门、藏起旌旗、登楼焚香抚琴，把“城空”如实亮出来，令多疑的司马懿疑中生疑、以为有伏兵而退。此计零成本、零战力，赌注是全部家底，只可作权宜缓兵，不可作常策。"
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：蜀汉第一次北伐，诸葛亮街亭失守后孤守西城，魏军乘势压来。边界画在这座孤城——守方兵少、攻方兵众，双方力量悬殊。

          第二层·威胁识别（承压者与承重件）：承压者是诸葛亮（守方主帅），最怕的是“城破人亡、北伐基业一并覆灭”。承重件不是城墙，而是司马懿脑中“诸葛亮平生谨慎、从不弄险”这个既有认知——对方怎么判断我方，才是这局真正的支点。

          第三层·现状约束：兵力空虚、无险可守、无援可待；战不能战、撤不及撤。唯一可用的资产，就是那一条既有的判断。
      - k: "信号"
        v: |
          诸葛亮判断司马懿会退，依据三条（判据一成立，再加二或三任一反常信号，即判定“对方会疑”）：

          1. 司马懿平生以诸葛亮“持重不弄险”为常识（阈值：这个既有判断必须先成立，否则整局不成立）。

          2. 城门大开、藏起旌旗、老兵扮百姓洒扫——这是“无备”的信号（阈值：与“谨慎人设”形成明显反差）。

          3. 诸葛亮焚香抚琴、神情从容——这是“有恃无恐”的信号（阈值：从容到不像在等死）。

          信号链：城门大开（无备）＋ 焚香抚琴（从容）→ 两组信号彼此矛盾 → 触发“诸葛亮从不弄险”的既有判断 → 反推“城中必有伏兵” → 不敢入城而退。
      - k: "排除"
        v: |
          不战：兵力悬殊，正面守城必破。

          不撤：仓促撤退会把空虚暴露在追击之下，走不掉。

          不示强：想走树上开花“借局布势”的路子没有条件——无兵可借、无势可布，硬造声势反被识破。

          何时不成立：这三条排除都押在“对手多疑”上。若对方不多疑（如司马昭所疑“莫非诸葛亮家中无兵”）、若有内应泄露虚实、若对方肯派小股试探，空城即刻破功。
      - k: "行动"
        v: |
          1.【结构动作】识承重——辨出这局的支点不在城墙，而在司马懿脑中“诸葛亮谨慎”这个既有认知。

          2.【结构动作】如实示虚——把“城空”这个真实状态亮出来，不藏、不装，让反常本身成为信号。

          3.【结构动作】反向加码——用从容姿态强化“这是诱饵、不是空城”的暗示，逼对方在自己的怀疑里越陷越深。

          4.【具体手段】藏旌旗、开四门、老兵扮百姓洒扫街巷、诸葛亮披鹤氅戴纶巾登城楼焚香操琴（《三国演义》的文学化细节）。
      - k: "预期"
        v: |
          诸葛亮设局时的预判：一向谨慎的人忽然做出反常举动，司马懿会顺着“他从不弄险”这条旧判断往下推，得出“必有伏兵”的结论而退兵。预期止于“退敌”，不求交锋、不图击溃。
      - k: "修正"
        v: |
          硬边界：此计只在“对手多疑、且对我方有稳定的既有判断”时成立，本身不增加一兵一卒。对手一旦派人试探或围而不攻，此计立破。

          失效早期信号：对方派小股侦察、绕城久围、或有准确情报（已知城空）。

          处置：对方一退即刻撤军、不留空城——赌赢就马上兑现，不恋战、不回头补赌。

          专属失败模式：① 疑敌不多疑——对方不信“谨慎人设”，直接进城；② 空城被识破——内应泄密、火力侦察、久围不攻。

          结构后果（事后）：此计是零成本、零战力的极端博弈，赌注是全部家底，只能作权宜缓兵，不能作常策；一旦对手换了判断方式，全套失效。
    effect: |-
      一向谨慎的人忽然做出反常举动，司马懿会顺着“他从不弄险”这条旧判断往下推，得出“必有伏兵”的结论而退兵
    reusable_condition: |-
      “对手多疑、且对我方有稳定的既有判断（认为我方从不弄险），而己方兵力空虚、战不能战撤不及撤”的格局
    non_applicable: |-
      “对手不多疑、或肯派小股试探、或有准确情报已知城空”的情形
    source_note: |
      空城计原文“虚者虚之，疑中生疑；刚柔之际，奇而复奇”见《三十六计》第三十二计；“刚柔之际”出自《周易·解卦》初六《象》辞“刚柔之际，义无咎也”。按语“虚虚实实，兵无常势。虚而示虚，诸葛而后，不乏其人”，并举张守圭守瓜州（“乃于城上，置酒作乐，以会将士。敌疑城中有备，不敢攻而退”）、齐祖铤守北徐州（“不关城门，守陴者皆令下城，静坐街巷”）二例。

      诸葛亮空城计为《三国志·诸葛亮传》正文所无，源自西晋郭冲《条亮五事》（东晋王隐《蜀记》转录）；裴松之注《三国志》时引而驳之，举四条理由：一、亮初屯阳平时，司马懿尚为荆州都督镇宛城，曹真死后始与亮在关中相抗，此前无阳平交兵事；二、既举二十万众、已知亮兵少力弱，若疑有伏兵“正可设防持重，何至便走”；三、《魏延传》载亮不轻付魏延万人，何以令其独将重兵东下；四、郭冲对司马懿之子司马骏面言其父之短，不合情理。故此故事属文学虚构，经《三国演义》第九十五回“马谡拒谏失街亭，武侯弹琴退仲达”敷演而成。

      史实可考的空城／空营之举：赵云汉水空营（《三国志·赵云传》裴注引《云别传》，“更大开门，偃旗息鼓”，刘备赞“子龙一身都是胆也”）；文聘石阳空城（《三国志·文聘传》裴注引《魏略》，孙权“疑有伏兵”而退）；张守圭瓜州（见上引计文按语）。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（以虚示虚）：本计的接口在“以虚示虚”——本来虚弱，就把虚弱如实亮出来，不加掩饰，靠“反常”本身去激活对方既有的判断，让他在自己的怀疑里打转。杠杆落在“疑（对手心中的既有判断反过来咬他自己）”。挂载：以虚示虚→信号层·显态（P1）。

      与 B-0029 树上开花互为镜像：树上开花是“虚者实之”，无势而借势，造一个假强；空城计是“虚者虚之”，有弱而露弱，亮一个真虚。一个造假、一个露真，赌的都是对方判断走偏——前者赌对方信以为强，后者赌对方不信以为虚。

      信号的藏与显（家族闭合）：藏——藏动作（B-0001 瞒天过海）／藏状态（B-0027 假痴不癫）；显·造强——借局布势（B-0029 树上开花）；显·示虚——以虚示虚（B-0032 空城计）。至此“藏／显·造强／显·示虚”三态齐。

      分层标注·认识论映射：边界划定——这局的支点被划在“对方脑中的既有判断”，不在城墙、不在兵力；能借的只有那条判断。（此为分析视角，与治水历挂载是两套系统，不混。）

      分层标注·动力学映射：不产生实际压力，只操纵“判断”这一层：两组矛盾信号同时递到，让对方在自己的推演里越走越深。

      分层标注·工具映射：主结构动作＝识承重→示虚→加码；具体手段＝开四门、藏旌旗、老兵洒扫、城楼抚琴。

      与相邻判例的分野（它不是什么）：与 B-0029 树上开花相比：一造强、一示虚，同为信号显态的两端。与 B-0027 假痴不癫相比：假痴是“藏”（把能藏起来），空城是“显”（把虚亮出去），一藏一显。与 B-0001 瞒天过海相比：瞒天藏的是一个动作，空城显的是一个状态，且瞒天是骗对方“没有这事”，空城是让对方“不信这是真的”。

      一句话记：把真弱亮给多疑的人看，赌他自己吓自己。
  - id: "B-0033"
    num: "B-0033"
    title: "反间计"
    card_title: "B-0033｜反间计"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: |-
      博弈决策（反间离隙／瓦解内外信任）
    date: "2026-10-28"
    source: |-
      《三十六计·第三十三计（败战计）》；《史记·陈丞相世家》《史记·项羽本纪》（陈平反间范增）
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/4mpey"
    interface: |-
      反间离隙（因敌之间而间之，借敌方既有猜忌，令其自毁长城）
    lever: |-
      敌方内部既有猜忌（君疑臣之旧隙）
    concepts: ["结构判断"]
    keywords: ["反间计", "反间离隙", "结构判断", "决策显影库", "宁凯峰"]
    abstract: |-
      楚汉相争，项羽围刘邦于荥阳，割地求和不成。陈平辨出项羽"意忌信谗"且封赏吝啬、骨鲠之臣不过范增数人，遂用四万斤金纵反间：先散布钟离眛通敌谣言，再趁项羽使者来汉，故意先盛礼款待、又佯称"以为是亚父使者"改以粗食，使者回报后项羽大疑范增，范增怒而请辞，未至彭城疽发背死。反间计是让敌人自己拔掉自己的智囊。
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：楚汉相争，项羽急攻荥阳，断绝汉军甬道，把刘邦围在城里。刘邦请求割荥阳以西求和，项羽不听。边界划在"楚军内部的君臣信任"——正面拼不过项羽，但项羽内部有可离间的关系。
          第二层·威胁识别（承压者与承重件）：承压者是刘邦（汉王），最怕的是"荥阳城破、身死国灭"。承重件在对方：项羽身边真正能用的骨鲠之臣——亚父范增、钟离眛、龙且、周殷，不过数人；这些人一离，项羽的系统就散了架。
          第三层·现状约束：汉军被围、粮道已断，硬拼无路、久拖必败。唯一的突破口，是项羽"意忌信谗"（多疑、易信谗言）又"行功爵邑重之"（封赏吝啬）这两条性格。
      - k: "信号"
        v: |
          陈平判断楚军可离间，依据三条（满足"君多疑"＋"臣有隙"两条即判定可离间）：
          1. 项羽为人"意忌信谗"——多疑，且容易听信谗言（阈值：这是整个计的前提，君若信臣则无从离间）。
          2. 项羽"行功爵邑重之"——封赏吝啬，钟离眛等"功多矣，然终不得裂地而王"（阈值：功高而赏薄，臣本有不满可借）。
          3. 项羽骨鲠之臣"不过数人"——范增、钟离眛、龙且、周殷，可离间的对象少而清晰（阈值：目标明确，离间才落得到人头上）。
          信号链：项羽多疑（先验）→ 陈平散布钟离眛"欲联汉灭楚"的谣言（点火）→ 项羽疑钟离眛 → 项羽派使者至汉营（上钩）→ 陈平做戏"以为是范增使者"（关键一步）→ 使者回报 → 项羽大疑范增 → 范增怒去。
      - k: "排除"
        v: |
          刘邦没有选择正面解围（围城被断粮道，硬拼必败），也没有继续求和（项羽已明确不听）。
          何时不成立：此排除押在"项羽多疑"和"范增等确有可离之隙"两条上。若项羽不信谣言、或范增当面澄清、或君臣之间本无隙可借，此计落空。
      - k: "行动"
        v: |
          1.【结构动作】识隙——辨出承重件是项羽的骨鲠之臣（范增数人），且项羽"意忌信谗"、封赏吝啬，君臣之间本有隙可离。
          2.【结构动作】撒金造隙——用重金在楚军中散布"钟离眛等功高不得封、欲与汉合灭楚"的谣言，先松动钟离眛等与项羽的信任。
          3.【结构动作】做戏反间——项羽派使者来汉，故意先以最高礼遇（太牢）相待，再佯惊"吾以为亚父使，乃项王使"，改以粗食，让使者带话回去，把疑火烧到范增身上。
          4.【具体手段】刘邦出黄金四万斤给陈平"恣所为，不问其出入"；先离间钟离眛、再离间范增的次序；"太牢改恶草具"的具体做戏。
      - k: "预期"
        v: |
          陈平设局时的预判：项羽"意忌信谗"，必"内相诛"——疑范增之后，范增怒去，楚军自失智囊，汉军趁隙解围。预期只到"离间君臣、松动包围"，不图当场击溃楚军。
      - k: "修正"
        v: |
          硬边界：反间只对"多疑之君"和"可离之隙"有效，本身不产生一兵一卒；对方一旦澄清或不信，立即失效。
          失效早期信号：项羽不信谣言、范增当面自辩、被离间者依然获信。
          处置：范增一去，陈平即刻"夜出女子二千人荥阳城东门"声东击西，刘邦从西门脱身——反间是缓兵解围的一环，不是终点。
          专属失败模式：① 君不多疑——离间无效；② 离间对象有解释空间——范增本可当面澄清；③ 离间效果有限——钟离眛等被疑者直到垓下兵败也未叛楚，反间只是让项羽"疏远"，并未真正"策反"。
          结构后果（事后）：范增疽发背死，项羽失智囊；汉军解围，项羽由此一步步走向众叛亲离、垓下之败。
    effect: |-
      项羽大疑范增，范增怒而请辞、未至彭城疽发背而死；楚军自失智囊，汉军趁隙从西门脱身。预期只到「离间君臣、松动包围」，不图当场击溃楚军。
    reusable_condition: |-
      对手是多疑之君（意忌信谗）、君臣之间本有旧隙可借（功高而赏薄），而己方正面打不过、粮道被断、只能从对方内部找出路的格局。
    non_applicable: |-
      君不疑臣、或范增能当面自证清白、或君臣之间本无隙可借的情形；此外反间只让人「疏远」被疑者，未必能真正「策反」——钟离眛等直到垓下兵败也未叛楚。
    source_note: |
      "疑中之疑。比之自内，不自失也"出自《三十六计》第三十三计；"比之自内，不自失也"出自《周易·比》卦六二《象》辞。按语"间者，使敌自相疑忌也；反间者，因敌之间而间之也"，并举田单间乐毅、周瑜间曹将、陈平间范增三例。
      陈平反间范增见《史记·陈丞相世家》与《项羽本纪》两处，细节一致：陈平献策"项王骨鲠之臣亚父、钟离眛、龙且、周殷之属，不过数人耳……行反间，间其君臣……项王为人意忌信谗，必内相诛"；刘邦"出黄金四万斤与陈平，恣所为，不问其出入"；"汉王为太牢具，举进。见楚使，即详惊曰：吾以为亚父使，乃项王使！复持去，更以恶草具进楚使"；"项王果大疑亚父……亚父乃怒曰：天下事大定矣，君王自为之！愿请骸骨归！归未至彭城，疽发背而死"。
      田单反间乐毅见《史记·田单列传》："燕昭王卒，惠王立，与乐毅有隙。田单闻之，乃纵反间于燕，宣言曰……燕王以为然，使骑劫代乐毅，乐毅因归赵"，为计文按语所引。
      周瑜借蒋干反间曹操将（《三国演义》"群英会蒋干中计"）属文学虚构，正史《三国志》无"盗书"情节，《江表传》仅记蒋干游说周瑜。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（反间离隙）：本计的接口在"反间离隙"——利用敌方派来的人（使者）或敌方内部已有的猜忌，把君臣之间的旧隙撬开，让敌人自己拔掉自己的智囊。杠杆落在"敌方内部的既有猜忌（君疑臣之隙）"。挂载：反间离隙→结构判断家族（P0）。
      反向操作"共识凝聚"：治水学三类规则操作之一的"共识凝聚"，是把成员凝成整体；反间计是反向操作——把敌方内部的信任共识变成猜忌，让凝聚散掉、自毁长城。
      与相邻判例的分野（它不是什么）：与 B-0003 借刀杀人（疏浚·转换出力者）相比：借刀借"外人之手"，反间借"敌人自己的手"，一借外刀、一借内刀。与 B-0018 擒贼擒王（攻其枢要）相比：擒王是"自己动手"拔对方枢纽，反间是"让敌人自己动手"拔自己的智囊，一手拔、一借手。与 B-0031 美人计（伐情·腐化中枢）相比：美人计从外送美人腐化中枢，反间计利用内部已有猜忌撬开君臣，一外腐、一内裂。
      分层标注·认识论映射：边界划在"楚军内部的君臣信任"，承重件是对方的骨鲠之臣而非兵力。（此为分析视角，与治水历挂载是两套系统，不混。）
      分层标注·动力学映射：不直接输出战力，只操纵"信任"这一层——谣言松动信任、做戏把疑火烧到范增，让楚军内部自己散掉。
      分层标注·工具映射：主结构动作＝识隙→撒金造隙→做戏反间；具体手段＝四万斤金、先钟离眛后范增的次序、太牢改恶草具。
      一句话记：让敌人自己拔掉自己的智囊。
  - id: "B-0034"
    num: "B-0034"
    title: "苦肉计"
    card_title: "B-0034｜苦肉计"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: |-
      博弈决策（自害取信／以身换信）
    date: "2026-10-29"
    source: |-
      《三十六计·第三十四计（败战计）》；《吴越春秋·阖闾内传》（要离刺庆忌）
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/N55yI"
    interface: |-
      自害取信（人不自害，受害必真；以真实自我牺牲换取敌方信任）
    lever: |-
      敌方「受害必真」的判断常理
    concepts: ["结构判断"]
    keywords: ["苦肉计", "自害取信", "结构判断", "决策显影库", "宁凯峰"]
    abstract: |-
      春秋吴国，阖闾杀吴王僚夺位，僚之子庆忌勇武无敌、逃亡卫国图谋复仇，阖闾无法正面除掉。要离献苦肉计：请阖闾断其右手、杀其妻子焚尸于市，制造"负罪出奔"的假象，投奔庆忌。庆忌见其真残、妻子真死，信其"与吴王有仇"，纳为心腹。三月后渡江，要离顺风以矛刺死庆忌。苦肉计是用真实牺牲换取信任，代价不可逆。
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：春秋吴国，公子光刺杀吴王僚自立为阖闾，僚之子庆忌逃亡卫国，招纳亡命、图谋复仇。边界画在"庆忌这个隐患"——庆忌勇武无敌，阖闾正面除不掉。
          第二层·威胁识别（承压者与承重件）：承压者是阖闾（吴王），最怕的是"庆忌复仇、王位不保"。承重件是庆忌的"戒备"——庆忌"明智之人"，对来历不明者防备极严，不解决"取信"这一关，谁都近不了身。
          第三层·现状约束：庆忌"筋骨果劲，万人莫当"，能追奔兽、接飞鸟，阖闾"驷马驰不及，射之矢不可中"；正面刺杀、正面交战，都没有路。
      - k: "信号"
        v: |
          要离判断"断手杀妻"能取信庆忌，依据三条（满足"受害必真"＋"牺牲够大"两条即判定可取信）：
          1. 庆忌"明智之人，归穷于诸侯，不下诸侯之士"——对来历不明者防备极严，寻常间谍近不了身（阈值：必须先过"取信"这一关）。
          2. "人不自害，受害必真"——断手、杀妻这种极端的自害，会让庆忌相信"受害是真"（阈值：牺牲越大、越不可逆，可信度越高）。
          3. 要离"细小无力，迎风则僵"的瘦弱外形——一个瘦小无力的人，反而不被怀疑是刺客（阈值：外形弱势降低戒备）。
          信号链：要离献策"断臣右手、戮臣妻子"→ 阖闾断其右手、杀其妻子焚尸于市 → 要离负罪出奔、四处扬言"无罪见诛"→ 投奔庆忌 → 庆忌"信其谋"、纳为心腹 → 三月后渡江顺风刺庆忌。
      - k: "排除"
        v: |
          阖闾没有选择正面交战（庆忌万人敌，追奔兽、接飞鸟），也没有派寻常刺客（庆忌"明智"，防备极严，接近不了）。
          何时不成立：此排除押在"人不自害，受害必真"这条常理上。若庆忌派人查证识破、或虽收纳而不委以近身之职，苦肉计即白付代价。
      - k: "行动"
        v: |
          1.【结构动作】识关——辨出真正的关卡不是庆忌的"勇"，而是庆忌的"疑"：庆忌明智多备，不解决"取信"这一关，永远近不了身。
          2.【结构动作】自害取信——献"断臣右手、戮臣妻子"的苦肉计，用真实的、不可逆的自我牺牲，制造"负罪出奔"的假象，换取庆忌的信任。
          3.【结构动作】示弱近身——以"细小无力"的瘦弱形象投奔，四处扬言"无罪见诛"、求庆忌复仇，三个月取得信任、成为心腹。
          4.【具体手段】断右手、杀妻焚尸于市、诈得罪出奔、沿途扬言、投卫求见庆忌、渡江时坐于上风、顺风以矛刺之。
      - k: "预期"
        v: |
          要离设局时的预判：庆忌看到要离"手真的断了、妻子真的被焚尸于市"，会顺着"人不自害，受害必真"这条常理，相信要离"真的与吴王有仇"，从而接纳为心腹、让他近身。预期只到"取信、近身、刺杀"，不图其他。
      - k: "修正"
        v: |
          硬边界：苦肉计押的是"真实的代价"——断手、杀妻一旦付出就不可逆；若对方仍不信，代价白付。
          失效早期信号：庆忌派人查证识破、庆忌虽纳而不用、要离近身前暴露。
          处置：刺杀成功后，庆忌临死反赞要离为"天下勇士"、放他还吴；要离渡江至江陵，自觉"杀吾妻子以事吾君，非仁也；为新君而杀故君之子，非义也"，自刎而死——苦肉计的代价，最终连自己的命也一并赔上。
          专属失败模式：① 自害不够真——对方识破，代价白付；② 取信而不得近身——庆忌纳而不信、不委近身之职；③ 代价付了、人也杀了，自己却活不下去（要离自刎即是"代价"的延续）。
          结构后果（事后）：庆忌死，阖闾除去心腹大患；要离家毁身残、自刎而死。
    effect: |-
      庆忌见要离手真断、妻子真焚尸于市，信其「与吴王有仇」，纳为心腹；三月后渡江，要离坐于上风、顺风以矛刺死庆忌。预期只到「取信、近身、刺杀」，不图其他。
    reusable_condition: |-
      对方防备极严、寻常间谍近不了身，而己方愿意付出真实且不可逆的代价（自伤、弃亲）去换取信任的格局——代价必须真，才撑得起「受害必真」这条常理。
    non_applicable: |-
      对方肯派人查证识破、或虽收纳而不委以近身之职、或己方付不起不可逆代价的情形；此外苦肉计代价不可逆，一旦对方仍不信，代价白付（要离最终自刎，即是代价的延续）。
    source_note: |
      "人不自害，受害必真；假真真假，间以得行。童蒙之吉，顺以巽也"出自《三十六计》第三十四计；"童蒙之吉，顺以巽也"出自《周易·蒙》卦六五《象》辞。按语"间者，使敌人相疑也；反间者，因敌人之疑，而实其疑也；苦肉计者，盖假作自间以间人也"，并举"郑武公伐胡而先以女妻胡君，并戮关其思""韩信下齐而骊生遭烹"。
      要离刺庆忌见《吴越春秋·阖闾内传》（东汉赵晔）：要离曰"臣诈以负罪出奔，愿王戮臣妻子，断臣右手，庆忌必信臣矣"；"要离乃诈得罪出奔，吴王乃取其妻子，焚弃于市"；"庆忌信其谋……要离力微，坐与上风，因风势以矛钩其冠，顺风而刺庆忌"。另《吕氏春秋·忠廉》记要离"伏剑而死"。
      郑武公伐胡见《韩非子·说难》："昔者郑武公欲伐胡，故先以其女妻胡君……大夫关其思对曰胡可伐。武公怒而戮之……胡君闻之，以郑为亲己，遂不备郑。郑人袭胡，取之"，另《史记·老子韩非列传》亦载。
      周瑜打黄盖（《三国演义》第四十六回）属文学虚构：正史《三国志·周瑜传》记黄盖诈降（裴注引《江表传》"先书报曹公，欺以欲降"），但无"苦肉计鞭打黄盖"情节。原文与史事以传世文献为准。
    recorder_note: |
      接口角度（自害取信）：本计的接口在"自害取信"——人不自害，受害必真；用真实的、不可逆的自我牺牲，制造"受害"假象，骗过敌人的信任判断，从而近身。杠杆落在"敌方『受害必真』的判断常理"。挂载：自害取信→结构判断家族（P0）。
      与 B-0033 反间计闭合"信任操作两态"：反间计（反间离隙）是"让敌人不信任自己人"（离间），苦肉计（自害取信）是"让敌人信任自己"（取信）——一疑一信，方向相反，杠杆都在"信任判断"上。
      与相邻判例的分野（它不是什么）：与 B-0003 借刀杀人相比：借刀借"外人之手"，苦肉付"自身之血"，一借外、一伤己。与 B-0031 美人计（伐情）相比：美人计送"外物"（美人）腐化中枢，苦肉计付"自身"（断手杀妻）换取渗透，一送物、一付身。与 B-0032 空城计（以虚示虚）相比：空城计是"示虚"赌对方疑，苦肉计是"示伤"赌对方信，对象一个是战场状态、一个是人身信任。
      分层标注·认识论映射：边界划在"庆忌的戒备／疑心"，承重件是对方的信任判断而非武力。（此为分析视角，与治水历挂载是两套系统，不混。）
      分层标注·动力学映射：不靠力敌，靠"真牺牲换信任"——牺牲不可逆，才让"受害必真"的常理站得住。
      分层标注·工具映射：主结构动作＝识关→自害取信→示弱近身；具体手段＝断右手、杀妻焚尸、诈奔扬言、投卫近身、顺风刺之。
      一句话记：用真伤换信任，赌对方"受害必真"。
  - id: "B-0035"
    num: "B-0035"
    title: "连环计"
    card_title: "B-0035｜连环计"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: |-
      博弈决策（使敌自累／两计扣用）
    date: "2026-10-30"
    source: |-
      《三十六计·第三十五计（败战计）》；《三国志·周瑜传》及裴注引《江表传》（赤壁之战）
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/7rYLS"
    interface: |-
      使敌自累（将多兵众，不可以敌，使其自累，以杀其势）
    lever: |-
      敌方自累结构（连锁战船——一烧全烧）
    concepts: ["疏浚"]
    keywords: ["连环计", "使敌自累", "疏浚", "决策显影库", "宁凯峰"]
    abstract: |-
      赤壁之战，曹操率大军南下，孙刘联军兵少不能力敌。周瑜黄盖用连环计：曹军北方士卒不习水战，曹操下令战船首尾相连以稳军心，正是"自累"；黄盖诈降，以数十艘装满薪草膏油的蒙冲斗舰，借东南风纵火，一船着火、全营连烧，烧尽北船。连环计是"一计累敌、一计攻敌"，让敌人自己捆住自己，再乘势而击。
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：建安十三年，曹操统一北方后率大军南下，荆州不战而降，曹军顺江东下逼向江东。边界画在"曹操的强大"——孙刘联军兵少，正面不能力敌。
          第二层·威胁识别（承压者与承重件）：承压者是周瑜（联军统帅），最怕的是"曹操渡江、江东不保"。承重件是曹操的"势"——兵多势众、顺流而下；但这"势"里藏着一处致命伤：北方士卒不习水战，曹操为稳军心把战船首尾相连，连锁即是"自累"。
          第三层·现状约束：曹军号称大军压境、兵力悬殊，"难与持久"；只能找一处巧劲，不能硬拼硬耗。
      - k: "信号"
        v: |
          黄盖判断曹军可火攻，依据三条（满足"敌已自累"＋"时机可借"两条即判定可攻）：
          1. "今寇众我寡，难与持久"——兵力悬殊，不能久战（阈值：必须先找到巧劲，不能硬拼）。
          2. "观操军船舰首尾相接，可烧而走也"——连锁战船，一船着火、全营连烧（阈值：连锁是火攻成立的前提，战船分散则烧不成）。
          3. "时东南风急"——火借风势（阈值：风向对了，火攻才成立）。
          信号链：曹操连锁战船（自累）→ 黄盖"可烧而走也"（识累）→ 黄盖诈降书（取信）→ 东南风急（时机）→ 火船冲入、烧尽北船 → 曹军大败。
      - k: "排除"
        v: |
          周瑜黄盖没有选择正面决战（兵力悬殊，"难与持久"），也没有选择继续对峙拖延（曹军可待荆州水军磨合后强渡）。
          何时不成立：此排除押在"敌已自累"和"时机可借"两条上。若曹军战船分散未连锁、或火攻当日无东南风、或诈降被识破，此计不成。
      - k: "行动"
        v: |
          1.【结构动作】识累——辨出曹军兵多不可力敌，但其"势"有可乘之累：北方士卒不习水战，曹操"连船舰，首尾相接"以稳军心，连锁正是"自累"。
          2.【结构动作】使敌自累——不揭破、不扰动曹操连锁战船的既成之势，让曹军自己捆住自己，一船着火、全营连烧。
          3.【结构动作】乘势攻敌——黄盖诈降取信，借东南风纵火，用装满薪草膏油的蒙冲斗舰冲入，一计累敌、一计攻敌，两计扣用。
          4.【具体手段】黄盖先"书报曹公，欺以欲降"；取蒙冲斗舰数十艘"实以薪草，膏油灌其中，裹以帷幕，上建牙旗"；十舰居前、中江举帆；去北军二里余"同时发火"。
      - k: "预期"
        v: |
          黄盖、周瑜设局时的预判：曹操连锁战船之后，一船起火则全营连烧；东南风起时以火船冲入，可烧尽北船、逼曹军退。预期只到"火烧北船、逼退曹军"，不图全歼。
      - k: "修正"
        v: |
          硬边界：连环计靠"敌自累"——若曹操不连锁战船，或火攻当日无东南风，此计不成。
          失效早期信号：曹军战船分散未连锁、风向不对、曹操识破黄盖诈降。
          处置：火起后周瑜、刘备联军"率轻锐继其后，雷鼓大进"，水陆并进追击——累敌之后必须乘势追击，否则前功尽弃。
          专属失败模式：① 敌不自累——战船分散，火攻无效；② 累敌而无攻敌之机——风不来、诈降被识破；③ 一计不成，两计皆空。
          结构后果（事后）：赤壁大败，曹操烧余船、引军北还，自此无力南下；三国鼎立之势由此成型。
    effect: |-
      黄盖识出曹军连锁战船之累，诈降取信、借东南风纵火，去北军二里余「同时发火」，火烈风猛、烧尽北船；曹军大败，曹操烧余船引军北还。预期只到「火烧北船、逼退曹军」，不图全歼。
    reusable_condition: |-
      对方的「势」内部存在致命联结（连锁、捆绑、互相绑定），一处失则全体崩；且己方握有可借的时机（风向、时机窗），并有办法接近（取信、诈降）的格局——联结须是对方自造的，己方只利用、不扰动。
    non_applicable: |-
      对方兵力分散、无可乘的连锁结构；或时机不可借（无风、无隙）；或取信不成（诈降被识破）的情形。凡需己方「制造」连锁而非「利用」既成连锁者，落回设饵断梯一类，不属本计。
    source_note: |-
      「将多兵众，不可以敌，使其自累，以杀其势。在师中吉，承天宠也」出自《三十六计》第三十五计；「在师中吉，承天宠也」出自《周易·师》卦九二《象》辞。按语「庞统使曹操战舰勾连，而后纵火焚之……一计累敌，一计攻敌，两计扣用，以摧强势也」，并举宋毕再遇撒豆诱马之例。
      黄盖火攻见《三国志·周瑜传》：「瑜部将黄盖曰：今寇众我寡，难与持久。然观操军船舰首尾相接，可烧而走也。乃取蒙冲斗舰数十艘，实以薪草，膏油灌其中，裹以帷幕，上建牙旗，先书报曹公，欺以欲降……盖放诸船，同时发火。时风盛猛，悉延烧岸上营落。」裴注引《江表传》：「时东南风急……去北军二里余，同时发火，火烈风猛，往船如箭，飞埃绝烂，烧尽北船。」
      曹操连锁战船为史实，《资治通鉴》载「操军方连船舰，首尾相接」——北方士卒不习水战、多生疾病，曹操连锁以稳军心。
      「庞统使曹操战舰勾连」（连环计按语）与王允貂蝉连环计，均属《三国演义》虚构：正史无庞统献连环计，连锁战船是曹操自为之；正史《三国志·吕布传》记吕布与董卓侍婢私通、二人有隙，但「貂蝉」「连环计」是演义敷演。原文与史事以传世文献为准。
    recorder_note: |-
      接口角度（使敌自累）：本计的接口在"使敌自累"——将多兵众，不可以敌，使其自累，以杀其势；一计累敌（连锁）、一计攻敌（火攻），两计扣用。杠杆落在"敌人的自累结构（连锁战船）"。挂载：使敌自累→疏浚·泄势家族（P10）。
      与 B-0019 釜底抽薪闭合"杀势两态"：断源是"我切断你的供给"，自累是"你自己捆住自己"，一外断、一内累，目标都是"杀其势"。
      一个必须说清的口径：演义里是"诱导敌人自累"（庞统献计），正史里是"敌人已自累、我利用之"（曹操自连锁，黄盖识累而烧）。"使敌自累"的结构不变，变的只是"累"从何来——本判例以正史为准，取"利用既成之累"。
      与相邻判例的分野（它不是什么）：与 B-0022 关门捉贼（关门困敌）相比——关门是我围困敌人（我动手），连环是让敌人自缚（他动手）。与 B-0028 上屋抽梯相比——抽梯是断其退路，连环是利用其内部联结。与 B-0005 趁火打劫相比——趁火是趁对方崩溃取利，连环是先使对方自缚再取。
      分层标注·认识论映射：边界划在"曹操的势"，承重件是曹军的连锁结构而非兵力。（此为分析视角，与治水历挂载是两套系统，不混。）
      分层标注·动力学映射：不硬拼，先"杀势"——让敌人动能自我削减（连锁成一片、一烧全烧），再乘势而击。
      分层标注·工具映射：主结构动作＝识累→使敌自累→乘势攻敌；具体手段＝诈降书、蒙冲斗舰装薪草膏油、东南风纵火。
      一句话记：敌人强，就让他自己捆住自己，再一把火烧。
  - id: "B-0036"
    num: "B-0036"
    title: "走为上"
    card_title: "B-0036｜走为上"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: |-
      博弈决策（全师避敌／以退为存）
    date: "2026-10-31"
    source: |-
      《三十六计·第三十六计（败战计）》；宋罗大经《鹤林玉露》乙编卷三（毕再遇悬羊击鼓）
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/vONCc"
    interface: |-
      全师避敌（敌势全胜，我不能战，走则未败，未败是胜之转机）
    lever: |-
      「走」的选择（降则全败、和则半败、走则未败）
    concepts: ["疏浚"]
    keywords: ["走为上", "全师避敌", "疏浚", "决策显影库", "宁凯峰"]
    abstract: |-
      南宋开禧二年，毕再遇与金人对垒，金兵日益增多、宋军难与争锋。毕再遇判断「敌势全胜、不能战」，走为上：一夜拔营撤退，留旗帜于营、缚生羊悬于鼓上，羊挣扎击鼓不断，金人数日方觉是空营，追之已远，宋军全师而退。走为上的核心是「降则全败、和则半败、走则未败」——全军还在，才有转机。
    elements:
      - k: "情境"
        v: |
          第一层·系统边界：南宋开禧二年，毕再遇率军与金人对垒。金兵增援日益增多，宋军渐成寡不敌众之势。边界画在「必败的局势」——敌势全胜，不能战。
          第二层·威胁识别（承压者与承重件）：承压者是毕再遇（宋军将领），最怕的是「全军覆没、战力尽失」。承重件是全军的「实力」——在必败的局势下，这支军队本身是唯一的本钱，保住了它，才有将来反败为胜的转机。
          第三层·现状约束：金兵「至者日众」，宋军「难与争锋」；硬拼必溃，而降则全败、和则半败——三条出路里，只剩「走」能保全。
      - k: "信号"
        v: |
          毕再遇判断「该走」，依据三条（满足「敌势全胜」＋「走则未败」两条即判定该走）：
          1. 「度金兵至者日众，难与争锋」——敌势日益增长，正面不能战（阈值：敌势全胜，是「走」的前提）。
          2. 「降则全败，和则半败，走则未败」——降、和、走三选一，唯有「走」不损失实力（阈值：走才「未败」，是唯一不折本的选项）。
          3. 「未败者，胜之转机也」——全军还在，才有反败为胜的转机（阈值：走的目的在存续，不是逃跑）。
          信号链：金兵日众（敌势全胜）→ 难与争锋（不能战）→ 必走（走则未败）→ 悬羊击鼓（留壳稳住金人）→ 全师而退 → 金人数日方觉、追之已远。
      - k: "排除"
        v: |
          毕再遇没有选择决战（敌势日盛、难与争锋），没有选择投降（全败），也没有选择议和（半败）。
          何时不成立：此排除押在「敌势全胜、不能战」上。若尚有一战之力、或走的时机已失，则「走」也走不脱、走不成。
      - k: "行动"
        v: |
          1.【结构动作】识势——辨出金兵「至者日众，难与争锋」，敌势全胜、不能战，此时「降则全败、和则半败」，唯有「走」能保全。
          2.【结构动作】全师避敌——下定「走」的决心，全师而退、避开强敌锋芒，不战、不降、不和。
          3.【结构动作】留壳稳敌——拔营时留旗帜于营、缚生羊悬于鼓上，让鼓声不断，稳住金人，为脱身争取时间。
          4.【具体手段】一夜拔营去、留旗帜、缚生羊悬之、置羊前二足于鼓上，羊不堪悬、挣扎击鼓有声。
      - k: "预期"
        v: |
          毕再遇设局时的预判：金人听到鼓声不断，以为宋营尚在、不以为意；等数日后发觉是空营，宋军早已远去。预期只到「保全全军、安全脱身」，不图他利。
      - k: "修正"
        v: |
          硬边界：走为上只适用于「敌势全胜、不能战」的局势；若有一战之力，或走的时机已失，则「走」也走不脱。
          失效早期信号：金人识破悬羊击鼓（壳破）、追兵咬住、走得太慢。
          处置：全师而退之后，毕再遇后续仍数有功——「开禧用兵，诸将皆败，唯毕再遇数有功」，走为上保住的全军，正是后续战机的本钱。
          专属失败模式：① 走不成——壳被识破、被追上；② 走错方向——慌不择路，反陷敌手；③ 走变成逃跑——丢盔弃甲，失了「全师」的「全」。
          结构后果（事后）：全师而退，保全战力；「未败者，胜之转机也」——存续本身，就是下一次翻盘的资格。
    effect: |-
      毕再遇判断敌势全胜、不能战，一夜拔营撤退，留旗帜于营、缚生羊悬于鼓上，羊挣扎击鼓不断，金人以为宋营尚在，数日方觉为空营，追之已远；宋军全师而退，保全战力。预期只到「保全全军、安全脱身」，不图他利。
    reusable_condition: |-
      己方处于「敌势全胜、不能战」的必败局面，且尚有完整的实力可保（走得动、走得掉）；三条出路中唯「走」不折本（降则全败、和则半败、走则未败）——走的核心不是逃命，是保住「下一次翻盘的资格」。
    non_applicable: |-
      尚有一战之力、或走的时机已失（被咬住、退路已断）的情形；以及「走」会失去全部本钱（丢盔弃甲、四散溃逃）的走法——那不是走为上，是把「未败」变成「已败」。凡以「走」为名放弃组织与秩序的，不属本计。
    source_note: |-
      「全师避敌。左次无咎，未失常也」出自《三十六计》第三十六计；「左次无咎，未失常也」出自《周易·师》卦六四《象》辞。按语「敌势全胜，我不能战，则必降、必和、必走。降则全败，和则半败，走则未败。未败者，胜之转机也」，并举毕再遇悬羊击鼓之例。
      毕再遇悬羊击鼓见计文按语所引《战略考·南宋》，另见宋罗大经《鹤林玉露》乙编卷三：「开禧用兵，诸将皆败，唯毕再遇数有功……一夕拔营去，虑虏来相追，乃留旗帜于营，并缚生羊，置其前二足于鼓上，击鼓有声。虏不觉其为空营，复相持竟日。及觉欲追，则已远矣。」
      檀道济唱筹量沙见《南史·檀道济传》：「道济夜唱筹量沙，以所余少米散其上。及旦，魏军谓资粮有余，故不复追……全军而反，雄名大振」。「檀公三十六策，走为上计」出自《南齐书·王敬则传》——「走为上」一语，正源于檀道济。原文与史事以传世文献为准。
    recorder_note: |-
      接口角度（全师避敌）：本计的接口在「全师避敌」——敌势全胜、不能战，则必降、必和、必走；降则全败、和则半败、走则未败，未败是胜之转机。杠杆落在「走」这个选择本身：保住全军，是「存续优先」的极致体现。挂载：全师避敌→疏浚·避势（P10）。
      与 B-0021 金蝉脱壳（留壳抽身）的分野：金蝉脱壳重点在「怎么走」（留壳迷惑、走而不示走），走为上重点在「为什么走」（走则未败、保全转机）。毕再遇悬羊击鼓两者兼用（悬羊击鼓是「壳」，全师避敌是「走」的实质），但按语归「走为上」，因其核心是「全师避敌」而非「留壳」。
      与相邻判例的分野（它不是什么）：与 B-0022 关门捉贼（关门困敌）相比——关门是我困敌，走为上是「我避敌」，方向相反。与 B-0016 欲擒故纵（疏浚·泄势）相比——欲擒故纵是「放对手」，走为上是「保全自己」。
      分层标注·认识论映射：边界划在「必败的局势」，承重件是全军的实力——实力是本钱、是转机。（此为分析视角，与治水历挂载是两套系统，不混。）
      分层标注·动力学映射：不消耗、不对抗，避开强敌锋芒、保存自身动能，把「存续」放在「胜负」之前。
      分层标注·工具映射：主结构动作＝识势→全师避敌→留壳稳敌；具体手段＝拔营、留旗、悬羊击鼓。
      一句话记：打不过就跑，跑得干净，就还没输。
