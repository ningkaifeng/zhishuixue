cases:
  - id: "A-0001"
    num: "A-0001"
    title: "业委会秘书“八个严禁”制度边界"
    card_title: "A-0001｜业委会秘书“八个严禁”制度边界"
    card_meta: "决策显影库 · A 基层治理 · 制度边界"
    category: "A 基层治理"
    scene: "制度边界"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/Pg8Od"
    interface: "方舟（底线守护）"
    lever: "划底线"
    concepts: ["方舟"]
    keywords: ["业委会秘书“八个严禁”制度边界", "方舟", "决策显影库", "宁凯峰"]
    abstract: "面对业委会秘书角色法规依据不足、职责泛化、利益冲突风险显现的困局，制度设计者不追求一步到位立法，而是以负面清单形式划出八条不可触碰的行为底线，用“方舟操作”先守住资金、信息、决策权等核心功能，为后续规范管理提供基础性制度支撑。"
    elements:
      - k: "情境"
        v: |
          某区推进业委会规范化建设，引入业委会秘书制度试点。秘书作为非业委会委员的专职工作人员，需要承担日常事务协调、档案管理、会议记录、与物业对接等工作。由于秘书并非法规明确设定的法定角色，其职责边界缺乏统一规范，街道层面在推行试点时需要一份可供秘书参照执行的行为底线文件。

          制度设计者接手时，面对的局面是：试点推进中基层反馈秘书角色“什么都做”，存在职责泛化倾向；部分秘书由物业人员或居委干部兼任，角色混同容易产生利益冲突；秘书经手事项包括公章、账目、业主信息、合同档案等敏感事务；上级对业委会规范化提出明确要求，基层需要具体化、可操作的落地文本。

          权变点：制度供给的方式是“先立法定义角色”还是“先划底线控制风险”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 试点推进中，基层反馈秘书角色“什么都做”，存在职责泛化倾向。

          · 部分秘书由物业人员或居委干部兼任，角色混同容易产生利益冲突。

          · 秘书经手事项包括公章、账目、业主信息、合同档案等敏感事务，需要明确禁止性规定。

          · 上级对业委会规范化提出明确要求，基层需要具体化、可操作的落地文本。
      - k: "排除"
        v: |
          · 排除采用笼统的“职业道德规范”式表述——过于宽泛，秘书无法对照执行。

          · 排除只规定“秘书不得做什么”而不规定“秘书应该做什么”——单有禁止条款会让秘书不知道日常该干什么，反而僵化。

          · 排除把“八个严禁”写成对秘书个人的处分依据——定位是行为底线和工作指引，不是惩戒清单。
      - k: "行动"
        v: |
          起草并发布业委会秘书“八个严禁”清单，以负面清单形式明确秘书不可触碰的行为边界：

          第一条：严禁泄露业主个人信息和小区内部信息。

          第二条：严禁利用职务之便谋取私利或接受利益输送。

          第三条：严禁挪用、侵占业主共有资金或公共收益。

          第四条：严禁违规使用、保管、出借公章及证照。

          第五条：严禁违规签订合同、协议或擅自作出重大事项决定。

          第六条：严禁违规干预业委会决策或代替业委会行使表决权。

          第七条：严禁弄虚作假，伪造、变造会议记录或台账资料。

          第八条：严禁超越授权范围对外代表业委会作出承诺或发布信息。

          清单通过正式文件形式印发，并配套纳入秘书培训内容，要求秘书对照执行。
      - k: "预期"
        v: |
          可核验目标：秘书在履职时有一条清晰的行为底线，知道哪些事绝对不能做。

          防御目标：街道在指导、监督时有一个明确的判断依据；减少因角色边界模糊带来的投诉、纠纷和权力滥用风险。

          核心问题解决：为后续秘书绩效考核和规范管理提供基础性制度支撑。
      - k: "修正"
        v: |
          · 如果后续试点中出现清单未覆盖的新风险点，按年度评估后增补或修订。

          · 如果市级层面出台统一的秘书职责规范，“八个严禁”将自动对齐上级文件要求。

          · 如果个别条款在基层实践中被证明执行困难或不符合实际，允许在听取一线反馈后调整措辞和范围。

          · 修正回路：始终回到“用底线思维控制风险”的逻辑，不因上级文件出台而放弃清单，也不因执行困难而放松底线。
    source_note: |
      · 基于公开报道整理，原始信息见相关区业委会秘书制度试点报道及《业委会秘书工作指引》公开文本。

      · 具体条款内容以街道正式发文为准。本判例仅记录其判断结构，不替代官方文件。
    recorder_note: |
      “八个严禁”的价值不在条款本身，而在于它用“负面清单”这种形式，在秘书角色尚无明确法规依据的情况下，快速划出了一条可执行的行为底线。

      这是一种典型的“制度供给”动作：不追求一步到位立法，先用禁止性规则把风险关进笼子。

      与治水学的接口：这一判断对应的是“方舟操作”——在角色边界模糊、法规依据不足的条件下，不追求定义完整的角色内涵，而是先划定不可逾越的底线，保护系统核心功能（资金安全、信息安全、决策权完整）不被不可逆破坏。这是“底线守护”的典型运用：先守住不能失去的东西，再谈发展。

      适用边界：此结构适用于新角色、新制度处于试点阶段、法规依据不足、但风险已经显现的场景；不适用于角色职责已有明确法规依据、或风险尚未显现、可以从容立法的场景。负面清单是过渡性制度工具，不能替代完整的角色定义。
  - id: "A-0002"
    num: "A-0002"
    title: "鲸鱼大楼酬金制账目困局"
    card_title: "A-0002｜鲸鱼大楼酬金制账目困局"
    card_meta: "决策显影库 · A 基层治理 · 账目与资金"
    category: "A 基层治理"
    scene: "账目与资金"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/PPgYK"
    interface: "疏浚（源头改造）"
    lever: "开信息"
    concepts: ["疏浚"]
    keywords: ["鲸鱼大楼酬金制账目困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对酬金制小区物业不公开账目、业主拒缴物业费的恶性循环，业委会秘书不直接对抗物业，而是通过强制分项公开、组建业主志愿者核查小组、建立共管账户，把道德质问转化为技术核对，以公开促信任，重建缴费意愿。"
    elements:
      - k: "情境"
        v: |
          鲸鱼大楼为售后公房小区，物业管理采用酬金制模式：业主缴纳物业费，物业公司按约定比例提取酬金，其余资金用于小区日常维护。酬金制对账目透明度要求极高，但长期以来物业公司不公开明细，业主对钱花在哪充满质疑，导致物业费收缴率持续下降，形成恶性循环。

          业委会秘书施先生接手后，面对的局面是：物业公司以“资金不足”为由减少保洁频次，服务质量继续下滑；业主以“账目不清”为由拒缴物业费，收缴率不足70%；双方互相指责，矛盾螺旋上升。

          施先生必须在“不更换物业、不放弃酬金制、不直接对抗”的约束下，打破僵局。

          权变点：账目信息是否从“物业单方掌握”变为“多方交叉核对”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 业主频繁投诉“物业费交了，但不知道钱怎么花的”。

          · 物业公司的账目只有总额报表，没有分项明细，无法核实。

          · 有业主在业主大会上提议“取消酬金制，改回包干制”，但包干制同样可能带来服务缩水问题。

          · 街道和房管部门对小区物业矛盾表示关注，希望业委会先行调解。

          · 物业费收缴率不足70%，物业公司以“资金不足”为由，减少了保洁频次，服务质量继续下滑。
      - k: "排除"
        v: |
          · 排除简单指责物业贪污——缺乏证据，容易引发对抗，且无法解决问题。

          · 排除立即更换物业公司——新物业进场需要时间，且酬金制本身不是问题核心，换汤不换药。

          · 排除放弃酬金制改回包干制——包干制下物业公司更缺乏公开动力，长期可能损害业主利益。

          · 排除由业委会自行接手财务核算——业委会成员专业能力不足，反而会造成新的账目混乱。
      - k: "行动"
        v: |
          施先生作为业委会秘书，采取“以公开促信任，以专业建规则”的方式：

          第一步：梳理酬金制合同条款，明确物业公司必须公开的财务信息范围。

          第二步：敦促物业公司按季度提供分项收支明细，包括人工成本、保安保洁费用、维修费用、公共收益入账等。

          第三步：邀请有财务背景的业主志愿者组成账目核查小组，对明细进行交叉核对，并出具初步核查报告。

          第四步：将核查结果在业主大会上通报，对存在疑问的条目要求物业公司逐一笔说明。

          第五步：推动建立“共管账户+双签审批”机制：大额支出需业委会和物业双方签字方可动用。

          第六步：将物业费收支明细同步到业主微信群，定期发布简版财务月报。
      - k: "预期"
        v: |
          可核验目标：物业收支透明度提高，业主质疑减少，缴费率回升。

          防御目标：通过业主志愿者参与核查，增强业主对业委会和物业的信任；共管账户机制从源头防范资金挪用风险。

          核心问题解决：形成一套酬金制小区财务监督的可操作流程，供其他小区借鉴。
      - k: "修正"
        v: |
          · 如果物业公司不配合公开账目，将相关情况书面反馈至街道房办，由行政渠道督促整改。

          · 如果核查发现重大违规线索，推动启动专项审计，必要时走司法途径。

          · 如果志愿者核查力量不足，可引入第三方会计师事务所进行年度抽审。

          · 修正回路：始终回到“以公开促信任”的逻辑，不因物业不配合而转为直接对抗。
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 鲸鱼大楼、施先生姓名如涉隐私可做脱敏化处理，仅保留角色和做法。
    recorder_note: |
      酬金制账目问题的本质是“信息不对称”。施先生的做法没有直接对抗物业，而是利用“公开”这个杠杆，把道德质问转化为技术核对，让数据说话。

      值得注意的动作是“业主志愿者核查小组”：既解决了业委会专业能力不足的问题，又让业主从旁观者变为参与者，天然增加了决策的合法性。

      与治水学的接口：这一判断对应的是“疏浚操作”——不直接堵住矛盾（指责物业、更换物业），而是改变信息流动的源头结构，让账目从“物业单方掌握”变为“多方交叉核对”，使矛盾赖以存在的土壤被消解。

      适用边界：此结构适用于信息不对称是主要矛盾、双方尚未彻底撕破脸、且存在可动员的第三方专业资源的场景；不适用于物业已涉及重大违法违规、或业主与物业已进入法律诉讼阶段的场景。
  - id: "A-0003"
    num: "A-0003"
    title: "长白229街坊充电桩困局"
    card_title: "A-0003｜长白229街坊充电桩困局"
    card_meta: "决策显影库 · A 基层治理 · 公共收益与设施"
    category: "A 基层治理"
    scene: "公共收益与设施"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/S4IYL"
    interface: "疏浚（源头改造）"
    lever: "改路径"
    concepts: ["疏浚"]
    keywords: ["长白229街坊充电桩困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对老旧小区新能源车充电需求激增、私拉电线安全隐患突出、电力容量不足的困局，社区工作者不禁止、不放任，而是统一规划共享充电方案，引入运营商负责安装维护收费，把个体需求转化为公共资源分配问题，在空间与电力双重约束下实现安全与刚需的平衡。"
    elements:
      - k: "情境"
        v: |
          长白229街坊为老旧小区，无固定车位，停车位本就紧张。近年新能源车数量快速增长，居民要求安装充电桩的需求急增。由于缺乏统一规划，部分车主自行拉线、安装移动式充电设备，存在严重安全隐患，同时引发其他业主不满。

          章先生作为社区工作者接手时，面对的局面是：178户居民共用30多个充电桩，私拉电线和飞线充电屡禁不止，街道对火灾安全隐患排查出清单要求限期整改。与此同时，电力部门反馈小区变压器容量不足，无法支持大量个人充电桩同时安装。

          权变点：充电桩问题的定性是“个人需求”还是“公共资源分配”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 多户业主向居委会和业委会提出充电桩安装申请。

          · 物业反映楼道内出现私拉电线和飞线充电现象，屡禁不止。

          · 有业主投诉“充电桩位置占用公共通道，影响行人通行”。

          · 电力部门反馈小区变压器容量不足，无法支持大量个人充电桩同时安装。

          · 街道对火灾安全隐患排查出清单，要求限期整改。
      - k: "排除"
        v: |
          · 排除一律禁止安装充电桩——无法解决新能源车主的刚需，会激化矛盾。

          · 排除允许每家独立申请安装独立电表、独立走线——老旧小区空间和电力容量不够，会变成“先到先得”的抢占战。

          · 排除只依赖物业自行处理——物业缺乏协调权限，且无法承担代收电费的合规风险。

          · 排除让车主自行与电力部门沟通——散户申请电力扩容周期长、费用高，且容易破坏小区整体规划。
      - k: "行动"
        v: |
          章先生作为社区工作者，牵头统一规划共享充电方案：

          第一步：排摸小区新能源车数量、车型、日常充电需求，统计潜在使用频次。

          第二步：联合物业、业委会、电力部门现场踏勘，确定可设置共享充电桩的区域（如边角空地、围墙边），避开消防通道和主通道。

          第三步：设计“共享充电桩+分时管理”方案：统一招标充电桩运营商，由运营商负责安装、维护和收费，物业不直接接触电费。

          第四步：公示方案和收费标准，听取业主意见，重点解释公共车位被充电桩占用后的替代停车方案。

          第五步：向街道申请老旧小区新能源设施改造补贴或引入充电桩企业的免费安装政策。

          第六步：制定使用规则：充电完成后需尽快挪车，超时加收占位费；违规车辆记录并限制充电权限。
      - k: "预期"
        v: |
          可核验目标：满足新能源车主充电刚需，消除私拉电线安全隐患。

          防御目标：充电桩由专业运营商统一管理，物业规避运营风险；通过“共享+分时”模式，提高公共空间利用率，减少车位纠纷。

          核心问题解决：形成老旧小区充电桩治理的标准化流程。
      - k: "修正"
        v: |
          · 如果首批共享充电桩使用率不高，调整位置和数量，或改为慢充为主。

          · 如遇停车位矛盾激化，优先保证非新能源车主的基本停车需求，必要时重新规划车位布局。

          · 若运营商服务不佳，业主可联合提出更换运营商，不影响小区整体设施。

          · 后续电力扩容完成后，可逐步增设充电桩数量。

          · 修正回路：始终回到“把个人需求转化为公共方案”的逻辑，不因矛盾激化而退回禁止或放任。
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 章先生、长白229街坊如涉隐私可做脱敏化处理，仅保留角色和做法。
    recorder_note: |
      这个案例的关键在于“把个人需求转化为公共方案”。章先生没有让每个车主各自为政，而是用统一规划、统一运营的方式，既满足了部分人的需求，又避免了公共利益受损。

      老旧小区充电桩问题的本质是空间稀缺和电力稀缺的分配问题。共享解不是最优解，但在资源约束下是成本最低、冲突最小的现实解。

      与治水学的接口：这一判断对应的是“疏浚操作”——不直接堵住需求（禁止安装），也不放任需求无序释放（各自为政），而是改变需求满足的路径结构，把分散的个体需求导入统一规划、统一运营的公共通道。

      适用边界：此结构适用于需求真实且刚性、个体方案会导致公共资源争夺、但存在统一规划可行性的场景；不适用于需求本身不真实、或统一规划成本远高于分散方案、或小区已无任何可用空间的场景。
  - id: "A-0004"
    num: "A-0004"
    title: "九里片区“九合一”拆墙并院困局"
    card_title: "A-0004｜九里片区“九合一”拆墙并院困局"
    card_meta: "决策显影库 · A 基层治理 · 空间改造与合并"
    category: "A 基层治理"
    scene: "空间改造与合并"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/34vX0"
    interface: "疏浚（源头改造）"
    lever: "排次序"
    concepts: ["疏浚"]
    keywords: ["九里片区“九合一”拆墙并院困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对九个院落拆墙并院时居民对“改后利益受损”的想象，牵头人不硬推、不投票、不搞一刀切，而是按“先做通谁、再带动谁”的次序，先立骨干示范，再一户一策回应停车、采光等具体顾虑，并以“同心亭”面对面协商、“三尺巷”式互换促成各退一步，把利益受损的想象转化为可当面交换的具体利益，适用于分歧在“改后利益分配”而非“改不改”、且有可动员骨干的场景。"
    elements:
      - k: "情境"
        v: |
          这是一个由九个院落、总长820米围墙分隔而成的老旧片区，边界画在“物理空间—居住归属”之间。系统存续目标不是完成一次工程改造，而是让九个各自为政的院子合成一个“共用一套服务、共担一份责任”的共同体。

          片区启动“九合一”改造项目后，“拆墙并院”成为头号难题——墙一拆，院子就不再是原来的院子。此前九个院子各自为政：门卫各管各的、设施各老化各的、矛盾各闹各的，几十年的居住习惯和归属感都附着在这道墙上。

          吴先生作为这次院改的牵头人（社区干部／业委会秘书角色）接手时，面对的局面是：居民的分歧不在“要不要改”，而在“改了之后我的利益会不会受损”。甲院（临街、停车最紧的大院）怕拆墙后外来车辆穿行，原本就紧的停车位更不够用；乙院（自管较久、环境维护较好）觉得自己院落维护得好，“没必要拿出来分享”；丙、丁等小院担心合并后话语权被大院子稀释，成了“被代表”的一方。同时，改造又受制于“不能硬推、不能把显性矛盾压成隐性对抗”的约束。
      - k: "信号"
        v: |
          · 居民的分歧不在“要不要改”，而在“改了之后我的利益会不会受损”——真正需要处理的不是技术方案，而是利益受损的想象。

          · 甲院的居民怕拆墙后外来车辆穿行，原本就紧的停车位更不够用。

          · 乙院觉得自己院落维护得好，“没必要拿出来分享”。

          · 丙、丁等小院担心合并后话语权被大院子稀释，自己成了“被代表”的一方。

          · 谁要是把“利益受损的想象”这一点看漏了，墙就拆不动。
      - k: "排除"
        v: |
          · 排除行政命令强制拆墙——没有“硬推”。围墙背后是几十年的居住习惯和归属感，强拆只会把显性矛盾压成隐性对抗，墙拆了心没拆。

          · 排除直接投票强行表决——信息不充分时投票，只会把既有分歧固化成“多数对少数”，投完票照样不配合。

          · 排除“统一标准一刀切”——如统一外墙风貌、统一门头样式这类“面子工程”。这类做法在多数改造中是必选项，但吴先生选择不做，把钱花在居民真正需要的地方。
      - k: "行动"
        v: |
          吴先生对行动顺序的判断是“先做通谁，再带动谁”，分五步走：

          第一步：成立院改临时党支部，先把党员组织起来，形成可依靠的骨干队伍。

          第二步：先做通党员户和骨干户，让他们带头签字、带头让利，把“谁先动”的示范效应立起来。

          第三步：挨家挨户上门，一户一策回应具体顾虑（停车、采光、噪音、产权），不做大锅饭式动员。

          第四步：在“同心亭”面对面协商，把分歧摆到桌面上，公开讨论、当场回应。

          第五步：用“三尺巷”式谈判促成各退一步——你让一点停车空间，我让一点绿化面积，换来整体打通。
      - k: "预期"
        v: |
          可核验目标：空间打通、服务覆盖、人心凝聚——九个院子从“各自为战”变成“共用一套服务、共担一份责任”。

          防御目标：以骨干先动形成示范，避免强推造成的隐性对抗；以一户一策、面对面协商，避免小院“被代表”、避免分歧被固化为“多数对少数”。

          核心问题解决：把“利益受损的想象”转化为可当面协商、可互相交换的具体利益，让墙“拆得动、也拆得顺”。
      - k: "修正"
        v: |
          · 墙拆完之后，吴先生意识到空间改造只是起点、人心凝聚才是终点，于是补上一条修正：引入“两步路学堂”，把退休职工从“被服务的对象”转化成“参与治理的力量”——人还是那些人，角色一变，矛盾就少了一大半。

          · 另一条：把“同心亭”从一次性的协商场地，改成承接常态化协商的机制，让协商习惯沉淀下来。

          · 修正回路：始终回到“空间改造是起点、人心凝聚才是终点”的逻辑，不因围墙已拆而停止对“人心之墙”的处理。
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 涉及片区及院落名称、人物姓名均做脱敏处理，仅保留角色与做法；“吴先生”为化名。
    recorder_note: |
      这个案例的关键判断不是“拆墙的技术方案”，而是“先做通谁、再带动谁”的顺序——骨干先动，群众才跟。

      最反直觉的细节是：统一外墙风貌在多数改造中是“必选项”，但九里片区选择不做，把钱花在居民真正需要的地方。

      与治水学的接口：这是一种典型的“源头改造”判断——不是按惯例做事，而是追问“钱花在哪里才是真正的源头”。它不直接搬动围墙（堵），也不放任分歧自行演化，而是从“利益受损的想象”这个源头入手，先改变少数关键人的动力结构，再用示范带动多数，属于“动力—规则适配”的源头性操作。

      适用边界：此结构适用于分歧不在“改不改”而在“改后利益分配”、存在可动员的骨干力量、且冲突尚未进入对抗状态的场景；不适用于居民已就改造成本与收益形成明确对立、或不存在任何可依靠骨干的场景。骨干示范只能降低启动阻力，不能替代对具体利益损失的实质回应。
  - id: "B-0001"
    num: "B-0001"
    title: "瞒天过海"
    card_title: "B-0001｜瞒天过海"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-27"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/09ZAk"
    interface: "信号层（祭祀逆向）"
    lever: "藏信息"
    concepts: ["祭祀"]
    keywords: ["瞒天过海", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "面对对方情报网络严密、正面行动风险过高的局面，决策者不秘密行动、不正面对抗，而是把真实意图隐藏在公开常规动作中，管理对方的信号识别阈值，使其“常见则不疑”，在对方意怠窗口内完成关键部署，以最小成本实现目标。"
    elements:
      - k: "情境"
        v: |
          这是一场博弈系统，边界画在“我方行动—对方判断”之间。系统存续目标不是消灭对方，而是在对方未察觉真实意图前完成关键部署。

          对方对我方行动高度关注，常规隐蔽手段会被识破。一旦真实意图暴露，对方会提前部署，行动成本剧增，甚至导致整个计划失败。

          对方情报网络严密，秘密行动容易被发现；我方资源有限，无法承受正面强攻；时间窗口有限，必须在对方反应前完成部署。
      - k: "信号"
        v: |
          · 对方处于“备周则意怠”状态——常规戒备已疲劳，对公开行动不再敏感。

          · 对方判断“常见”之事为安全，对异常之事反而警觉。

          · 我方观察到：对方对日常往来、例行公事、公开活动已形成“不疑”惯性。

          · 对方注意力集中在“可能的异常”上，而忽略了“异常就藏在常规里”。
      - k: "排除"
        v: |
          · 排除秘密行动——对方情报网络严密，秘密行动容易被发现。

          · 排除直接强攻——成本高、风险大，胜负不确定。

          · 排除临时改变计划——突然改变会暴露异常，触发对方警觉。

          · 排除正面欺骗——对方已有防备，直接欺骗反而会暴露意图。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：贺若弼以“换防”为名频繁调动军队，使陈国习以为常，最终渡江灭陈。

          · 商业上：竞争对手司空见惯的日常运营中完成关键布局。

          · 基层治理中：把关键调整包装成例行公事，在居民未察觉时完成方案落地。

          其结构为：

          第一步：把真实意图隐藏在公开的、常规的行动中。在对方已经“常见”的场景里完成部署，让对方把异常当作正常。

          第二步：维持日常节奏不变，不制造任何异常信号。所有调动、部署、准备都包装成例行公事。

          第三步：在对方“意怠”的时间窗口内，完成关键动作。

          第四步：动作完成后，继续维持常规状态，直到对方发现时，既成事实已经形成。
      - k: "预期"
        v: |
          可核验目标：对方在真实行动发起前保持“不疑”状态，我方完成关键部署。

          防御目标：即使对方中途产生疑虑，也不会触发全面戒备，因为我方行动始终在“常见”范围内。

          核心问题解决：以最小成本、最小风险，在对方未察觉的情况下完成关键部署。
      - k: "修正"
        v: |
          · 若对方对“常见之事”开始提高警觉，不要急着消除警觉，而是主动制造一个“更大的异常”吸引其注意力，让真正的部署继续隐藏在常规中。

          · 若连日频繁的常规动作反而引起疑心，主动安排一次高调的、无害的“意外”，让对方觉得我方行动不过如此，重新恢复“不疑”惯性。

          · 修正回路：回到“常见”状态，重新积累“不疑”惯性，而不是解释或掩盖。
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：贺若弼事见《隋书》，后世注解普遍引用为“瞒天过海”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是欺骗，是管理对方的信号识别阈值。它不是“让对方看不到”，而是“让对方看到但不当回事”。

      与治水学的接口：这一计对应的是信号层的操作——通过控制信号的“常见性”，改变对方对信号的判断权重。在治水学中，这接近“祭祀操作”的逆向使用：不是凝聚共识，而是维持对方的“认知惯性”。

      适用边界：这一计适用于对方处于常规戒备状态、对公开行动不敏感的场景；不适用于对方高度警觉、或己方行动已被识破的场景。在存续逻辑中，它只能用于争取时间窗口，不能替代实质性的动力-规则适配。
  - id: "B-0002"
    num: "B-0002"
    title: "围魏救赵"
    card_title: "B-0002｜围魏救赵"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-27"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/NxKCp"
    interface: "疏浚（改变压力流向）"
    lever: "改优先级"
    concepts: ["疏浚"]
    keywords: ["围魏救赵", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对正面救援成本过高、坐视不救又危及自身存续的两难，决策者不直接赴援，而是攻击对方必救的薄弱环节，迫使其主动改变部署，以间接路线解除危机，同时保全自身实力。"
    elements:
      - k: "情境"
        v: |
          这是一场多边博弈系统，边界画在“救援方—被攻方—进攻方”三方之间。系统存续目标不是直接击败进攻方，而是解除被攻方的危机，同时保全救援方自身实力。

          被攻方正在被进攻方主力围攻，若救援方直接赴援，将正面遭遇进攻方主力，胜负难料，且即使获胜也将消耗巨大。若坐视不救，被攻方灭亡后，进攻方势力扩张，救援方自身存续环境恶化。

          进攻方主力在外，国内空虚；被攻方尚能支撑一段时间；救援方兵力不足以正面决战；时间窗口有限，必须在被攻方崩溃前迫使进攻方撤军。
      - k: "信号"
        v: |
          · 进攻方主力全部压在前线，都城防守空虚。

          · 进攻方的存续命脉在都城，不在前线。

          · 被攻方虽被围，但尚未崩溃，仍有支撑时间。

          · 救援方与进攻方正面决战，成本高于攻击其必救之处。
      - k: "排除"
        v: |
          · 排除直接发兵被攻方与进攻方主力正面决战——成本高、风险大、胜负不确定。

          · 排除坐视不救——被攻方灭亡后，进攻方势力扩张，救援方自身存续环境恶化。

          · 排除小规模骚扰——不足以迫使进攻方撤军，反而暴露意图。

          · 排除等待进攻方自行撤军——时间不可控，被攻方可能先崩溃。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：齐军直捣魏国都城大梁，迫使魏军回援，在桂陵设伏截击。

          · 商业上：不直接争夺被对手挤压的市场，而是攻击对手的现金流核心或核心客户群，迫使其回防。

          · 基层治理中：不直接对抗矛盾焦点，而是改变矛盾赖以存在的资源结构，使焦点自行消解。

          其结构为：

          第一步：不直接赴援，而是识别进攻方的“必救之处”——其存续命脉所在。

          第二步：向进攻方的必救之处施加实质威胁，使其不得不回援。

          第三步：在进攻方回援途中设伏或制造不利条件，以逸待劳。

          第四步：若进攻方不回援，则继续施加威胁，形成实质打击。
      - k: "预期"
        v: |
          可核验目标：进攻方被迫从被攻方撤军，被攻方危机解除。

          防御目标：救援方避免与进攻方主力正面决战，保全自身实力。

          核心问题解决：以间接路线解除被攻方危机，同时消耗进攻方。
      - k: "修正"
        v: |
          · 若进攻方识破意图，坚持不回援，则继续围困其必救之处，形成实质威胁，迫使其在“失都城”和“失前线”之间做出选择。

          · 若进攻方分兵回援，则集中力量打击其回援部队，在运动中歼灭。

          · 若被攻方提前崩溃，则转为直接对抗，评估是否仍有间接路线可选。

          · 修正回路：始终回到“攻击必救之处”的逻辑，不因对方反应而转为正面硬拼。
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：孙膑围魏救赵事见《史记·孙子吴起列传》，后世注解普遍引用为“围魏救赵”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是“不打”，是改变对方的优先级。它不直接解决正面冲突，而是制造一个对方必须优先处理的新问题，迫使对方主动改变部署。

      与治水学的接口：这一计对应的是疏浚操作——不直接堵压力源，而是改变压力源的流向，使其不再冲击原目标。在治水学中，这接近“疏浚”的迂回运用：不是正面消解压力，而是引导压力转向对方必须承受的位置。

      适用边界：这一计适用于对方有明确“必救之处”、且该处防守薄弱的场景；不适用于对方无明确存续命脉、或对方宁愿放弃必救之处也不改变部署的场景。在存续逻辑中，它只能用于改变博弈节奏，不能替代实质性的动力-规则适配。
  - id: "B-0003"
    num: "B-0003"
    title: "借刀杀人"
    card_title: "B-0003｜借刀杀人"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-28"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/wSNCq"
    interface: "疏浚（转换出力者）"
    lever: "借第三方"
    concepts: ["疏浚"]
    keywords: ["借刀杀人", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对敌人已明、正面出手损耗巨大而第三方态度未定的局面，决策者不亲自出手、不与第三方正面结盟，而是识别并激化第三方与敌人之间的矛盾，诱导第三方出手（引友杀敌），借第三方之力削弱敌人，自己保存实力、坐收其成。"
    elements:
      - k: "情境"
        v: |
          这是一场三方博弈系统，边界画在“我方—敌方—第三方”之间。系统存续目标不是亲自消灭敌人，而是在保存自身实力的前提下，借助第三方之手削弱或清除敌人。

          敌人已经暴露，其意图、位置与弱点均可识别（敌已明）；但第三方的态度尚未确定（友未定），它既有能力对敌方动手，又尚未明确站队。若我方亲自出手，胜负难料且损耗巨大；若坐视不理，敌人坐大，我方的存续环境将持续恶化。

          我方实力不足以、也不值得正面消耗；第三方与敌方之间存在可利用的矛盾或利益冲突；时间窗口有限，必须在敌人进一步壮大前完成借力。
      - k: "信号"
        v: |
          · 敌方目标已经暴露，其威胁方向与薄弱环节可以辨识。

          · 第三方与敌方之间存在既有的利益冲突、历史积怨或竞争关系。

          · 第三方有实力对敌方造成实质打击，只是尚未被激发或尚未下定决心。

          · 我方若亲自出手，成本高于诱导第三方出手，且易暴露自身意图。
      - k: "排除"
        v: |
          · 排除亲自正面进攻——成本高、损耗大、胜负难料，且违背“保存实力”的存续目标。

          · 排除与第三方正式结盟、正面作战——第三方态度未定，强行结盟易暴露意图，反而把“友未定”推向敌方。

          · 排除坐视不理——敌人坐大后，我方存续环境恶化，错失削弱敌人的窗口。

          · 排除直接收买或利诱第三方——过于直白，易被识破，且成本未必低于正面消耗。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：郑桓公欲袭郐，先收集郐国忠臣良将名单，刻于盟书、埋于城外，制造“郐臣通敌”的假象；郐君中计，尽杀其良臣，郑国不战而取郐。

          · 商业上：不直接攻击竞争对手，而是识别并放大对手与其盟友、渠道、股东之间的裂痕，借其内部或第三方力量削弱对手。

          · 基层治理中：不直接对抗矛盾焦点，而是借既有的制度、规则或上级、舆论等第三方力量，让对立面在规则约束下自行削弱或退出。

          其结构为：

          第一步：确认“敌已明”——锁定敌人的意图、位置与弱点，明确必须清除的目标。

          第二步：识别“友未定”——在态度未定的第三方中，找出与敌方存在矛盾、且有能力动手的那一个。

          第三步：制造条件激化第三方与敌人之间的矛盾，诱导第三方出手（引友杀敌），自己始终不出力、不暴露。

          第四步：坐收其成，保存实力；若第三方仍不动手，则持续加码诱导，直到其出手为止。
      - k: "预期"
        v: |
          可核验目标：第三方对敌方形成实质打击，敌方被削弱或清除，我方未亲自投入对抗。

          防御目标：即使第三方最终不配合，我方自身不暴露意图、不损耗实力。

          核心问题解决：以“不自出力”的最小成本削弱敌人，把自身损耗与暴露风险降到最低。
      - k: "修正"
        v: |
          · 若第三方识破意图、拒绝出手，不要强行推进，转而寻找新的第三方，或制造更隐蔽、更自然的诱导条件。

          · 若第三方出手后反而坐大、成为新的威胁，要及时转入制衡，防止“引狼入室”、借来的刀反噬自身。

          · 若敌方先发制人、反过来拆解我方布局，立刻收回诱导，转为防御或另寻他路。

          · 修正回路：始终回到“引友杀敌、不自出力”的逻辑——借力而不被力所累，绝不让借来的刀伤到自己。
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：郑桓公袭郐事见《韩非子》，借孙权之手擒关羽事见《三国志》，后世注解普遍引用为“借刀杀人”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是“不战”，是把“消灭敌人的成本”转嫁给第三方。它操作的对象不是敌人本身，而是“敌人与第三方之间的关系”——识别二者之间可被激化的矛盾，制造条件让矛盾在有利于自己的方向上释放，用第三方的力量消耗敌人，自己坐收其成、保存实力。

      与治水学的接口：这一计接近“疏浚”的借势运用——不是自己正面消解压力，也不是引导敌人自己的力量回击（那是围魏救赵），而是引导第三方的力量去打击敌人。它调度的是“动力—规则”关系中“友未定”的第三方动力，把既有的势能导向目标，让势能替自己完成冲刷。

      适用边界：这一计适用于“敌已明、友未定”、且第三方与敌方存在可利用矛盾、第三方有实力且能被激发的场景；不适用于无可借的第三方、第三方识破意图反而反噬、或我方与第三方的矛盾大于第三方与敌方矛盾（借刀反而伤己）的场景。在存续逻辑中，它只能用于借力消耗，不能替代自身实力建设——“借来的刀”不可持久，且可能反噬。
  - id: "B-0004"
    num: "B-0004"
    title: "以逸待劳"
    card_title: "B-0004｜以逸待劳"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-29"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/udsQl"
    interface: "分层异步（等对方动能衰减）"
    lever: "等衰减"
    concepts: ["分层异步"]
    keywords: ["以逸待劳", "分层异步", "决策显影库", "宁凯峰"]
    abstract: "面对敌方主动进攻、锐气正盛而正面迎击损耗巨大的局面，决策者不主动出击、不消极避战，而是退守有利态势、养精蓄锐，等待对方攻势的衰减拐点（锐气耗尽、补给不济），再以逸击劳、一击致命，适用于己方有地势与时间资本、敌方劳师袭远不可持久的场景。"
    elements:
      - k: "情境"
        v: |
          这是一场攻守博弈系统，边界画在“我方—敌方”之间。系统存续目标不是抢先出手、与敌硬拼，而是以最小代价拖垮来犯之敌，同时保全自身实力。

          敌方主动进攻、锐气正盛，正面迎击将与强弩之末对撞，胜负难料、损耗巨大；若避而不战、一味退让，敌方将长驱直入，我方存续空间被逐步压缩。

          敌方远征而来、补给线长、难以持久；我方据有利地势、补给充足、可以以静制动；时间站在我方一边，但必须在敌方疲惫之前始终守住“逸”的态势。
      - k: "信号"
        v: |
          · 敌方劳师袭远、补给线长，其攻势依赖一股“锐气”，难以长期维持。

          · 敌方的士气有衰减周期——“一鼓作气，再而衰，三而竭”，强攻不克必然衰竭。

          · 我方占据有利地形与补给优势，可以“以逸”待“劳”，把时间转化为己方的势能。

          · 敌强我弱的表面态势下，隐藏着“强弩之末，势不能穿鲁缟”的转化窗口。
      - k: "排除"
        v: |
          · 排除正面迎击、主动决战——敌方锋锐正盛，硬拼损耗大、胜负难料。

          · 排除彻底退让、消极避战——会助长敌方锐气，且丢失关键位置。

          · 排除速战速决——正中对方下怀，让对方把“锐气”优势发挥到极致。

          · 排除不断袭扰、小打小闹——既消耗自身，又暴露虚实，不能伤其根本。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：陆逊面对刘备东征大军，主动退守夷陵、坚壁不出，待蜀军屯兵山林、锐气尽失、补给不济，火烧连营七百里，一举破敌。

          · 商业上：不跟进对手的价格战，反而收缩战线、巩固现金流与成本优势，等对手扩张过度、资金链紧绷时，再以逸待劳收割其市场。

          · 基层治理中：面对激化的矛盾不急于正面调解，先稳住局面、摸清各方诉求，等情绪降温、利益格局清晰后再切入，化被动为主动。

          其结构为：

          第一步：主动退守有利态势，把“劳”的代价转嫁给对手——让对方来攻、让对方远征、让对方消耗。

          第二步：坚壁不出、养精蓄锐，把自己始终保持在“逸”的状态（休整、补给、待机）。

          第三步：观察对方的消耗拐点，等待其“刚”转为“柔”——锐气耗尽、补给不济、士气衰竭。

          第四步：在拐点出现时，以己方蓄满之力一击致命，击其惰归、收其全功。
      - k: "预期"
        v: |
          可核验目标：敌方锐气耗尽、疲惫沮丧，我方以最小代价取胜或逼其退却。

          防御目标：不正面硬拼、不主动消耗，保全自身实力。

          核心问题解决：把“敌强我弱”的表面态势，通过时间与态势的调度，转化为“我逸敌劳”的有利格局。
      - k: "修正"
        v: |
          · 若对方识破意图、不上钩、不主动进攻，则主动制造诱因（利而诱之），引其来攻，再以逸待劳。

          · 若对方持久对峙、不露破绽，则转而袭扰其补给线，迫使其要么撤退、要么主动出击。

          · 若我方“逸”的条件丧失（补给被断、地利被夺），则及时转入机动或决战，不以逸待劳变成坐以待毙。

          · 修正回路：始终回到“养己之逸、疲敌之劳”的逻辑——待机是为了蓄力，不是消极等待。
    source_note: |
      · 计名与原文：出自《三十六计》原文“困敌之势，不以战；损刚益柔”。

      · 历史案例：陆逊夷陵之战见《三国志·陆逊传》；曹刿论战“一鼓作气，再而衰，三而竭”见《左传·庄公十年》，后世注解普遍引用为“以逸待劳”的典型注脚。

      · “击其惰归”出自《孙子兵法·军争篇》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“不打”，是“把时间变成自己的武器”。它不直接消解压力，而是识别对方攻势的衰减周期，避开其峰值，在其谷值反击。

      与治水学的接口：这一计对应的是对“突破性动能”时间结构的识别与利用——对方的攻势是突破性动能的峰值，必然衰减（一鼓作气，再而衰，三而竭）；以逸待劳不承接峰值，而是“损刚益柔”，等其动能衰减到谷值，再以己方蓄满的动能反击。它调度的不是空间上的流向（那是围魏救赵、借刀杀人的疏浚），而是时间上的相位差——是“分层异步”的实操化：利用动力层与规则层之间的时间差，让己方的规则（防守、补给）始终跟得上，而对方的动力在时间中自我耗散。

      适用边界：这一计适用于我方有“逸”的资本（地利、补给、时间、纵深）、对方有“劳”的来源（远征、补给线长、锐气不可持续）的场景；不适用于我方无险可守、无粮可继、或对方同样以逸待劳、持久对峙的场景。在存续逻辑中，它只能用于“待机取胜”，不能替代实质性的动力-规则适配——若自身没有“逸”的资本，以逸待劳就成了坐以待毙。
  - id: "B-0005"
    num: "B-0005"
    title: "趁火打劫"
    card_title: "B-0005｜趁火打劫"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-30"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/rz6Gx"
    interface: "响应缺口（趁对方响应崩溃）"
    lever: "乘危机"
    concepts: ["响应缺口"]
    keywords: ["趁火打劫", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "面对敌方已陷入内乱、无暇他顾的窗口，决策者不正面强攻、不点火造势，而是识别敌方因危机暴露的存续命脉，就势出手夺取本属于敌方的利益，得手即收、不引火烧身，适用于敌方危机为“真火”、且火势不会反噬自身的场景。"
    elements:
      - k: "情境"
        v: |
          这是一场多方博弈系统，边界画在“我方—敌方—敌方内部各派”之间。系统存续目标不是击败一个团结的敌人，而是在敌方已陷入内乱、无暇他顾的窗口内，就势夺取本属于敌方的利益。

          敌方正处于危机之中——内乱、灾荒或领导层更迭，其存续功能暂时失序。但这危机是暂时的：一旦敌方度过危机、重新整合，我方将面对一个重新强大的敌人；而火不会永远烧下去，觊觎者不止我方一个。

          现状约束：敌方的火是真火还是假火，需要先判明；火势可能失控、波及自身；机会窗口与敌方危机的持续期绑定，稍纵即逝。这要求决策者既要克制贪欲，又要具备止损意识。
      - k: "信号"
        v: |
          · 敌方内部出现裂痕——内乱、派系斗争、民变、灾荒或领导层更迭。

          · 敌方的核心资源与关键位置因危机而疏于防守，存续命脉暴露。

          · 危机是“真火”而非“表面的烟”——敌方内部已无暇他顾、自顾不暇。

          · 趁火取利的收益大于风险，且我方具备就势出手的能力。
      - k: "排除"
        v: |
          · 排除正面开战、主动强攻——敌方虽乱，但外部强攻会逼其内部一致对外，等于给敌方送一个“共同敌人”，反而替它灭火。

          · 排除等待敌方完全崩溃后再动手——火是暂时的，等火灭了机会也灭了，且火可能被别人先趁走。

          · 排除过早结盟、明确站队——敌方内乱时各方势力未定，过早站队会卷入漩涡，失去“就势取利”的进退余地。

          · 排除主动点火、制造敌方内乱——趁火打劫的精髓是“就势”而非“造势”，主动点火成本高、易留把柄，且火的走向不可控。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：多尔衮趁李自成农民军攻陷北京、明朝覆亡、中原大乱之际，在吴三桂开关后率清军入关，不救明、不助闯，就势夺取中原。

          · 商业上：不主动进攻对手，而是盯住对手内部的资金链断裂、股东内斗或核心团队出走，在对手自顾不暇时收割其市场与人才。

          · 基层治理中：不在矛盾平稳时强行介入，而在多方僵持、旧秩序松动、各方都无力掌控局面的关口，就势推出新的规则或方案。

          其结构为：

          第一步：判明敌方是否已陷入“真火”——内乱、失序、无暇他顾，而非表面的烟雾。

          第二步：锁定敌方因危机而暴露的“存续命脉”——核心资源、关键位置或战略机会。

          第三步：就势出手，不灭火、不点火，只在火势最旺的窗口内夺取本属于敌方的利益。

          第四步：得手即收，在敌方重新整合或火势失控之前离场，不让“火”烧到自己。
      - k: "预期"
        v: |
          可核验目标：在敌方危机窗口内夺取既定的利益，敌方因自顾不暇而无力反扑。

          防御目标：不卷入敌方内乱、不被火势反噬，始终保持“就势”而非“入局”的位置。

          核心问题解决：把一个“团结的强敌”的问题，转化为一个“混乱中可趁的窗口”的问题。
      - k: "修正"
        v: |
          · 若判明敌方是“假火”（内乱被夸大、实则团结），立即收手退出，不硬闯铁板。

          · 若火势失控、有波及自身的风险，及时抽身，宁可不得利，也不引火烧身。

          · 若出手过早、反而促成敌方一致对外，立刻停止施压，退回旁观，等敌方重新分化再伺机。

          · 修正回路：始终回到“就势取利”而非“造势取利”——只趁真火，不点假火，火不可控时先保全身而退。
    source_note: |
      · 计名与原文：出自《三十六计》原文“敌之害大，就势取利，刚决柔也”。

      · 历史案例：多尔衮趁明末内乱、李自成攻陷北京之际入关，事见《清史稿》；后世注解普遍引用为“趁火打劫”的典型注脚。

      · “刚决柔”出自《易经·夬卦》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“制造机会”，是“识别并利用别人已经烧起来的火”。它不点火、不灭火，而是趁火取利——在敌方自身陷入失序时，就势夺取本属于敌方的利益。

      与治水学的接口：这一计对应的是对敌方系统“响应缺口”的识别与利用。敌方的内乱，本质是其系统内部的失序压力（洪水）已经发作，而规则层（秩序、整合能力）来不及响应，这就是治水学所说的“响应缺口”——规则层完成有效响应所需的时间，超过了系统承受冲击而不发生核心功能损害的时间窗口。趁火打劫，就是在这个“规则失守”的缺口内就势取利。它调度的不是己方的动力，也不是引导流向（疏浚），而是敌方自身失序的势能——把敌方的洪水，变成我方的机会。

      适用边界：这一计适用于敌方已陷入真实的内乱/失序、且其存续命脉因危机暴露的场景；不适用于敌方外患反而促成内部团结、或火势会失控波及自身的场景。在存续逻辑中，它只能用于“就势取利”，不能替代自身实力建设——火总有烧完的一天，趁火所得，须在敌方重新整合前转化为己方的长期优势。
  - id: "B-0006"
    num: "B-0006"
    title: "声东击西"
    card_title: "B-0006｜声东击西"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-01"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/YSdl3"
    interface: "响应错位（引导对方部署错位）"
    lever: "调兵力"
    concepts: ["响应缺口"]
    keywords: ["声东击西", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "面对敌方重兵防守真实目标、正面强攻受挫的局面，决策者不硬攻真目标、不真打假方向，而是制造声势逼真的假动作（声东）把敌方防守引到错误方向，再趁真实目标空虚突然转攻（击西），适用于敌方有明确防守重点、真假目标存在空间差、假信号能调动对方的场景。"
    elements:
      - k: "情境"
        v: |
          这是一场攻守博弈系统，边界画在“我方—敌方的防守部署”之间。系统存续目标不是攻破敌方重兵防守的目标，而是先调动敌方的防守力量离开真实目标，再趁虚攻克。

          敌方重兵防守着我方真正要攻取的目标，正面强攻等于在敌方预设的战场上硬碰。若不能调动敌方的部署，我方要么强攻受挫，要么暴露真实意图。

          现状约束：敌方兵力集中、但可被假信号调动；真实目标与假目标之间存在空间差，可被“声东”的假动作利用；假信号要逼真到足以让对方相信，才能完成调动。
      - k: "信号"
        v: |
          · 敌方兵力集中于某处、防守有明确重点——这“重点”就是可被调动的空间。

          · 敌方神志慌乱、疏于防备（“敌志乱萃”“不虞”），最易被假信号牵引。

          · 真实目标（西）与假目标（东）之间存在空间差，可被假动作利用。

          · 敌方对“声势”敏感、易被调动——假信号要真到让对方相信，才能把防守引开。
      - k: "排除"
        v: |
          · 排除正面强攻真实目标——敌方重兵防守，正面强攻无异于放弃“调动对方”这个唯一杠杆，把自己钉死在敌方预设的战场上。

          · 排除“声东”之后真的攻东——假戏真做，就是自曝意图、放弃真实目标。

          · 排除只有佯动、没有实攻——只“声东”不“击西”，假信号等于说白白暴露意图，还提醒了对方。

          · 排除假信号过弱、不足以调动对方——假信号要逼真到让对方确信，否则调动不了防守，声东击西就落空。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：耿弇讨张步，声言五日后攻西安，又纵放俘虏传回假消息；张蓝闻之日夜戒备，耿弇却夜半转攻临淄，半日拔之，张蓝孤立无援、弃城而逃。

          · 商业上：高调宣布进军华东（假方向），引对手把资源、渠道都堆到华东，实际却突入对手疏于防守的华南市场，一击得手。

          · 基层治理中：不直接触碰矛盾焦点（真目标），先在别处制造一个“焦点假象”，把各方的注意力和情绪引开，再回到真问题趁虚切入、解决。

          其结构为：

          第一步：制造“声东”——在假方向（东）制造声势逼真的假动作，让对方确信我方要攻东。

          第二步：确认调动——观察对方是否把防守力量、注意力投向东边，西边（真实目标）暴露。

          第三步：“击西”——趁真实目标空虚，突然转攻，一击得手。

          第四步：得手即收——在对方反应过来、回援之前，完成攻取并稳住既得。
      - k: "预期"
        v: |
          可核验目标：敌方防守力量被引到假方向，真实目标空虚，我方攻克真实目标。

          防御目标：即使假信号被识破，我方也未深陷假动作、保有退回的余地。

          核心问题解决：把“攻破重兵防守目标”的问题，转化为“先引开防守、再攻空虚目标”的问题。
      - k: "修正"
        v: |
          · 若假信号被识破、对方不上当不调动，立即停止佯动，退回真实评估或另寻他路，不硬闯。

          · 若“声东”声势过大、反而引起对方警觉，适度收敛假信号，回到“逼真而不夸张”的分寸。

          · 若对方开始回援、尚未到位——抢在合流前完成实攻；若已经合流、时机已失——果断放弃，不硬攻。

          · 修正回路：始终回到“假信号调动、真目标出击”的逻辑——声东是为了击西，不是为声东而声东。
    source_note: |
      · 计名与原文：出自《三十六计》原文“敌志乱萃，不虞，坤下兑上之象，利其不自主而取之”。

      · 历史案例：耿弇讨张步、声言攻西安而实取临淄，事见《后汉书·耿弇列传》；后世注解普遍引用为“声东击西”的典型注脚。

      · “坤下兑上”为《易经·萃卦》之象。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“藏”，是“骗”——它不隐藏真实意图，而是主动制造一个假的攻击方向（声东），引导对方的防守力量投错位置，让真实目标（西）失去守护，再趁虚攻克。

      与治水学的接口：这一计对应的是“响应错位”——通过假信号（声东），引导对方的规则响应（防守）发生空间错位：对方把防守力量投向了假方向，真实目标因此失守。它不同于“响应缺口”（B-0005，对方来不及响应），而是“响应对了、方向错了”——响应的空间错位。它调度的不是己方的动力，而是对方防守力量的部署方向。

      适用边界：这一计适用于敌方有明确的防守重点、且真实目标与假目标之间存在空间差、假信号能逼真到足以调动对方的场景；不适用于敌方无固定防守重点（无空间差可趁）、或对方高度警觉、假信号无法调动的场景。在存续逻辑中，它只能用于“调动部署、趁虚而取”，不能替代实质性攻坚——声东击西的前提，是“西”确实可攻，若“西”也重兵把守，则声东击西失效。
  - id: "B-0007"
    num: "B-0007"
    title: "无中生有"
    card_title: "B-0007｜无中生有"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-02"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/c2oy4"
    interface: "响应钝化（磨钝对方敏感度）"
    lever: "养脱敏"
    concepts: ["响应缺口"]
    keywords: ["无中生有", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "面对箭矢耗尽、正面无法补充的绝境，决策者不硬拼、不硬守，而是先用假信号（草人）骗得真利（箭），再用假信号的反复磨钝对方的警觉，最后用真动作（敢死队）乘虚突袭，适用于对方有可被反复假信号磨钝的固定响应、且真假难辨的场景。"
    elements:
      - k: "情境"
        v: |
          这是一场攻守博弈，边界画在"守城一方—攻城一方"之间。系统的存续目标不是出城和敌军硬拼，而是先补上"箭矢耗尽"这个致命短缺，再反过来重创敌军。

          守城一方箭矢用尽，火力眼看就要熄火；攻城一方夜里戒备森严，对"城上有人下来"会本能地万箭齐发。

          现状约束：箭矢无法正面补充（出城就是送死）；敌军夜里高度戒备、但真假难辨——"草人"和"真人"在夜里看起来一样。
      - k: "信号"
        v: |
          · 箭矢用尽——最直接的信号，守城的"火力"即将熄火。

          · 敌军夜里对"城上有人下来"本能放箭——这是一个可以被利用的固定反应。

          · 敌军在夜里分不清草人和真人——真假难辨，是可操作的空间。
      - k: "排除"
        v: |
          · 排除出城补充箭矢——敌军围攻，出城就是送死。

          · 排除硬守待援——箭矢用尽，硬守就是等死。

          · 排除"骗一次箭就收手"——只放一次草人，对方下次就不上当了；必须用"反复"把对方的警觉磨掉，真的突袭才能穿透。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：张巡守睢阳、箭矢用尽，夜里先放草人骗得敌军数十万支箭，再反复放草人让敌军"笑不设备"，最后放真人敢死队突袭敌营，大败敌军。

          · 商业上：先反复放"假信号"（造势、放风），让对手或市场对这类信号脱敏，最后真的出招时对方已不设防。

          · 基层治理中：先在别处反复制造"焦点假象"，让各方的警觉被磨钝，再回到真问题趁虚切入。

          其结构为：

          第一步：以假换真——用假信号（草人）骗得真利（箭），"无"中得"有"。

          第二步：反复磨钝——再放假信号（草人），让对方嘲笑、不再防备，警觉被磨钝。

          第三步：以真破局——最后放真动作（敢死队），对方以为是假的、不加防备，被突袭。
      - k: "预期"
        v: |
          可核验目标：箭矢得到补充，且最终用"真人突袭"重创敌军。

          防御目标：即便对方识破草人，守城方也没损失（草人是假目标，成本极低）。

          核心问题解决：把"箭矢耗尽、正面无法补充"的绝境，转化为"用对方的箭补自己的箭，再用对方的松懈突袭对方"。
      - k: "修正"
        v: |
          · 若对方第一次射箭后就不再上当（直接识破草人），"反复"失效——换成别的假信号，或果断放弃突袭、另寻他路。

          · 若对方始终高度戒备、每次都当真（不脱敏），"真人突袭"的时机未到——不能硬突，继续等对方松懈。

          · 修正回路：始终回到"假信号的反复是为了磨钝对方、为真动作铺路"——无中生有不是"骗一次"，是"用反复把假变成真的跳板"。
    source_note: |
      · 计名与原文：出自《三十六计》原文"诳也，非诳也，实其所诳也。少阴、太阴、太阳。"

      · 历史案例：张巡守睢阳、草人借箭事，见《资治通鉴·唐纪》。

      · "少阴、太阴、太阳"为《易经》阴阳消长之象。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是"一次骗过"，是"反复养成"——它不追求一次性骗过对方，而是用反复的假信号，把对方的警觉一点一点磨掉，等对方麻木了，真的动作再乘虚而入。

      与治水学的接口：这一计对应的是"响应钝化"——不是没时间响应，也不是方向错了，而是反复的假信号把对方的警觉磨钝了，真威胁来临时已经麻木。它和"响应缺口"（B-0005，来不及响应）、"响应错位"（B-0006，方向错了）构成"响应"失效的三种形态。

      适用边界：适用于对方有"可被反复假信号磨钝"的固定响应模式（如夜里本能放箭）、且真假目标在感知上难辨的场景；不适用于对方每次都能识破真假、或响应弹性极强（不脱敏）的场景。
  - id: "B-0008"
    num: "B-0008"
    title: "暗渡陈仓"
    card_title: "B-0008｜暗渡陈仓"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-03"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/feTzy"
    interface: "响应锁定（被钉在假方向）"
    lever: "铺明线"
    concepts: ["响应缺口"]
    keywords: ["暗渡陈仓", "响应缺口", "决策显影库", "宁凯峰"]
    abstract: "面对正面栈道断绝、对方重兵把守的困境，决策者不硬修栈道、不坐守，而是用明修栈道把对方的注意力锁死，再从偏僻的陈仓道暗渡突袭，适用于对方有明确的、可被锁定的关注点、且存在对方忽视的暗路的场景。与声东击西的区别是：声东击西是调动对方移动，暗渡陈仓是锁定对方不动。"
    elements:
      - k: "情境"
        v: |
          这是一场攻守博弈，边界画在"刘邦—章邯"之间。刘邦的目标不是正面突破栈道，而是东出关中、夺回三秦之地。

          刘邦被项羽封到汉中，实力远弱于项羽；入汉中时栈道已被烧毁——是刘邦自己烧的，为的是向项羽示弱、表明"无意东归"。但章邯等三秦守将仍重兵把守关中，死死盯着栈道方向。

          现状约束：栈道被烧，正面通道断绝，短时间内无法修复；章邯的防守注意力高度集中在"栈道"这一个点上；但从汉中到关中，除了栈道，还有一条偏僻的故道（陈仓道），少有人知。
      - k: "信号"
        v: |
          · 栈道被烧——正面通道断绝，但这恰恰是刘邦自己制造的"示弱"信号，麻痹了项羽和章邯。

          · 章邯重兵把守栈道方向——他的注意力牢牢锁定在"刘邦会从栈道东出"这个判断上。

          · 陈仓道偏僻、少有人知——这是一条被双方都忽视的暗路。
      - k: "排除"
        v: |
          · 排除正面修栈道硬攻——修栈道耗时漫长，等修好，章邯早就在栈道出口重兵以待。

          · 排除坐守汉中——刘邦志在东进争天下，坐守汉中等于放弃。

          · 排除只走陈仓道、不做明面动作——如果没有"明修栈道"做掩护，章邯的注意力会分散在各个方向，陈仓道反而容易被发现。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。其结构为：

          第一步：明线造势——命樊哙、周勃等大张旗鼓修复栈道，制造"刘邦要从栈道出兵"的假象，把章邯的注意力牢牢锁死在栈道方向。

          第二步：暗线潜行——韩信亲率主力，从偏僻的陈仓道暗中进军，避开章邯的防备。

          第三步：暗线破局——章邯还在盯着栈道，韩信已从陈仓杀出，三秦守将猝不及防，关中迅速平定。
      - k: "预期"
        v: |
          可核验目标：章邯的兵力被锁在栈道方向，陈仓方向空虚，韩信从陈仓突袭成功、夺回关中。

          防御目标：即便章邯识破"明修栈道"是假，韩信主力已从陈仓出发，箭在弦上、势难回头。

          核心问题解决：把"正面栈道断绝、章邯重兵把守"的困境，转化为"用明修栈道锁住对方、从陈仓暗渡"的破局。
      - k: "修正"
        v: |
          · 若章邯识破"明修栈道"是假、转而防备陈仓，暗渡就落空——须另选暗路，或果断放弃突袭。

          · 若明线声势不够、锁不住章邯的注意力，他的防守会分散，陈仓道容易被发现——须加大明线的声势。

          · 修正回路：始终回到"明线锁人、暗线穿透"的逻辑——明修栈道是为了锁住对方，暗渡陈仓才是真意图。
    source_note: |
      · 计名与原文：出自《三十六计》原文"示之以动，利其静而有主，益动而巽。"

      · 历史案例：韩信"明修栈道、暗渡陈仓"事，见《史记·淮阴侯列传》。

      · "益动而巽"为《易经·益卦》之象（益卦上巽下震，动而顺）。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是"藏"，是"分流"——明面一条线（修栈道）把对方的注意力锁住，暗面一条线（渡陈仓）趁机穿透。

      与治水学的接口：这一计对应的是"响应锁定"——明信号（修栈道）把对方的响应牢牢钉在假方向上，暗信号（渡陈仓）因此得以穿过。它和"响应缺口"（B-0005，来不及）、"响应错位"（B-0006，方向错）、"响应钝化"（B-0007，麻木）构成"响应失效"的四态。

      与声东击西的区分：这一计和声东击西（B-0006）同属"明暗分离"结构，但操作目标不同——声东击西的明线用于调动对方（让对方移动），暗渡陈仓的明线用于锁定对方（让对方不动）。一个是引开，一个是钉住。

      适用边界：适用于对方有明确的、可被锁定的关注点（如栈道），且存在一条对方忽视的暗路（如陈仓道）的场景；不适用于对方无固定关注点（注意力分散、无法锁定）、或暗路不存在／已被对方识破的场景。
  - id: "B-0009"
    num: "B-0009"
    title: "隔岸观火"
    card_title: "B-0009｜隔岸观火"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-04"
    source: "《三国志·魏书·袁绍传》《后汉书·袁绍刘表列传》等"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/vnT9R"
    interface: "结构判断（系统边界）"
    lever: "划系统边界"
    concepts: ["结构判断"]
    keywords: ["隔岸观火", "结构判断", "决策显影库", "宁凯峰"]
    abstract: "袁绍死后二子相争，曹操按兵不动、坐观内斗。精妙不在不动手，而在划清系统边界——看准火在“袁家子系统”里烧、自己不在其内，才敢隔岸；等二袁自耗殆尽，逐个击破。"
    elements:
      - k: "情境"
        v: |
          袁绍死了。他一死，河北最大的势力瞬间裂成两半：长子袁谭、幼子袁尚各拥一派，为了继承权从暗斗变明斗。曹操刚在官渡击溃袁绍主力，本可继续北上，但他选择了收兵观望，放这两个“袁家小子”自己去打。
      - k: "信号"
        v: |
          · 袁谭、袁尚两派公开翻脸，兵戎相见。
          · 袁谭势弱，几次派人向曹操求救。
          · 谋士劝曹操趁机扫平河北，曹操只回一句：先让他们自己打。
      - k: "排除"
        v: |
          · 排除“立刻进攻”——曹操大军一到，袁谭袁尚会立刻放下内斗、联手抗曹，河北反而啃不动。
          · 排除“调停讲和”——没必要替敌人把裂缝补上。
          · 排除“扶一方压另一方”——会让其中一方坐大，反成后患。
      - k: "行动"
        v: |
          · 第一步：假意结盟（许婚），稳住袁谭，给二袁内斗留出空间。
          · 第二步：退回许都，隔岸看着二袁相争，一个都不真帮。
          · 第三步：等二袁打得两败俱伤，曹操先收拾袁谭，再收拾袁尚，河北到手。
      - k: "预期"
        v: |
          可核验目标：二袁的内斗会自己把袁家势力耗干，曹操坐收渔利。
          防御目标：即便二袁中途察觉，曹操也没有损耗一兵一卒。
          核心问题解决：把“啃下河北”的问题，转化为“等对方内部自行瓦解”的问题。
      - k: "修正"
        v: |
          · 实际走向：曹操一开始想速战速决，等看到二袁先打了起来，他才改了主意：这一家子会自己把自己耗干，不用他动手。
          · 修正回路：从“打”到“等”——关键是他看清了袁家内部正在自相残杀，及时调整了策略。
    source_note: |
      · 事见《三国志·魏书·袁绍传》《后汉书·袁绍刘表列传》。
      · 原文“阳乖序乱，阴以待逆。暴戾恣睢，其势自毙。顺以动豫，豫顺以动。”出自《三十六计·敌战计》。
      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“不动手”，是“边界判断”——曹操看清了“北方争霸”的大系统里，有一个“袁家继承权”的子系统正在自我塌陷，而他不在这个子系统里，火才烧不到他。判准了，“隔岸”是安全的观火；判错了，就是引火烧身。

      与治水学的接口：结构判断·系统边界——先看清火在哪个圈子里烧、我是不是圈外人。

      区别（大白话版）：趁火打劫是去抢正在燃烧的房子，以逸待劳是等对方自己跑累，隔岸观火是看着邻居家里起火，自己只管喝茶。

      适用边界：适用于对方内部存在不可调和的裂痕、且我方不属于该子系统、贸然介入反而会促成对方团结的场景；不适用于我方处于同一系统内、无法独善其身、或对方内部矛盾可被轻易平息的情况。
  - id: "C-0001"
    num: "C-0001"
    title: "OpenAI 解雇风波"
    card_title: "C-0001｜OpenAI 解雇风波"
    card_meta: "决策显影库 · C 企业管理 · 组织治理"
    category: "C 企业管理"
    scene: "组织治理"
    date: "2026-10-01"
    source: "《Why AI Governance Must Be Dynamic: Pattern Continuity as the Ontological Ground for Diagnostic Governance》（DOI: https://doi.org/10.2139/ssrn.7453298）＋ OpenAI 官方公告"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/52Mv1"
    interface: "祭祀（承重误判）"
    lever: "辨节点"
    concepts: ["祭祀"]
    keywords: ["OpenAI 解雇风波", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "2023 年 OpenAI 董事会以\"沟通破裂\"为由解雇 CEO Sam Altman，引发员工与投资者全体反弹、Altman 数日内复职。这篇判例显影这场失败决策：董事会以为在\"换一个高管\"，实际上在\"拔掉缝合点\"——动手前没问清 Altman 是\"可替换零件\"还是\"承重墙\"。适用：动关键人物前，先判断他是\"结构缝合点\"还是\"可替换部件\"。"
    elements:
      - k: "情境"
        v: |
          OpenAI 当时的情况，不是"谁和谁有矛盾"，而是一个组织系统快要撑不住了。

          技术跑得太快——GPT-4 发布，商业化提速；治理结构严重滞后——非营利架构追不上公司的扩张；使命愿景被拉扯——一边是"安全地造福人类"，一边是"必须赚钱活下去"。

          Sam Altman 就是唯一能缝合这三股力量的那个人。他既是使命的化身，又是技术和制度的接口。

          董事会觉得"沟通破裂"，想换掉他。
      - k: "信号"
        v: |
          董事会给出的解雇理由很直接："沟通破裂"。但真正在响警报的信号，其实是三条：

          · 技术跑得太快：GPT-4 发布、商业化提速，公司扩张的速度远超治理结构更新的速度。

          · 制度跟不上：非营利架构管不住一家快速商业化的公司，制度与业务的节奏越拉越大。

          · 愿景被拉扯："安全地造福人类"和"必须赚钱活下去"，两套叙事公开顶撞。

          把这些信号合起来看，问题根本不是"Altman 沟通不行"，而是"这个组织内部的三股力量已经严重脱节，需要一个出口"。
      - k: "排除"
        v: |
          · 排除"先改治理结构、再动 CEO"——董事会认定沟通破裂已不可调和，等不了结构改造。

          · 排除"只做表面修补"（加强汇报、透明度报告）——董事会觉得这些是杯水车薪。

          · （事后看，董事会真正漏掉的选项是：动手前先搞清楚——Altman 是可替换的零件，还是维系系统运转的承重墙？）
      - k: "行动"
        v: |
          董事会的动作只有一步：直接解雇 Altman。他们以为在换一个高管，实际上在拔掉一个缝合点。

          真正的问题是：动手之前，他们没问自己一句——他是可替换的零件，还是维系这个系统运转的承重墙？
      - k: "预期"
        v: |
          可核验目标：换掉 Altman 后，组织沟通恢复、治理秩序重建。

          防御目标：即便解雇引发反弹，组织也不至于散架。

          核心问题解决：把一个"系统级的结构问题"，错当成"换一个 CEO 的人事问题"来解决。
      - k: "修正"
        v: |
          实际：员工和投资者几乎全体反弹，Altman 几天内就复职了（11 月 21 日公告）——预期彻底落空。

          复盘：解雇只动了表面（换人），没碰真正的病灶（三股力量脱节），反而把唯一能缝合它们的那个人拔掉了，系统在重新站稳之前就崩了。

          正确的做法应该是：动手前先问清楚——这个人是不是缝合点？如果是，先找到新的缝合方式，再动他；找不到，就别动。问题在三股力量的脱节，不在某一个人。
    source_note: |
      · 事实与时间线以 OpenAI 官方公告为准（2023.11.17《Update on Sam Altman》；2023.11.21《Bringing clarity to the path ahead》）。

      · 分析框架出自《Why AI Governance Must Be Dynamic: Pattern Continuity as the Ontological Ground for Diagnostic Governance》（DOI: https://doi.org/10.2139/ssrn.7453298）。

      · 正文中的母本标准术语（如"三浪""疏浚／方舟／祭祀"）以《治水学论纲》为准，此处按通俗表达转写。
    recorder_note: |
      这一判例的本质是"换人不换结构"——董事会把一场结构性危机当成一个职位问题，以为换掉 CEO 就能恢复秩序，却没意识到危机在结构层、不在个人层。

      与治水学的接口："祭祀的承重误判"——本该先"疏浚"（治源头）、"方舟"（守底线），最后才"祭祀"（凝聚共识）；董事会跳过前两步直接换人，结果拆掉的是承重墙。

      适用边界：动一个关键人物或职位之前，先判断它是"结构缝合点"还是"可替换部件"；如果是缝合点，先重建绑定机制再动手。适用于一切"换人不换结构"的组织决策。
  - id: "C-0002"
    num: "C-0002"
    title: "DeepSeek 开源决策"
    card_title: "C-0002｜DeepSeek 开源决策"
    card_meta: "决策显影库 · C 企业管理 · 战略抉择"
    category: "C 企业管理"
    scene: "战略抉择"
    date: "2026-10-02"
    source: "梁文锋投资人会议实录（2026年）＋ 梁文锋早期访谈（2024年）＋ DeepSeek 官方公告"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/ZTdbF"
    interface: "疏浚（开源造河道）"
    lever: "放技术"
    concepts: ["疏浚"]
    keywords: ["DeepSeek 开源决策", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "DeepSeek 在算力受限、资本受限的条件下，选择把最强模型完全开源，而非跟随行业闭源惯例。核心判断是：闭源护城河短暂，开源能建立生态引力；只赚\"六倍利润\"、不追求最大化，开源与商业可持续不冲突。结果 R1 成为全球最受欢迎开源模型，公司首轮融资估值约 520 亿美元。"
    elements:
      - k: "情境"
        v: |
          DeepSeek 是一家中国 AI 大模型公司，2023 年成立，创始人梁文锋。公司成立之初就立下一条铁律：不接受外部融资、不稀释股权、不被商业化时间表绑架。这在 AI 行业极为罕见——同行普遍靠融资烧钱抢市场。

          2023–2025 年，全球 AI 行业处于"闭源霸权"阶段。OpenAI、Anthropic、谷歌等头部公司全部闭源，把最强模型锁在付费 API 背后——技术不公开，外部开发者无法部署，定价权完全握在公司手里。

          2025 年初，DeepSeek 发布 R1 模型，性能比肩 OpenAI 的 GPT-4o，训练成本却大幅降低。此时 DeepSeek 站在一个岔路口：是跟随行业惯例，把最强模型闭源、走高价 API 路线？还是走一条前所未有的路——把最强模型完全开源？

          现状约束：算力资源受美国芯片出口管制限制，无法像美国公司那样大规模采购高端算力；开源意味着放弃定价权，第三方可以独立部署、用更低成本提供同类服务；但不开源，又很难在闭源赛道与 OpenAI 正面竞争。
      - k: "信号"
        v: |
          · 闭源路线的天花板已经露头：OpenAI 们靠闭源锁住定价权，但"AI 黑盒"引来越来越大的质疑。DeepSeek 内部一位研究员的判断是：不希望世界变成"少数巨头控制大部分资源、大多数人只能用上孱弱技术"的模样。

          · 开源是最高效的生态扩张路径：省去交易环节和交易成本，各行各业可以直接接入，不用和 AI 公司一家一家谈合作。

          · 闭源的技术护城河是暂时的：梁文锋判断，"在颠覆性技术面前，闭源形成的护城河是短暂的"——模型真正的壁垒不在代码是否公开，而在团队能否持续创新。

          · AI 市场足够大，不可能独占：梁文锋认为，AI 可能占到人类 GDP 的 10%，任何企业试图独占利益都会遭遇阻力——"如果你的愿景是拿走 5% 的利益，你一定会被一个愿意只拿 1% 的挑战者击败"。

          · 算力受限倒逼"以软补硬"：芯片管制迫使 DeepSeek 必须在软件和算法上创新，而不是堆硬件。开源能调动全球开发者一起优化，加速技术迭代。
      - k: "排除"
        v: |
          · 排除闭源路线。梁文锋明确说："我看不到闭源有什么必然的好处。"闭源保护的只是短期定价权，却会拖慢生态扩张和技术迭代。

          · 排除利润最大化。API 定价锚定为"十个月收回硬件成本"（约 6 倍利润），而非按市场需求弹性定价。梁文锋说："想赚一百倍利润，开源确实有影响；但我们只赚六倍，开源对商业模式没有任何影响。"

          · 排除靠融资烧钱抢市场。"三不"铁律决定了 DeepSeek 不能走"烧钱换规模"，必须找到一条不需要巨额资本投入就能扩张的路。

          · 排除跟风做视频生成、世界模型等"好生意"。梁文锋说："这些跟智能的上限没关系，我们不做。"拒绝为商业机会分散对 AGI 主线的投入。
      - k: "行动"
        v: |
          DeepSeek 选了开源路线，具体动作：

          第一步：每一代核心模型（V2、V3、R1 等）在 MIT 许可协议下完全开源，代码、文档、权重全部公开，无功能阉割。

          第二步：对外开源的版本与内部部署版本完全相同，绝不私下保留更强模型。

          第三步：API 定价锚定"十个月收回硬件成本"（约 6 倍利润），不追求利润最大化。

          第四步：组织上不设 KPI，自上而下交办的工作不超过员工总工时的一半，另一半留给自主探索。

          第五步：开源不止于模型本身——DeepSeek 后续开源了面向 AI 芯片的 TileLang 编程语言和通信库，目标是为更多芯片建立高可用软件生态。
      - k: "预期"
        v: |
          可核验目标：通过开源快速建立开发者生态，让 DeepSeek 模型成为行业事实标准，同时以低定价、低成本维持可持续运营。

          防御目标：即便开源让第三方能以更低价格部署，DeepSeek 仍保有成本优势和工程能力壁垒——"模型开源、原理全公开，别人要用起来的门槛依然非常高"。

          核心问题解决：在算力受限、资本受限的条件下，找到一条不需要烧钱、不需要独占市场、却能持续积累技术优势的存续路径。
      - k: "修正"
        v: |
          实际走向：R1 开源后迅速成为 HuggingFace 史上最受欢迎的开源模型（下载量破千万）。但外部环境变了——2026 年算力成本指数级上升，单靠母公司幻方量化的利润已经撑不住万卡集群的烧钱速度。于是"不融资"这条配套铁律在竞争压力下松动了：2026 年 6 月，DeepSeek 完成首轮外部融资，投后估值约 520 亿美元。

          修正回路：主决策"开源"始终没变，变的只是"是否接受外部资本"这条配套策略。梁文锋的判断标准不是"哪个赚更多钱"，而是"哪个更有利于做成 AGI"。

          风险对冲：开源后模型谁都能下载，但梁文锋的逻辑是——把成本做到同样低，需要极强的工程管理和算力调度能力，这不是每家公司都做得到。护城河不在模型本身，在团队和工程能力。
    source_note: |
      · 梁文锋投资人会议实录（2026年5月，2026年7月流出），含"闭源无必然好处""十个月回本""六倍利润"等原话。

      · 梁文锋早期访谈（2024年），含"在颠覆性技术面前，闭源形成的护城河是短暂的"。

      · DeepSeek 官方公告（2026年9月），开源昇腾版 TileLang 编程语言。

      · R1 开源后成为 HuggingFace 史上最受欢迎模型，见公开报道。

      · 具体数据与时间以官方发布为准。

      · 本判例引用梁文锋原话作为素材。对决策结构的显影（疏浚操作、六倍利润克制、不争最大块）是本判例的分析框架，非当事人自述。
    recorder_note: |
      这一决策的本质是"以退为进"——放弃利润最大化，换生态扩张速度；放弃技术封锁，换行业事实标准。

      需要说明的是：本判例显影的结构，是显影者基于公开信息所做的判断，不一定是当事人当时的自我认知。梁文锋公开表述的"看不到闭源好处""只赚六倍"，是本判例的素材，不是本判例的结论。

      与治水学的接口：这是一次"疏浚"操作（开源造河道）——闭源是"堵"，把技术锁在自己手里、让别人绕道走；开源是"疏"，把技术放出去，让整个生态的水流都从自己的河道里过。"六倍利润克制战略"对应的正是治水学逻辑：不争最大的那块，而是让所有人都从你这里过。

      适用边界：适用于（1）自身资源不足以支撑正面竞争；（2）行业存在明显生态扩张机会；（3）具备别人难以复制的工程能力，技术开源后执行成本仍构成壁垒。不适用于（1）核心竞争力完全依赖技术保密；（2）开源后无法靠工程能力或生态位维持优势；（3）行业本身无网络效应，开源带不来生态引力。
  - id: "B-0010"
    num: "B-0010"
    title: "笑里藏刀"
    card_title: "B-0010｜笑里藏刀"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-05"
    source: "《韩非子·说难》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/XT7XL"
    interface: "祭祀（共识凝聚）"
    lever: "制造亲善共识"
    concepts: ["祭祀"]
    keywords: ["笑里藏刀", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "郑武公欲伐胡，不硬攻，先嫁女结亲、再当众诛杀主张伐胡的大夫关其思，让胡君认定郑国把自己当亲兄弟、从此不备，最后袭胡灭之。精妙在用两个“善意证据”主动制造“亲善”共识、解除对方戒备，而非隐藏敌意；与瞒天过海（利用已有惯性）相对，这是祭祀（共识凝聚）的正向运用。"
    elements:
      - k: "情境"
        v: |
          这是一场两方博弈，边界画在“郑国—胡国”之间。郑武公决意吞并邻近的胡国，但胡君对郑国一直有戒备——两家国土相接，稍见异动，胡君就会整军备战。

          这道戒备有个软肋：胡君判断郑国是敌是友，只看一件事——郑国对我好不好。郑武公要做的，就是让“对我好”这三个字，在胡君心里坐实。
      - k: "信号"
        v: |
          · 胡君判断郑国是敌是友，不看实力、不看利害，只看“郑国对我好不好”。
          · 郑武公摸清了他的软肋：他信“亲”不信“势”——结亲、让利、表忠心，在他眼里就是“自己人”的铁证。
          · 这道软肋就是郑武公唯一能下刀的地方——要吞胡，先让胡君把郑国当兄弟。
      - k: "排除"
        v: |
          · 排除“直接翻脸开战”——胡君正防着郑国，翻脸只会让他更戒备，把“对方愿意信你”这条路彻底堵死。
          · 排除“明着备战、亮出伐胡意图”——意图一露，胡君立刻整军，“以亲诱之”的机会就没了。
          · 排除“只联姻、不再表态”——单凭嫁女，胡君仍半信半疑；必须再补一个“当众证明”的动作，才能让他彻底放下戒心。
      - k: "行动"
        v: |
          · 第一步：联姻示好——把女儿嫁给胡君，坐实“亲家”名分，先让对方觉得郑国无害。
          · 第二步：杀“说真话的人”——武公故意问群臣“可以打谁”，大夫关其思说“胡可伐”，武公大怒当众杀了他，说：“胡是兄弟之国，谁让你说打它的？”
          · 第三步：坐等卸防——胡君听说后，认定郑国把自己当亲兄弟，从此不再防备郑国。
          · 第四步：备而后动——等对方彻底松懈，郑人突然袭胡，一举灭之。
      - k: "预期"
        v: |
          可核验目标：胡君不再防备郑国，郑国一举袭取胡国。
          防御目标：即便胡君仍有疑心，郑武公杀掉的只是一个“主战”的大夫，郑国自己毫发无伤，随时可退回去再图。
          核心问题解决：把“啃下胡国”的问题，转化为“让胡君自己卸下戒备”的问题。
      - k: "修正"
        v: |
          · 专属失败模式：如果“笑”过了头——善意演得太用力，胡君反而会起疑：“连劝你打我的人你都杀，此人心太狠，不可交。”刀就露了。
          · 扳回：对方一旦起疑，不能继续加码示好（越解释越假），只能果断收手、另寻由头，等疑心自然消散，或另择他路。
          · 修正回路：始终回到“让对方相信我是你的自己人”这个支点——笑里藏刀的命门不在刀（兵力），在笑（信任）能不能撑住。
    source_note: |
      · 计名与原文：出自《三十六计·敌战计》“信而安之，阴以图之；备而后动，勿使有变。刚中柔外也。”
      · 历史案例：郑武公伐胡，见《韩非子·说难》，后世兵家多以之为“笑里藏刀”的典范。
      · 此典为韩非说理之引例，其史事以《韩非子》传世文本为准。
      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“假装友善”，是“经营对方的共识”——它不靠隐藏，而靠主动把对方拉进“我们是自己人”的共识里，让对方自己解除戒备。

      与治水学的接口：祭祀（共识凝聚）——不是让你看不见，而是主动把你拉进“我们是一家人”的共识，让你自己卸下防备。

      区别：瞒天过海是藏在你“看惯了的日常”里（利用你已有的惯性），笑里藏刀是藏在你“信以为真的情分”里（制造新的信任）。

      适用边界：适用于对方“以亲疏定敌友”、且己方拿得出“善意证据”（联姻、让利、表忠心）的场景；不适用于对方“只认实力、不吃感情”、或己方善意被一眼看穿的情形。

  - id: "B-0011"
    num: "B-0011"
    title: "李代桃僵"
    card_title: "B-0011｜李代桃僵"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-06"
    source: "《史记·项羽本纪》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/MjLv1"
    interface: "疏浚（损失重定向）"
    lever: "改损失落点"
    concepts: ["疏浚"]
    keywords: ["李代桃僵", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "刘邦被困荥阳、粮尽，损失已不可避免。部将纪信主动假扮刘邦、乘黄屋车从东门“降”，把楚军注意力全部吸走，刘邦率数十骑从西门脱身，纪信被项羽烧死。精妙在损失落点的重定向——把必然的损失精准砸在可替代的替身（阴）上、保全不可替代的核心（阳）。与围魏救赵（疏浚·压力向）、借刀杀人（疏浚·出力向）同属疏浚三向，此为损失向。"
    elements:
      - k: "情境"
        v: |
          这是一场绝境博弈，边界画在“刘邦—项羽”之间。刘邦被困荥阳，城中粮尽，项羽四面围城。损失已经锁死：荥阳必失，刘邦若不脱身，必被项羽擒获。

          这一局的特殊在于——问题不再是“怎么避免损失”，而是“损失落在谁身上”。刘邦阵营里，人分两种：一种是走了就散、散了就亡的“根本”（刘邦本人，汉阵营的旗帜）；一种是可替换、可牺牲的“枝干”（部将、士卒）。要破局，就得让损失精准地砸在“枝干”上，把“根本”换出去。
      - k: "信号"
        v: |
          · 损失已不可避免——粮尽、被围、外援不至，“势必有损”的信号齐了。
          · 阵营里“根本”与“枝干”界限清晰——刘邦是唯一不可替代的旗帜，纪信等部将可替换。
          · 有人愿意相代——纪信主动请缨：“形势危急，让我假扮大王去诓楚军，您趁机走。”
      - k: "排除"
        v: |
          · 排除“全军一起突围”——目标太大，项羽全力围追，谁也走不脱；更要命的是，一起走等于没有替身，损失会直接砸在核心（刘邦）头上。
          · 排除“死守待援”——粮已尽、援不至，死守等于把损失拖到“核心被擒”，落点恰恰是最不能承受的那一个。
          · 排除“真投降”——投降是“全损”，核心连同事业一起交给项羽，违背“损阴以益阳”。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。其结构为：

          · 第一步：排序——先把“谁可牺牲、谁必须保全”排死：刘邦（阳）必须出城，纪信（阴）顶上去。
          · 第二步：替身坐实——纪信假扮刘邦，乘天子所乘的黄屋车、打出全套天子仪仗，让“我是汉王”在楚军眼里坐实。
          · 第三步：造受降假象——从东门放出二千身披铠甲的女子，纪信高喊“城中食尽，汉王降”，把楚军注意力全部吸到东门。
          · 第四步：核心脱身——刘邦率数十骑从西门悄出，逃往成皋。
      - k: "预期"
        v: |
          可核验目标：楚军信以为真、纷纷涌向受降处，刘邦从西门脱身。
          防御目标：即便被识破，烧死的是替身纪信，核心刘邦已趁乱走远。
          核心问题解决：把“荥阳必失、刘邦必被擒”的死局，转化为“损阴（替身纪信）以益阳（核心刘邦脱身）”。
      - k: "修正"
        v: |
          · 专属失败模式：替身不够像——仪仗、气度露出破绽，项羽不起疑、不亲自来验，或只派偏师“受降”、主力仍围城，刘邦就来不及走远。
          · 扳回：替身的作用本不在“活下来”，而在“把损失吃下、把时间拖够”——纪信面对项羽的追问只回一句“汉王已经出城”，把拖延用到了最后一刻；只要核心已走远，损失就锁死在阴（替身）上，不再波及阳（核心）。
          · 修正回路：始终回到“损失落点”这一支点——李代桃僵的命门不在替身能不能骗过，而在损失有没有精准砸在替身身上、核心有没有趁隙走远。
    source_note: |
      · 计名与原文：出自《三十六计》“势必有损，损阴以益阳。”
      · 典故出处：“李代桃僵”语出《乐府诗集·鸡鸣》：“桃生露井上，李树生桃旁。虫来啮桃根，李树代桃僵。树木身相代，兄弟还相忘！”本讽兄弟不能互助，后转为“以此代彼、代人受过”。
      · 历史案例：纪信代刘邦（荥阳之战），见《史记·项羽本纪》，亦见《史记·高祖本纪》。
      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“牺牲”，是“损失落点重定向”——损失已经不可避免，主动决定让它落在“可替代的替身”上，保全“不可替代的核心”。

      与治水学的接口：疏浚·损失重定向（损失向）——把必然的损失（洪水）改道浇到替身（洼地）上，保全主体（高地）。它与围魏救赵、借刀杀人同属“疏浚”的变体；其中有一个内外之别——围魏救赵改的是外部压力的流向，李代桃僵改的是内部损失的落点。

      一个值得注意的点：纪信是“主动请缨”，恰好呼应典故原意“树木身相代”——李树是主动代桃死的。所以李代桃僵的“阴”，往往不是被动丢弃的卒子，而是系统里愿意相代的“自己人”；这也把它和“金蝉脱壳”（自己脱身、不留替身）区分开。

      适用边界：适用于“势必有损”（损失不可避免）、且“阴”“阳”清晰可分（有可替代的替身、有不可替代的核心）的场景；不适用于没有可牺牲的替身（阴阳不可分、核心本身也可替换），或损失可以完全避免（无须李代桃僵）的情形。

  - id: "B-0012"
    num: "B-0012"
    title: "顺手牵羊"
    card_title: "B-0012｜顺手牵羊"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-10-07"
    source: "《晋书·苻坚载记》"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/Y71hd"
    interface: "响应微隙（趁小疏忽顺手取利）"
    lever: "乘微隙"
    concepts: ["响应缺口"]
    keywords: ["顺手牵羊", "响应微隙", "决策显影库", "宁凯峰"]
    abstract: "前秦苻坚号称百万大军压境，东晋谢玄仅八万兵隔淝水对峙。谢玄不正面决战，先看准微隙（苻坚骄狂、秦军厌战、大军一动就乱），再派人激苻坚“暂退一箭之地”，百万大军一退即乱，晋军乘乱追击、顺手收割辎重，把“挡住秦军”的主目标放大成“击溃秦军”。精妙在“顺手”——捕捉对方移动中露出的微隙，顺手取利，不因小失大；与趁火打劫（趁大乱取大利）相对，这是抓微隙、取微利的微缺口变体。"
    elements:
      - k: "情境"
        v: |
          这是一场悬殊的攻防，边界画在“东晋—前秦”之间。苻坚号称百万大军压境，东晋谢玄只有八万北府兵，两军隔着淝水对峙。

          这一局的特殊在于——微隙不在兵力对比上，在“百万”这两个字背后。苻坚的大军是强征来的各族杂牌，士气涣散、指挥笨重，苻坚本人又骄狂到喊出“投鞭断流”。体量越大，动起来露出的缝隙越多。谢玄要做的，不是正面去啃这个庞然大物，而是等它自己动起来、把缝隙露出来，再顺手取利。
      - k: "信号"
        v: |
          · 微隙一：苻坚“投鞭断流”的骄狂——轻敌、急于决战，这是对方心理上的小疏忽。
          · 微隙二：秦军是强征的各族士兵，厌战、士气体质脆弱，这是对方组织上的小裂缝。
          · 微隙三：百万大军指挥笨重，“一动就乱”，这是大部队固有的缝隙——“大军动处，其隙甚多”。
      - k: "排除"
        v: |
          · 排除“正面渡河决战”——八万对百万，正面打，微隙根本不会出现；顺手牵羊的缝隙只来自“让对方自己动”，不来自“我方硬攻”。
          · 排除“死守对峙、等援军”——晋军粮少，拖下去，对方还没齐集的后续部队会陆续赶到，微隙（大军未齐、指挥未稳）会慢慢合上，变成铁桶。
          · 排除“为取利而冒险”——顺手牵羊的纪律是“不因小失大”：若诱敌之举有暴露主力、反伤主目标的风险，宁可不动，不能为了“牵羊”丢掉“保江东”。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。其结构为：

          · 第一步：看隙——先看准微隙在哪：不在兵力，在“苻坚骄狂 + 秦军厌战 + 大军一动就乱”这三处。
          · 第二步：诱隙——谢玄派人给苻坚传话：“你若有胆，就暂退一箭之地，让我渡河决战。”把苻坚“骄狂、急于求成”的微隙主动勾出来。
          · 第三步：等隙放大——苻坚果然下令“暂退”，百万大军一退，指挥失灵、阵脚大乱，微隙瞬间放大成“溃乱”。
          · 第四步：顺手取利——谢玄抓住“秦军一退即乱”这个露出来的缝隙，乘势渡河追击；追击途中顺手收割秦军遗弃的辎重粮草，把“挡住秦军”的主目标，顺手放大成“击溃秦军”的战果。
      - k: "预期"
        v: |
          可核验目标：秦军一退即乱，晋军乘乱渡河追击，击溃秦军主力。
          防御目标：即便苻坚不上当、不肯退，谢玄也毫发无损——激将只是“顺手试试”，主力未动，随时退回对峙。
          核心问题解决：把“八万挡不住百万”的死局，转化为“等对方自己动起来、露出微隙，顺手取利”。
      - k: "修正"
        v: |
          · 专属失败模式：微隙判断错了——若苻坚指挥得力、秦军“暂退”后并不乱，谢玄渡河反而半渡被击，顺手牵羊就变成自投罗网。
          · 扳回：微隙一露，必须立刻取利，不能犹豫（“见利不失，遇时不疑”）；一旦发现“这缝隙是陷阱不是机会”，果断收手退回对峙，不贪。
          · 修正回路：始终回到“微隙是否真实、取利是否顺手”——顺手牵羊的命门不在“羊”（利）有多大，在“顺手”二字：取利不能耽误主目标，更不能因小失大。
    source_note: |
      · 计名与原文：出自《三十六计》“微隙在所必乘，微利在所必得。少阴，少阳。”按语：“大军动处，其隙甚多，乘间取利，不必以胜。胜固可用，败亦可用。”
      · 典故出处：“顺手牵羊”本义即顺手把别人的羊牵走，比喻趁机取利、伺隙捣虚。
      · 历史案例：淝水之战（公元 383 年，东晋谢玄大破前秦苻坚），见《晋书·苻坚载记》，亦见《资治通鉴·晋纪》。
      · “投鞭断流”“风声鹤唳”“草木皆兵”均出自此战。
      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“去抢”，是“顺手”——在既有的主行动里，捕捉对方移动/决策中露出的“微隙”（小疏忽），顺手把“微利”收下，且绝不因小失大。

      与治水学的接口：响应微隙（趁小疏忽顺手取利）——趁对方响应出现微小疏忽，顺手取利。它与“响应缺口”（B-0005 趁火打劫，对方响应崩溃、大决口）同属“响应失效”家族，但这一计抓的是“微缺口”，不是“大决口”：趁火打劫是趁对方堤坝决口，顺手牵羊是趁对方堤坝渗漏。

      一个值得注意的点：淝水之战里，谢玄抓的是“微隙”（苻坚的骄狂、秦军的厌战），但微隙一旦被抓住、放大，取的利远超“微利”的常规范围——这恰恰是“顺手牵羊”的威力所在：命门不在“羊”的初始大小，而在“微隙→大乱”的放大效应。

      适用边界：适用于“大军动处/大动作中必然露出微隙”、且取微利不影响主目标的场景；不适用于对方严整无缝（无微隙可乘）、或取利会因小失大（干扰主目标）的情形。
