cases:
  - id: "A-0001"
    num: "A-0001"
    title: "业委会秘书“八个严禁”制度边界"
    card_title: "A-0001｜业委会秘书“八个严禁”制度边界"
    card_meta: "决策显影库 · A 基层治理 · 制度边界"
    category: "A 基层治理"
    scene: "制度边界"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/Pg8Od"
    interface: "方舟（底线守护）"
    lever: "划底线"
    concepts: ["方舟"]
    keywords: ["业委会秘书“八个严禁”制度边界", "方舟", "决策显影库", "宁凯峰"]
    abstract: "面对业委会秘书角色法规依据不足、职责泛化、利益冲突风险显现的困局，制度设计者不追求一步到位立法，而是以负面清单形式划出八条不可触碰的行为底线，用“方舟操作”先守住资金、信息、决策权等核心功能，为后续规范管理提供基础性制度支撑。"
    elements:
      - k: "情境"
        v: |
          某区推进业委会规范化建设，引入业委会秘书制度试点。秘书作为非业委会委员的专职工作人员，需要承担日常事务协调、档案管理、会议记录、与物业对接等工作。由于秘书并非法规明确设定的法定角色，其职责边界缺乏统一规范，街道层面在推行试点时需要一份可供秘书参照执行的行为底线文件。

          制度设计者接手时，面对的局面是：试点推进中基层反馈秘书角色“什么都做”，存在职责泛化倾向；部分秘书由物业人员或居委干部兼任，角色混同容易产生利益冲突；秘书经手事项包括公章、账目、业主信息、合同档案等敏感事务；上级对业委会规范化提出明确要求，基层需要具体化、可操作的落地文本。

          权变点：制度供给的方式是“先立法定义角色”还是“先划底线控制风险”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 试点推进中，基层反馈秘书角色“什么都做”，存在职责泛化倾向。

          · 部分秘书由物业人员或居委干部兼任，角色混同容易产生利益冲突。

          · 秘书经手事项包括公章、账目、业主信息、合同档案等敏感事务，需要明确禁止性规定。

          · 上级对业委会规范化提出明确要求，基层需要具体化、可操作的落地文本。
      - k: "排除"
        v: |
          · 排除采用笼统的“职业道德规范”式表述——过于宽泛，秘书无法对照执行。

          · 排除只规定“秘书不得做什么”而不规定“秘书应该做什么”——单有禁止条款会让秘书不知道日常该干什么，反而僵化。

          · 排除把“八个严禁”写成对秘书个人的处分依据——定位是行为底线和工作指引，不是惩戒清单。
      - k: "行动"
        v: |
          起草并发布业委会秘书“八个严禁”清单，以负面清单形式明确秘书不可触碰的行为边界：

          第一条：严禁泄露业主个人信息和小区内部信息。

          第二条：严禁利用职务之便谋取私利或接受利益输送。

          第三条：严禁挪用、侵占业主共有资金或公共收益。

          第四条：严禁违规使用、保管、出借公章及证照。

          第五条：严禁违规签订合同、协议或擅自作出重大事项决定。

          第六条：严禁违规干预业委会决策或代替业委会行使表决权。

          第七条：严禁弄虚作假，伪造、变造会议记录或台账资料。

          第八条：严禁超越授权范围对外代表业委会作出承诺或发布信息。

          清单通过正式文件形式印发，并配套纳入秘书培训内容，要求秘书对照执行。
      - k: "预期"
        v: |
          可核验目标：秘书在履职时有一条清晰的行为底线，知道哪些事绝对不能做。

          防御目标：街道在指导、监督时有一个明确的判断依据；减少因角色边界模糊带来的投诉、纠纷和权力滥用风险。

          核心问题解决：为后续秘书绩效考核和规范管理提供基础性制度支撑。
      - k: "修正"
        v: |
          · 如果后续试点中出现清单未覆盖的新风险点，按年度评估后增补或修订。

          · 如果市级层面出台统一的秘书职责规范，“八个严禁”将自动对齐上级文件要求。

          · 如果个别条款在基层实践中被证明执行困难或不符合实际，允许在听取一线反馈后调整措辞和范围。

          · 修正回路：始终回到“用底线思维控制风险”的逻辑，不因上级文件出台而放弃清单，也不因执行困难而放松底线。
    effect: |-
      秘书在履职时有一条清晰的行为底线，知道哪些事绝对不能做
    reusable_condition: |-
      新角色、新制度处于试点阶段、法规依据不足、但风险已经显现的场景
    non_applicable: |-
      角色职责已有明确法规依据、或风险尚未显现、可以从容立法的场景
    source_note: |
      · 基于公开报道整理，原始信息见相关区业委会秘书制度试点报道及《业委会秘书工作指引》公开文本。

      · 具体条款内容以街道正式发文为准。本判例仅记录其判断结构，不替代官方文件。
    recorder_note: |
      “八个严禁”的价值不在条款本身，而在于它用“负面清单”这种形式，在秘书角色尚无明确法规依据的情况下，快速划出了一条可执行的行为底线。

      这是一种典型的“制度供给”动作：不追求一步到位立法，先用禁止性规则把风险关进笼子。

      与治水学的接口：这一判断对应的是“方舟操作”——在角色边界模糊、法规依据不足的条件下，不追求定义完整的角色内涵，而是先划定不可逾越的底线，保护系统核心功能（资金安全、信息安全、决策权完整）不被不可逆破坏。这是“底线守护”的典型运用：先守住不能失去的东西，再谈发展。

      适用边界：此结构适用于新角色、新制度处于试点阶段、法规依据不足、但风险已经显现的场景；不适用于角色职责已有明确法规依据、或风险尚未显现、可以从容立法的场景。负面清单是过渡性制度工具，不能替代完整的角色定义。
  - id: "A-0002"
    num: "A-0002"
    title: "鲸鱼大楼酬金制账目困局"
    card_title: "A-0002｜鲸鱼大楼酬金制账目困局"
    card_meta: "决策显影库 · A 基层治理 · 账目与资金"
    category: "A 基层治理"
    scene: "账目与资金"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/PPgYK"
    interface: "疏浚（源头改造）"
    lever: "开信息"
    concepts: ["疏浚"]
    keywords: ["鲸鱼大楼酬金制账目困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对酬金制小区物业不公开账目、业主拒缴物业费的恶性循环，业委会秘书不直接对抗物业，而是通过强制分项公开、组建业主志愿者核查小组、建立共管账户，把道德质问转化为技术核对，以公开促信任，重建缴费意愿。"
    elements:
      - k: "情境"
        v: |
          鲸鱼大楼为售后公房小区，物业管理采用酬金制模式：业主缴纳物业费，物业公司按约定比例提取酬金，其余资金用于小区日常维护。酬金制对账目透明度要求极高，但长期以来物业公司不公开明细，业主对钱花在哪充满质疑，导致物业费收缴率持续下降，形成恶性循环。

          业委会秘书施先生接手后，面对的局面是：物业公司以“资金不足”为由减少保洁频次，服务质量继续下滑；业主以“账目不清”为由拒缴物业费，收缴率不足70%；双方互相指责，矛盾螺旋上升。

          施先生必须在“不更换物业、不放弃酬金制、不直接对抗”的约束下，打破僵局。

          权变点：账目信息是否从“物业单方掌握”变为“多方交叉核对”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 业主频繁投诉“物业费交了，但不知道钱怎么花的”。

          · 物业公司的账目只有总额报表，没有分项明细，无法核实。

          · 有业主在业主大会上提议“取消酬金制，改回包干制”，但包干制同样可能带来服务缩水问题。

          · 街道和房管部门对小区物业矛盾表示关注，希望业委会先行调解。

          · 物业费收缴率不足70%，物业公司以“资金不足”为由，减少了保洁频次，服务质量继续下滑。
      - k: "排除"
        v: |
          · 排除简单指责物业贪污——缺乏证据，容易引发对抗，且无法解决问题。

          · 排除立即更换物业公司——新物业进场需要时间，且酬金制本身不是问题核心，换汤不换药。

          · 排除放弃酬金制改回包干制——包干制下物业公司更缺乏公开动力，长期可能损害业主利益。

          · 排除由业委会自行接手财务核算——业委会成员专业能力不足，反而会造成新的账目混乱。
      - k: "行动"
        v: |
          施先生作为业委会秘书，采取“以公开促信任，以专业建规则”的方式：

          第一步：梳理酬金制合同条款，明确物业公司必须公开的财务信息范围。

          第二步：敦促物业公司按季度提供分项收支明细，包括人工成本、保安保洁费用、维修费用、公共收益入账等。

          第三步：邀请有财务背景的业主志愿者组成账目核查小组，对明细进行交叉核对，并出具初步核查报告。

          第四步：将核查结果在业主大会上通报，对存在疑问的条目要求物业公司逐一笔说明。

          第五步：推动建立“共管账户+双签审批”机制：大额支出需业委会和物业双方签字方可动用。

          第六步：将物业费收支明细同步到业主微信群，定期发布简版财务月报。
      - k: "预期"
        v: |
          可核验目标：物业收支透明度提高，业主质疑减少，缴费率回升。

          防御目标：通过业主志愿者参与核查，增强业主对业委会和物业的信任；共管账户机制从源头防范资金挪用风险。

          核心问题解决：形成一套酬金制小区财务监督的可操作流程，供其他小区借鉴。
      - k: "修正"
        v: |
          · 如果物业公司不配合公开账目，将相关情况书面反馈至街道房办，由行政渠道督促整改。

          · 如果核查发现重大违规线索，推动启动专项审计，必要时走司法途径。

          · 如果志愿者核查力量不足，可引入第三方会计师事务所进行年度抽审。

          · 修正回路：始终回到“以公开促信任”的逻辑，不因物业不配合而转为直接对抗。
    effect: |-
      物业收支透明度提高，业主质疑减少，缴费率回升
    reusable_condition: |-
      信息不对称是主要矛盾、双方尚未彻底撕破脸、且存在可动员的第三方专业资源的场景
    non_applicable: |-
      物业已涉及重大违法违规、或业主与物业已进入法律诉讼阶段的场景
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 鲸鱼大楼、施先生姓名如涉隐私可做脱敏化处理，仅保留角色和做法。
    recorder_note: |
      酬金制账目问题的本质是“信息不对称”。施先生的做法没有直接对抗物业，而是利用“公开”这个杠杆，把道德质问转化为技术核对，让数据说话。

      值得注意的动作是“业主志愿者核查小组”：既解决了业委会专业能力不足的问题，又让业主从旁观者变为参与者，天然增加了决策的合法性。

      与治水学的接口：这一判断对应的是“疏浚操作”——不直接堵住矛盾（指责物业、更换物业），而是改变信息流动的源头结构，让账目从“物业单方掌握”变为“多方交叉核对”，使矛盾赖以存在的土壤被消解。

      适用边界：此结构适用于信息不对称是主要矛盾、双方尚未彻底撕破脸、且存在可动员的第三方专业资源的场景；不适用于物业已涉及重大违法违规、或业主与物业已进入法律诉讼阶段的场景。
  - id: "A-0003"
    num: "A-0003"
    title: "长白229街坊充电桩困局"
    card_title: "A-0003｜长白229街坊充电桩困局"
    card_meta: "决策显影库 · A 基层治理 · 公共收益与设施"
    category: "A 基层治理"
    scene: "公共收益与设施"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/S4IYL"
    interface: "疏浚（源头改造）"
    lever: "改路径"
    concepts: ["疏浚"]
    keywords: ["长白229街坊充电桩困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对老旧小区新能源车充电需求激增、私拉电线安全隐患突出、电力容量不足的困局，社区工作者不禁止、不放任，而是统一规划共享充电方案，引入运营商负责安装维护收费，把个体需求转化为公共资源分配问题，在空间与电力双重约束下实现安全与刚需的平衡。"
    elements:
      - k: "情境"
        v: |
          长白229街坊为老旧小区，无固定车位，停车位本就紧张。近年新能源车数量快速增长，居民要求安装充电桩的需求急增。由于缺乏统一规划，部分车主自行拉线、安装移动式充电设备，存在严重安全隐患，同时引发其他业主不满。

          章先生作为社区工作者接手时，面对的局面是：178户居民共用30多个充电桩，私拉电线和飞线充电屡禁不止，街道对火灾安全隐患排查出清单要求限期整改。与此同时，电力部门反馈小区变压器容量不足，无法支持大量个人充电桩同时安装。

          权变点：充电桩问题的定性是“个人需求”还是“公共资源分配”。这一变量一变，整个排除、行动、预期、修正全部跟着变。
      - k: "信号"
        v: |
          · 多户业主向居委会和业委会提出充电桩安装申请。

          · 物业反映楼道内出现私拉电线和飞线充电现象，屡禁不止。

          · 有业主投诉“充电桩位置占用公共通道，影响行人通行”。

          · 电力部门反馈小区变压器容量不足，无法支持大量个人充电桩同时安装。

          · 街道对火灾安全隐患排查出清单，要求限期整改。
      - k: "排除"
        v: |
          · 排除一律禁止安装充电桩——无法解决新能源车主的刚需，会激化矛盾。

          · 排除允许每家独立申请安装独立电表、独立走线——老旧小区空间和电力容量不够，会变成“先到先得”的抢占战。

          · 排除只依赖物业自行处理——物业缺乏协调权限，且无法承担代收电费的合规风险。

          · 排除让车主自行与电力部门沟通——散户申请电力扩容周期长、费用高，且容易破坏小区整体规划。
      - k: "行动"
        v: |
          章先生作为社区工作者，牵头统一规划共享充电方案：

          第一步：排摸小区新能源车数量、车型、日常充电需求，统计潜在使用频次。

          第二步：联合物业、业委会、电力部门现场踏勘，确定可设置共享充电桩的区域（如边角空地、围墙边），避开消防通道和主通道。

          第三步：设计“共享充电桩+分时管理”方案：统一招标充电桩运营商，由运营商负责安装、维护和收费，物业不直接接触电费。

          第四步：公示方案和收费标准，听取业主意见，重点解释公共车位被充电桩占用后的替代停车方案。

          第五步：向街道申请老旧小区新能源设施改造补贴或引入充电桩企业的免费安装政策。

          第六步：制定使用规则：充电完成后需尽快挪车，超时加收占位费；违规车辆记录并限制充电权限。
      - k: "预期"
        v: |
          可核验目标：满足新能源车主充电刚需，消除私拉电线安全隐患。

          防御目标：充电桩由专业运营商统一管理，物业规避运营风险；通过“共享+分时”模式，提高公共空间利用率，减少车位纠纷。

          核心问题解决：形成老旧小区充电桩治理的标准化流程。
      - k: "修正"
        v: |
          · 如果首批共享充电桩使用率不高，调整位置和数量，或改为慢充为主。

          · 如遇停车位矛盾激化，优先保证非新能源车主的基本停车需求，必要时重新规划车位布局。

          · 若运营商服务不佳，业主可联合提出更换运营商，不影响小区整体设施。

          · 后续电力扩容完成后，可逐步增设充电桩数量。

          · 修正回路：始终回到“把个人需求转化为公共方案”的逻辑，不因矛盾激化而退回禁止或放任。
    effect: |-
      满足新能源车主充电刚需，消除私拉电线安全隐患
    reusable_condition: |-
      需求真实且刚性、个体方案会导致公共资源争夺、但存在统一规划可行性的场景
    non_applicable: |-
      需求本身不真实、或统一规划成本远高于分散方案、或小区已无任何可用空间的场景
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 章先生、长白229街坊如涉隐私可做脱敏化处理，仅保留角色和做法。
    recorder_note: |
      这个案例的关键在于“把个人需求转化为公共方案”。章先生没有让每个车主各自为政，而是用统一规划、统一运营的方式，既满足了部分人的需求，又避免了公共利益受损。

      老旧小区充电桩问题的本质是空间稀缺和电力稀缺的分配问题。共享解不是最优解，但在资源约束下是成本最低、冲突最小的现实解。

      与治水学的接口：这一判断对应的是“疏浚操作”——不直接堵住需求（禁止安装），也不放任需求无序释放（各自为政），而是改变需求满足的路径结构，把分散的个体需求导入统一规划、统一运营的公共通道。

      适用边界：此结构适用于需求真实且刚性、个体方案会导致公共资源争夺、但存在统一规划可行性的场景；不适用于需求本身不真实、或统一规划成本远高于分散方案、或小区已无任何可用空间的场景。
  - id: "A-0004"
    num: "A-0004"
    title: "九里片区“九合一”拆墙并院困局"
    card_title: "A-0004｜九里片区“九合一”拆墙并院困局"
    card_meta: "决策显影库 · A 基层治理 · 空间改造与合并"
    category: "A 基层治理"
    scene: "空间改造与合并"
    date: "2026-09-27"
    source: "公开报道"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/34vX0"
    interface: "疏浚（源头改造）"
    lever: "排次序"
    concepts: ["疏浚"]
    keywords: ["九里片区“九合一”拆墙并院困局", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对九个院落拆墙并院时居民对“改后利益受损”的想象，牵头人不硬推、不投票、不搞一刀切，而是按“先做通谁、再带动谁”的次序，先立骨干示范，再一户一策回应停车、采光等具体顾虑，并以“同心亭”面对面协商、“三尺巷”式互换促成各退一步，把利益受损的想象转化为可当面交换的具体利益，适用于分歧在“改后利益分配”而非“改不改”、且有可动员骨干的场景。"
    elements:
      - k: "情境"
        v: |
          这是一个由九个院落、总长820米围墙分隔而成的老旧片区，边界画在“物理空间—居住归属”之间。系统存续目标不是完成一次工程改造，而是让九个各自为政的院子合成一个“共用一套服务、共担一份责任”的共同体。

          片区启动“九合一”改造项目后，“拆墙并院”成为头号难题——墙一拆，院子就不再是原来的院子。此前九个院子各自为政：门卫各管各的、设施各老化各的、矛盾各闹各的，几十年的居住习惯和归属感都附着在这道墙上。

          吴先生作为这次院改的牵头人（社区干部／业委会秘书角色）接手时，面对的局面是：居民的分歧不在“要不要改”，而在“改了之后我的利益会不会受损”。甲院（临街、停车最紧的大院）怕拆墙后外来车辆穿行，原本就紧的停车位更不够用；乙院（自管较久、环境维护较好）觉得自己院落维护得好，“没必要拿出来分享”；丙、丁等小院担心合并后话语权被大院子稀释，成了“被代表”的一方。同时，改造又受制于“不能硬推、不能把显性矛盾压成隐性对抗”的约束。
      - k: "信号"
        v: |
          · 居民的分歧不在“要不要改”，而在“改了之后我的利益会不会受损”——真正需要处理的不是技术方案，而是利益受损的想象。

          · 甲院的居民怕拆墙后外来车辆穿行，原本就紧的停车位更不够用。

          · 乙院觉得自己院落维护得好，“没必要拿出来分享”。

          · 丙、丁等小院担心合并后话语权被大院子稀释，自己成了“被代表”的一方。

          · 谁要是把“利益受损的想象”这一点看漏了，墙就拆不动。
      - k: "排除"
        v: |
          · 排除行政命令强制拆墙——没有“硬推”。围墙背后是几十年的居住习惯和归属感，强拆只会把显性矛盾压成隐性对抗，墙拆了心没拆。

          · 排除直接投票强行表决——信息不充分时投票，只会把既有分歧固化成“多数对少数”，投完票照样不配合。

          · 排除“统一标准一刀切”——如统一外墙风貌、统一门头样式这类“面子工程”。这类做法在多数改造中是必选项，但吴先生选择不做，把钱花在居民真正需要的地方。
      - k: "行动"
        v: |
          吴先生对行动顺序的判断是“先做通谁，再带动谁”，分五步走：

          第一步：成立院改临时党支部，先把党员组织起来，形成可依靠的骨干队伍。

          第二步：先做通党员户和骨干户，让他们带头签字、带头让利，把“谁先动”的示范效应立起来。

          第三步：挨家挨户上门，一户一策回应具体顾虑（停车、采光、噪音、产权），不做大锅饭式动员。

          第四步：在“同心亭”面对面协商，把分歧摆到桌面上，公开讨论、当场回应。

          第五步：用“三尺巷”式谈判促成各退一步——你让一点停车空间，我让一点绿化面积，换来整体打通。
      - k: "预期"
        v: |
          可核验目标：空间打通、服务覆盖、人心凝聚——九个院子从“各自为战”变成“共用一套服务、共担一份责任”。

          防御目标：以骨干先动形成示范，避免强推造成的隐性对抗；以一户一策、面对面协商，避免小院“被代表”、避免分歧被固化为“多数对少数”。

          核心问题解决：把“利益受损的想象”转化为可当面协商、可互相交换的具体利益，让墙“拆得动、也拆得顺”。
      - k: "修正"
        v: |
          · 墙拆完之后，吴先生意识到空间改造只是起点、人心凝聚才是终点，于是补上一条修正：引入“两步路学堂”，把退休职工从“被服务的对象”转化成“参与治理的力量”——人还是那些人，角色一变，矛盾就少了一大半。

          · 另一条：把“同心亭”从一次性的协商场地，改成承接常态化协商的机制，让协商习惯沉淀下来。

          · 修正回路：始终回到“空间改造是起点、人心凝聚才是终点”的逻辑，不因围墙已拆而停止对“人心之墙”的处理。
    effect: |-
      空间打通、服务覆盖、人心凝聚——九个院子从“各自为战”变成“共用一套服务、共担一份责任”
    reusable_condition: |-
      分歧不在“改不改”而在“改后利益分配”、存在可动员的骨干力量、且冲突尚未进入对抗状态的场景
    non_applicable: |-
      居民已就改造成本与收益形成明确对立、或不存在任何可依靠骨干的场景
    source_note: |
      · 基于公开报道整理，具体数据与时间以官方发布为准。

      · 涉及片区及院落名称、人物姓名均做脱敏处理，仅保留角色与做法；“吴先生”为化名。
    recorder_note: |
      这个案例的关键判断不是“拆墙的技术方案”，而是“先做通谁、再带动谁”的顺序——骨干先动，群众才跟。

      最反直觉的细节是：统一外墙风貌在多数改造中是“必选项”，但九里片区选择不做，把钱花在居民真正需要的地方。

      与治水学的接口：这是一种典型的“源头改造”判断——不是按惯例做事，而是追问“钱花在哪里才是真正的源头”。它不直接搬动围墙（堵），也不放任分歧自行演化，而是从“利益受损的想象”这个源头入手，先改变少数关键人的动力结构，再用示范带动多数，属于“动力—规则适配”的源头性操作。

      适用边界：此结构适用于分歧不在“改不改”而在“改后利益分配”、存在可动员的骨干力量、且冲突尚未进入对抗状态的场景；不适用于居民已就改造成本与收益形成明确对立、或不存在任何可依靠骨干的场景。骨干示范只能降低启动阻力，不能替代对具体利益损失的实质回应。
  - id: "B-0001"
    num: "B-0001"
    title: "瞒天过海"
    card_title: "B-0001｜瞒天过海"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-27"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/09ZAk"
    interface: "信号层（祭祀逆向）"
    lever: "藏信息"
    concepts: ["祭祀"]
    keywords: ["瞒天过海", "祭祀", "决策显影库", "宁凯峰"]
    abstract: "面对对方情报网络严密、正面行动风险过高的局面，决策者不秘密行动、不正面对抗，而是把真实意图隐藏在公开常规动作中，管理对方的信号识别阈值，使其“常见则不疑”，在对方意怠窗口内完成关键部署，以最小成本实现目标。"
    elements:
      - k: "情境"
        v: |
          这是一场博弈系统，边界画在“我方行动—对方判断”之间。系统存续目标不是消灭对方，而是在对方未察觉真实意图前完成关键部署。

          对方对我方行动高度关注，常规隐蔽手段会被识破。一旦真实意图暴露，对方会提前部署，行动成本剧增，甚至导致整个计划失败。

          对方情报网络严密，秘密行动容易被发现；我方资源有限，无法承受正面强攻；时间窗口有限，必须在对方反应前完成部署。
      - k: "信号"
        v: |
          · 对方处于“备周则意怠”状态——常规戒备已疲劳，对公开行动不再敏感。

          · 对方判断“常见”之事为安全，对异常之事反而警觉。

          · 我方观察到：对方对日常往来、例行公事、公开活动已形成“不疑”惯性。

          · 对方注意力集中在“可能的异常”上，而忽略了“异常就藏在常规里”。
      - k: "排除"
        v: |
          · 排除秘密行动——对方情报网络严密，秘密行动容易被发现。

          · 排除直接强攻——成本高、风险大，胜负不确定。

          · 排除临时改变计划——突然改变会暴露异常，触发对方警觉。

          · 排除正面欺骗——对方已有防备，直接欺骗反而会暴露意图。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：贺若弼以“换防”为名频繁调动军队，使陈国习以为常，最终渡江灭陈。

          · 商业上：竞争对手司空见惯的日常运营中完成关键布局。

          · 基层治理中：把关键调整包装成例行公事，在居民未察觉时完成方案落地。

          其结构为：

          第一步：把真实意图隐藏在公开的、常规的行动中。在对方已经“常见”的场景里完成部署，让对方把异常当作正常。

          第二步：维持日常节奏不变，不制造任何异常信号。所有调动、部署、准备都包装成例行公事。

          第三步：在对方“意怠”的时间窗口内，完成关键动作。

          第四步：动作完成后，继续维持常规状态，直到对方发现时，既成事实已经形成。
      - k: "预期"
        v: |
          可核验目标：对方在真实行动发起前保持“不疑”状态，我方完成关键部署。

          防御目标：即使对方中途产生疑虑，也不会触发全面戒备，因为我方行动始终在“常见”范围内。

          核心问题解决：以最小成本、最小风险，在对方未察觉的情况下完成关键部署。
      - k: "修正"
        v: |
          · 若对方对“常见之事”开始提高警觉，不要急着消除警觉，而是主动制造一个“更大的异常”吸引其注意力，让真正的部署继续隐藏在常规中。

          · 若连日频繁的常规动作反而引起疑心，主动安排一次高调的、无害的“意外”，让对方觉得我方行动不过如此，重新恢复“不疑”惯性。

          · 修正回路：回到“常见”状态，重新积累“不疑”惯性，而不是解释或掩盖。
    effect: |-
      对方在真实行动发起前保持“不疑”状态，我方完成关键部署
    reusable_condition: |-
      对方处于常规戒备状态、对公开行动不敏感的场景
    non_applicable: |-
      对方高度警觉、或己方行动已被识破的场景
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：贺若弼事见《隋书》，后世注解普遍引用为“瞒天过海”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是欺骗，是管理对方的信号识别阈值。它不是“让对方看不到”，而是“让对方看到但不当回事”。

      与治水学的接口：这一计对应的是信号层的操作——通过控制信号的“常见性”，改变对方对信号的判断权重。在治水学中，这接近“祭祀操作”的逆向使用：不是凝聚共识，而是维持对方的“认知惯性”。

      适用边界：这一计适用于对方处于常规戒备状态、对公开行动不敏感的场景；不适用于对方高度警觉、或己方行动已被识破的场景。在存续逻辑中，它只能用于争取时间窗口，不能替代实质性的动力-规则适配。
  - id: "B-0002"
    num: "B-0002"
    title: "围魏救赵"
    card_title: "B-0002｜围魏救赵"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-27"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/NxKCp"
    interface: "疏浚（改变压力流向）"
    lever: "改优先级"
    concepts: ["疏浚"]
    keywords: ["围魏救赵", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对正面救援成本过高、坐视不救又危及自身存续的两难，决策者不直接赴援，而是攻击对方必救的薄弱环节，迫使其主动改变部署，以间接路线解除危机，同时保全自身实力。"
    elements:
      - k: "情境"
        v: |
          这是一场多边博弈系统，边界画在“救援方—被攻方—进攻方”三方之间。系统存续目标不是直接击败进攻方，而是解除被攻方的危机，同时保全救援方自身实力。

          被攻方正在被进攻方主力围攻，若救援方直接赴援，将正面遭遇进攻方主力，胜负难料，且即使获胜也将消耗巨大。若坐视不救，被攻方灭亡后，进攻方势力扩张，救援方自身存续环境恶化。

          进攻方主力在外，国内空虚；被攻方尚能支撑一段时间；救援方兵力不足以正面决战；时间窗口有限，必须在被攻方崩溃前迫使进攻方撤军。
      - k: "信号"
        v: |
          · 进攻方主力全部压在前线，都城防守空虚。

          · 进攻方的存续命脉在都城，不在前线。

          · 被攻方虽被围，但尚未崩溃，仍有支撑时间。

          · 救援方与进攻方正面决战，成本高于攻击其必救之处。
      - k: "排除"
        v: |
          · 排除直接发兵被攻方与进攻方主力正面决战——成本高、风险大、胜负不确定。

          · 排除坐视不救——被攻方灭亡后，进攻方势力扩张，救援方自身存续环境恶化。

          · 排除小规模骚扰——不足以迫使进攻方撤军，反而暴露意图。

          · 排除等待进攻方自行撤军——时间不可控，被攻方可能先崩溃。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：齐军直捣魏国都城大梁，迫使魏军回援，在桂陵设伏截击。

          · 商业上：不直接争夺被对手挤压的市场，而是攻击对手的现金流核心或核心客户群，迫使其回防。

          · 基层治理中：不直接对抗矛盾焦点，而是改变矛盾赖以存在的资源结构，使焦点自行消解。

          其结构为：

          第一步：不直接赴援，而是识别进攻方的“必救之处”——其存续命脉所在。

          第二步：向进攻方的必救之处施加实质威胁，使其不得不回援。

          第三步：在进攻方回援途中设伏或制造不利条件，以逸待劳。

          第四步：若进攻方不回援，则继续施加威胁，形成实质打击。
      - k: "预期"
        v: |
          可核验目标：进攻方被迫从被攻方撤军，被攻方危机解除。

          防御目标：救援方避免与进攻方主力正面决战，保全自身实力。

          核心问题解决：以间接路线解除被攻方危机，同时消耗进攻方。
      - k: "修正"
        v: |
          · 若进攻方识破意图，坚持不回援，则继续围困其必救之处，形成实质威胁，迫使其在“失都城”和“失前线”之间做出选择。

          · 若进攻方分兵回援，则集中力量打击其回援部队，在运动中歼灭。

          · 若被攻方提前崩溃，则转为直接对抗，评估是否仍有间接路线可选。

          · 修正回路：始终回到“攻击必救之处”的逻辑，不因对方反应而转为正面硬拼。
    effect: |-
      进攻方被迫从被攻方撤军，被攻方危机解除
    reusable_condition: |-
      对方有明确“必救之处”、且该处防守薄弱的场景
    non_applicable: |-
      对方无明确存续命脉、或对方宁愿放弃必救之处也不改变部署的场景
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：孙膑围魏救赵事见《史记·孙子吴起列传》，后世注解普遍引用为“围魏救赵”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是“不打”，是改变对方的优先级。它不直接解决正面冲突，而是制造一个对方必须优先处理的新问题，迫使对方主动改变部署。

      与治水学的接口：这一计对应的是疏浚操作——不直接堵压力源，而是改变压力源的流向，使其不再冲击原目标。在治水学中，这接近“疏浚”的迂回运用：不是正面消解压力，而是引导压力转向对方必须承受的位置。

      适用边界：这一计适用于对方有明确“必救之处”、且该处防守薄弱的场景；不适用于对方无明确存续命脉、或对方宁愿放弃必救之处也不改变部署的场景。在存续逻辑中，它只能用于改变博弈节奏，不能替代实质性的动力-规则适配。
  - id: "B-0003"
    num: "B-0003"
    title: "借刀杀人"
    card_title: "B-0003｜借刀杀人"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-28"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/wSNCq"
    interface: "疏浚（转换出力者）"
    lever: "借第三方"
    concepts: ["疏浚"]
    keywords: ["借刀杀人", "疏浚", "决策显影库", "宁凯峰"]
    abstract: "面对敌人已明、正面出手损耗巨大而第三方态度未定的局面，决策者不亲自出手、不与第三方正面结盟，而是识别并激化第三方与敌人之间的矛盾，诱导第三方出手（引友杀敌），借第三方之力削弱敌人，自己保存实力、坐收其成。"
    elements:
      - k: "情境"
        v: |
          这是一场三方博弈系统，边界画在“我方—敌方—第三方”之间。系统存续目标不是亲自消灭敌人，而是在保存自身实力的前提下，借助第三方之手削弱或清除敌人。

          敌人已经暴露，其意图、位置与弱点均可识别（敌已明）；但第三方的态度尚未确定（友未定），它既有能力对敌方动手，又尚未明确站队。若我方亲自出手，胜负难料且损耗巨大；若坐视不理，敌人坐大，我方的存续环境将持续恶化。

          我方实力不足以、也不值得正面消耗；第三方与敌方之间存在可利用的矛盾或利益冲突；时间窗口有限，必须在敌人进一步壮大前完成借力。
      - k: "信号"
        v: |
          · 敌方目标已经暴露，其威胁方向与薄弱环节可以辨识。

          · 第三方与敌方之间存在既有的利益冲突、历史积怨或竞争关系。

          · 第三方有实力对敌方造成实质打击，只是尚未被激发或尚未下定决心。

          · 我方若亲自出手，成本高于诱导第三方出手，且易暴露自身意图。
      - k: "排除"
        v: |
          · 排除亲自正面进攻——成本高、损耗大、胜负难料，且违背“保存实力”的存续目标。

          · 排除与第三方正式结盟、正面作战——第三方态度未定，强行结盟易暴露意图，反而把“友未定”推向敌方。

          · 排除坐视不理——敌人坐大后，我方存续环境恶化，错失削弱敌人的窗口。

          · 排除直接收买或利诱第三方——过于直白，易被识破，且成本未必低于正面消耗。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：郑桓公欲袭郐，先收集郐国忠臣良将名单，刻于盟书、埋于城外，制造“郐臣通敌”的假象；郐君中计，尽杀其良臣，郑国不战而取郐。

          · 商业上：不直接攻击竞争对手，而是识别并放大对手与其盟友、渠道、股东之间的裂痕，借其内部或第三方力量削弱对手。

          · 基层治理中：不直接对抗矛盾焦点，而是借既有的制度、规则或上级、舆论等第三方力量，让对立面在规则约束下自行削弱或退出。

          其结构为：

          第一步：确认“敌已明”——锁定敌人的意图、位置与弱点，明确必须清除的目标。

          第二步：识别“友未定”——在态度未定的第三方中，找出与敌方存在矛盾、且有能力动手的那一个。

          第三步：制造条件激化第三方与敌人之间的矛盾，诱导第三方出手（引友杀敌），自己始终不出力、不暴露。

          第四步：坐收其成，保存实力；若第三方仍不动手，则持续加码诱导，直到其出手为止。
      - k: "预期"
        v: |
          可核验目标：第三方对敌方形成实质打击，敌方被削弱或清除，我方未亲自投入对抗。

          防御目标：即使第三方最终不配合，我方自身不暴露意图、不损耗实力。

          核心问题解决：以“不自出力”的最小成本削弱敌人，把自身损耗与暴露风险降到最低。
      - k: "修正"
        v: |
          · 若第三方识破意图、拒绝出手，不要强行推进，转而寻找新的第三方，或制造更隐蔽、更自然的诱导条件。

          · 若第三方出手后反而坐大、成为新的威胁，要及时转入制衡，防止“引狼入室”、借来的刀反噬自身。

          · 若敌方先发制人、反过来拆解我方布局，立刻收回诱导，转为防御或另寻他路。

          · 修正回路：始终回到“引友杀敌、不自出力”的逻辑——借力而不被力所累，绝不让借来的刀伤到自己。
    effect: |-
      第三方对敌方形成实质打击，敌方被削弱或清除，我方未亲自投入对抗
    reusable_condition: |-
      “敌已明、友未定”、且第三方与敌方存在可利用矛盾、第三方有实力且能被激发的场景
    non_applicable: |-
      无可借的第三方、第三方识破意图反而反噬、或我方与第三方的矛盾大于第三方与敌方矛盾（借刀反而伤己）的场景
    source_note: |
      · 计名与原文：出自《三十六计》原文。

      · 历史案例：郑桓公袭郐事见《韩非子》，借孙权之手擒关羽事见《三国志》，后世注解普遍引用为“借刀杀人”的典型注脚。

      · 具体数据与时间以官方发布为准。
    recorder_note: |
      这一计的本质不是“不战”，是把“消灭敌人的成本”转嫁给第三方。它操作的对象不是敌人本身，而是“敌人与第三方之间的关系”——识别二者之间可被激化的矛盾，制造条件让矛盾在有利于自己的方向上释放，用第三方的力量消耗敌人，自己坐收其成、保存实力。

      与治水学的接口：这一计接近“疏浚”的借势运用——不是自己正面消解压力，也不是引导敌人自己的力量回击（那是围魏救赵），而是引导第三方的力量去打击敌人。它调度的是“动力—规则”关系中“友未定”的第三方动力，把既有的势能导向目标，让势能替自己完成冲刷。

      适用边界：这一计适用于“敌已明、友未定”、且第三方与敌方存在可利用矛盾、第三方有实力且能被激发的场景；不适用于无可借的第三方、第三方识破意图反而反噬、或我方与第三方的矛盾大于第三方与敌方矛盾（借刀反而伤己）的场景。在存续逻辑中，它只能用于借力消耗，不能替代自身实力建设——“借来的刀”不可持久，且可能反噬。
  - id: "B-0004"
    num: "B-0004"
    title: "以逸待劳"
    card_title: "B-0004｜以逸待劳"
    card_meta: "决策显影库 · B 历史判例 · 博弈决策"
    category: "B 历史判例"
    scene: "博弈决策"
    date: "2026-09-29"
    source: "三十六计原文"
    license: "CC BY 4.0"
    planet_url: "https://t.zsxq.com/udsQl"
    interface: "分层异步（等对方动能衰减）"
    lever: "等衰减"
    concepts: ["分层异步"]
    keywords: ["以逸待劳", "分层异步", "决策显影库", "宁凯峰"]
    abstract: "面对敌方主动进攻、锐气正盛而正面迎击损耗巨大的局面，决策者不主动出击、不消极避战，而是退守有利态势、养精蓄锐，等待对方攻势的衰减拐点（锐气耗尽、补给不济），再以逸击劳、一击致命，适用于己方有地势与时间资本、敌方劳师袭远不可持久的场景。"
    elements:
      - k: "情境"
        v: |
          这是一场攻守博弈系统，边界画在“我方—敌方”之间。系统存续目标不是抢先出手、与敌硬拼，而是以最小代价拖垮来犯之敌，同时保全自身实力。

          敌方主动进攻、锐气正盛，正面迎击将与强弩之末对撞，胜负难料、损耗巨大；若避而不战、一味退让，敌方将长驱直入，我方存续空间被逐步压缩。

          敌方远征而来、补给线长、难以持久；我方据有利地势、补给充足、可以以静制动；时间站在我方一边，但必须在敌方疲惫之前始终守住“逸”的态势。
      - k: "信号"
        v: |
          · 敌方劳师袭远、补给线长，其攻势依赖一股“锐气”，难以长期维持。

          · 敌方的士气有衰减周期——“一鼓作气，再而衰，三而竭”，强攻不克必然衰竭。

          · 我方占据有利地形与补给优势，可以“以逸”待“劳”，把时间转化为己方的势能。

          · 敌强我弱的表面态势下，隐藏着“强弩之末，势不能穿鲁缟”的转化窗口。
      - k: "排除"
        v: |
          · 排除正面迎击、主动决战——敌方锋锐正盛，硬拼损耗大、胜负难料。

          · 排除彻底退让、消极避战——会助长敌方锐气，且丢失关键位置。

          · 排除速战速决——正中对方下怀，让对方把“锐气”优势发挥到极致。

          · 排除不断袭扰、小打小闹——既消耗自身，又暴露虚实，不能伤其根本。
      - k: "行动"
        v: |
          本显影展示的是策略结构层，不还原具体操作细节。具体操作因领域而异：

          · 军事上：陆逊面对刘备东征大军，主动退守夷陵、坚壁不出，待蜀军屯兵山林、锐气尽失、补给不济，火烧连营七百里，一举破敌。

          · 商业上：不跟进对手的价格战，反而收缩战线、巩固现金流与成本优势，等对手扩张过度、资金链紧绷时，再以逸待劳收割其市场。

          · 基层治理中：面对激化的矛盾不急于正面调解，先稳住局面、摸清各方诉求，等情绪降温、利益格局清晰后再切入，化被动为主动。

          其结构为：

          第一步：主动退守有利态势，把“劳”的代价转嫁给对手——让对方来攻、让对方远征、让对方消耗。

          第二步：坚壁不出、养精蓄锐，把自己始终保持在“逸”的状态（休整、补给、待机）。

          第三步：观察对方的消耗拐点，等待其“刚”转为“柔”——锐气耗尽、补给不济、士气衰竭。

          第四步：在拐点出现时，以己方蓄满之力一击致命，击其惰归、收其全功。
      - k: "预期"
        v: |
          可核验目标：敌方锐气耗尽、疲惫沮丧，我方以最小代价取胜或逼其退却。

          防御目标：不正面硬拼、不主动消耗，保全自身实力。

          核心问题解决：把“敌强我弱”的表面态势，通过时间与态势的调度，转化为“我逸敌劳”的有利格局。
      - k: "修正"
        v: |
          · 若对方识破意图、不上钩、不主动进攻，则主动制造诱因（利而诱之），引其来攻，再以逸待劳。

          · 若对方持久对峙、不露破绽，则转而袭扰其补给线，迫使其要么撤退、要么主动出击。

          · 若我方“逸”的条件丧失（补给被断、地利被夺），则及时转入机动或决战，不以逸待劳变成坐以待毙。

          · 修正回路：始终回到“养己之逸、疲敌之劳”的逻辑——待机是为了蓄力，不是消极等待。
    effect: |-
      敌方锐气耗尽、疲惫沮丧，我方以最小代价取胜或逼其退却
    reusable_condition: |-
      我方有“逸”的资本（地利、补给、时间、纵深）、对方有“劳”的来源（远征、补给线长、锐气不可持续）的场景
    non_applicable: |-
      我方无险可守、无粮可继、或对方同样以逸待劳、持久对峙的场景
    source_note: |
      · 计名与原文：出自《三十六计》原文“困敌之势，不以战；损刚益柔”。

      · 历史案例：陆逊夷陵之战见《三国志·陆逊传》；曹刿论战“一鼓作气，再而衰，三而竭”见《左传·庄公十年》，后世注解普遍引用为“以逸待劳”的典型注脚。

      · “击其惰归”出自《孙子兵法·军争篇》。

      · 原文与史事以传世文献为准。
    recorder_note: |
      这一计的本质不是“不打”，是“把时间变成自己的武器”。它不直接消解压力，而是识别对方攻势的衰减周期，避开其峰值，在其谷值反击。

      与治水学的接口：这一计对应的是对“突破性动能”时间结构的识别与利用——对方的攻势是突破性动能的峰值，必然衰减（一鼓作气，再而衰，三而竭）；以逸待劳不承接峰值，而是“损刚益柔”，等其动能衰减到谷值，再以己方蓄满的动能反击。它调度的不是空间上的流向（那是围魏救赵、借刀杀人的疏浚），而是时间上的相位差——是“分层异步”的实操化：利用动力层与规则层之间的时间差，让己方的规则（防守、补给）始终跟得上，而对方的动力在时间中自我耗散。

      适用边界：这一计适用于我方有“逸”的资本（地利、补给、时间、纵深）、对方有“劳”的来源（远征、补给线长、锐气不可持续）的场景；不适用于我方无险可守、无粮可继、或对方同样以逸待劳、持久对峙的场景。在存续逻辑中，它只能用于“待机取胜”，不能替代实质性的动力-规则适配——若自身没有“逸”的资本，以逸待劳就成了坐以待毙。
  - id: "B-0005"
    num: "B-0005"
    title: "趁火打劫"
    card_title: "B-0005｜趁火打劫"
