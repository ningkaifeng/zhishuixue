about:
  heading: "What is Dynamic Sustenance Theory (DST)?"
  lead: 'DST is a structural grammar for governing complex adaptive systems. It asks not "what a system is" but "how a system sustains itself amid flux" — and turns that perspective into a diagnosable, intervenable grammar.'
  core_claim: "Its ontological ground is the domain of sustenance: a system persists not by staying unchanged, but by maintaining structural continuity under flux."
  core_mechanism: "Core mechanism — force-rule symbiosis: the dynamic layer (Three Waves) and the rule layer (Three Phases) co-adapt to keep a system alive. Key concepts include Ti-Xiang Correlation, Layered Asynchrony, and Syntax Lock-in — three structural invariants that together define where and how intervention can take hold."
  gap: "Existing complex-systems theories explain how systems evolve. DST works on the other question: how a system sustains itself."

