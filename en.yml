core_move:
  heading: "The core move"
  intro:
    - "Most governance asks whether a system complies with rules. That question assumes the rules are the right ones, and that stability is the goal."
    - "DST starts one step earlier: it asks where the pressure is, and which constraint can still move."
    - "The result is not a verdict but a structure — what state the system is in, and where intervention can actually take hold."
  table:
    left_label: "Static governance asks"
    right_label: "DST asks"
    rows:
      - ["What is the rule?", "Where is the pressure?"]
      - ["Who is accountable?", "Which constraint can still move?"]
      - ["Is the system compliant?", "Is the system still adjustable?"]
  closer: "Existing complexity theory explains how systems evolve. DST works on the other question: how a system keeps itself alive."

invariants:
  heading: "Three structural invariants"
  note: "Not a framework of layers or boxes — three relationships that hold in any system that sustains itself."
  items:
    - name: "Force-Rule Coordination"
      desc: "The dynamic layer and the rule layer adapt to each other. Neither alone sustains a system."
    - name: "Layered Asynchrony"
      desc: "The force layer and the rule layer are structurally out of sync. The response gap is permanent, not a temporary failure to be fixed."
    - name: "Syntax Lock-in"
      desc: "When the rule structure freezes, the system loses the ability to re-weight rules as the dynamics shift. Even if a shock breaks it temporarily, the system returns to the locked state."
  closer: "A general structural grammar for diagnosing where and how intervention can take hold."

