    niche_zh: "现有复杂系统理论（系统动力学、复杂适应系统理论）解释了系统如何演化，但没有回答“系统如何在永恒流变中维持自身存续”这一问题；治水学（DST）填补的正是这一空缺——它以“存续”为第一视角，提供可诊断、可干预的存续分析语法。"
