terms:
  # 一、核心本体论
  - {anchor: dst, cat: "核心本体论", code: "DST-ONT-01", name: "治水学", en: "Dynamic Sustenance Theory (DST)", desc: "一套面向复杂适应系统的存续分析元理论，回答系统如何在永恒流变中通过动力与规则协同实现自身存续。", doi: "10.5281/zenodo.20372186"}
  - {anchor: sustenance, cat: "核心本体论", code: "DST-ONT-02", name: "存续", en: "Sustenance", desc: "存在在可观测层面的唯一形式，系统通过持续对抗失序压力以维持自身运作完整性。", doi: "10.5281/zenodo.22785849"}
  - {anchor: sustenance-priority, cat: "核心本体论", code: "DST-ONT-03", name: "存续优先", en: "Sustenance Priority", desc: "治水学的工作假设：在哲学根本追问中，将“系统如何存续”置于“存在是什么”之前。", doi: "10.5281/zenodo.22785725"}
  - {anchor: pattern-continuity, cat: "核心本体论", code: "DST-ONT-04", name: "模式连续性", en: "Pattern Continuity", desc: "系统的同一性不是组分的静止不变，而是动力-规则协同模式在时间中保持拓扑连续。", doi: "10.5281/zenodo.22785562"}
  - {anchor: practice-precedence, cat: "核心本体论", code: "DST-ONT-05", name: "治水实践先在", en: "Practice Precedence", desc: "实践是理解存续相关属性的构成性方式，系统的存续属性在治水实践中生成并维持。", doi: "10.5281/zenodo.22789923"}
  # 二、动力层（三浪）
  - {anchor: three-waves, cat: "动力层（三浪）", code: "DST-DYN-01", name: "三浪", en: "The Three Waves (Ti)", desc: "系统动力的三个不可还原维度——技术浪、制度浪、思想浪，分别提供突破性、稳定性与方向性动能。", doi: "10.5281/zenodo.22795174"}
  - {anchor: tech-wave, cat: "动力层（三浪）", code: "DST-DYN-02", name: "技术浪", en: "Technological Wave (Tech-Wave)", desc: "由工具、方法、创新驱动的突破性动能。", doi: "10.5281/zenodo.22795174"}
  - {anchor: inst-wave, cat: "动力层（三浪）", code: "DST-DYN-03", name: "制度浪", en: "Institutional Wave (Inst-Wave)", desc: "由规则、秩序、组织结构驱动的稳定性动能。", doi: "10.5281/zenodo.22795174"}
  - {anchor: idea-wave, cat: "动力层（三浪）", code: "DST-DYN-04", name: "思想浪", en: "Ideational Wave (Idea-Wave)", desc: "由价值观、信念、共享叙事驱动的方向性动能。", doi: "10.5281/zenodo.22795174"}
  # 三、规则层（三元）
  - {anchor: three-phases, cat: "规则层（三元）", code: "DST-RUL-01", name: "三元", en: "The Three Phases (Xiang)", desc: "规则约束动力的三种互斥且穷尽的元操作：源头改造、底线守护、共识凝聚。", doi: "10.5281/zenodo.22805434"}
  - {anchor: dredging, cat: "规则层（三元）", code: "DST-RUL-02", name: "疏浚", en: "Dredging / Source Transformation", desc: "引导动力主动改造、移除或重定向失序源头的规则操作。", doi: "10.5281/zenodo.22805434"}
  - {anchor: arking, cat: "规则层（三元）", code: "DST-RUL-03", name: "方舟", en: "Arking / Boundary Safeguarding", desc: "引导动力防御系统核心边界的规则操作。", doi: "10.5281/zenodo.22805434"}
  - {anchor: sacrificing, cat: "规则层（三元）", code: "DST-RUL-04", name: "祭祀", en: "Sacrificing / Consensus Calibration", desc: "引导动力凝聚共识、协调集体行动的规则操作。", doi: "10.5281/zenodo.22805434"}
  # 四、耦合与诊断
  - {anchor: body-phase-correlation, cat: "耦合与诊断", code: "DST-DIA-01", name: "体相关系", en: "Body-Phase Correlation", desc: "动力-规则协同的内在结构（体）与其呈现出的特征状态（相）之间的关系。体是动力层与规则层的协同关系本身，不是动力层。", doi: "10.5281/zenodo.22821896"}
  - {anchor: matching, cat: "耦合与诊断", code: "DST-DIA-02", name: "匹配", en: "Matching", desc: "响应缺口未导致核心功能损害持续累积的状态。不要求规则追上动力、不要求异步缩小，紧张但不崩溃是常态。", doi: "10.5281/zenodo.22821896"}
  - {anchor: mismatch, cat: "耦合与诊断", code: "DST-DIA-03", name: "失配", en: "Mismatch", desc: "响应缺口导致核心功能损害持续累积、且可归因于动力-规则适配本身的状态。失配是结构性常态，不可消除只能管理；呈扩张型／保守型／空转型“2+1”结构。", doi: "10.5281/zenodo.22821896"}
  - {anchor: lock-in, cat: "耦合与诊断", code: "DST-DIA-04", name: "锁定", en: "Lock-in", desc: "体相耦合的病理状态，系统丧失动态调整规则配置的能力。", doi: "10.5281/zenodo.22821896"}
  - {anchor: syntax-lock-in, cat: "耦合与诊断", code: "DST-DIA-05", name: "语法锁定", en: "Syntax Lock-in", desc: "三元特征固化的状态：某一型特征持续主导、系统丧失按三浪失配动态调整规则权重的能力；固化沉淀于语法结构，即使外部扰动暂时打破，系统仍会返回锁定。", doi: "10.5281/zenodo.23113642"}
  - {anchor: layered-asynchrony, cat: "耦合与诊断", code: "DST-DIA-06", name: "分层异步", en: "Layered Asynchrony", desc: "动力层与规则层之间结构性的非同步耦合：动力变化传导到规则层的时间差恒大于零且不可消除，使动态适配无法完全闭合。其来源是传导时间差，三浪异步只是充分条件之一。", doi: "10.5281/zenodo.22842961"}
  - {anchor: force-rule-symbiosis, cat: "耦合与诊断", code: "DST-DIA-07", name: "动力-规则共生", en: "Force-Rule Symbiosis", desc: "动力与规则的动态适配不是静态均衡，而是持续的相互调整过程。", doi: "10.5281/zenodo.22842961"}
  - {anchor: response-gap, cat: "耦合与诊断", code: "DST-AIG-04", name: "响应缺口", en: "Response Gap", desc: "规则层完成有效响应所需周期，超过系统承受而不发生核心功能损害的时间窗口的部分。响应缺口天然非负——超过窗口才有缺口，未超过则无。", doi: "10.5281/zenodo.22884353"}
  - {anchor: tolerance-window, cat: "耦合与诊断", code: "DST-AIG-05", name: "容忍窗口", en: "Tolerance Window", desc: "系统在功能损害持续累积前所能承受的最长响应延迟。", doi: "10.5281/zenodo.22884353"}
