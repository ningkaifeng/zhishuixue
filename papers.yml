  - {anchor: six-dimensional-framework, cat: "自主知识体系", code: "DST-AKS-02", name: "六维能力框架", en: "Six-Dimensional Capability Framework", desc: "自主知识体系由解释性、预测性、干预性、自反性、传承性、对话性六个维度构成。", doi: "10.5281/zenodo.21897465"}
