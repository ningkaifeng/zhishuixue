  num: No.02
  domain: 塑料污染治理
  border: 全球塑料污染治理（2022–2026）
  state: 锁定态中后期
  dim_constraint: 固化（生产上限四年调不动）
  dim_generation: 可生成（弱，产出落不了地）
  channel: 外部介入通道（external intervention）
  leverage: 初级塑料聚合物生产上限
  direction: 从「下游回收/清理」转向「源头生产上限」
  judgment: 全球塑料污染治理处于锁定态中后期，核心约束（生产上限）四年调不动、内部已无调空间，唯一出口是外部介入——把干预从下游回收转到源头生产上限。
  summary: 公约谈判四年零产出、产量反升、回收率停滞；三个衰减算子同时发生，方向协方差坍缩。
  correction_bad: 谈判彻底终止 → collapse（固化+断裂）；若崩溃逼出约束被迫松动 → crisis-restructuring window（可调+断裂）。
  correction_good: 续谈达成含生产上限的公约、主要产油国签署、约束从已固化重新变可调 → adaptive（适应态）。
  repo_path: T0/No.02-塑料污染-2026-11-07.md
