  - 'no': 2
    node: 沙特/产油国联盟有无松动迹象
    verify: 立场无松动，继续抵制生产上限
    break: 措辞松动（「坚决反对」→「有条件讨论」）→ 约束可调性其实可调
  - 'no': 3
    node: 全球南方资金机制是否从「呼吁」变「有数字方案」
    verify: 仍是呼吁、无数字
    break: 出现有数字方案 → 共识凝聚在实质化
  - 'no': 4
    node: 微塑料健康证据积累到何程度触发底线守护升级
    verify: 证据累积但未触发升级
    break: 证据触发升级（新强制限值、禁塑扩围）→ 底线守护在增强
  title: 全球塑料污染治理现状 · 结构显影
