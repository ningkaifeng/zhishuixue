specimens:
- id: S-0001
  num: No.01
  domain: AI 治理
  border: 全球 AI 治理（2024–2026）
  state: 锁定态早期
  dim_constraint: 可调 → 固化过渡中
  dim_generation: 可生成（强）
  channel: 修复通道（repair）
  leverage: 模型发布许可
  direction: 从「事后追责」转向「部署前条件」
  judgment: 全球 AI 治理处于锁定态早期，规则持续追不上模型能力，可干预的杠杆点是模型发布节点——把约束从事后追责移到部署前条件，是目前唯一还能动的入口。
  summary: 三种动能节奏失配、方向协方差坍缩；约束尚在固化初期，锁定仍在早期，仍有修复窗口。
  correction_bad: 规则产出全面停止 → collapse（固化+断裂）；若崩溃逼出约束被迫松动 → crisis-restructuring window（可调+断裂）。
  correction_good: EU AI Act 执行顺利、重大事故触发快速立法、约束从固化重新变可调 → adaptive（适应态）。
  repo_path: T0/No.01-AI治理-2026-11-07.md
  source: 标本No.01-AI治理-2026-11-07.docx
  obs:
  - 'no': 1
    node: EU AI Act 核心条款 2027 落地前是否实质性修订
    verify: 无实质修订，按原表推进或再推迟
    break: 出现实质修订 → 约束其实仍在被主动调整，「固化过渡中」判偏
  - 'no': 2
    node: 美国行政令到期后国会是否接棒立法
    verify: 到期后无接棒，仍停自愿/行政层
    break: 国会通过实质立法 → 从自愿转强制，维持动能在增强，「维持慢」判偏
  - 'no': 3
    node: 下一个前沿模型发布时是否出现新的单边约束
    verify: 发布节点仍无审批、单边可变
    break: 发布节点被强制加审批 → 杠杆点从可调变被管，约束可调性其实「可调」
  - 'no': 4
    node: 中美 AI 安全标准有无可验证互认协议
    verify: 无任何互认，各自固化
    break: 出现哪怕一个可验证互认 → 方向在收敛，「导向拉扯/协方差坍缩」判偏
  title: 全球 AI 治理现状 · 结构显影
  t0_date: '2026-11-07'
  license: CC BY 4.0
  sections:
  - k: 边界
    v: 全球 AI 治理（2024–2026 当下）。这个边界内能识别出一组完整的"动力—规则"关系：三种动能（生成、维持、导向）与三种操作（源头改造、底线守护、共识凝聚）——观察的是它们能否协同，而不是"技术与治理能不能适配"那句老话。
  - k: 动态声明
    v: 本标本所显影的，不是 2024–2026 年 AI 治理的一张静态照片，而是这套治理安排在时间窗内的一条动态张力曲线。落点"锁定态早期"是这条曲线在当下的位置标注，随 T1/T2 演化可修正。
  - k: 信息可得性
    v: '· 可得：法规文本（EU AI Act、美国行政令、中国备案制）、模型发布记录、公开治理动作

      · 不可得：系统内部协同状况的时刻级数据、企业内部决策、跨国协调真实约束'
  - k: 1 状态诊断（2×2 四态）
    v: '· 约束可调性：可调 → 固化过渡中

      · 状态生成能力：可生成（强——系统正常生成核心状态，产出能成活：EU AI Act 生效、备案制运转）

      ⇒ 落点：锁定态早期（约束尚可调，对应"修复"通道，尚未到中后期）'
  - k: 2 失序压力差（Adaptive Capacity–Stress Gap）
    v: 失序压力逼近速度 ＞ 这套治理安排的适应能力增长，差距扩大（独立趋势，预示落点可能继续滑向 locked-in / collapse）。
  - k: 3 三种动能（系统的原生动力）
    v: '任何治理系统都靠三种动能协同才转得起来——生成（产生新能力）、维持（把秩序固定下来）、导向（给行业定朝向）；缺任何一股，都说明边界划错了。全球 AI 治理此刻：

      · 生成：模型能力月级迭代，前沿模型持续发布、研发竞赛激烈

      · 维持：立法、备案、行业标准年级跟进——EU AI Act 生效但高风险义务推迟，美国只做自愿预览

      · 导向：三股方向在拉扯（欧盟朝安全与人权、美国朝保持领先、中国朝可控发展），但真正要问的不是"谁往哪拉"，而是这三股方向还能不能收敛出一个各方都认的"下一帧"——目前看，方向协方差在坍缩：没有可共享的下一帧在生成，各方向各自固化、互不相让。

      节奏失配（Tempo-Mismatch）：三种动能的步调错开了——生成以月计、维持以年计，跨一个数量级；导向则在多股方向之间来回摆、定不下来。

      · 传输延迟增长：治理动作对技术变化的响应一轮比一轮慢

      · 响应衰减：不是"规则多了所以信号弱"这个结论，而是三个衰减算子——①接收端饱和（被监管者面对太多规则，边际信号趋零）；②无执行齿数（模型发布被规则包裹，但规则不咬合）；③共识层无惩罚函数（违反共识无代价）。当前②③同时发生。'
  - k: 4 三种操作（干预的三个落点）
    v: '治理能做的操作也只有三种，缺一种就说明显影漏了。全球 AI 治理此刻：

      · 源头改造（改造压力源本身）：提高模型安全、对齐训练、从数据源头治理——目前主要靠企业自发，公共强制弱

      · 底线守护（守住不可接受的边界）：欧盟用途禁止、美国出口管制、中国内容安全红线——红线在划，但执行滞后、实质约束不足

      · 共识凝聚（把各方拉到同一张桌子）：AI 安全峰会、多边声明——各国各说各话，共识薄弱

      杠杆点定位：三种动能、三种操作的交汇点，落在"模型发布"——它是目前少数高频通过、又能被少数主体单方面改变的位置；但这个可调节性本身需要持续检验，若它也被固化，杠杆点就失效了。

      · 约束可变性评估：可调 → 固化过渡中 → repair 通道'
  - k: 5 综合判定（含干预四问）· 由前四项组合输出，非独立第六项
    v: '落点：锁定态早期

      判定链（术语关系）：三个量构成一条因果链——①传输延迟增长（规则追不上动力、越追越慢）→ ②约束可调性下降（约束固化、越来越改不动）→ ③响应衰减（规则越来越无效、边际信号趋零）。传输延迟是根因（动力快、规则慢），约束固化是中间态（延迟累积导致约束僵死），响应衰减是结果（僵死的约束越来越没用）。当前这条链已在运转：约束尚处于固化初期（尚可调），所以锁定在早期；若约束完全固化、响应彻底衰减，就滑向中后期。失序压力差是趋势预警：差距在扩大，落点可能继续滑向 locked-in。

      干预四问：

      · ① 调哪条约束：模型发布许可

      · ② 方向与幅度：从"事后追责"转向"部署前条件"

      · ③ 如何验证：发布前条件是否生效

      · ④ 如何回滚：若阻碍动力释放则放宽

      规范层（任一约束必须同时回答四问，答不全就只是存在域的标语、不是存续域的约束）：

      · ① 谁授权（国内法授权 / 国际协调 / 多边共识）

      · ② 谁赔（设条件者自身是否被问责、评估是否独立）

      · ③ 怎么退（条件错误时有无纠偏与救济通道；设限后撤回受政治刚性约束，往往难退）

      · ④ 退不动时系统怎么续命（约束撤不回时，靠什么兜底、让系统不至于崩）'
  - k: 公开事实锚点
    v: '· 约束可调性"向固化过渡"：EU AI Act 通用条款 2025 年 8 月生效，但高风险义务执行推到 2026 年 8 月、核心条款延至 2027 年底；美国 2026 年 6 月行政令明确"拒绝强制许可与预先审批"，只做自愿 30 天预览；中国走备案制，综合性立法仍在起草。→ 规则在出，但规则追上最前沿能力的时间差是结构性的——这个响应缺口持续存在、差距未见收敛。

      · 响应衰减 / 空信号：Floridi 2026 直接点出"规范膨胀（normative inflation）+ 空信号（crying wolf effect）"——规则越多，边际信号越弱，形成"虚假保护感"。

      · 导向拉扯：欧盟以风险分级与人权保护为主轴（EU AI Act），美国行政令以"保持美国领先"为纲，中国以"发展与安全并重、可控发展"为主轴——三方对"AI 治理朝哪走"没有共识，方向本身在拉扯。

      · 模型发布是真实杠杆点：2026 年 Anthropic 两款前沿模型因出口管制被暂取下架、三周内有条件恢复；GovAI 统计 375 次发布中欧盟 11% 延迟、Meta 高达 26%。→ 发布节点确实是"高频 + 单边可变 + 咽喉位"。'
  - k: T0 诚实边界与未来修正条件
    v: 本标本为 T0 实时判断（记录于 2026-11-07）。T1/T2 留待事件演化后补录。修正条件双向设置——若未来 6–12 个月出现"规则全面失效 / 多模型同时突破发布管控"信号：若规则产出全面停止（状态链断裂），落点向恶化方向修正为 collapse（固化 + 断裂）；若崩溃逼出约束被迫松动，则转 crisis-restructuring window（可调 + 断裂，重构窗口）。若 EU AI Act 执行顺利、重大事故触发快速立法、约束从固化重新变可调，落点向好转方向修正为 adaptive（适应态）。
