<p class="intro" style="font-size:0.88em;color:#888;">与决策显影库的分工：决策显影用六要素显影「事件」，思想显影用五段显影「体系」。共 <b id="cnt">6</b> 篇。</p>

<script>
var DATA = [{"num": "N-0001", "title": "尼采", "full": "尼采——实践学显影", "cat": "解释框架", "name": "上升存续系统", "border": "生命力的上升（能不能更强、更丰盈、越过此刻的样子）", "judge": "生命力不保存，只周转——它得一次次重新挣出来；停下挣的那一刻，剩下的只是还能撑多久｜上升存续系统", "u": "https://zhishuixue.com/thoughts/N-0001.html"}, {"num": "N-0002", "title": "孙子兵法", "full": "孙子兵法——实践学显影", "cat": "系统方案", "name": "先胜存续系统", "border": "胜负在开打之前算不算得出来（两边的力能不能上同一把尺子）", "judge": "胜负在开打之前就已经算定；阵上做的那些，只是让对方把已经写下的结果认下来｜先胜存续系统", "u": "https://zhishuixue.com/thoughts/N-0002.html"}, {"num": "N-0003", "title": "商君书", "full": "商君书——实践学显影", "cat": "系统方案", "name": "一孔存续系统", "border": "国家能种出粮、能拉出兵的实力（农战）", "judge": "国力的存续不看民手里有多少，看全国的力量能不能收进一个出口｜一孔存续系统", "u": "https://zhishuixue.com/thoughts/N-0003.html"}, {"num": "N-0004", "title": "道德经", "full": "道德经——实践学显影", "cat": "系统方案", "name": "损存续系统", "border": "万物相冲而成的那份平衡（阴阳相激而不相害，各归其位）", "judge": "系统能不能久，不看它添了多少，看它有没有强作；强作的地方先坏，不争的地方自全｜损存续系统", "u": "https://zhishuixue.com/thoughts/N-0004.html"}, {"num": "N-0005", "title": "论语", "full": "论语——实践学显影", "cat": "系统方案", "name": "正名存续系统", "border": "名分秩序（每个位置上的名与它该有的事实对不对得上）", "judge": "秩序能不能立住，看名分是否名副其实、人心里是否有那一层肯；只靠刑罚撑着的秩序，名一乱就散｜正名存续系统", "u": "https://zhishuixue.com/thoughts/N-0005.html"}, {"num": "N-0006", "title": "逻辑学", "full": "逻辑学——实践学显影", "cat": "思维工具", "name": "形式存续系统", "border": "从真前提到真结论的通道通不通——形式有没有把真保住", "judge": "真不是靠说服保下来的，是靠形式保下来的｜形式存续系统", "u": "https://zhishuixue.com/thoughts/N-0006.html"}];

function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fill(){
  var sel=document.getElementById('fc'), set={};
  DATA.forEach(function(t){ if(t.cat) set[t.cat]=1; });
  Object.keys(set).sort().forEach(function(v){
    var o=document.createElement('option'); o.value=v; o.textContent=v;
    sel.appendChild(o);
  });
}
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var fc=document.getElementById('fc').value;
  var out=DATA.filter(function(t){
    if(fc && t.cat!==fc) return false;
    if(q){
      var hay=[t.num,t.title,t.full,t.cat,t.name,t.border,t.judge].join(' ').toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
  document.getElementById('cnt').textContent=out.length;
  document.getElementById('list').innerHTML=out.map(function(t){
    return '<div class="th-card">'
      + '<div class="t"><a href="'+t.u+'">'+esc(t.num)+'｜'+esc(t.full)+'</a></div>'
      + '<div class="m">'+esc(t.cat)+'</div>'
      + '<div class="n">命名：'+esc(t.name)+'</div>'
      + '<div class="a"><b>边界：</b>'+esc(t.border)+'</div>'
      + '<div class="a"><b>关键判断：</b>'+esc(t.judge)+'</div>'
      + '<div class="m"><a href="'+t.u+'">阅读全文 →</a></div>'
      + '</div>';
  }).join('') || '<p class="intro">没有匹配的篇目。</p>';
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('fc').addEventListener('change',render);
fill();render();

</script>
