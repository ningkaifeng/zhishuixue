    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统儒学研究（从先秦原典、汉唐注疏、宋明理学到现代新儒学）将儒学视为道德哲学、心性之学或伦理学说；治水学显影补充了存续维度的操作框架——儒学不仅是一套伦理学说，也是「关系存续系统」：人在伦理关系中维持差序位置与名分义务的存续守护结构。
    lead: 儒学是一套系统存续方案，两千五百年前就开始在实践里运作。它划定的边界不是国家、不是个人，而是伦理关系。用五段框架显影它，会浮现一个清晰的判断：关系本身是存续单位，仁、礼、成仁是推动这套方案运转的三种力量。
    sections:
      - k: ① 边界画在哪
        v: '儒学把存续单位画在伦理关系上——不是国家，不是个人，不是仁，而是伦理关系网络。以家庭为核心，由亲及疏、由近及远，形成差序格局。个体只有在关系中获得位置，才成为完整的人；社会只有在关系中保持秩序，才能抵御混乱。

          儒学的系统单位是“关系”而非“个体”——一个孤立的个人在儒学看来是不完整的。存续的问题不是“每个人如何变强”，而是“每个人如何在关系中找到并守住自己的位置”。'
      - k: ② 把什么当最大威胁
        v: '儒学认定的最大威胁，不是外敌入侵、不是天灾饥荒，而是“人伦失序，礼崩乐坏”——五伦（父子、君臣、夫妇、长幼、朋友）失去各自应守的名分与义务，社会的意义网络断裂。真正致命的是内部的角色关系断裂：父不父、子不子、君不君、臣不臣。

          一旦关系的识别标志模糊，人与人之间的协作基础就瓦解。“礼崩乐坏”的真正含义，不是礼仪的形式丢失，而是关系的结构崩塌。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“仁”（仁的创发、君子人格的感召力、时中）。仁是关系中的创发力量，是每个人都有的恻隐之心与向善之性；君子人格的感召力可重新点燃他人的向善之志；“时中”使仁的创发不被僵化为教条。

          仁在传统解释中常被理解为秩序的根源（秩序之所以为秩序），但本文语法中定位为突破性动能——礼把关系再生产为可重复、可预期的交往规范（守成）；仁打破关系中的僵化与断裂，重新激活联结（开新）。

          • 稳定性动能——承载物是“礼”（礼的规范、差序结构、宗法制度）。礼把仁的内在创发转化为可重复、可预期的交往规范，通过仪式化行为、等级化分位、日常化礼节，使关系网络固化。

          • 方向性动能——承载物是“成仁／大同”（天下归仁）。成仁是个体的终极方向——在关系中实现最完善的道德人格；大同是社会的终极方向——“天下归仁”，所有人各安其位、和谐共处。

          配置：以“关系”统摄——仁（创发）驱动 → 礼（规范）维系 → 成仁／大同（天下归仁）定向。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：修身（个人层面正本清源）→ 教化（群体层面感化示范）→ 以德化民（政治层面统治者以身作则）。

          • 底线守护：礼不放、名分不乱。孔子主张“正名”，守住君君、臣臣、父父、子子——只要名分不乱，关系骨架就在，系统就有修复的可能。

          • 共识凝聚：乐、诗、乡约。乐和诗通过情感共鸣，重新把个体编织进关系网络；乡约把伦理关系从血缘家族扩展到地缘社区。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 系统存续的第一要务是关系不能断。关系一断，系统就是一堆人。存续不是要每个人变强，是要每个人在关系里找到自己该站的位置。
