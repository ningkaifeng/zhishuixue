    naming: 平衡存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统阴阳五行研究（从顾颉刚 1930 年《五德终始说下的政治和历史》对其政治起源的考订、李约瑟 1956 年《中国科学技术史》第二卷对其有机宇宙论的定位，到近年出土数术文献对早期阴阳五行材料的重构）多在“哲学框架”与“数术实践”之间给它定位；治水学显影补充了存续维度的操作框架——它也是一套「平衡存续系统」：要保的不是哪一行更强，是它们之间那口气还通不通。
    lead: 阴阳五行最狠的一句话不是“相生相克”，是“亢则害，承乃制”——过了头就是害，压得住才生得下去。用五段显影它，会看见它其实不是一套解释世界的理论，是一把判断“一个整体现在正不正常”的尺：不看哪个零件坏没坏，只看它们之间还平不平、还通不通。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一个整体此刻是在正常运转，还是已经失序——判据不在各个零件好不好，在它们相互之间还平不平、还通不通。这条线一划下来，“找出坏零件换掉”这条路就被排除了：病灶是关系呈现出来的样子，不是某样东西本身。谁过了，谁不足，谁压着谁，谁该生谁却生不出来——要看的全是这些。
      - k: ② 把什么当最大威胁
        v: '它要挡的是“失序会走”。一处失衡不会待在那儿不动，它顺着关系网一路传：这儿过了，就去压它本该受它克的那一处；那一处被压虚了，反过来又去侮它本该克的那一处。传到哪儿，哪儿病。所以这套系统怕的从来不是“某处坏了”，是“坏正在走”而人还没看见。


          它把防线下在还没病的地方，理由就在这里。见肝之病，知肝传脾，当先实脾——看到的是一处，动手却动在下一处；因为等那一处也坏了再治，治的就已经是结果。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“阴阳”：两股相反相成的气，一消一长。阴长则阳消，阳长则阴消；消到极处转生，长到极处转杀。春夏秋冬、生长收藏，全从这一进一退里出来。它是变化之父母——这套系统里一切“动”，源头都在这里。


          稳定性——承载物是“五行生克的那张网”：木生火、火生土、土生金、金生水、水生木，一环扣一环往前推；木克土、土克水、水克火、火克金、金克木，一环压一环往回拉。这张网是闭合的：任何一行都在里头，动了有反馈，过了有东西压它，虚了有东西补它。变化再大，网在，就散不掉。去掉这张网，每一处变化都成了孤立的事——过头的没人管，缺的没人补，攒到某一天整个塌。


          方向性——承载物是“平”：不是两边一样多，是消长还有节。阴平阳秘，精神乃治——该长的时候长得出，该消的时候消得下；过了头有东西压住，虚了有东西补上。它顺带给出的尺是：看这一处还能不能按它该有的节律走——该化的化不动、该生的生不出，就是偏了。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：在还没传开的地方调。不等病成形，先把失衡的源头按住——虚的补上，实的泻掉。压力源是“失序会一路传”，动的办法是抢在它传出去之前，在最上游那一处动手。这一步的分寸全在“早”：等它传开了再动手，动的就已经是结果，不是源头。


          • 底线守护：不许任何一头彻底断掉。阴阳可以偏，不能一方归零——孤阴不生，独阳不长，两边一离决，气就绝了。这一条比调回节律更硬：节律可以慢慢恢复，归零调不回来。所以急的时候先扶住快断的那一头，其余的事往后放。


          • 共识凝聚（预设式）：靠一套共同的归类，不靠商量。春、东、青、酸、肝、怒，全归木；夏、南、赤、苦、心、喜，全归火——它们被放在一处，不是因为本身相同，是因为在同一张关系网里占着同一个位置。医者之间据此交谈，说的是同一件事，不必先议定，也不必彼此说服。它对齐的是看的方式，不是结论，更不是行动：程序先于同意。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 整体能不能撑住，不在零件好不好，在它们之间还转不转得动。
    vision:
      - 它把存续画在“内部关系的平衡”上，所以看得见里头的失调，看不见从外面来的冲击——一场瘟疫、一次饥荒，它只能折算成“外邪”塞进同一张网里，没有位置描述外部结构本身长什么样。
      - 它看得见失衡会传导，看不见传导的速度与阈值——传到哪一步算坏、多快传遍，它只给性质不给数量。同样一句“木旺克土”，慢性和暴发在它这里是一个说法。
      - 它看得见一处的过与不及，看不见哪一处更要害——五行是一个等价的环，没有主次之分；可现实里总有要害与非要害，掐住一处就全停，掐另一处却还能撑。这一层它给不出，五运六气也没有给。
    remainder:
      - “为什么是五”，问到源头是一段沉默。五这个数从五方、五材、五色这些经验里收束出来，收束之后就被当成闭区间用，再没回过头问一句“还能不能不是五”。这不是疏忽，是归纳做完之后收尾没做：框架一旦生效，当初为什么这样收的问题就没人再提。所有配属都挂在这个数上。
      - “五运六气”是这套系统自己长出来的一根补救枝。它按天干地支排六十年的运与气，把气候与疫病也算进来——这一手补的正是这张网自己不长的三样：长周期的时间尺度、从外面来的冲击、以及太过与不及之间的规模差别。补得动规模，补不动结构：它用的仍是同一套五行语言，外部冲击最后还是被折成某一行过盛或不足。枝长出来了，根没有换。
    anchors:
      - k: 关键词
        v: 阴阳、五行、相生、相克、相乘、相侮、亢害承制、阴平阳秘、取象比类、治未病、五运六气、标本中气
      - k: 关键文本
        v: 《尚书·洪范》；《黄帝内经·素问》（阴阳应象大论、六微旨大论、玉机真藏论、至真要大论）；董仲舒《春秋繁露》；周敦颐《太极图说》；《难经》
      - k: 核心争议
        v: 五行说源于五材、五方还是五德终始；阴阳与五行何时合流为一套；配属表是经验归纳还是先验框架；《素问》七篇大论的成书年代；五运六气能否成立
    category: 解释框架
    border: 一个整体此刻正常运转，还是已经失序
    flood: 失序会走——一处失衡顺着关系网一路传，传到哪儿哪儿病，人到那时才看见
    forces: 突破［阴阳］·稳定［五行生克网］·方向［平（消长有节，非等量）］
    operations: 源改［在还没传开处调（虚补实泻）］·底线［不许一头归零］·共识［预设式：共用归类，对齐看的方式］
    judgment: 整体能不能撑住，不在零件好不好，在它们之间还转不转得动｜平衡存续系统
    note: 归目（后验）＝解释框架；规模＝整体内部关系；③稳定＝生克网（过留存闸，非阴阳交感）；方向“平”＝消长有节非静态等量；④预设式只对齐描述不对齐行动；剩余物“五运六气”＝自我补救枝（补规模不补结构）
