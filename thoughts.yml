      摘要: 系统边界＝国家能种粮拉兵的实力（农战）；他要挡的是民不事农战。三股力＝更法／法／农战；三类动作＝堵死农战外的获利路／守法的信用／壹教。
      边界①: 国家能种出粮、能拉出兵的实力（农战）
      洪水②: 民不事农战——人往经商、游说、读诗书求名上走
      三动能③: 更法·法·农战（利出一孔）
      三操作④: 堵死农战外的获利路·刑无等级不赦·壹教
      判断⑤: 国力的存续不看民手里有多少，看全国的力量能不能收进一个出口
      承重件落点: 制度（法、赏罚）为主＋无辅
      三方状况: 文本档
