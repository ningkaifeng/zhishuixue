  - id: N-0020
    num: N-0020
    title: 纯粹理性批判
    full_title: 纯粹理性批判——实践学显影
    naming: 界限存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统《纯粹理性批判》研究（从雅可比 1787 年“没有物自体进不去、有了物自体出不来”的两难、海德格尔 1929 年《康德与形而上学问题》的存在论解读，到斯特劳森 1966 年《感觉的界限》的分析哲学重构、艾利森 1983 年的“两个面向”读法）多在“物自体是否必要”“先验演绎是否成立”上争论；治水学显影补充了存续维度的操作框架——它也是一套「界限存续系统」：要保的不是哪个命题为真，是一套判断还能不能守在被给予的范围之内。
    lead: 康德（1724—1804），《纯粹理性批判》1781 年初版、1787 年再版。它要回答的是：不来自经验、却又能增加内容的判断，怎么可能。用五段显影它，会看见它做的是一件更靠前的事——给知识划一条线，线这边算数，线那边不算数；而划线的依据不是权威，是“它能不能落到一个东西上”。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一个判断有没有落处——它能不能给出一个东西让人看，还是只有概念在自己转。这条线一划，讲灵魂不灭、讲世界有开端、讲上帝存在的那一整套推理就落到线外：它们每一步都严丝合缝，可没有一个能对上一个能被给出来的东西。线不划在这里，“想得通”和“知道”就永远分不开。
      - k: ② 把什么当最大威胁
        v: '它要挡的是理性自己会骗自己。把只对可能经验管用的概念用到可能经验之外，一套推论走下来，没有一步算错，可结论对不上任何东西。这种骗不是疏忽：先验幻相不像普通的错，讲清了就没有；它像插进水里的棍子看上去是弯的——就算你明知道它是直的，它还是看着弯。


          挡不住这一层，就会倒向另一边：什么都不信。前一种病是独断，后一种病是怀疑；这套系统两头都要挡，所以它不能只拆，还得说明白知识凭什么成立。只说“那些都是假的”不算完，得给出真的凭什么真。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“哥白尼式转折”：不是知识去符合对象，是对象必须经过人的形式才能被给出来。这个方向一翻，此前“知识得照着对象来”的假定就立不住了——不是人去够世界，是世界先得过人这道关。它翻的不是某个结论，是知识与对象的关系朝哪边开。


          稳定性——承载物是“图型”：把纯概念翻译成“在时间里长什么样”的那道手续。因果这个范畴，要说清它在经验里怎么现身，就是“时间里的必然先后”；实体，就是“时间里的持存”。概念和直观本来不同类，中间没有这道翻译，概念就落不到东西上，知识也就是空的。去掉它，范畴只剩名字，一切判断都悬着。


          方向性——承载物是“彻底”：每一步都要能追到它的来源，不许有一个环节悬在空中。这股劲推着人往回问：这个结论凭什么？凭的那个又凭什么？一直问到不能再问的地方才停——在康德那里，这个终点是先验统觉：一切表象都必须能够被“我”伴随；再往回问，问本身已经预设了它。它顺带给出的尺是：说不出凭什么成立的，不算数，哪怕它看起来再自然。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：把“开端”和“来源”分开——批判这个动作本身，做的就是把这两件事掰开。一切知识都从经验开始，但不能因此说都来自经验：经验是扳机，不是来源。没有经验，概念落不了地；可概念不是经验给的，是主体自己带上去的整理方式。承认有两个源头，任何一方单独都不够：只有直观，是盲的；只有概念，是空的。


          • 底线守护：这条界不许越——范畴只能用在可能经验之内。一旦越出去，幻相立刻进来，而它进来的时候不打招呼。守不住这一条，前面所有的审查全白做——因为审查的规矩本身就是“只对能给出来的东西有效”；规矩一松，审出来的东西也就不作数了。


          • 共识凝聚（审查式）：把每一个主张送进同一个法庭，问的不是“事实如何”，是“你凭什么”。这个判断来自哪里——来自被给予的，来自知性自己整理的，还是理性越了界？出身说清了，判决自己就下来；说不清的，听起来再顺也不算数。不必信谁，只看能不能过这道审查。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 知识不是想得通，是能落到东西上——落不上的，再严密也只是概念在自己转。
    vision:
      - 它把存续画在“概念的合法性”上，所以看得见越界，看不见线外面怎么走——道德、信仰、审美，它明确划出去，说“那不是知识”；但划出去不是遗弃，是安置，它们在这里没有位置，在别处有位置。所以这条线是它的长处，也是它的止步处：它说清了知识到哪儿为止，没说清界线外面该怎么走。
      - 它看得见知识成立的条件，看不见知识怎么长起来——它给的是地基，不是方法。嫌它的人说：它只讲清了房子必须这么盖，没讲怎么盖得更高。
      - 它看得见“任何一个有理性者”的认识结构，看不见不同时代、不同语言里的人认识得不一样——它假定了一个普遍的认识主体，而这个主体是空的，没有历史，也没有处境。
    remainder:
      - “物自体”是这条界外面的那一半，而它自己说不清那一半是什么。它必须被设出来，否则现象就无所依托；可一旦承认它存在，它又成了一个不能被认识的“东西”，等于在线的另一边放了一样线这边才有的货。这是整套体系最著名的一处别扭——设它，和说它，两件事互相拆台。
      - “我思”里的那个“我”，位置始终不明。它伴随一切表象，是使经验成为我的经验的那个条件；可它自己不在时间里，不能被直观，于是也就不算知识。它到底是认识的结构，还是一个被悄悄实体化的东西？这一问悬在那里，三格都装不下——它既不是力，也不是动作。
    anchors:
      - k: 关键词
        v: 先天综合判断、感性、知性、理性、范畴、图型、先验统觉、物自体、先验幻相、二律背反、哥白尼式转折、超验
      - k: 关键文本
        v: 《纯粹理性批判》A 版 1781／B 版 1787（导言、先验感性论、先验分析论、先验辩证论）；《未来形而上学导论》1783；《实践理性批判》1788
      - k: 核心争议
        v: 物自体是否必要；先验演绎是否成功；哥白尼式转折能否成立；两版之间的改动意味着什么；德国观念论对“物自体”的批评
