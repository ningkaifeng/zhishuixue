  - id: N-0011
    num: N-0011
    title: 进化论
    full_title: 进化论——实践学显影
    naming: 自然选择存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统进化论研究（从斯宾塞 1864 的社会演化读法、费希尔 1930 的群体遗传学综合，到迈尔 1942 的生物学物种概念、道金斯 1976 的基因视角）多把《物种起源》读成“物种演化的机制”，重心在变异与选择怎么运作；治水学显影补充了存续维度的操作框架——进化论不仅是一套生物学机制，也是一套「自然选择存续系统」：它要保的不是物种变不变，是适应能不能在没有设计者的情况下自己形成。
    lead: 达尔文（1809—1882），英国自然学者，1831 至 1836 年随贝格尔号环球，1859 年出版《物种起源》。用五段显影它，会看见一个反直觉的东西：这本书并没有“证明物种会变”——那件事当时已经有人信了；它解决的是另一件更难的事：一只眼睛这样精巧的东西，如果不是有人照着目的做的，还能怎么解释。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：适应能不能不靠设计者自己形成。一旦承认有一个照着目的做的力量，这一整套就没了立足处——它全部的力气都用来交代“没有那个力量，精巧也照样出来”。这条线它写在结尾那几句上：物种不是被分别创造出来的，而是像变种一样，从别的物种传下来的。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“这一切只能归于设计”：一只眼睛的精巧、啄木鸟的喙、寄生蜂把卵产在别人幼虫身上的本能，当时的解释是有个设计者照着用处做的。后果他看在眼里：物种的由来被推到科学之外，自然学家只能描述，不能解释；一旦合用的构造都归给设计，留下的只是赞叹，不是学问。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“变异”：每一代都生出微小的差别，个体之间没有两个完全一样。没有这层差别，就没有可挑的东西，整套停在原样。


          稳定性——承载物是“遗传”：有利的差别能传给后代，一代加一点，不从头再来。没有它，每一代都归零，变了也白变。


          方向性——承载物是“自然选择”：什么算数？活下来、并且留下后代的才算数。长得更合用的留下更多后代，不合用的留下的少，方向就是这么定下来的——不是谁在指，是留下来的那些说了算。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：拿家养动物做对照。人挑了几千年，鸽子、狗、甘蓝变成那么多样子，靠的只是“留种的时候挑想要的”。他做的动作是把“挑选”从人的意图里剥出来，交给自然的差别繁殖——同一个动作，换了执行者。


          • 底线守护：不做目的解释。凡说“为了……所以长成这样”的，一律不算数：不是为了飞才长出翅膀，是长了翅膀的那些活下来了。这条线一破，整套就退回设计论。


          • 共识凝聚：把证据摆到台面上，让任何人自己核一遍——家养变异、地质分布、胚胎相似、退化器官，一条一条列出来；不要求你信，只要求你看。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 物种不是被造出来的，是被留下来的——每一代多一点差别，留下来的那些攒着攒着，就成了另一个物种。
    vision:
      - 它把存续画在“适应能不能不靠设计自己形成”，所以看得见物种怎么一点点变，看不见变化的速度与跳法——渐变是它的底色，突变、灾变、大灭绝，未纳入。
      - 它看得见差别怎么被挑选，看不见这差别靠什么传下去：遗传在书里是一个被用到的事实，不是一个被打开的机制，基因这一层不在它的视野内。
      - 它看得见有用的构造怎么留下，看不见没用的东西怎么也在：中性变异、随机的漂变，它只能归到“不重要的构造”里去。
    remainder:
      - “自然选择”卡在方向与操作之间。它是判准（什么算数），又是动手的那一下（谁来筛）；尺子和手，用的是同一个词。
      - “遗传”卡在稳定与空处之间。它占着让变化留得下来的位置，可它怎么运作，达尔文说不上来——他甚至还倾向“融合遗传”（父母的样子混在一起），而这条路本身是错的。一格实打实的承载物，底下是空的。
      - “物种”卡在①与⑤之间。它既是要保的那道界限（物种可变），又是变化到最后才划出来的结果；要动的东西和动出来的东西，是同一个词。
      - “进步”哪一格都装不下。书里偶尔露出“高等”“进步”的说法，可自然选择没有往哪儿走的目标；它是读者加进去的意思，却处处在，三格都不合适。
    anchors:
      - k: 关键词
        v: 自然选择、变异、遗传、生存斗争、适应、性状分歧、物种、变种、性选择、人工选择、渐变论、共同祖先、退化器官
      - k: 关键文本
        v: 《物种起源》（1859）、《人类由来与性选择》（1871）、《贝格尔号航行日记》（1839）
      - k: 核心争议
        v: 渐变论与跳跃进化的分歧；自然选择的单位（基因、个体还是群体）；中性演化与随机漂变的地位；获得性遗传是否被完全排除；“进步”是否暗含目的论
    category: 解释框架
    border: 适应能不能不靠设计者自己形成
    flood: 一切精巧只能归于设计，物种由来被推到科学之外
    forces: 突破［变异］·稳定［遗传］·方向［自然选择］
    operations: 源改［把挑选从人的意图里剥出来，交给自然］·底线［不做目的解释］·共识［举证式：证据摆上台面，任何人可自核］
    judgment: 物种不是被造出来的，是被留下来的｜自然选择存续系统
    note: 归目（后验）＝解释框架；规模＝物种（文明尺度以下）；④有东西（科学共同体属多主体）；稳定性承载物“遗传”底下是黑箱却不影响系统成立
