      - q: 「双驱存续系统」这个命名是什么意思？
        a: 这是本显影给墨家取的结构命名。依据第⑤段结构判断「内耗靠兼爱化解，浪费靠节用守住——扩张与紧缩双驱」——存续单位是功利效用（兴天下之利、除天下之害，检验标准是总体生存能力），守的方式是一边把关爱扩张到天下、一边把资源紧缩到必要。命名取「双驱」（扩张—紧缩两个驱动）作核心词，后缀「存续系统」为全库统一格式。
        src: 正文①；正文⑤；命名
      - q: 为什么把「兼爱、尚贤」算作突破性动能、「节用、节葬、非乐」算作稳定性动能？
        a: 按三种动能判据分开看：兼爱打破亲疏贵贱界限、把关爱扩到天下（扩张），尚贤把权力交给有能力的人而非血缘最近的人（扩张选择半径），属「能改变」；节用、节葬、非乐把资源收到必要、守住不浪费，属「能持续」；兴天下之利、除天下之害提供终极方向，属「能定向」。传统解释多从伦理或宗教看墨家，本显影只按动能分工定位，不涉价值判断。
