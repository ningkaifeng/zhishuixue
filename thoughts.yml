    lead: 黑格尔（1770—1831），德国古典哲学集大成者。他以“绝对精神”的自我展开为轴，把整个世界理解为一个自我运动、自我认识的总体过程。用五段框架显影，会看到一套“以扬弃矛盾来保住精神不僵死”的辩证方案。
    sections:
      - k: ① 边界画在哪
        v: '黑格尔把存续单位画在“精神”上——不是个人、不是国家，也不只是认识，而是“精神如何自我展开、自我认识、自我实现”的整个运动。

          他有一句总纲：“真理是全体”（Das Wahre ist das Ganze）——任何孤立的部分都是抽象的、不真实的，唯有作为整体的精神，才是真实的存续单位。'
      - k: ② 把什么当最大威胁
        v: '黑格尔认的最大威胁，不是错误，也不是外敌，而是“精神的僵化与分裂”——停留在片面的知性层面，把对立固定化，不肯前进：

          • 僵化：停在正题或反题上，把某一规定绝对化；

          • 分裂：主体与客体、理性与现实的割裂（他批评康德式二元）；

          • 外在化：精神不认识自身，把自身产物当作异己之物。

          三者本质是一个：精神停止了自我运动。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“内在否定性”。矛盾不是要消除的麻烦，而是“一切运动和生命力的根源”，它推动精神否定自身、向前走。

          • 稳定性动能——承载物是“概念的规定性”。每个环节都有确定的规定（Bestimmtheit），体系靠这些规定保持结构，不至于滑成空无。

          • 方向性动能——承载物是“自由”。黑格尔说世界历史是“自由意识的进展”，绝对精神自我实现就是自由的最高形态。

          配置：突破性是引擎（矛盾推动），稳定性是骨架（规定保持），方向性是归宿（自由）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：辩证法 / 扬弃（Aufhebung）。这是黑格尔最核心的操作——不是消灭矛盾，而是“否定同时保存并提升”，把对立双方带到一个更高的合题里。从内在矛盾出发改造，而不是从外部强加。

          • 底线守护（硬字段）：守住不僵化的红线——任何环节都不得被当作终点，必须始终保留被继续扬弃的可能。

          • 共识凝聚：理性（Vernunft）。用概念把握整体，达到“思有同一”——思维与存在的同一，让分散的规定凝成一个可理解的总体。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 精神存续的第一要务，是不怕矛盾、在矛盾中前进——精神的生命不是回避否定，而是“承受死亡并在其中保存自身”，通过不断扬弃，在更高环节里既否定又保存。
    remainder:
      - 体系的封闭性：黑格尔的“绝对精神”宣称体系已完成，后世（如波普尔）质疑其封闭、不容未来；
      - 逻各斯中心：以逻辑 / 概念为最高，情感、身体、实践中的非概念维度接不住；
      - 历史的代价：辩证法把历史的苦难纳入“理性的狡黠”，个体苦难是否被“扬弃”合理化，超出结构提取；
      - 黑格尔学派的分裂：老年黑格尔派 vs 青年黑格尔派（含马克思的翻转），显影取“黑格尔本人体系”，不做谱系。
    anchors:
      - k: 关键词
        v: 绝对精神、扬弃、辩证法、矛盾、自由、全体
      - k: 关键文本
        v: 《精神现象学》（主奴辩证法、“真理是全体”）、《逻辑学》（存在论 / 本质论 / 概念论）、《法哲学原理》（“凡是合理的都是现实的”）
      - k: 核心争议
        v: 体系封闭 vs 开放；辩证法是否可“翻转”（马克思）；“理性的狡黠”与历史苦难
      - k: 历史案例
        v: 拿破仑战争中的黑格尔（称拿破仑为“马背上的世界精神”）、柏林大学讲席与普鲁士国家哲学
    faq:
      - q: 「扬弃」（Aufhebung）是什么意思？
        a: 否定同时保存并提升——不是消灭矛盾，而是把对立双方带到一个更高的合题里，既否定又保留。这是黑格尔最核心的操作。
        src: 正文④
      - q: 「真理是全体」是谁说的？出自哪本？
        a: 黑格尔，出自《精神现象学》序言（Das Wahre ist das Ganze）。意思是任何孤立的部分都是抽象的、不真实的，唯有作为整体的精神才是真实的存续单位。
        src: 正文①；厚度锚点·关键文本
      - q: 黑格尔为什么批评康德？
        a: 因为康德把主体与客体、理性与现实划成二元割裂。黑格尔认为这种分裂正是精神僵化的表现，必须用辩证法统一到更高的整体里。
        src: 正文②分裂
      - q: 马克思对黑格尔辩证法的「翻转」指什么？
        a: 把体系的地基换掉：黑格尔以精神为起点，马克思以物质生产为起点。本文显影取黑格尔本人体系，不做谱系。
        src: 厚度锚点·核心争议
      - q: 「理性的狡黠」是什么意思？
        a: 黑格尔的说法（List der Vernunft）：理性让个人的私欲与激情去行动，却借这些行动实现自身的目的。它是黑格尔历史哲学的核心争议之一——历史苦难是否被「扬弃」合理化。
        src: 厚度锚点·核心争议
      - q: 黑格尔说的「绝对精神」是什么？
        a: 精神自我展开、自我认识、自我实现的整个运动与终点。它不是某个实体，而是整个运动过程；唯有作为整体的精神，才是真实的存续单位。
        src: 正文①
  - id: X-0004
    num: X-0004
    title: 进化论
    full_title: 进化论——实践学显影
    category: 解释框架
    naming: 自然选择存续系统
    date: '2026-10-27'
    license: CC BY 4.0
    border: 物种（通过遗传累积变异的世代链条，无固定本质，只有延续的谱系）
    flood: 环境的淘汰压力（环境变化、生存竞争、灭绝）
    forces: 突破[变异]·稳定[遗传]·方向[适应]
    operations: 源改[自然选择]·底线[自然主义：只能诉诸自然过程，不引入设计者/目的]·共识[共同祖先]
    judgment: 生命存续靠的不是设计而是变异+选择的自然过程，适者存续、不适者淘汰，世代累积产生适应与多样性｜自然选择存续系统
    note: 第四篇；归目＝解释框架；名取判断核心概念「自然选择」（第②级，边界词「物种/种群」宽泛）
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    lead: 达尔文（1809—1882），英国博物学家，进化论创立者。他以“自然选择”为核心，把物种的起源与多样性还原为一个可检验的自然过程。用五段框架显影，会看到一套“靠变异与选择来保住生命不灭绝”的解释框架。
    sections:
      - k: ① 边界画在哪
        v: '达尔文把存续单位画在“物种”上——不是个体（个体终有一死），也不是固定不变的本质（物种会变），而是“一个通过遗传把变异累积起来、在环境中延续下去的世代链条”。

          《物种起源》全书只有一个落点：解释物种如何通过世代累积的微小有利变异而起源与存续。物种没有不变的“本质”，只有延续的“谱系”。'
      - k: ② 把什么当最大威胁
        v: '达尔文认的最大威胁，是“环境的淘汰压力”——环境持续变化、资源有限，生存竞争无时不在，任何不能适应的都会被淘汰：

          • 环境变化：气候、食物、天敌的改变，让原本适应的变得不适应；

          • 生存竞争：个体多于资源所能供养，多数后代活不到繁殖；

          • 灭绝：不适应者在竞争中退场（化石记录里的物种灭绝）。

          三者本质是一个：环境不断出题，不适者出局。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“变异”（可遗传的个体差异）。变异是演化的原材料，不断提供新的可能，没有变异就没有演化的方向可走。

          • 稳定性动能——承载物是“遗传”。遗传把亲代的性状传给后代，既保持物种的连续，也让有利变异能一代代累积下来。

          • 方向性动能——承载物是“适应”。自然选择不断筛出更适应环境者，让生命与环境的关系走向契合——但这个方向不是预设的目标，而是“适应当前环境”这个结果。

          配置：变异是引擎（提供差异），遗传是骨架（保持连续），自然是筛子（筛出适应）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：自然选择。不是设计、也不是拉马克式的“用进废退”，而是从已有的变异中“筛选”——让适应环境的个体存活并留下更多后代，让不适应者被淘汰；世代累积，种群的性状分布就发生了改变。

          • 底线守护（硬字段）：守住“自然主义”的红线——解释生物起源只能诉诸自然过程（变异＋选择），不许引入超自然的设计者或预定目的。

          • 共识凝聚：共同祖先。用“所有生命同出一源”这一共识，把形态万千的生物界凝成一棵可追溯的谱系树，让化石、解剖、地理分布等分散事实都归到同一个解释之下。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 生命存续靠的不是设计，而是“变异＋选择”的自然过程——在环境压力下，适者存续、不适者淘汰，世代累积微小的有利变异，就产生了物种的适应与多样性。
    remainder:
      - 遗传机制的黑箱：达尔文不知道变异如何产生、如何遗传（孟德尔遗传学当时未被发现），“变异—遗传”的物质机制是空的（后来的“现代综合”才补上）；
      - 适应的方向性：自然选择没有预定目标，“进步”是结果不是目的，达尔文式语法不承诺进步的必然性；
      - 利他行为：无法解释工蜂的自我牺牲等利他现象（后来的亲缘选择／群体选择才补）；
      - 社会达尔文主义：把“适者生存”搬到人类社会是误用，达尔文本人不主张，超出结构提取。
    anchors:
      - k: 关键词
        v: 自然选择、变异、生存竞争、适者生存、共同祖先、性选择
      - k: 关键文本
        v: 《物种起源》（1859，自然选择的理论构建）、《人类的由来》（1871，性选择与人类演化）、《小猎犬号航海记》（1839，观察素材）
      - k: 核心争议
        v: 与拉马克（获得性遗传）之争；与设计论／宗教之争（1860 牛津论战，赫胥黎对威尔伯福斯）；融合遗传难题（詹金的“稀释论”反驳）
      - k: 历史案例
        v: 加拉帕戈斯雀（达尔文雀）的分化；华莱士独立提出自然选择（1858 联合宣读）；达尔文拖延二十年才出版（惧怕争议）
    faq:
      - q: 自然选择的核心机制是什么？
        a: 变异提供差异、遗传保持连续、环境做筛选——适应者留下更多后代，世代累积微小的有利变异，种群的性状分布就发生改变。
        src: 正文③④
      - q: 达尔文和拉马克的区别是什么？
        a: 拉马克主张「用进废退＋获得性遗传」（后天获得的性状可传给后代）；达尔文主张从已有变异中「筛选」，不诉诸获得性遗传。这是《物种起源》要驳的核心对手。
        src: 正文④；厚度锚点·核心争议
      - q: 《物种起源》是哪一年出版的？
        a: 1859 年。华莱士 1858 年独立提出自然选择，两人的论文当年联合宣读；达尔文拖延二十年才出版。
        src: 厚度锚点·关键文本／历史案例
      - q: 「适者生存」是达尔文说的吗？
        a: 「适者生存」（survival of the fittest）一词由斯宾塞提出，达尔文自《物种起源》第五版起采用。其含义是「适应当前环境」，不是「更强」或「进步」。
        src: 厚度锚点·关键词
      - q: 社会达尔文主义是达尔文的主张吗？
        a: 不是。把「适者生存」搬用到人类社会是误用，达尔文本人不主张。
        src: 正文·剩余物栏
      - q: 进化等于进步吗？
        a: 不等于。自然选择没有预定目标，「进步」是结果不是目的，这套解释框架不承诺进步的必然性。
        src: 正文·剩余物栏
  - id: X-0005
    num: X-0005
    title: 经典力学
    full_title: 经典力学——实践学显影
    category: 解释框架
    naming: 力学定律存续系统
    date: '2026-10-27'
    license: CC BY 4.0
    border: 宇宙的力学秩序（天体与地面物体共同遵循的、可计算的运动秩序）
    flood: 运动的失序与不可预测（天地分裂、不可预测、无规律）
    forces: 突破[万有引力]·稳定[三大运动定律]·方向[普遍性]
    operations: 源改[数学化+公理化]·底线[不杜撰假说：只描述可计算规律，不臆造引力本质]·共识[统一的力学图景]
    judgment: 宇宙是一部服从统一力学定律的精密机器，用少数定律即可计算并预测一切运动｜力学定律存续系统
    note: 第五篇；归目＝解释框架；名取判断核心概念「力学定律」（第②级，边界词「宇宙/自然」宽泛）
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    lead: 牛顿（1643—1727），英国物理学家、数学家，《自然哲学的数学原理》作者。他用万有引力与三大运动定律，把天上与地上的运动统一到一套数学定律之下。用五段框架显影，会看到一套“用统一力学定律守住宇宙秩序可计算”的解释框架。
    sections:
      - k: ① 边界画在哪
        v: '牛顿把存续单位画在“宇宙的力学秩序”上——不是单个物体，也不是社会，而是“天体与地面物体共同遵循的、可计算的运动秩序”。

          他证明了一件颠覆性的事：天上行星的运转和地上苹果的落地，服从同一套定律。于是“宇宙”第一次成为一个可用数学统一描述的体系。'
      - k: ② 把什么当最大威胁
        v: '牛顿认的最大威胁，是“运动的失序与不可预测”——若天体运动无规律、落体与行星各循其道，世界就是混乱的、无法预测的：

          • 天地分裂：天上（天体）与地上（落体）若各有一套规律，宇宙就没有统一秩序；

          • 不可预测：无法由当前状态推算未来，秩序无从守护；

          • 无规律可循：现象停留在“看起来如此”，不能化约为定律。

          三者本质是一个：秩序无法被把握，宇宙就无法被守护。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“万有引力”。这一个概念把天上与地上统一起来：月球绕地、苹果落地，是同一个力。

          • 稳定性动能——承载物是“三大运动定律”。惯性、F=ma、作用与反作用，让任何运动都可计算、可预测，秩序因此稳定。

          • 方向性动能——承载物是“普遍性”。定律不分天上地下、不因时地而变，指向一个统一的、可理解的宇宙。

          配置：万有引力是引擎（统一天地），三大定律是骨架（保证可算），普遍性是归宿（宇宙作为一部精确的机器）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：数学化＋公理化。从少数公理（三大定律、万有引力）出发，用几何与微积分演绎出整个宇宙的运动——不是停留在现象归纳，而是从公理推到一切。

          • 底线守护（硬字段）：守住“不杜撰假说”（hypotheses non fingo）的红线——只描述能由现象推出、可计算的规律，不为引力臆造形而上学的“本质原因”。

          • 共识凝聚：统一的力学图景。把开普勒的行星定律、伽利略的落体、潮汐、彗星轨道等分散现象，凝聚到同一套定律之下，让整个知识共同体接受一个可计算的宇宙。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 宇宙是一部服从统一力学定律的精密机器——用少数定律就能计算并预测一切运动；掌握了这些定律，就掌握了宇宙运行的秩序。
    remainder:
      - 绝对时空：牛顿预设绝对时间、绝对空间，后被相对论推翻（时空是相对的）；
      - 引力的本质：他“不做假说”，就没解释引力如何传递（超距作用），后由相对论的时空弯曲解释；
      - 确定性≠可预测：三体及以上问题不可解析求解（混沌），牛顿式确定性不等于长期可预测；
      - 微观失效：量子尺度上牛顿力学让位于量子力学；
      - 神学尾巴：“第一推动”的上帝预设，被后世科学剔除。
    anchors:
      - k: 关键词
        v: 万有引力、三大运动定律、绝对时空、公理化、“我不做假说”（hypotheses non fingo）
      - k: 关键文本
        v: 《自然哲学的数学原理》（1687）、《光学》（1704）
      - k: 核心争议
        v: 微积分发明权之争（与莱布尼茨）；超距作用是否可接受；绝对时空之争（与莱布尼茨的克拉克论战）
      - k: 历史案例
        v: 哈雷彗星回归的预测成功；“月亮也是落体”；海王星靠牛顿力学算出
    faq:
      - q: 牛顿三大运动定律是什么？
        a: 惯性定律（不受外力则保持静止或匀速直线运动）、F＝ma（加速度与合外力成正比）、作用与反作用定律（作用力与反作用力大小相等、方向相反）。
        src: 正文③稳定性动能
      - q: 万有引力定律怎么表述？
        a: 任意两物体间的引力与两者质量乘积成正比、与距离平方成反比（F＝G·m₁m₂/r²）。牛顿用它把月球绕地与苹果落地统一为同一个力。
        src: 正文③突破性动能（公式为原典展开）
      - q: 「我不做假说」（hypotheses non fingo）是什么意思？
        a: 牛顿在《自然哲学的数学原理》总注中的表述：只描述能由现象推出、可计算的规律，不为引力的「本质原因」臆造形而上学假说。
        src: 正文④底线守护
      - q: 牛顿和莱布尼茨争的是什么？
        a: 两件事：一是微积分发明权之争；二是关于绝对时空的论战（克拉克书信）——莱布尼茨认为时空不是实体，牛顿主张绝对时空。
        src: 厚度锚点·核心争议
      - q: 牛顿力学在什么情况下失效？
        a: 微观尺度让位于量子力学；高速与强引力让位于相对论；三体及以上问题不可解析求解（混沌），所以确定性不等于可预测。
        src: 正文·剩余物栏
      - q: 《自然哲学的数学原理》是哪一年出版的？
        a: 1687 年。另著《光学》（1704）。
        src: 厚度锚点·关键文本
  - id: X-0006
    num: X-0006
    title: 相对论
    full_title: 相对论——实践学显影
    category: 解释框架
    naming: 相对性存续系统
    date: '2026-10-27'
    license: CC BY 4.0
    border: 时空（物质、运动、引力相互构成的几何结构，时空非固定舞台）
    flood: 参照系的不自洽（光速之谜、超距作用、绝对时空失效）
    forces: 突破[光速不变/时空弯曲]·稳定[协变性/不变量]·方向[统一性]
    operations: 源改[公理重构：换掉地基公设]·底线[相对性原理：所有参照系平权，定律协变]·共识[时空-引力统一图景]
    judgment: 时空不是固定舞台，而是与物质、运动、引力相互构成的结构；用相对性原理+光速不变与等效原理自洽描述一切物理世界｜相对性存续系统
    note: 第六篇；归目＝解释框架；名取判断核心概念「相对性」（第②级，边界词「时空」与牛顿重叠不具区分度）
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    lead: 爱因斯坦（1879—1955），德裔物理学家，相对论创立者。他用“光速不变”与“时空弯曲”重建了牛顿之后的时空观。用五段框架显影，会看到一套“以相对性原理守住物理定律普适性”的解释框架。
    sections:
      - k: ① 边界画在哪
        v: '爱因斯坦把存续单位画在“时空”上——不是物质，也不是力，而是“时空结构本身”。

          广义相对论的一句话总纲：物质告诉时空如何弯曲，时空告诉物质如何运动。引力不是超距的力，而是时空的几何；时空也不再是固定的舞台，而是与物质、运动相互构成的结构。'
      - k: ② 把什么当最大威胁
        v: '爱因斯坦认的最大威胁，是“参照系的不自洽”——若物理定律在不同观察者那里给出不同结果，或牛顿的绝对时空在高速、强引力下失效，物理世界的秩序就无法自洽描述：

          • 光速之谜：光速对任何惯性系都相同，与牛顿的速度叠加规则矛盾；

          • 超距作用：牛顿引力瞬间传递，与“没有信息能超光速”矛盾；

          • 绝对时空失效：时空不是固定舞台，而会随运动伸缩、随质量弯曲。

          三者本质是一个：旧有的“绝对参照”框架崩了，必须重建一个自洽的参照框架。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“光速不变”（狭义）与“时空弯曲”（广义）。光速不变推翻绝对时空；时空弯曲把引力几何化。

          • 稳定性动能——承载物是“协变性”（不变量）。光速、四维间隔是洛伦兹不变量，物理方程在任意坐标变换下形式不变——定律因此普适。

          • 方向性动能——承载物是“统一性”。狭义统一了时空，广义统一了引力与时空几何，并指向一个统一的宇宙图景（爱因斯坦晚年追的统一场论）。

          配置：光速不变／时空弯曲是引擎（突破旧框架），协变性是骨架（保证定律普适），统一性是归宿（一个自洽的宇宙）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：公理重构。从“相对性原理＋光速不变”两个公设出发重建时空观（狭义）；从“等效原理”出发把引力化为时空几何（广义）——换掉地基公设，从源头重建。

          • 底线守护（硬字段）：守住“相对性原理”的红线——所有参照系平权，物理定律必须协变，不许回到“绝对参照”或任何特权观察者。

          • 共识凝聚：时空—引力统一的图景。把引力重新凝聚为“时空弯曲”，让引力、加速、时空三者统一在一个几何图景下；光线弯曲、水星进动、引力红移等证据凝聚共同体的共识。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 时空不是固定不变的舞台，而是与物质、运动、引力相互构成的结构——用“相对性原理＋光速不变”（狭义）与“等效原理”（广义），就能自洽地描述从接近光速到强引力的一切物理世界。
    remainder:
      - 量子力学：爱因斯坦晚年拒绝量子力学的概率解释（“上帝不掷骰子”），相对论与量子力学至今未完全统一（量子引力未解）；
      - 宇宙常数：为维持静态宇宙引入的宇宙常数，被他自嘲“最大错误”，后又因暗能量复活；
      - 奇点：黑洞中心、大爆炸起点，广义相对论在奇点失效（需要量子引力补位）；
      - 统一场论：晚年追求统一引力与电磁力，未竟。
    anchors:
      - k: 关键词
        v: 相对性原理、光速不变、时空弯曲、等效原理、协变性
      - k: 关键文本
        v: 《论动体的电动力学》（1905，狭义相对论）、《广义相对论基础》（1916）
      - k: 核心争议
        v: 与量子力学的玻尔论战（EPR 悖论、“上帝不掷骰子”）；宇宙常数；以太是否必需（迈克尔逊—莫雷实验）
      - k: 历史案例
        v: 1919 爱丁顿日食观测证实光线弯曲；水星近日点进动；GPS 计时需相对论修正
    faq:
      - q: 狭义相对论的两条基本公设是什么？
        a: 相对性原理（所有惯性系中物理定律形式相同）＋光速不变（真空光速对任何惯性系都相同）。
        src: 正文④
      - q: 广义相对论的核心思想是什么？
        a: 从等效原理出发，把引力化为时空几何——物质告诉时空如何弯曲，时空告诉物质如何运动。引力不再是超距的力，而是时空的几何。
        src: 正文①④
      - q: 光速不变是推导出来的还是前提假设？
        a: 是狭义相对论的公设之一，不从其他原理推出；迈克尔逊—莫雷实验否定了以太，为它提供了实验支持。
        src: 正文④；厚度锚点·核心争议
      - q: 牛顿的绝对时空为什么被推翻？
        a: 三处不自洽：光速不变与牛顿的速度叠加规则矛盾；牛顿引力含瞬时超距作用；绝对时空在高速与强引力下失效。旧框架崩了，必须重建自洽的参照框架。
        src: 正文②
      - q: 相对论有哪些实验验证？
        a: 1919 年爱丁顿日食观测证实光线弯曲；水星近日点进动；GPS 卫星计时需按相对论修正。
        src: 厚度锚点·历史案例
      - q: 相对论和量子力学的分歧是什么？
        a: 与玻尔的论战（EPR 悖论、「上帝不掷骰子」）；核心争议在于世界的描述是否本质上是概率性的。
        src: 厚度锚点·核心争议
