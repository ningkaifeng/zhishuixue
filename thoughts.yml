      三操作④: 源改［把本体从实体改写为生生，腾空本体之位］·底线［不许还原为情感、境界，不许以理气心代仁］·共识［预设式：恻隐之心，人皆有之］
      判断⑤: 它把本体安在“生”上：只要有东西在生，这个世界就成立
      承重件落点: 认知规范（主）／个人修养（副）
