    faq:
      - q: 「我思故我在」出自哪本书？原文怎么说？
        a: 出自笛卡尔《谈谈方法》（1637）第四部分，法文原文「Je pense, donc je suis」，后来拉丁文定型为「Cogito, ergo sum」；系统的形而上学展开在《第一哲学沉思集》（1641）。
        src: 厚度锚点·关键文本；正文①
      - q: 《谈谈方法》里的「四条规则」是什么？
        a: ①凡未经清楚明白认识的一律不判断，只接受无可置疑者；②把难题尽可能分解成小部分，逐一解决；③按次序由简到繁思考；④处处作完全枚举与普遍复查，确保无遗漏。这是笛卡尔自述的研究方法准则。
        src: 正文③突破性动能；厚度锚点·关键词
      - q: 「清楚明白」是什么意思？
        a: 笛卡尔判断真假的标准：清楚＝对注意它的心灵而言显明而现成；明白＝清晰到与其他观念分得开、不含混。凡达不到这两条的一律不当真——这是《谈谈方法》的底线。
        src: 正文③；正文④底线守护
      - q: 笛卡尔的「普遍怀疑」是要否定一切吗？
        a: 不是。普遍怀疑是方法不是结论——把一切未经检验的判断（感官、习惯、权威）先悬置起来，看是否还有东西不能被怀疑。结果只剩「我正在怀疑」这件事本身不可怀疑，即「我思故我在」。
        src: 正文④源头改造；正文②
      - q: 「bon sens（良知）」在书里指什么？
        a: 人人都天然具备的分辨真假的能力。笛卡尔开篇说良知是世界上分配得最均匀的东西——正因为人人都有，清楚明白的判断才能被主体间校验，这是他的共识凝聚基础。
        src: 正文④共识凝聚
      - q: 《谈谈方法》哪一年出版？原文是法文还是拉丁文？
        a: 1637年在荷兰莱顿出版，原文为法文（《Discours de la méthode》）而非当时学术通行的拉丁文，原计划作为《折射光学》《气象学》《几何学》三篇论文的导言。
        src: 厚度锚点·关键文本
