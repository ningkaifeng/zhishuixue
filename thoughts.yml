  - id: N-0003
    num: N-0003
    title: 商君书
    full_title: 商君书——实践学显影
    naming: 一孔存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统法家研究（自《汉书·艺文志》著录法家，到近代的法治论与国家能力研究）多把《商君书》读成一部“严刑峻法”“富国强兵”的施政纲领，重心在“手段有多硬”；治水学显影补充了存续维度的操作框架——《商君书》不仅是硬的纲领，也是一套「一孔存续系统」：它要保的不是民富，是全国的力量只有一个出口。
    lead: 《商君书》今存二十四篇，记商鞅及其后学之作，非一时一人之手（作者与成篇年代有争议）。商鞅（约前 390—前 338），战国卫国人，入秦佐孝公变法。用五段显影它，会看见一个反直觉的东西：这部书最狠的地方不在刑罚重，而在“出口”——它把一个人可以向上的路全堵掉，只留一条，再用最硬的信用保证这条路真的通。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：国家能不能种出粮、能不能拉出兵——农战那股实力。不是民的富足，不是君的德望，也不是疆土的大小。他把它写在“国之所以兴者，农战也”里（《农战》），也写在“凡世主之患，用兵者不量力，治草莱者不度地”的算法里（《算地》）——一国的强弱，是田亩与甲兵这两笔能数出来的账。
      - k: ② 把什么当最大威胁
        v: 他要挡的是民不事农战。种田最苦、上阵最险，人自然会往别处走——经商、游说、投权门、读诗书求名声，哪一条路都比耕战省力，还可能更得利。后代价他写在《农战》里：“农战之民千人，而有《诗》《书》辩慧者一人焉，千人者皆怠于农战矣。”一千个种田打仗的人里，只要有一个人靠口舌得了富贵，这一千个人就都懈怠了。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“更法”：秩序可以整个换掉，不必守着古制。“治世不一道，便国不法古”（《更法》）；“汤武不循古而王，夏殷不易礼而亡”（《更法》）。它主张的是：一套法不行了，换一套，不是修补。


          稳定性——承载物是“法”：一旦定下，就是唯一尺度，不许拿好话去改它。“法已定矣，不以善言害法”（《靳令》）；“刑无等级，自卿相将军以至大夫庶人，有不从王令、犯国禁、乱上制者，罪死不赦”（《赏刑》）。它的作用是让每一次赏罚都可预期：民知道做什么得什么、犯什么受什么，不看人、不看情。


          方向性——承载物是“农战”：什么算数，只有种粮与斩首算数。“利出一孔，则国多物”（《靳令》）；“民之欲利者，非耕不得；避害者，非战不免”（《慎法》）。商贾、游说、技艺、学问，都不在这把尺子上。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：堵死农战以外的所有获利路。壹山泽，让山林川泽之利归国；重关市之赋，让经商无利可图；禁游宦之民，让说客没有出路。“民之欲利者，非耕不得；避害者，非战不免”（《慎法》）——不是劝人耕战，是把不耕战的路一条条封上。


          • 底线守护：守法的信用，一步不让。“法已定矣，不以善言害法”（《靳令》）；“刑无等级”（《赏刑》）；“自卿相将军以至大夫庶人，有不从王令、犯国禁、乱上制者，罪死不赦”。红线是排除式的：有罪者虽有功不赏，违法者虽贤不赦——法的信用一破，前面堵的路就全白堵。


          • 共识凝聚：壹教。只留农战一种算数的活法，其余一概不许换来名利。“所谓壹教者，博闻、辩慧、信廉、礼乐、修行、群党、任誉、清浊，不可以富贵，不可以评刑，不可独立私议以陈其上”（《赏刑》）。不是说服人相信什么，是把别的说法从得利的路上拿掉。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 国力的存续不看民手里有多少，看全国的力量能不能收进一个出口；出口一多，力就散在各处，收不回来。
    vision:
      - 它把存续画在“能不能种出粮、拉出兵”上，所以看得见田亩与甲兵，看不见工商、技艺、学问——凡不直接产粮出兵的事，在它眼里都是消耗——这不是它错，只是它不负责。
      - 它看得见法能立信，看不见法由谁来改：法一旦定死，改法的口子也一并关上了，后来想改的人找不到入口。
      - 它看得见民被安置在什么位置上，看不见民怎么想：壹教之下没有私议的位置，代价是没有人能说“这样不对”。
    remainder:
      - “法”卡在突破与稳定之间。作为“更法”，它是改变（治世不一道，便国不法古）；作为“法已定矣，不以善言害法”，它是维持。两格都进得去，只写一格，“更法”那一面就被压薄——而那恰恰是这部书最锋利的地方。
      - “壹教”分不清是共识凝聚还是方向性判准。它一边把众人的想法收到一处（对主体间关系动手），一边规定“什么算数”（判准）。两者在这一处重合，归哪边都只剩一半。
      - “刑赏”既是稳定也是改源。作为“民知所避就”的秩序，它落在稳定；作为用重罚改变人行为的工具，它落在源头改造。同一套刑赏，两格都说得通。
      - “弱民”哪一格都装不下。它是手段（削弱民力以防对抗）、是结果（民朴则易使）、还是目的？三股力与三类操作里都没有它的位置，可它确实在这套方案的边界内。
      - “粟爵粟任”（纳粟得爵）卡在赏与方向之间。作为赏，它是稳定；作为利出一孔的一部分，它是方向。归哪边都会漏掉另一半。
    anchors:
      - k: 关键词
        v: 农战、壹赏、壹刑、壹教、利出一孔、刑无等级、什伍连坐、军功爵、开塞、弱民、朴民、作壹
      - k: 关键文本
        v: 《商君书》今存二十四篇，重点在《更法》《农战》《赏刑》《靳令》《开塞》《算地》《外内》《慎法》《定分》
      - k: 核心争议
        v: 作者与成篇年代（商鞅亲撰、商鞅后学辑录诸说）；二十四篇真伪与《商君书》和秦制的距离；“弱民”“壹教”是否被后世夸大
