  - id: N-0007
    num: N-0007
    title: 仁学本体论
    full_title: 仁学本体论——实践学显影
    naming: 仁体存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统中国哲学研究（冯友兰 1934 的“全德”说、牟宗三 1968 的“道德本心”说）多把“仁”读成德性或本心，重心在道德实践与心性论；治水学显影补充了存续维度的操作框架——《仁学本体论》不仅是一套本体论主张，也是一套「仁体存续系统」：它要保的不是人应当如何，是“仁”还能不能坐在本体的位置上。
    lead: 陈来，1952 年生，清华大学哲学系教授，治中国哲学史，著有《朱子哲学研究》《有无之境》《古代宗教与伦理》，2014 年出版《仁学本体论》。用五段显影它，会看见一个反直觉的东西：这本书讲的不是人应当怎样去爱，而是世界凭什么算一个世界。中国思想里最像伦理学的那个字——仁——被它拿去干了本体论的活，而它给出的本体不是实体，是“生”。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：“仁”占不占得住本体之位。一旦仁只被读成人的道德情感、社会规范或修养境界，本体之位让给理、让给气、让给心、让给情中的任何一个，这一整套立刻散架。这条线它借程颢的话立起来：“仁者以天地万物为一体”（《识仁篇》）。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“仁”被分掉：近代学科把仁分给伦理学，把本体分给西方形而上学，仁只剩下“应当”这一半。后果他看在眼里——仁若只是情感，“天地以生物为心”就成了一句比喻，人与物、人与人的相通再没有存在论上的依据，儒学在宇宙论这一层开不了口。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“生生”：天地不断生物的那股力，仁就是它。它不是从外面推动世界，它就是这个世界的生在继续。


          稳定性——承载物是“论证的延续”：这个结论靠后来的人不断重述、注疏、讲授才留得下来，不是靠制度、习惯去维持。它管到的是接着论下去的人，不约束日常行为。


          方向性——承载物是“感通”：一个东西仁不仁，看它还通不通。“医书言手足痿痹为不仁”（程颢语），麻木即不仁。通得了才算数。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：动的是“本体”这个定义。它把本体从“实体”改写为“生生”，先腾空本体之位，再把仁放上去。压力源没有被消掉，是被换掉了定义方式。


          • 底线守护：三条不许破——不许把仁还原为心理情感，不许把“万物一体”降为主观境界，不许以理、以气、以心代仁。触线即不成立。


          • 共识凝聚：预设式——“恻隐之心，人皆有之”，不靠说服，靠断言人人本来就有。它不做凝聚的动作，把共通当成既成事实摆在前面：不必让人相信彼此相通，只须指出本来就通。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 它把本体安在“生”上：只要有东西在生，这个世界就成立；一旦不生，名目排得再齐也不算数。
    vision:
      - 它把存续画在“仁占住本体之位”，所以看得见生生的连续与万物的相通，看不见那些不生新物、只靠名目与惯例延续的秩序——这不是它错，只是它不负责。
      - 它看得见一体的实相，看不见一体的账：谁在维持这个整体、维持它要谁付出什么，未纳入。
      - 它看得见本体论的论证，看不见人怎么在具体位置上把它做出来——工夫、礼制、教化，不在它的视野内。
      - 它看得见一个论证怎么占住一个位置，看不见这个位置由谁承认：谁算有资格裁决本体之争，未纳入。
    remainder:
      - “生生”卡在突破与方向之间。它是天地生物的那股力，又是“能生者算数”的判准；力与尺同出一词，拆不开。
      - “一体”卡在边界与方向之间。它是要保的那个东西（边界）；可“通不通”之所以能当判准，前提正是万物本来一体——它同时是判准的底。
      - “一体”与“天地以生物为心”之间没有桥。一体说的是万物本来如此，是实然；“为心”说的是天地有意于生，带进了取向。从“是”跨到“为”，这一段靠的不是论证，是“大家都这么认”。
      - “情”卡在洪水与底线之间。它在洪水位要挡的，是“情”被抬成唯一的本体（情本体）；可仁自己不能无情——恻隐一起，情就在里头。挡的是情本体，用的是情，两个字贴得太近，容易被读成同一件东西。
      - “仁包四德”哪一格都装不下。义、礼、智在仁中各得一位，这是概念里的位置，不约束任何人：既不是力，也不是动作，也不是让变化留得下来的秩序。它确实在这套方案的边界内，却三格都不合适。
    anchors:
      - k: 关键词
        v: 仁体、生生、一体、同体、感通、天地以生物为心、万物一体、仁包四德、恻隐、麻木不仁
      - k: 关键文本
        v: 《仁学本体论》（陈来，2014，生活·读书·新知三联书店）；所本：程颢《识仁篇》、朱熹《仁说》、张载《西铭》、王阳明《大学问》、《易·系辞》
      - k: 核心争议
        v: 仁能否为“体”（全德与本体之别）；“万物一体”是存在论命题还是价值理想；仁与情的关系；中国思想有无“本体论”、与实体本体论如何区分
    category: 解释框架
    border: 仁占不占得住本体之位
    flood: 仁被分给伦理学、本体被分给西方形而上学，仁只剩“应当”一半
    forces: 突破［生生］·稳定［论证的延续］·方向［感通］
    operations: 源改［把本体从实体改写为生生，腾空本体之位］·底线［不许还原为情感、境界，不许以理气心代仁］·共识［预设式：恻隐之心，人皆有之］
    judgment: 它把本体安在“生”上：只要有东西在生，这个世界就成立｜仁体存续系统
    note: 归目（后验）＝解释框架｜据书名“本体论”的自我定位，原句待核；稳定性薄属范围性（本书不管装置一层），非主张性；规模＝文明
