    faq:
      - q: 陈来《仁学本体论》是哪一年出版的？「新原仁」这个别名怎么来的？
        a: 2014 年由生活·读书·新知三联书店出版；同年《文史哲》第 4 期先發表同名论文。「新原仁」是作者自题的别名，呼应冯友兰「贞元六书」中的《新原人》《新原道》《新原理》一系——意为「接着讲」而非「照着讲」，是当代儒家本体论重建的一次尝试。
        src: 厚度锚点·关键文本
      - q: 「仁体」是什么？为什么说它不是实体、不是心、不是理？
        a: 仁体是以仁为本体、万物关联共生为一整体的那个「体」。说它不是实体，是反对把本体当作静态的、可对象化的共相；说它不是心，是不取心本体（熊十力一路）；说它不是理，是不取理本体（冯友兰一路）。陈来的主张是：本体是「关联—生生—一体」本身，是活的、有创生力的关系整体。
        src: 正文①；厚度锚点·核心争议
      - q: 「仁体存续系统」这个命名是怎么取的？
        a: 按显影命名规则取第⑤段结构判断的核心概念，并直接沿用原典专名「仁体」——既保住与原典的锚点，也让名称自解释（看到「仁体」就知道显影对象是哪一家）。不用「生生存续系统」是因为「生生」只是仁体的一层属性，会丢掉「关联」「一体」两层。
        src: 正文⑤；备注
      - q: 「翕辟」是谁的概念？为什么显影要标「借用熊十力语汇」？
        a: 翕辟出自熊十力《新唯识论》的「翕辟成变」：辟是发散、开创的创生之势，翕是收摄、凝聚的成物之势，二者相反相成而非高低。陈来吸收了这对语汇来描述仁体的两种势用。显影标注「借用」是因为：这对概念不是陈来原创，用它来讲三种动能属于显影者的翻译，不是《仁学本体论》原文的术语。
        src: 正文③；备注
      - q: 「他者优先」的恕，与儒家「差等之爱」是否矛盾？
        a: 这是学界对仁学的一处真实张力。儒家讲爱有差等（亲亲而仁民，仁民而爱物），而「他者优先」带有列维纳斯式的伦理意味。陈来的处理是把恕（己所不欲勿施于人）作为感通的作用方式——不是取消差等，而是让感通不自我封闭。显影只取「方向」这一层（恕定方向），不介入差等与平等的争论，该争论写入「剩余物」。
        src: 正文③方向性动能；厚度锚点·核心争议；剩余物
      - q: 《仁学本体论》与心本体、情本体、理本体是什么关系？
        a: 它是「接着讲」现代新儒家的最新一环，与三家都构成对话关系：熊十力的心本体、李泽厚的情本体、冯友兰的理本体。陈来的立场是把三者都视为「仁体的遮蔽」形式——实体化（理）、心化（心）、情化（情），认为它们都抽掉了仁的「关联」与「生生」。具体论争属思想史，显影写入「剩余物」不展开。
        src: 正文②；剩余物；厚度锚点·核心争议
