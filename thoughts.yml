      - q: 「巨子」是什么？墨家为什么在「非国家组织」条件下也有执行力？
        a: 巨子是墨家团体的领袖（组织首领）。墨家有严密的组织（巨子制），成员服从巨子、纪律严格；加之「天志」「明鬼」提供了一套超越世俗权力的信仰约束——这使墨家在非国家组织条件下仍有执行力，可以「赴汤蹈火、死不旋踵」。显影把巨子制作为共识凝聚（祭祀）的组织承载物。
