  - id: X-0016
    num: X-0016
    title: 墨家
    full_title: 墨家——实践学显影
    category: 系统方案
    naming: 双驱存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统墨家研究（从先秦诸子到现代思想史）将墨家视为兼爱非攻的和平主义、功利主义（后果论）或名辩逻辑的先驱（墨子约前468—前376）；治水学显影补充了存续维度的操作框架——墨家不仅是一套兼爱学说或名辩逻辑，也是「双驱存续系统」：社会在兼爱扩张与节用紧缩的双驱中维持总体生存能力的存续守护结构。
    lead: 墨家是一套系统存续方案。它划定的边界不是关系、不是自然、不是权力，而是效用。用五段框架显影它，会浮现一个反常识的结构：墨家一边主张把关爱扩张到天下（兼爱），一边主张把资源紧缩到必要（节用）——扩张与紧缩，两个相反的方向在同一套方案里并存。
    sections:
      - k: ① 边界画在哪
        v: '墨家把存续单位画在功利效用上——一个系统要活下去，需要多少资源？这些资源被用在何处是值得的？如果资源被无谓地消耗掉，系统无论多么道德、多么自然、多么有权势，都会走向崩溃。

          墨家的系统单位是“效用”——兴天下之利，除天下之害。一切制度、行为、主张，都要经过效用检验：它是否增加了系统的总体生存能力？是否减少了无意义的消耗？'
      - k: ② 把什么当最大威胁
        v: '墨家认定的最大威胁有两个，而且分得很清：

          • 内耗——人与人相互损耗。亲疏贵贱的界限让人各亲其亲、各子其子，为了各自的近亲争夺资源，系统在内部的相互消耗中散掉。这是关系问题。

          • 浪费——资源投向低效处。厚葬久丧、繁饰礼乐、攻城略地，把资源投在不能增加总体生存能力的地方。这是配置问题。

          内耗和浪费是两个不同的威胁，墨家各有一套机制应对：兼爱治内耗，节用治浪费。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“兼爱、尚贤”（非攻）。兼爱要求打破亲疏贵贱的界限，让关爱惠及所有人——这是“扩张”：把爱的范围从近亲扩到天下，直接消解内耗的根源（各亲其亲的争夺）；尚贤把权力交给有能力的人而非血缘最近的人，同样是在扩张选择的半径。

          • 稳定性动能——承载物是“节用、节葬、非乐”。这是一套“紧缩”制度——把资源从低效处收回、转向生产，直接治浪费。

          • 方向性动能——承载物是“兴天下之利、除天下之害”。以天下总体利益为方向，而非某国某家的局部利益——注意“天下”二字，这是一种超越了血缘和政治边界的普世效用观。

          配置：扩张与紧缩双驱——兼爱（扩张：爱的范围扩到天下）驱动，节用（紧缩：资源的消耗收到必要）维系，兴利除害（天下总效用）定向。

          组织载体：这套观念能落地，靠墨家严密的组织——巨子制、墨者集团、赴汤蹈火死不旋踵。没有这个组织，兼爱节用只是主张；有了巨子制，它们才有执行者。组织形态是这套存续方案不可分割的一部分。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：尚贤使能。在权力源头打破世袭制，让能力而非出身成为任职标准。一个无能的贵族占据要职，消耗的不仅是他的俸禄，还有整个系统因决策错误而付出的代价。尚贤使能就是从源头堵住这个漏洞。

          • 底线守护：节用、非攻。节用是守住资源底线——不做任何浪费资源的事；非攻是守住生命底线——反对一切攻伐征战，因为它们消耗最大、收益最少。墨子在止楚攻宋时展现的不仅是和平主义理想，更是一套冷峻的成本核算：攻城之战消耗的资源和生命，远远超过任何可能的收益。

          • 共识凝聚：兼爱、天志、明鬼。兼爱是最高的伦理共识——人人兼爱，内耗自消；天志和明鬼则是墨家独特的社会控制机制：天有意志会赏善罚恶，鬼有灵明会监督人的行为。

          为什么墨家用“天”而不用“法”？法家直接用刑赏，更省事——但法家是国家，有暴力机器执行规范。墨家是游士团体，没有国家机器，只能借超越性权威做外部约束。天志明鬼不是信仰选择，而是非国家组织的执行力替代方案。'
      - k: ⑤ 压成一句什么判断（结构判断）
