  - id: X-0012
    num: X-0012
    title: 仁学本体论
    full_title: 仁学本体论——实践学显影
    category: 解释框架
    naming: 仁体存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统儒学研究（自宋明理学“仁者浑然与物同体”，至熊十力、冯友兰、李泽厚的现代新儒家本体论）将仁视为伦理概念、或心体／性体／理体；治水学显影补充了存续维度的操作框架——《仁学本体论》不仅是儒家形而上学的重建，也是「仁体存续系统」：万物在仁体中维持关联与生生的存续守护结构。
    lead: 陈来（1952—），清华大学教授、国学研究院院长，当代儒家哲学代表人物。《仁学本体论》（2014）别名“新原仁”，是他回应“中国哲学登场”、重建儒家形而上学的代表作。用五段框架显影它，会浮现一个清晰的判断：这部书真正要做的，是把“仁”从一个伦理概念提升为“本体”——世界的根基不是实体、不是心、不是理，而是“关联、生生、一体”的仁。
    sections:
      - k: ① 边界画在哪
        v: '仁学本体论把存续单位画在“仁体”上——不是某个存在物、不是心、不是理，而是“以仁为本体的、万物关联共生的整体”。

          陈来的核心命题：本体不是实体、不是理、不是心，而是“仁”。传统儒学“万物一体”既是精神境界，也指“万物关联共生的整体”——这个整体就是仁体。存续单位是仁体：万物关联、生生不息的一体。'
      - k: ② 把什么当最大威胁
        v: '仁学本体论认的最大威胁，是“仁体的遮蔽／断裂”——关联断裂、生生停滞：

          • 实体化：把本体理解成静态的实体／共相（如“理”“大全”），抽空了仁的关联与生生；

          • 心／情化：把本体落在心（心本体）或情（情本体）上，仁体被降格为一己之心或经验情感；

          • 隔绝化：万物一体的断裂——“麻木不仁”，失去感通，自我与万物隔绝。

          三者本质是一个：本体从“活的关系（关联＋生生）”变成“死的规定（实体／心／情）”，仁体的生生与一体被遮蔽。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“生生之仁（辟之势用）”。“天地之大德曰生”，仁体的创生、发散倾向，是万物生成的力量。缺它：有关联有方向，却无创生之力。（借用熊十力翕辟语汇：辟为创生之势）

          • 稳定性动能——承载物是“一体之仁（翕之势用）”。万物关联共生、感通固结的一体秩序，把创生收拢为可感之物。缺它：有创生有方向，却守不住关联之形。（翕为成物之势；陈来吸收此框架，落点在“关联本身即本体”）

          • 方向性动能——承载物是“恕（他者优先）”，感通为其作用方式。仁体通过恻隐、感通向他者敞开，“己所不欲勿施于人”是价值定向。缺它：有创生有关联，却搞不清向谁、为何。

          配置：以“仁体”统摄——生生（辟，创生）驱动 → 一体（翕，成物）维系 → 感通·恕（他者优先）定向。

          注：翕辟为熊十力语汇，陈来吸收转化；感通—恕的具体文本表述见厚度锚点，本文作结构显影近似，非逐字引证。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：体仁／识仁。作用对象＝仁体的遮蔽（实体化、心化、情化），动作＝回到“关联—生生—一体”的仁体本身，从死规定回到活的关系。

          • 底线守护（结构反推）：守住生生与一体。作用对象＝系统边界，动作＝不许本体退化为静态实体、孤绝心体、一己经验情感。生生不息、万物一体是显影判据下的不可破边界（非陈来原文术语，系结构反推）。

          • 共识凝聚：一体之仁的感通实践。作用对象＝主体间关系，动作＝以“恕”（他者优先、平等不自我中心）建立“我与他者一体共生”的秩序认同。此“共识”非意见妥协，是“一体共生”的本体论认同。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 世界的本体不是实体、不是心、不是情，而是仁——关联、生生、一体；守住仁体的生生与一体，万物在感通中存续。
    remainder:
      - 翕辟体用关系的精细推演：属熊十力原教，陈来仅吸收未展开；
      - 与西方本体论的深度对话（萨特、海德格尔、布伯关系本体、列维纳斯他者伦理）的细节，不纳入；
      - “仁统领自由、平等、公正”这一现代价值的安放，是应用层，不纳入；
      - 与心本体（熊十力）、情本体（李泽厚）、理本体（冯友兰）的具体论争，属思想史争论。
    anchors:
      - k: 关键词
        v: 仁体、万物一体、生生之仁、翕辟、感通、恕（他者优先）、恻隐之心
      - k: 关键文本
        v: 陈来《仁学本体论》（2014，别名“新原仁”）；《文史哲》2014 年第 4 期同名论文；熊十力《新唯识论》（翕辟成变）；程颢《识仁篇》“仁者浑然与物同体”、王阳明《大学问》万物一体论
      - k: 核心争议
        v: 仁体与心／情／理本体的高下；“他者优先”与儒家“差等之爱”的张力；儒家非宗教人道主义能否成为社会凝聚力
      - k: 历史案例
        v: 获思勉原创奖（2015）、全球华人国学大典国学成果奖（2016）；作为“接着讲”现代新儒家（熊十力、冯友兰）的最新一环
