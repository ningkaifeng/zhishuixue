    faq:
      - q: 林毅夫是谁？《新结构经济学》是哪一年提出的？
        a: 林毅夫（1952—），中国发展经济学家，曾任世界银行首席经济学家（2008—2012，首位来自发展中国家的该职）。《新结构经济学：反思经济发展与政策的理论框架》2012 年出版（英文版由世界银行同年出版；「新结构经济学」这一命名是 2009 年在世行内部讨论会上提出的），标志该理论正式成书；其思想可上溯到他 1994 年与蔡昉、李周合著的《中国的奇迹》。
        src: 厚度锚点·关键文本；正文导语
      - q: 新结构经济学里的「结构」指什么？为什么叫「新」？
        a: 「结构」指经济体的产业结构、技术结构等，由要素禀赋结构（资本、劳动、技术、自然资源的相对丰缺）内生决定。叫「新」是相对于 20 世纪 50—70 年代的「旧结构主义」：旧结构主义主张政府直接推动重工业、忽视禀赋，新结构经济学主张结构变迁要顺应禀赋结构、政府只做「因势利导」。
        src: 正文①；厚度锚点·核心争议
      - q: 「比较优势存续系统」这个命名是怎么取的？
        a: 按显影命名规则取第⑤段结构判断的核心概念。判断句是「经济体存续靠禀赋结构与比较优势的内生匹配」，核心词落在「比较优势」；边界词「经济体」太宽泛、不具区分度（换成任何经济体理论都成立），故取核心概念命名。
        src: 正文⑤；备注
      - q: 什么是「自生能力」？它和比较优势是什么关系？
        a: 自生能力指一个企业在开放竞争市场中，不需要政府补贴即可获得正常利润的能力。林毅夫认为，企业是否具备自生能力，取决于它的产业技术选择是否与禀赋结构（比较优势）一致——遵循比较优势则自生，违背则需补贴维持。显影中自生能力是「禀赋匹配」的结果判据。
        src: 厚度锚点·关键词；厚度锚点·核心争议
      - q: 新结构经济学与「华盛顿共识」的争论焦点是什么？
        a: 华盛顿共识主张「最小政府」：私有化、自由化、宏观稳定，政府尽量少干预；新结构经济学认为政府不是要不要的问题，而是做什么的问题——市场缺制度基础设施时，政府要「因势利导」补足，否则交易成本过高、比较优势无从发挥。显影把这一分歧落在②「自由放任」那条威胁上。
        src: 正文②；厚度锚点·核心争议
      - q: 「赶超战略」和「自由放任」方向相反，为什么都是威胁？
        a: 因为它们都是「偏离内生匹配」：赶超战略是政府跑在禀赋前面（超前违背比较优势），自由放任是政府没跟上禀赋（制度供给不足）——一前一后，都是让结构离开了禀赋结构这个锚。显影在②把两者与「遗留扭曲」并列为三向偏离：超前、缺位、滞留。
        src: 正文②；正文③
