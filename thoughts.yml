    naming: 可算存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统科学史研究（从科瓦雷 1939 的“从封闭世界到无限宇宙”、韦斯特福尔 1946 的牛顿体系研究，到科恩 1980 的科学革命编史学、夏平 1994 的社会建构读法）多把《原理》读成“近代物理学的奠基”，重心在定律的发现与数学方法；治水学显影补充了存续维度的操作框架——经典力学不仅是一套定律，也是一套「可算存续系统」：它要保的不是世界为什么这样，是下一刻能在哪儿被算出来。
    lead: 牛顿（1642—1727），英国数学家与物理学家，1687 年出版《自然哲学的数学原理》。用五段显影它，会看见一个反直觉的东西：这部书几乎不解释“为什么”，它把“为什么”划到界外，只做一件事——算。它之所以立得住，不在说清了引力是什么，在算出来的数对得上天上的位置。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：运动算不算得出来——给定此刻的位置、速度与受力，下一刻在哪儿。一旦运动只能描述、不能预报，这一整套就没了立足处：它全部的力气都用来把“下一刻”钉成一个数。这条线它画在书的体例上：先下定义，再立公理，再把一条条命题推出来——凡是推不出、算不出的，都不进这门学问。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“只能这样说、算不出来”：东西为什么往下掉，当时的答案是重的东西要回到它该在的地方；行星为什么绕着走，答案是天上本来就圆满，圆周最完美。后果他看在眼里：位置算不准，航海靠经验表一张张试，天上一套规律、地上一套规律，各管各的，谁也不通谁。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“力”：外面加上去的、可以量出来的那一下。没有它，物体不会改变自己的运动；有了它，速度就按它的大小和方向改。天上地下能并成一套，靠的就是这个字在两处指的是同一件事。


          稳定性——承载物是“惯性”：已经在动的东西，会照原样一直动下去，不需要谁推着。这一条让一次推动不必反复施加，也让“没有力的时候会怎样”有了一个确定的默认。


          方向性——承载物是“数理信念”：自然是照着数学写成的，凡事都能算出一个确切的数。这股劲推着他把天上地下都并进同一套算法；至于“算得对才算数”，是这套信念顺带给出的尺。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：先把词钉死。质量、动量、力、时间与空间，一样一样给定义，含糊的“重”“轻”“快”“慢”换成可以称、可以量的东西；定义完了才从定义往下推。压力源是“说不清”，动的办法就是让它必须说得清。


          • 底线守护：不做假说。凡不能被观测检验、只能靠想象补上的解释，一律不进系统——引力为什么能隔着这么远起作用，他不答，只说这已经够了。这条线一破，整套就退回成一套哲学猜想。


          • 共识凝聚（举证式）：把方法交出去，让任何人自己算一遍。从定义和定律出发，一步一步推到行星的位置，每一步都可以被复核；不要求你信他，只要求你按这个算法算。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 天和地归同一套算法：给出现在和力，下一刻就定了——不是它想去哪儿，是它只能去哪儿。
    vision:
      - 它把存续画在“运动算不算得出来”，所以看得见可测的量，看不见不可测的东西——引力靠什么传过来、力的本质是什么，它明确划到界外，未纳入。
      - 它看得见匀速与加速度，看不见这套算法自己的边：绝对的空间与时间、速度可以直接相加，在它那里是不用证明的前提；接近光速、极小尺度时这套算法失效，这一层不在它的视野内。
      - 它看得见一个物体的轨道，看不见大量个体凑在一起会长出另一种规律——分子的整体行为、统计性的法则，不在它的视野内。
    remainder:
      - “力”卡在突破与方向之间。它是改变运动的那一下，又是判断有没有外作用的依据——看见加速度，反推有力。手和尺是同一个词。
      - “惯性”卡在稳定与前提之间。它让运动留得下来，是这一格实打实的承载物；可它本身又是第一定律规定的，一个被规定下来的东西，当了后面全部的默认。
      - “绝对时空”哪一格都装不下。它不是力，不是秩序，也不是判准；它是这三样共同踩着的地面，本身却不参与任何一格。
      - “万有引力”卡在③与界外之间。它把天上地下并成一套，是这套系统最硬的成果；可它“隔着空处起作用”的性质，牛顿自己拒绝解释，于是它一半在系统里，一半被推到界外。
    anchors:
      - k: 关键词
        v: 三大定律、惯性、力、质量、动量、万有引力、绝对空间、绝对时间、超距作用、公理、命题、假说
      - k: 关键文本
        v: 《自然哲学的数学原理》（1687）、《光学》（1704）；1684 年致哈雷论轨道的书信
      - k: 核心争议
        v: 万有引力是实在的相互作用还是数学描述；绝对时空是否必要（马赫与爱因斯坦的质疑）；“我不构造假说”的真意；力的本体论地位
    category: 解释框架
    border: 运动算不算得出来：给定此刻的位置、速度与受力，下一刻在哪儿
    flood: 只能这样说、算不出来；天上一套规律地上一套规律
    forces: 突破［力］·稳定［惯性］·方向［数理信念］
    operations: 源改［先把词钉死：定义先行］·底线［不做假说］·共识［举证式：方法交出去，自己算一遍］
    judgment: 天和地归同一套算法：给出现在和力，下一刻就定了｜可算存续系统
    note: 归目（后验）＝解释框架；规模＝宇宙（天上地下同一套）；④举证式第二例（供方法，不供材料）；方向性承载物由“定量”改为“数理信念”（定量是尺不是力）
