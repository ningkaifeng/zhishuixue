  - id: X-0007
    num: X-0007
    title: 易经
    full_title: 易经——实践学显影
    category: 辩证方法
    naming: 变易存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统易学研究（自《易传》十翼以降，汉象数、宋义理两大传统）将《易经》视为卜筮之书或宇宙变化之理；治水学显影补充了存续维度的操作框架——《易经》不仅是对变化的描述，也是一套“在变易中如何存续”的结构判断。
    lead: 《易经》号称“群经之首”，六十四卦、三百八十四爻，历来被当作卜筮之书，也被读成宇宙变化的哲学。用五段框架显影它，会浮现一个反直觉的事实：这部书真正关心的不是“变化是什么”，而是“变化之中，一个系统如何存续”——它不预言未来，它教人在任何时位下如何判断、如何自处。
    sections:
      - k: ① 边界画在哪
        v: '《易经》把存续单位画在“变易中的整体”上——不是个人、不是国家、也不是某一个固定状态，而是“万物在阴阳交感中生生不息的整体”。

          《系辞》一句话点题：“生生之谓易”——易不是一套关于固定实在的学说，而是“持续生成”本身。存续的单位，就是一个永远在生成、转化、代谢中的动态整体。

          正因为存续单位是“变易的整体”，《易经》才不把“保持原状”当存续，而把“顺变而生生”当存续。'
      - k: ② 把什么当最大威胁
        v: '《易经》认的最大威胁，不是外敌，也不是匮乏，而是“变化的停滞”——阴阳不再交感，变化走到了尽头却不肯转：

          • 穷：阴阳失衡到极点——“亢龙有悔”，物极必反；

          • 塞：阴阳不相交——“天地不交，否”，泰极否来；

          • 昧：看不到变化的苗头——“履霜，坚冰至”，错失“几”（微变之机）。

          三者本质是一个：变化的动力停转了，系统僵死。“穷则变，变则通，通则久”——反过来，穷而不变，就是死亡。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“阴阳交感”。刚柔相推、阴阳相摩，生出变化的力量。这是引擎。

          • 稳定性动能——承载物是“中正”。得中（二、五爻居卦之中）、得正（阳居阳位、阴居阴位）才能稳住，不偏不倚。这是骨架。

          • 方向性动能——承载物是“时”。时止则止，时行则行，每一爻的吉凶取决于它“当下的时位”该进、该守还是该待。这是归宿。

          配置：三者由“位”来编排——一卦六爻，从初到上，每个位置决定该用进（突破）、守（稳定）还是待（方向）。得位则吉，失位则凶。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：知几。在变化的源头——“几”（微小的苗头）处就动手调整。“知几其神乎”，君子见几而作，不俟终日。

          • 底线守护（硬字段）：守中正。守住“无过无不及”，不许自己走到“亢”（过头）、“穷”（尽头）——亢龙有悔，正是越界之戒。

          • 共识凝聚：设卦观象。圣人设卦观象、系辞明吉凶，让天下人通过卦象认识时势、趋吉避凶、协同行动——“通天下之志”。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 《易经》对存续的核心判断：存续不靠保持不变，靠顺应变易——识时位、守中正、见几微；穷则变，变则通，通则久。系统只要还转得动，就还活着。
    remainder:
      - 象数层：卦象的具体占断（某卦某爻断什么吉凶），那是操作手册，不是结构判断，五段不接；
      - 卜筮功能：《易经》原本是占卜之书，显影只取它的“变易哲学”结构，不处理占筮的仪式与效力；
      - 经传之辨：《经》与《易传》（十翼）年代、作者不同（十翼是否孔子所作有争议），显影合一处理，不做文献学分层；
      - 术数流变：后世纳甲、京房、梅花易数等术数体系，属《易经》的应用衍生，不纳入显影。
    anchors:
      - k: 关键词
        v: 阴阳、变易、生生、时位、中正、几、穷变通久
      - k: 关键文本
        v: 《系辞上传／下传》（“一阴一阳之谓道”“生生之谓易”“穷则变，变则通”）、《乾卦》（“亢龙有悔”“见群龙无首，吉”）、《坤卦》（“履霜，坚冰至”）、《泰卦》《否卦》
      - k: 核心争议
        v: 易有三义（易简／变易／不易）；经传关系（十翼是否孔子所作）；汉象数与宋义理两大解释传统
      - k: 历史案例
        v: 王弼扫象数而明义理、程颐《程氏易传》、朱熹《周易本义》
    date: '2026-10-28'
    license: CC BY 4.0
    border: 变易中的整体（万物在阴阳交感中生生不息；生生之谓易，存续单位＝动态生成的整体）
    flood: 变化的停滞（穷——阴阳失衡到极点；塞——阴阳不相交；昧——看不到苗头）
    forces: 突破[阴阳交感]·稳定[中正]·方向[时]
