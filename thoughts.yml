  - id: N-0008
    num: N-0008
    title: 新结构经济学
    full_title: 新结构经济学——实践学显影
    naming: 比较优势存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统发展经济学（从普雷维什—辛格命题下的进口替代，到 1980 年代之后的华盛顿共识）多把问题读成“政府该多管还是少管”，重心在干预的多少；治水学显影补充了存续维度的操作框架——《新结构经济学》不仅是一套政策主张，也是一套「比较优势存续系统」：它要保的不是增长快慢，是产业与禀赋对不对得上。
    lead: 林毅夫，1952 年生，北京大学国家发展研究院教授，2008 至 2012 年任世界银行首席经济学家，《新结构经济学》2012 年出版。用五段显影它，会看见一个反直觉的东西：这本书两头都批——旧结构主义的政府主导，华盛顿共识的政府退出，它都判为错；然后它说政府该出手，只出手一件事：别让产业离开禀赋。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：产业结构与要素禀赋结构对不对得上。一旦产业可以脱离禀赋、靠价格扭曲和补贴立住，这一整套就没了立足处——它全部推论都从这个“对上”出发。这条线它立在全书的主命题上：一个经济体在每一时点上的产业与技术结构，内生于该时点给定的要素禀赋结构（《新结构经济学》）。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“产业选得不对还硬扶”：按赶超的愿望指定产业，用压低的利率、保护的市场、定向的补贴把它撑起来。后果落在企业的账上——这些企业没有自生能力，离开补贴就活不了；扶得越久，财政背得越重，增长看着有，底子是空的。另一头他也挡：以为政府一退就万事大吉，任凭结构停在原地。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“企业家的发现与进入”：有人先看见那个还没人做的产业，投钱进去、把厂办起来。第一个进去的人不出现，禀赋再厚也只是存量，变不成产业。


          稳定性——承载物是“有效市场”：价格反映要素的相对稀缺，谁进对了、进错了，由价格和竞争来判；进对了的留下，进错了的被淘汰。一个产业能在一地生根，靠这个筛子反复筛，不靠谁的保护。


          方向性——承载物是“比较优势”：该做哪个产业，看当下最丰裕的那一项禀赋，不看别人在做什么，也不看哪个产业听着高级。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：动的是“先行者障碍”——第一个进入新产业的企业要担信息成本、协调成本、外部性，别人随后跟进。政府把这些障碍搬开：发布产业信息、协调配套、补偿外部性；不替企业做决定，也不替企业兜底。


          • 底线守护：凡违背比较优势、要靠扭曲价格和补贴才活得下去的产业，一律不扶。没有自生能力的，不算产业，是包袱。


          • 共识凝聚（甄别—供给式）：政府先按禀赋把该走的方向算出来——筛出候选产业、点明先行者要付的代价、把配套摆好；企业照这个方向进场，也可以不进。方向是算出来的，不是吵出来的。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 产业对不对，不看它高不高，看它合不合当下的禀赋：合，企业自己就能活；不合，扶多久都是空的。
    vision:
      - 它把存续画在“产业与禀赋对不对得上”，所以看得见产业选得对不对，看不见禀赋本身怎么长出来——教育、健康、基础研究，它按存量算，不追问存量怎么积。
      - 它看得见政府该做什么，看不见政府为什么常常做错：政绩、寻租、部门利益，未纳入。
      - 它看得见一个经济体顺着禀赋往上走，看不见禀赋被别人卡住的时候怎么办——技术封锁、供应中断，不是禀赋问题，不在它的视野内。
      - 它看得见一处产业该怎么选，看不见这套处方凭什么被采纳：政治意愿、部门利益、任期压力，未纳入。而这一层，恰恰决定它能不能留下来。
    remainder:
      - “自生能力”卡在②与③之间。它既是要挡的那种状态——没有自生能力，就是靠补贴活着的包袱；又是判断产业对不对的一把准。而它量的是一个没发生的状态：撤掉补贴，这企业还能不能活。作为威胁，它说的是现实；作为判准，它测的是假设。
      - “比较优势”卡在方向与边界之间。它是判准（什么该做），又是这套方案要保的那个东西（结构对上）。
      - “补贴”卡在源头改造与底线之间。搬开先行者障碍要用它：补偿外部性、给第一个进入的人一点底气；可同一笔钱流到没有自生能力的产业上，就成了必须禁的东西。同一个工具，一处必须用，一处必须禁——现实里的失败，多半发生在从前者滑到后者的那一步。这条张力的底还有一层：工具本身没有对错，对错取决于用它的政府可不可靠；而这套方案把执行者放在框架外头，不处理他靠不靠谱。
      - “潜在比较优势”哪一格都装不下。它不是当下的禀赋（当不了突破的载体），也不是当下能用的判准（企业现在还不该进），而是“条件齐了才会成立”的一个位置——它悬在时间上，三格都放不进去。
    anchors:
      - k: 关键词
        v: 要素禀赋结构、比较优势、潜在比较优势、自生能力、因势利导、结构变迁、有效市场、有为政府、增长甄别与因势利导框架、产业政策
      - k: 关键文本
        v: 《新结构经济学：反思经济发展与政策的理论框架》（林毅夫，2012，北京大学出版社）；《中国的奇迹：发展战略与经济改革》（林毅夫等，1994）
      - k: 核心争议
        v: 产业政策是否必要（与张维迎的争论）；比较优势是否低估学习效应与动态能力；信息不对称下政府能否识别正确产业；“自生能力”如何度量；比较优势的主体归属——是政府算出来的，还是企业家发现的
    category: 系统方案
    border: 产业结构与要素禀赋结构对不对得上
    flood: 产业选得不对还硬扶，企业离补贴就活不了；另一头以为政府一退就万事大吉
    forces: 突破［企业家的发现与进入］·稳定［有效市场］·方向［比较优势］
    operations: 源改［搬开先行者障碍］·底线［违背比较优势、靠补贴才活的产业一律不扶］·共识［甄别—供给式：政府算方向，企业进场也可不进］
    judgment: 产业对不对，不看它高不高，看它合不合当下的禀赋｜比较优势存续系统
    note: 归目（后验）＝系统方案｜据副题“反思经济发展与政策的理论框架”自我定位；规模＝国家；第一篇处方型（存续靠被采纳，执行者在框架外）
