    faq:
      - q: 儒学显影依据的原典是哪些？
        a: 以《论语》《孟子》《大学》《中庸》四书为主体，兼及《礼记·礼运》（大同篇）与《荀子·礼论》；「差序格局」这一社会学对应概念取自费孝通《乡土中国》（1947）。显影只取这些文本中关于「关系如何维持」的结构，不作义理阐释。
        src: 厚度锚点·关键文本
      - q: 「差序格局」是谁提出的？和儒学显影有什么关系？
        a: 费孝通在《乡土中国》（1947）中提出，指以己为中心、按亲疏远近层层外推的社会关系结构。本显影用它作为「关系存续系统」的社会学对应概念——说明儒学的存续单位是关系网络，而非孤立的个人。
        src: 厚度锚点·关键文本
      - q: 「关系存续系统」这个命名是什么意思？
        a: 这是本显影给儒学取的结构命名。依据第⑤段结构判断「系统存续的第一要务是关系不能断」——存续单位是伦理关系网络（不是国家、不是个人、也不是仁），守的方式是让每个人在关系中守住位置与名分。命名取「关系」作边界词，后缀「存续系统」为全库统一格式。
        src: 正文①；正文⑤；命名
      - q: 为什么把「仁」算作突破性动能、「礼」算作稳定性动能？
        a: 按三种动能的判据分开看：仁打破关系中的僵化与断裂、重新激活联结，属「能改变」；礼把仁的创发转化为可重复、可预期的交往规范（仪式化、等级化、日常化），属「能持续」；成仁／大同（天下归仁）提供终极方向，属「能定向」。传统解释常以仁为秩序根源，本显影只按动能分工定位，不涉本体论判断。
        src: 正文③
      - q: 儒学的「底线守护」守的是什么？
        a: 守「礼不放、名分不乱」。孔子主张「正名」，即君君、臣臣、父父、子子各守其名分——只要名分不乱，关系骨架就还在，系统就有修复的可能；名分一乱，人与人之间的协作基础就瓦解了。
        src: 正文④
      - q: 「仁与礼孰为根本」这个问题学界有定论吗？
        a: 没有定论，是儒学内部的长期争论（孔子重仁、荀子重礼）。同类未决争议还有：性善（孟子）与性恶（荀子）、差等之爱与兼爱（儒墨之争）、「亲亲相隐」与普遍正义的张力，以及儒学作为存续方案在现代的适用性。本显影不裁决这些争论，只提取存续结构。
        src: 厚度锚点·核心争议
