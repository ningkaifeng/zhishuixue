  - id: N-0014
    num: N-0014
    title: 谈谈方法
    full_title: 谈谈方法——实践学显影
    naming: 确定性存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统笛卡尔研究（从黑格尔 1833 年哲学史讲演的“近代哲学之父”定位、胡塞尔 1931 年《笛卡尔式的沉思》的奠基性重述，到法兰克福 1970 年《恶魔、梦者与疯人》、威廉斯 1978 年《笛卡尔：纯粹探究的计划》）多把《谈谈方法》读成主体性哲学的宣言，或科学方法的通俗导论，重心在“我思”确立了什么；治水学显影补充了存续维度的操作框架——它也是一套「确定性存续系统」：要保的不是“我”有多重要，是一套已经被推倒的知识还能不能重新立起来。
    lead: 笛卡尔（1596—1650），《谈谈方法》1637 年在莱顿出版，是他三部科学论文（《屈光学》《气象学》《几何学》）的序言。用五段显影它，会看见一件被“我思故我在”这句话盖住的事：这本书要回答的不是“我是什么”，是“一套已经不能用了的知识，怎么从零再立起来”。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一个判断能不能自己站住——是它清楚分明地立在眼前，还是靠别人的话撑着。这两件事他当成一件事：撑得住的那个，既不必借谁的眼，也用不着谁来担保。他把线画在这里——依据是父母、老师、书本、习俗的，就不算；自己看得清、自己也验得过的，才算。他讲过一个比喻：由许多人之手拼起来的作品，不如一个人从头做的完整——一座城、一栋楼、一部法典，都是这样；学问也一样。这条线一划下来，此前学到的几乎全部落到线外，包括经院哲学里最精致的那部分。
      - k: ② 把什么当最大威胁
        v: '他要挡的是“错的确信和真的知识长得一模一样”。读完全部课程、被列入学者之林的时候，他发现自己陷在无数疑虑和错误里；而这件事最麻烦的地方不在错了多少，在于——错的东西与对的东西，在自己心里分不出来。各处学者对同一件事给出不同说法，每一种都说自己是真的，没有一个能站到所有说法之上给判据。


          所以他面对的不是“某个结论错了，改过来就行”，是“整套判断的来源都不可靠，而这套来源有制度撑着”——学校、教会、古代权威，都在告诉他什么该信。要把这些东西从自己心里搬走，不是一场学术争论，是跟供养了他全部知识的那个建制告别。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“怀疑的方法”：一把只会拆、不会建的刀。它不证明任何东西，只问一句“这件事有没有可能不是这样”；凡答得出“有可能”的，就先不算。刀砍到某一处砍不动了，那里就是清场之后剩下的东西。换任何一个题目，这把刀照样使得动。


          稳定性——承载物是“次序”：从最简单的一块起，一步托一步，前一步给后一步作保；走到最后再沿着这条链回头通盘查一遍，看有没有漏。链条一断，后面的全悬空。它管的不是哪一条结论对不对，是这些结论之间那根能受力的链——链在，已立住的东西就塌不下来，也随时能回头查。边界画在一个人身上，稳定也就不落在管人的规矩上，落在这一个人自己的判断彼此怎么托住。


          方向性——承载物是“不可争辩”：他要的不是把别人说服，是一个连反对它都得先用到它的地方。这股劲不指向某个具体答案，指向的是“争到不能再争”这个位置——正因如此，“我在怀疑”这件事被留到了最后：谁要否掉它，就得先用它。它顺带给出的尺是：凡还需要争的，就还没到位。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：把每一个信念拿出来，问一句“我凭什么信它”。凡是只凭别人的话撑着的，一律退回；凡是自己看得清、自己也验得过的，才留下。压力源是“错的依据从外面来”，动的办法是把依据搬进自己这里——不再借别人的眼睛看，改用自己看得清的那一处起算。


          • 底线守护：正在怀疑的这个“我”，不许再被怀疑掉。整套重建都从这一点起，这一点一塌，上面全部归零。他写得很直：这条真理如此确实，一切最狂妄的怀疑论假设都推不翻它。守住它，等于守住整座楼唯一的那块地。


          • 共识凝聚（预设式）：先假定人人手里都有同一样东西，再把路摊开让人自己走。开篇第一句就是“良知是世上分配得最均匀的东西”——人人都认为自己有。接下去他不引经据典、不用拉丁文，用法语把每一步推理摆出来：不必信我，你照这条路自己走一遍，走到的就是同一个地方。这条路若只有他一个人走得通，那它就还不算立住。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 宁可悬着，也不拿别人的话填——悬着的地方将来还能补，填错的地方要先拆。
    vision:
      - 它把存续画在“一个人怎么查清一个判断”上，所以看得见单人重建知识的全过程，看不见知识在人群里怎么活——学会、期刊、实验室、教科书，这些它没有位置。一个人查得清，不等于一群人查得清。
      - 它看得见“我在怀疑”这一点推不掉，看不见这一点之外怎么接上世界：从“我在”到“物质在”，中间要过上帝不骗人那一关，那一关是借来的，不是自己查出来的。
      - 它看得见链条能托住，看不见链条该有多长——分到多细才算够、查到哪一步算穷尽，最后那条规则只说“尽量”，没给判据。
    remainder:
      - “临时道德”没进任何一格。重建期间自己还得照常活着、照常与人相处，于是他先定了三条先照着做的规矩：守本地的法律与习俗、选定一条路就走到底不来回摇摆、只求改变自己不求改变世界的秩序。它不改造压力源，也不守系统边界，管的是“一边拆一边还得站着”这段过渡期怎么过。
      - “上帝”悬在三格之外。它被用来给“清楚分明就是真的”这件事作担保——凡清楚明白的都是真的，因为上帝不骗人；担保一做完，它自己就没位置了，既不是让结论彼此托住的那根链，也不是推动方向的牵引。它是这套方案为了让自己闭合而额外架上去的一根梁，取掉之后屋里还亮，但屋顶的账没人结。
    anchors:
      - k: 关键词
        v: 良知（bon sens）、清楚明白（claire et distincte）、我思故我在（cogito ergo sum）、方法论怀疑、分解与枚举、临时道德、自然之光（lumen naturale）、第一原理
      - k: 关键文本
        v: 《谈谈方法》（1637，法语）、《指导心灵的规则》（约 1628，未完成）、《第一哲学沉思集》（1641）、《哲学原理》（1644）
      - k: 核心争议
        v: 笛卡尔循环——用清楚明白证明上帝存在，又用上帝保证清楚明白；“我思”是一条推论还是一次直观；方法论怀疑是真实经历还是写作修辞（与蒙田《随笔》的关系）；“我思”里是否已经预设了一个“我”
