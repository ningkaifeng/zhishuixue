  - id: N-0004
    num: N-0004
    title: 道德经
    full_title: 道德经——实践学显影
    naming: 损存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统老子研究（自王弼注、河上公注，到近代的哲学、政治思想史与出土文献研究）多把五千言读成一套“无为而治”或“自然哲学”，重心在“它主张什么”；治水学显影补充了存续维度的操作框架——《道德经》不只是一套主张，也是一套「损存续系统」：它要保的是万物相冲而成的那份平衡，靠不断撤掉人为造作来维持。
    lead: 《道德经》五千余言，通行本（王弼本）分八十一章；作者与成书年代有争议，1973 年马王堆帛书、1993 年郭店楚简出土后，文本层次更形复杂。用五段显影它，会看见一个反直觉的东西：这部书通篇在讲“不做”——它不是消极，它是把“做”当成最主要的破坏源，所以它的核心动作是减法。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：万物相冲而成的那份平衡——阴阳相激而不相害，各归其位。不是某一个人的性命，不是某一家一国，也不是道的本身。他把它写在“万物负阴而抱阳，冲气以为和”里（四十二章），也写在“知和曰常，知常曰明”里（五十五章）。用五十七章的话说，是民自化、自正、自富、自朴的那个状态。
      - k: ② 把什么当最大威胁
        v: 他要挡的是上者多事——以己意造作，以法令滋扰，以兵力争胜，把本来会自己归位的秩序搅乱。“法令滋彰，盗贼多有”（五十七章）；“民之饥，以其上食税之多，是以饥”（七十五章）。他看到的后果是双向的：上愈有为，民愈难治；国愈求强，愈近于衰——“物壮则老，是谓不道，不道早已”（三十章）。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“柔弱”：不是无力，是能进得去刚强进不去的地方。“天下莫柔弱于水，而攻坚强者莫之能胜”（七十八章）；“天下之至柔，驰骋天下之至坚”（四十三章）。它改变局势的办法不是顶，是渗、是绕、是让对方的硬先失去对手。


          稳定性——承载物是“常”：万物自己会回去的那条轨道。“归根曰静，是谓复命。复命曰常”（十六章）；“夫物芸芸，各复归其根”。它不靠外力维持，靠的是万物各自有归处——所以老子说“不知常，妄作，凶”。


          方向性——承载物是“自然”：什么叫对，看它是不是自己如此。“道法自然”（二十五章）；“功成事遂，百姓皆谓我自然”（十七章）。凡是靠外力摆出来的样子，都不算；自己长成的那样，才算。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：无为。不是什么都不做，是不从上面另造一套。“我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴”（五十七章）。压力的源头就在“上之多事”，把这一头撤掉，底下自己会动。


          • 底线守护：不以兵强天下。“以道佐人主者，不以兵强天下，其事好还”（三十章）；“祸莫大于不知足，咎莫大于欲得”（四十六章）。红线是排除式的：靠强力去取，取来的会以同样的方式还回去——这条线不许越。


          • 共识凝聚：承载物是“不争”，但这一条很薄。他不去建立共同的说法，而是把引起争的东西撤掉——“不尚贤，使民不争；不贵难得之货，使民不为盗”（三章）。这不是把人聚起来，是让争没有由头；到了极处就是“邻国相望，鸡犬之声相闻，民至老死不相往来”（八十章）——各安其居，不必往来。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 系统能不能久，不看它添了多少，看它有没有强作；强作的地方先坏，不争的地方自全——所以每一次做减法，都是在把系统往它自己会去的地方推一把。
    vision:
      - 它把存续画在“万物相冲而成的平衡”上，所以看得见整体的和，看不见个体的进取：谁想变强，在它眼里就是失和的开始——这不是它错，只是它不负责。
      - 它看得见“少做”的好处，看不见“必须做”的时候怎么办：灾、乱、外患来了，它不给应对之法，只说“以正治国，以奇用兵”。
      - 它看得见万物自复，看不见人建立起来的制度：凡“作”都被它看成干扰，可有些秩序恰恰只能由人建成。
    remainder:
      - “道”卡在三格之间。它既是万物所由生（源头），又是万物所复归（稳定），又是“自然”那把尺（方向）。三格都进得去，归哪一格都漏掉其余两面。
      - “无为”卡在方向与源头改造之间。作为“什么算对”的判准，它是方向；作为“上不多事”的那个动作，它是源头改造。同一句话，两格。
      - “柔弱”卡在突破与稳定之间。作为以柔克刚的力，它是突破；作为“不争而善胜”的保全之道，它又像稳定——争胜与全生，在“柔弱”这一处重合。
      - “不争”卡在共识凝聚与底线守护之间。作为让人无由可争的手段，它是凝聚；作为“不敢为天下先”的那条线，它是守界。
    anchors:
      - k: 关键词
        v: 道、自然、无为、柔弱、水、常、复命、和、朴、不争、知足、为道日损、小国寡民、反者道之动
      - k: 关键文本
        v: 《道德经》八十一章，重点在第十六、二十五、三十、四十、四十二、四十三、四十六、四十八、五十五、五十七、七十五、七十八、八十章；郭店楚简本（1993）、马王堆帛书本（1973）
      - k: 核心争议
        v: 作者与成书年代（老聃、老莱子、太史儋诸说）；帛书本与通行本的次序与异文；“无为”是政治术还是修养论；“小国寡民”是否可作实然主张
    category: 系统方案
    border: 万物相冲而成的那份平衡（阴阳相激而不相害，各归其位）
    flood: 上者多事——造作、滋扰、争胜，把会自己归位的秩序搅乱
    forces: 柔弱·常（复命）·自然
    operations: 无为·不以兵强天下·不争（薄）
    judgment: 系统能不能久，不看它添了多少，看它有没有强作；强作的地方先坏，不争的地方自全｜损存续系统
    note: 归目（后验）＝系统方案｜据“为无为，则无不治”；定义权＝取消×弱；共识凝聚一条薄
