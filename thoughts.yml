  - id: N-0018
    num: N-0018
    title: 龙树《中论》
    full_title: 龙树《中论》——实践学显影
    naming: 中道存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统中论研究（从月称七世纪《明句论》的应成解释、清辨一系的自续路线，到牟谛 1955 年《中观哲学》的康德式解读、葛菲尔德 1995 年的译注与西德里茨 2007 年以后的分析哲学重构）多在“龙树到底立不立宗”“二谛如何安立”上争论；治水学显影补充了存续维度的操作框架——它也是一套「中道存续系统」：要保的不是哪个主张成立，是一套判断还能不能不被两种极端吃掉。本文取应成派（月称一系）的读法——连“不立宗”也不立；自续派（清辨一系）认为无自性可以自立量，那条路另论。
    lead: 龙树（约 150—250），《中论》四百偈，二十七品。它最反常的地方是：整部书不立一个主张，只把别人的主张一个个推到自相矛盾。用五段显影它，会看见一套很特别的存续逻辑——它不靠建立什么来站稳，靠的是证明“凡是自己立住的，都立不住”。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一样东西，是不是离开条件还能自己立住。这条线画得很细：它不否认眼前有树、有苦、有修行，只否认这些东西背后有一个不靠任何条件的“自己”。凡答“能自己立住”的，都落在界线之外。至于“依着条件才有”——那不是另一个可以拿去执的答案，它只是把问题挪了个位置；挪过去之后，这个位置也不许占。
      - k: ② 把什么当最大威胁
        v: '第一样是病：一切都被当成离开条件也能自己立住。苦被当成一个固定的东西，于是它只能一直被受着；因果被当成一条固定的链，于是变了也白变。整套修行为什么要做，前提是“能变”；而“能自己立住”恰恰取消了能变的余地。


          第二样是药变成毒：把“没有自性”读成“什么都没有”。《中论》自己把这一条列为最险的——不能正观空，钝根则自害，如不善咒术，不善捉毒蛇。抓蛇抓错了地方，被咬的是自己。一旦落到断灭，因果不成立，修行也没意义，整套佛法从内部被取消。


          所以这套系统要挡的第二重威胁，是它自己。药吃错了，比病更凶；而它只有这一味药，没有第二味可以换。一套不留备用纠错处的系统，一旦被自己污染，里面没有哪一处能把话纠回来。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“破”：一套只拆不建的方法。它不提出任何正面主张，只顺着对方的说法往下推，一直推到对方自己不能接受的地方，让他自己把手松开。力气全在推上：推得越远，对方的立足处越少，一步比一步窄。


          稳定性——承载物是“缘起”：一切依条件而生，依条件而灭。这一条最反直觉的地方是，它正是让一切得以成立的那个条件——以有空义故，一切法得成。正因为背后没有一个自己，因才能生果、苦才能灭、修行才有着落；反过来，若一切真有自性，什么都不动，因果断，四谛也不成立。去掉缘起，整套实践当场塌掉——不是塌一半，是连“要修”这句话都说不出口。


          方向性——承载物是“不落二边”：不许停在任何一个答案上。这是一个反封闭的方向——它不给终点，只给一条规矩：不许把任何一站当作终点站。说它存在，推；说它不存在，也推；说它亦有亦无，还推。它顺带给出的尺是：凡是你觉得“就这样定了”的，都还没到；凡是还推得动的，才算对。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：顺着对方的立场往下推，推到他自相矛盾。压力源是“自性见”，动的办法不是拿出一个更好的主张去替换它，是把它自己的前提摊开，让它自己倒。推到“已去、未去、去时”三处都安不上“去”这个动作，对方就没有地方再放了。


          • 底线守护：连自己也不许立宗。这一条是整套方法的命门——一旦自己立一个主张，就落到某一边，立刻成为下一个被推的对象，前面的拆全白做。所以到最后，它连“一切皆空”这句话也不许当作主张来持。守不住这一条，方法就变成了它本来要破的东西。


          • 共识凝聚（通道式）：二谛——先划清在哪一层说话。世俗层谈因果、谈修行、谈苦与灭；第一义层谈无自性。两层不打架，因为它们答的不是同一个问题。但两层不是并列的，是必经的：不借世俗的路，到不了第一义。所以这不是约定，是路径——绕不过去。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 正因为没有哪一样东西能自己立住，一切才成立——能变、能修、能灭，全压在这一点上。
    vision:
      - 它把存续画在“一个说法成不成立”上，看得见概念的破与立，看不见事该怎么办——一个主张被推倒了，事情还在那儿。它只拆不建，拆完之后空出来的那块地，它不种东西。后两条，都是这一条的两个后果。
      - 它按自己的规矩不能答“病好了之后靠什么活”——破尽之后站在空地上，往哪走、按什么走，它不许自己答。所以这一条它看不见：不是答得不好，是它不能答。
      - 它看得见一个人在论辩里的见对不对，看不见许多人在制度里怎么共处——需要做决定、需要分资源、需要有人负责的地方，这套方法给不出决定。它能证明你错，不能告诉谁该做什么。
    remainder:
      - 没有自性，谁在受报，这一处没有结账。业要有人承，轮回要有人续；若一切无自性，那个从这一世走到下一世的“谁”是什么？回答是一个比喻——如灯焰相续，前一焰点后一焰。可比喻只说了像什么，没说是什么。这个洞是真的，不是读者没读懂——唯识学拿阿赖耶识去填它，正因为这里一直空着。三格都装不下这一问，因为它既不是力，也不是动作。
      - 四句推完之后，那个“推”站在哪里，这一处是自指的。有、无、亦有亦无、非有非无，四句全被否掉；否掉之后所剩的那个位置，它说心行言语断。可它用“不回答”来回答——连“不立宗”也不立。而不立宗本身是不是一个宗？不回答本身是不是一个回答？死结在这里，不在没接。
    anchors:
      - k: 关键词
        v: 缘起、无自性、空、二谛、八不、四句、戏论、中道、归谬、无生、寂灭、自性
      - k: 关键文本
        v: 《中论》二十七品（观因缘品、观去来品、观四谛品、观涅槃品尤要）；《回诤论》；《七十空性论》；青目注；月称《明句论》《入中论》；鸠摩罗什译本（409 年）
      - k: 核心争议
        v: 龙树到底立不立宗；二谛是一层还是两层；空是否等于虚无（恶取空之辨）；中观与唯识的诤论；月称与清辨的应成、自续之分
    category: 解释框架
    border: 一样东西是不是离开条件还能自己立住
    flood: 一、自性见（把一切当成固定）；二、药变毒（把空读成什么都没有）；它只有一味药，没有备用纠错处
    forces: 突破［破］·稳定［缘起］·方向［不落二边（反封闭）］
    operations: 源改［顺对方立场推至自相矛盾］·底线［连自己也不许立宗］·共识［通道式：二谛分层，必经路径］
    judgment: 正因为没有哪一样东西能自己立住，一切才成立｜中道存续系统
    note: 归目（后验）＝解释框架；规模＝命题与见；③稳定＝缘起（过留存闸，原文“以有空义故一切法得成”）；②威胁是它自己（零冗余，药变毒）；④通道式为判据第五种形态（本篇首例）；立场＝应成派读法，已在脚注声明
