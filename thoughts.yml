  - id: N-0010
    num: N-0010
    title: 辩证法
    full_title: 辩证法——实践学显影
    naming: 扬弃存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统黑格尔研究（从狄尔泰 1905 的精神史路径、科耶夫 1947 的欲望承认读法，到泰勒 1975、霍尔盖特 1998 的体系重构）多把辩证法读成“方法”或“逻辑结构”，重心在思维的形式；治水学显影补充了存续维度的操作框架——辩证法不仅是一套方法，也是一套「扬弃存续系统」：它要保的不是结论对不对，是否定还能不能一直走下去。
    lead: 黑格尔（1770—1831），德国哲学家，1807 年出版《精神现象学》，1818 年到柏林大学任教。用五段显影它，会看见一个反直觉的东西：辩证法常被读成“正—反—合”三步法，可黑格尔自己从没这么用过。他要的不是一个方法，是让事情自己动起来——推动力不在他手里，在事情自己的矛盾里。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：否定还算不算事物自己的一部分。一旦矛盾被当成毛病、当成要去掉的杂质，这一整套就散了——它全部的运动都靠否定推着走。这条线它写在《精神现象学》序言里：关键不仅在于把真实的东西表述为实体，而且同样要把它表述为主体。实体不是一块静止的东西，它自己会动，动的就是那个否定。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“分裂”：主体与客体分成两边，思维与存在对不上，世界被切成两半，人在自己家里成了外人。这道沟是康德留下的——物自体不可知，范畴只管现象，认识与对象之间隔着一层。后果他看在眼里：哲学从此变成对认识的审查，不再是认识本身；一整套文化被切成知性的碎片，各管一段，谁也不通谁。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“否定性”：事物自己身上那个不接受现状的力，它让每一个规定都站不稳，被迫走向下一个。不是外面有人在推，是它自己撑不住。


          稳定性——承载物是“整体”：每一环被否定掉的东西都没有丢，都收在整体的圆圈里，各得一个位置。这是概念层面的留存，不约束任何人——没有人因为“真理是整体”而必须做什么；只要这个结构成立，环节就有地方待。


          方向性——承载物是“自在自为”：一个形态算不算真，看它能不能自己规定自己、把否定收进自身。凡靠外物来定的，都不算数。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：扬弃。不在对立的两边挑一边，而是指出两边都片面，把它们一起收进一个更高的规定里——压下去的那个并没有被扔掉，它换了位置继续在。


          • 底线守护：不许停在任何一个环节上。凡宣称某一片面就是最终的（怀疑主义停在这里，苦恼意识停在那里，优美灵魂停在自己心里），一律不算数。


          • 共识凝聚：本篇未见其承载物。这套东西的对象是概念自己的运动，不是人群：它不设共同标准，也不要求被谁接受；读者跟上来，是被这个运动带着走的，不是被凝聚起来的。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 真理不是一个现成的结论，是一条自己走出来的路——每个环节都否定自己，又在否定里被留下来，直到把全部环节收进自身；停在半路上，它就不再是它。
    vision:
      - 它把存续画在“否定能不能一直走下去”，所以看得见概念怎么自己运动，看不见概念之外还有别的系统——自然、身体、制度在它那里是精神的异在形态，不是能自己说话的东西。
      - 它看得见整体的真理，看不见具体的人在具体时刻的处境：历史在它那里是精神的自我展开，个体只是被用到的载体。
      - 它看得见否定性的推动，看不见“停下来”也有价值——凡是凝固的东西都被判为片面，稳定的制度、习俗、成见，未纳入。
    remainder:
      - “扬弃”卡在③与④之间。它既是保存（被否定的东西一样没丢，是稳定），又是动作（否定并抬升，是源头改造）。同一个词，一半是格子里的承载物，一半是手上的动作。
      - “否定性”卡在突破与方向之间。它是推动的那股力，又是衡量的尺——一个形态能不能自我否定，就是判它真假的标准。
      - “绝对知识”卡在⑤与外面。它是终点，可一旦真到了，运动就停了；这跟“不许停在任何一个环节上”正好顶住。终点这一格，这套语法不给它位置。
      - “我们”哪一格都装不下。它不是共识凝聚（不凝聚任何人），也不是操作；它是叙述者站的那个位置，让读者跟得上来。三格都不合适。
    anchors:
      - k: 关键词
        v: 辩证法、否定性、扬弃（Aufhebung）、实体即主体、整体、绝对精神、自在自为、异化、教化（Bildung）、苦恼意识、知性、理性、具体共相
      - k: 关键文本
        v: 《精神现象学》（1807）、《逻辑学》（1812—1816）、《法哲学原理》（1821）
      - k: 核心争议
        v: 辩证法是方法还是本体自身的运动；“扬弃”的保存义是否足以承担体系；体系是否封闭（绝对知识是不是终点）；黑格尔与马克思的“颠倒”究竟颠倒了什么；辩证法能否被形式化
    category: 辩证方法
    border: 否定还算不算事物自己的一部分
    flood: 分裂：主体与客体分成两边，思维与存在对不上，康德留下的那道沟
    forces: 突破［否定性］·稳定［整体］·方向［自在自为］
    operations: 源改［扬弃：两边都片面，收进更高规定］·底线［不许停在任何一个环节上］·共识［未见：边界内无多主体］
    judgment: 真理不是一个现成的结论，是一条自己走出来的路，直到把全部环节收进自身｜扬弃存续系统
    note: 归目（后验）＝辩证方法｜据“实体即主体”这一自我定位；规模＝无特定对象（概念）；第三次命中“论证型对象”判别句；④空因无多主体
