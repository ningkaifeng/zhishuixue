  - id: X-0017
    num: X-0017
    title: 佛学
    full_title: 佛学——实践学显影
    category: 解释框架
    naming: 解脱存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统佛学研究（从印度学、宗教学到现代佛学研究）将佛教视为宗教、解脱论或哲学体系（释迦牟尼约前563—前483）；从存续域坐标重读，可提出一个不同的读法——佛教不仅是宗教或解脱论，也是一套「解脱存续系统」：众生靠般若照破无明、戒律规范行为、涅槃指引方向的存续守护结构。
    lead: 佛学的论述层满是“反”字——反执着、反本质、反意义。但显影不能被论述层迷惑、跟着它走，要剥开表述层，看它下面的结构：所谓“反执着”，落到结构上就是般若照破无明——这是它的突破性动能，一种“能改变”的力量，跟进化论的变异、法家的变法、墨家的兼爱是同一类。
    sections:
      - k: ① 边界画在哪
        v: 佛学把存续单位画在“解脱之道”上——众生如何离苦得乐的方法与传承。众生是承压者（在轮回中受苦），解脱之道是承重件（会衰减、会断灭）。
      - k: ② 把什么当最大威胁
        v: '佛学认定的最大威胁，是“无明执着”——众生把无常执为常、把无我执为我（我执、法执），起贪嗔痴、造业受报，困于轮回之苦，解脱之道失效。

          此外还有一层独特的失败模式：即使破掉了执着，若停在“空”上（只反一次、没反第二次），空就成了新的执着（顽空、断灭见）——这是佛学自己批判的。所以威胁有两层：执着困住众生，顽空困住破执者。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“般若”（智慧）：照破无明执着。佛学叫它“反执着”，但结构上，它就是“能改变”的力量——打破无明，让众生从迷转悟。

          般若的“反”有一个独特机制：双重反——照破执着之后，连“照破”这个动作也照破（空亦复空）。只反一次会停在“空”上（空成新执着），反两次才停不下来。这正是佛学必须“一路破到底”的原因。

          • 稳定性动能——承载物是“戒”（戒律）：规范身语意，让修行不退转。这是“能持续”的力量。

          • 方向性动能——承载物是“涅槃”（解脱、寂静）：指向离苦得乐。这是“能定向”的力量。

          配置：般若（照破无明，双反）驱动 → 戒（规范修行）维系 → 涅槃（解脱）定向。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：正见（破除无明，从源头改压力源）；

          • 底线守护：戒律（不造恶业，守住底线）。戒是“船”不是“筏”——佛学舍的是“对戒的执取”（戒禁取见），不是“戒”本身，船到彼岸才卸，中途卸了就沉；

          • 共识凝聚：僧团、六和敬（和合共修，正法久住）。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 众生因无明执着困于苦。本文检验其是否具备三种动能与三类操作的协同：般若照破（突破）、戒律规范（稳定）、涅槃指引（方向）三项均可指认，故判为具备动力—规则协同。
    remainder:
      - 【坐标提醒】佛学讲“空”，空是无自性，不是“不动”——显影时不可把“空”读成“静止态”，否则就是把无自性实体化，正是佛学要破的执着。本文的“存续单位”（解脱之道）是方便设施，不是佛学承认的实体。
