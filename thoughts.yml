    faq:
      - q: 法家显影依据的原典是哪些？
        a: 以《韩非子》（《孤愤》《五蠹》《显学》）、《商君书》为主体，兼及《史记·商君列传》《史记·老子韩非列传》；历史案例取商鞅变法使秦富国强兵、秦统一后「以法为教、以吏为师」。显影只取这些文本中关于「权力如何运作」的结构，不作义理阐释。
        src: 厚度锚点·关键文本；厚度锚点·历史案例
      - q: 「权力存续系统」这个命名是什么意思？
        a: 这是本显影给法家取的结构命名。依据第⑤段结构判断「系统存续的第一要务是权力必须可预期」——存续单位是权力结构（谁有权决定什么、谁服从谁、赏罚由谁掌握；不是关系、不是自然），守的方式是让赏罚、职务、规则保持可预期。命名取「权力」作边界词，后缀「存续系统」为全库统一格式。
        src: 正文①；正文⑤；命名
      - q: 为什么把「变法、集权」算作突破性动能、「法、术、势」算作稳定性动能？
        a: 按三种动能判据分开看：变法、集权、战时动员打破旧的世袭权力结构、强力破旧立新，属「能改变」；法、术、势把权力的运作固化为可重复、可预期的标准与手段（法＝明文的赏罚标准，术＝君主考察驾驭臣下的方法，势＝君主所处的位置与威权），属「能持续」；富国强兵、以法治国提供终极方向，属「能定向」。传统解释多以法术势为纯权术，本显影只按动能分工定位，不涉价值判断。
        src: 正文③
      - q: 法家的「底线守护」守的是什么？
        a: 守「赏罚必信、法不阿贵」。赏罚必信——说赏就赏、说罚就罚，不因私废、不含糊，权力才可预期；法不阿贵——法不偏袒权贵，「刑过不避大臣，赏善不遗匹夫」，规则对强者也硬。两条一松，权力的可预期性就崩了，系统内部先散。
        src: 正文④
      - q: 「法、术、势」分别指什么？
        a: 法＝公开、明文的赏罚标准（商鞅重法）；术＝君主考察、驾驭臣下的方法（申不害重术）；势＝君主所处的位置与威权（慎到重势）；韩非把三者综合为一套完整的统治术。本显影只把三者作为「稳定性动能」的承载物，不展开具体驭下手段。
        src: 厚度锚点·关键词；正文③；剩余物
      - q: 法家是「法治」吗？秦速亡是不是法家之过？学界有定论吗？
        a: 都没有定论。其一，法家的「法」是君主意志的工具、赏罚由君主掌握，与「对所有人普遍约束」的现代法治不同，学界常称「人治之下的法制」；其二，商鞅变法使秦富国强兵、为统一奠基，但秦二世而亡是否归咎法家，长期争论；其三，法家与道家（黄老刑名）的渊源亦无定论。本显影不裁决这些争论，只提取存续结构。
        src: 厚度锚点·核心争议
