      - q: 为什么把「道」算作突破性动能、「无为守静」算作稳定性动能？
        a: 按三种动能判据分开看：道是自然本身的创生力量（万物自化、生生不息），提供一条不靠人为干预的根本更新路径，属「能改变」；无为守静是去除多余干预、让系统回归自身节奏（「治大国若烹小鲜」，翻动太多鱼就碎），属「能持续」；返璞归真（小国寡民、顺天应人）提供终极方向，属「能定向」。传统解释多以道为宇宙本体，本显影只按动能分工定位，不涉本体论判断。
        src: 正文③
      - q: 道家的「底线守护」守的是什么？
        a: 守「不妄作、知止、不争」。不确定某个干预是否越界时，就停下来——知止是对行动边界的自我约束，知道在哪里该停，比知道往哪里走更重要；不争则是对竞争本身的质疑，争强好胜是人为妄作的典型表现。
        src: 正文④
      - q: 「小国寡民」出自哪里？显影怎么理解它？
        a: 出自《老子》第八十章。显影不把它读作「落后的原始社会」，而读作「没有被人为干预层层叠加的理想状态」——它是方向性动能（返璞归真）的政治表达，与「顺天应人」同属一条线。
        src: 正文③；厚度锚点·关键文本
      - q: 「无为」是「不作为」还是「不妄为」？学界有定论吗？
        a: 没有定论，是道家研究里的长期争议。本显影取「不妄为」这一读法——无为是不做违背自然之势的事，不是消极不作为。另有两条同类未决争议：道是宇宙论还是政治哲学；老庄与黄老是否同一套存续方案。
        src: 厚度锚点·核心争议
