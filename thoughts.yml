  - id: N-0006
    num: N-0006
    title: 逻辑学
    full_title: 逻辑学——实践学显影
    naming: 形式存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统逻辑史研究（罗斯 1923 的《工具论》注疏、卢卡西维茨 1951 的形式化重构，到帕特齐希与肖尔茨关于《工具论》编纂的研究）多把《工具论》读成“形式逻辑的起源”，重心在“规则齐不齐、推得对不对”；治水学显影补充了存续维度的操作框架——《工具论》不仅是一套规则，也是一套「形式存续系统」：它要保的不是结论的内容，是“从真到真”这条通道还在不在。
    lead: 亚里士多德（前 384—前 322），古希腊哲学家，柏拉图的学生，在雅典吕克昂办学。《工具论》六篇——《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辨谬篇》——是这套东西的源头文本。用五段显影它，会看见一个反直觉的东西：这部讲逻辑的书，通篇没有说出任何一件具体的事是真的，它只解决一件事——一句真话交给下一句的时候，真会不会掉。这套东西的定位是工具（ὄργανον）：不是知识，是拿知识之前先把刀磨好的那一步。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：从真前提到真结论的这条通道通不通——形式有没有把真保住。不是命题的内容，不是论证在什么场合用，也不是谁更雄辩。他把它写在《前分析篇》开篇那句定义里：“三段论是一种论证，其中只要确定某些东西，某些异于它们的东西就必然从中推出”（《前分析篇》24b18）；也写在《后分析篇》对证明的界定里：前提必须是真的、在先的、比结论更可认的（《后分析篇》71b）。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“看起来成立”顶替“真的成立”——把话说顺、把词换一换、把一部分话藏起来，听的人就认了。后果他写在《辨谬篇》：诡辩式反驳有十三种样式（歧义、合谬、分谬、重音错放、以偶性当本质、乞题、把结果说成原因），每一种都长得像证明，却一样也不保真。真假一旦交由话术裁决，学问就退成在场面上占上风。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“变项”：用字母替掉具体词项，形式才从内容里露出来。他把三段论写成“若 A 属于所有 B，且 B 属于所有 C，则 A 属于所有 C”（《前分析篇》25b），不问 A、B、C 究竟是些什么。同一堆论证，剥掉内容就显出骨架。


          稳定性——承载物是“格与式”：哪些前提组合能推出什么，被列成表固定下来；第一格完满，其余格可化归第一格（《前分析篇》第一卷第 4—7 章）。一条推理不必每次重新想，照着表走；错了也能对着表找出错在哪一格。


          方向性——承载物是“必然”（τὸ ἐξ ἀνάγκης）：一个论证算不算数，只看结论是不是必然跟着前提出来。多半如此、通常如此、听起来如此，都不算。必然既是它的判准，也是它全部的追求。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：先给词下定义，再把话拆成前提与结论。歧义是诡辩最常用的入口，定义一落，同名异义的词就分开了（《后分析篇》卷二 13）；话说成前提与结论两截，夹在中间的那些就藏不住。压力源是“似是而非”，办法是让它无处可藏。


          • 底线守护：凡自相矛盾的，一律不算论证。矛盾律——同一事物不能同时既属于又不属于同一事物，任何证明最后都站在这条上（《形而上学》Γ 3，1005b）；排中律——是或不是，中间没有第三种。这条红线不为谁破例。


          • 共识凝聚：把双方都认的前提作为起点。《论题篇》处理的是从“普遍接受的意见”（ἔνδοξα）出发的论辩：谁提问、谁作答、怎么算赢怎么算输，都有规矩（《论题篇》卷一 100a—101a）。输赢按规则判，不按谁声音大。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 真不是靠说服保下来的，是靠形式保下来的——形式一乱，真从缝里漏出去；形式一立，真不必再争。
    vision:
      - 它把存续画在“从真到真的通道”上，所以看得见一个论证对不对，看不见一个论证值不值得提出来——问什么、前提从哪来，不在它的视野内。
      - 它看得见已有的真怎么传下去，看不见新的真怎么长出来：发现、观察、归纳，它只留了一句“从感觉来”，之后的事未纳入。
      - 它看得见两人论辩的规矩，看不见那些公认意见自己是怎么变成公认的——谁的历史、谁的习俗算数，这一层它不负责。
    remainder:
      - “必然”卡在方向与稳定之间。作为“算不算证明”的判准，它是方向；可它又是靠格与式固定下来的东西，格与式存在的全部理由就是让必然留下来。它同时站在两格里。
      - “变项”卡在突破与稳定之间。用字母替掉词项，是让形式第一次显形的那一步；可这套记号一旦定下，就成了谁都得照着用的写法。
      - “本原”（ἀρχή）三格都装不下。证明的前提本身不能再被证明——再往前追就无穷后退，所以亚里士多德说它由努斯（νοῦς）直接把握，不属证明（《后分析篇》卷二 19，100b）。它既不是力，也不是动作，却决定了一切证明的起点。
      - “普遍接受的意见”卡在共识与方向之间。它是论辩双方共同的起点，又在充当“什么算可信”的那把尺。
      - “或然”（εἰκός）卡在方向与洪水之间。修辞与论题术处理的是“多半如此”：够不上必然，进不了方向；又不算诡辩，进不了洪水，只能悬在中间。
    anchors:
      - k: 关键词
        v: 三段论、词项、格（σχῆμα）、式、前提、必然（τὸ ἐξ ἀνάγκης）、矛盾律、排中律、定义、范畴、证明（ἀπόδειξις）、本原（ἀρχή）、努斯（νοῦς）、辩证（διαλεκτική）、诡辩式反驳、普遍接受的意见（ἔνδοξα）、或然（εἰκός）
      - k: 关键文本
        v: 《工具论》六篇——《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辨谬篇》（约前 4 世纪）；矛盾律与排中律见《形而上学》Γ 卷
      - k: 核心争议
        v: 三段论是否只覆盖直言命题（假设推理与模态逻辑是否被排除在外）；《工具论》六篇的成书先后、“ὄργανον”之名是否出自亚里士多德本人；矛盾律能否被证明（否证法是否循环）；逻辑是工具还是学科；与斯多亚派命题逻辑的关系
    category: 思维工具
    border: 从真前提到真结论的通道通不通——形式有没有把真保住
    flood: “看起来成立”顶替“真的成立”；诡辩十三种，长得像证明却不保真
    forces: 突破［变项：字母替掉词项，形式显形］·稳定［格与式：有效式固定成表，余格化归第一格］·方向［必然：只看结论是否必然跟着前提］
    operations: 源改［下定义＋拆成前提与结论，让似是而非无处可藏］·底线［矛盾律、排中律，自相矛盾一律不算］·共识［从普遍接受的意见出发，按问答规矩定输赢］
    judgment: 真不是靠说服保下来的，是靠形式保下来的｜形式存续系统
    note: 归目（后验）＝思维工具｜据“它所研究的对象是证明”（《前分析篇》24a10）；待核：ὄργανον 之名是否出自本人
