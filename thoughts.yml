    faq:
      - q: 《君主论》写于哪一年、什么时候出版？
        a: 1513 年写成，1532 年出版（马基雅维利身后五年）。写作背景是他 1512 年美第奇复辟后被免职、逐出佛罗伦萨，书成后献给洛伦佐·德·美第奇以求起用。
        src: 厚度锚点·关键文本；厚度锚点·历史案例
      - q: 马基雅维利说的「virtù」到底指什么？是「美德」吗？
        a: 不是道德美德，而是「能力」——君主夺取与维持国家所需要的能力：果断、权变、敢用强力与欺诈、能顺应时势。显影中作「能力（virtù）」，与「命运（fortuna）」对举，是三类失国原因之一的反面。
        src: 正文②；正文③突破性动能
      - q: 「verità effettuale」是什么意思？为什么译成「实效」？
        a: 字面是「事物的实际真相」。《君主论》第 15 章说，他要写的是「事物的实际真相」而不是「关于它的想象」。译作「实效」是为强调它是一种取向：只看能不能保住国家，不按应该怎样来论政。显影中作方向性动能的承载物。
        src: 正文③方向性动能；厚度锚点·关键词
      - q: 「狮子与狐狸」这个说法出自哪里？
        a: 出自《君主论》第 18 章：君主必须懂得像狐狸一样识别陷阱、像狮子一样震慑豺狼。显影中它是突破性动能的承载物——权变的手段，解决「能改变」。
        src: 厚度锚点·关键文本；正文③突破性动能
      - q: 马基雅维利本人是共和派还是君主派？为什么只显影《君主论》？
        a: 两说都有文本依据：《君主论》主张君主制，《论李维》主张共和，学界一般认为他更认同共和，写《君主论》有求仕的现实动机。显影只取《君主论》，把这一张力明确写进「剩余物」，不替文本调和。
        src: 剩余物；厚度锚点·核心争议
      - q: 「马基雅维利主义」是不是《君主论》的本意？
        a: 不是。后世把「为达目的不择手段」归为马基雅维利主义，属污名化读法。显影取文本本义——君主国如何存续，不取权谋手册的读法；这一点也写进了「剩余物」。
        src: 厚度锚点·核心争议；剩余物
