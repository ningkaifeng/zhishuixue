  - id: N-0002
    num: N-0002
    title: 孙子兵法
    full_title: 孙子兵法——实践学显影
    naming: 先胜存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统兵学研究（自曹操《孙子略解》开注家一脉，到格里菲斯 1963 的英译、李零 2006 的文本细读）多把十三篇读成一部“取胜之术”，重心在“怎么打赢”；治水学显影补充了存续维度的操作框架——《孙子》不仅是取胜之术，也是一套「先胜存续系统」：它要保的不是赢一次，是让胜负在开打之前就被算出来。
    lead: 孙武，春秋末期齐国人，《孙子兵法》十三篇的作者，生卒年不详，约与孔子同时。用五段显影它，会看见一个反直觉的东西：十三篇通篇在讲打仗，却把“打赢”放在最不要紧的位置上——“是故百战百胜，非善之善者也”（《谋攻》）。它真正在做的，是把胜负从战场上搬走，搬到开打之前。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：胜负在开打之前算不算得出来——两边的力能不能放到同一把尺子上量，量完轻重已经分明。不是国土的大小，不是兵力的多寡，也不是君主的心气，那些都是被量的东西。他把这一条写在“胜兵先胜而后求战，败兵先战而后求胜”里（《军形》），也给了量的路：“地生度，度生量，量生数，数生称，称生胜”（《军形》）。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“先战而后求胜”——不算就打，打了再盼；把胜负押在敌人的疏忽、一次侥幸、国君的一口气上。后果他写在《作战》：“钝兵挫锐，屈力殚货，则诸侯乘其弊而起，虽有智者，不能善其后矣。”兵在外头，打不动也耗，打赢了也耗，耗到别家趁虚而入，赢的那一仗就白赢了。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“势”：靠位置、距离、时机凑出的落差，可积可放。“故善战者，求之于势，不责于人”（《兵势》）；“激水之疾，至于漂石者，势也”。同一块石头，放在千仞之山上就动得了，放在平地上动不了——力没变，位变了。


          稳定性——承载物是“法”：曲制、官道、主用，加上“分数”“形名”，即编制、号令、赏罚、粮械各归谁管。“凡治众如治寡，分数是也；斗众如斗寡，形名是也”（《兵势》）。它让一次得手不靠运气：队伍散了能收，命令乱了能通，赢完之后那支力量还在。


          方向性——承载物是“全”：什么算赢的那把尺。“凡用兵之法，全国为上，破国次之……是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也”（《谋攻》）。杀得多、赢得漂亮，都不算数；把对面整体接过来、自己不留缺口，才算数。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：把“不知道”这个压力源本身拆掉。一边在庙算里把敌情变成可比的数——“经之以五事，校之以计而索其情”（《始计》）、“夫未战而庙算胜者，得算多也”；一边用间补上看不清的地方——“先知者……必取于人，知敌之情者也”（《用间》）。不让对方的虚实留在暗处。


          • 底线守护：凡不合于利者一律不动——“非利不动，非得不用，非危不战”（《火攻》），理由同一篇里给全了：“主不可以怒而兴师，将不可以愠而致战……亡国不可以复存，死者不可以复生。”红线也管上面下来的命令：“途有所不由，军有所不击，城有所不攻，地有所不争，君命有所不受”（《九变》）。


          • 共识凝聚：把上下的意志做成同一个——“道者，令民与上同意也，故可以与之死，可以与之生，而不畏危”（《始计》）。落到动作上是“视卒如婴儿，故可与之赴深溪”（《地形》）、“善用兵者，携手若使一人”（《九地》）。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 胜负在开打之前就已经算定；阵上做的那些，只是让对方把已经写下的结果认下来。
    vision:
      - 它把存续画在“能不能先算定胜负”上，所以看得见一战之内怎么不输，看不见一场仗之外的消耗：财政、生产、代际的亏空，它只拿“兵闻拙速”一句带过——这不是它错，只是它不负责。
      - 它看得见君、将、民怎样同心，看不见国里那些不肯同心的人：卒“可使”而“可愚”，个体的意愿与代价，未纳入。
      - 它看得见力量怎么用，看不见力量怎么长出来：田制、赋税、器械的产出，不在它的视野内。
    remainder:
      - “势”卡在突破与方向之间。作为造出落差、让石头从山上滚下来的那股力，它是突破；作为“求之于势，不责于人”的倚靠，它又像“该往哪儿使劲”的判准。两格都进得去。
      - “全”卡在方向与边界之间。作为“什么算赢”的尺，它是方向（全国为上，破国次之）；可它同时规定了这套方案要保的东西，又像边界。
      - “庙算”卡在源头改造与判准之间。它是对“不知道”这个压力源动手（算敌情、用间），可算出来的那个数本身，又是“能不能先胜”的判准。动手与量尺在这一处重合。
      - “君命有所不受”卡在底线与共识之间。它是守边界（将的裁断权不许被侵），可它要求的正是“上”与“将”可以不同心——与“令民与上同意”那一格，在同一部书里彼此拉扯。
      - “用间”卡在源头改造与代价之间。算敌情是改源（拆掉“不知道”），可“死间”要拿自己人出去送——那是代价，落在任何一格的“动作”之外。
    anchors:
      - k: 关键词
        v: 五事（道、天、地、将、法）、七计、庙算、诡道、先为不可胜、先胜、全、不战而屈人之兵、势、节、形、虚实、致人而不致于人、分数、形名、九变、乡导、用间、先知
      - k: 关键文本
        v: 《孙子兵法》十三篇——《始计》《作战》《谋攻》《军形》《兵势》《虚实》《军争》《九变》《行军》《地形》《九地》《火攻》《用间》；银雀山汉简本（1972 年出土）
      - k: 核心争议
        v: 作者与成书年代（孙武亲撰、战国成书、孙膑一派所作诸说）；十三篇是否即原本篇数；“全胜”是否等于“不战”；“诡道”与“义战”之争；与《吴子》《孙膑兵法》《六韬》的文本关系
