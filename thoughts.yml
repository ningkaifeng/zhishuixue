      题眼: 在最高价值失效、旧支柱全塌的条件下，一条生命靠什么还能往上走
      摘要: 系统边界＝生命力的上升；他要挡的是上帝死后人无处安放。三种力＝权力意志／永恒轮回的肯定／超人；三类动作＝重估一切价值／拒斥否定生命者／共识凝聚未见。
      边界①: 生命力的上升（能不能更强、更丰盈、越过此刻的样子）
      洪水②: 上帝死了，最高价值失效——人滑进虚无，或缩进末人
      三动能③: 权力意志·永恒轮回的肯定·超人
      三操作④: 重估一切价值·拒斥否定生命者·未见
      判断⑤: 生命力不保存，只周转——它得一次次重新挣出来；停下挣的那一刻，剩下的只是还能撑多久
      承重件落点: 个人修养（强度）
      三方状况: 文本档
      备注: 归目（后验）＝解释框架｜据“生命本身就是权力意志”；定义权＝事实或生命×弱
