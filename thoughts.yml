    border: 仁体（以仁为本体、万物关联共生的整体，非实体/心/理）
    flood: 仁体的遮蔽断裂（实体化/心化情化/隔绝化——本体从活关系到死规定）
    forces: 突破[生生之仁·辟（创生势）]·稳定[一体之仁·翕（成物势）]·方向[恕·他者优先（感通为作用方式）]
