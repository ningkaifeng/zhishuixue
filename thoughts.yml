      - q: 兼爱是「爱无差等」还是「利他即利己」？墨家算功利主义吗？学界有定论吗？
        a: 都没有定论。其一，兼爱是否「爱无差等」，与儒家「差等之爱」长期争论；其二，墨家是功利主义还是普遍利他主义，学界看法不一；其三，墨辩与先秦逻辑的关系、墨家何以在汉以后中绝，亦无定论。本显影不裁决这些争论，只提取「扩张—紧缩双驱」这一存续结构。
