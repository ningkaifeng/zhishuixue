    category: 解释框架
    naming: 上升存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统尼采研究（自哲学史、存在主义脉络到后现代解读）多把尼采读成“价值的批判者”“形而上学的爆破手”，重心在“他否定了什么”；治水学显影补充了存续维度的操作框架——尼采不仅是批判者，也是一套「上升存续系统」：生命靠自身上升的强度维持存续的守护结构。
    lead: 尼采（1844—1900），德国哲学家、古典语文学家、文化批评家，24 岁即任瑞士巴塞尔大学古典语文学教授，1879 年因病辞职，此后十年漫游写作，1889 年在都灵精神崩溃，1900 年于魏玛去世。用五段框架显影他，会浮现一个反直觉的事实：他真正关心的不是“哪些价值是真的”，而是“价值凭什么站得住、生命凭什么上升”。他不给你一套新道德，他给你一套“自己造价值、并且承受得住”的结构。
    sections:
      - k: ① 边界画在哪
        v: '尼采把存续单位画在“生命力的上升”上——不是灵魂、不是理性、不是来世、也不是共同体，而是“这条生命能不能更强、更丰盈”。

          承压者是生命本身（每一个会疲惫、会衰败的具体生命），承重件是“上升的能力”，即自我超越的强度。所以他的边界既不在“世界是什么”（形而上学），也不在“人应该怎样”（道德），而在“生命还能不能往上走”。'
      - k: ② 把什么当最大威胁
        v: '最大威胁是生命力的衰败，分三层：

          • 虚无主义：最高价值自行贬黜，“上帝已死”，价值空，目标没了；

          • 怨恨与奴隶道德：把弱者的复仇包装成道德，以贬抑强者、贬抑生命的方式保全自己——这是最隐蔽的一层，因为它伪装成“善”；

          • 末人：连渴望都没了，只要舒适与平安，不再想上升——不是被打败，而是自己不再想往上走。

          此外还有尼采自己批判的第二层失败：破掉旧价值却造不出新价值，停在“空”上，即消极虚无主义（破了不立）。这与佛学显影中的“顽空”是同一种结构：否定本身不该成为终点。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“权力意志”：生命自我超越、向外生长、创造新价值的力量。解决“能改变”：靠它才能拆掉旧价值、造出新价值。缺它：看穿了旧价值，却只能停在批判里。（坐标提醒：这里的“权力”不是政治统治权，而是生命自我提升的强度。）

          • 稳定性动能——承载物是“永恒轮回的肯定”（amor fati 热爱命运）：一切价值都要过一道检验——“你愿意这件事无限重复吗”？愿意才是真肯定，不愿意说明背后还藏着否定。注意：这不像“秩序／规则”那样是外部结构，而是自我确认——尼采的稳定靠自我肯定，不靠外部秩序，所以它是“内在的、可塌的”：一旦撑不住这份肯定，就退回怨恨与来世。

          • 方向性动能——承载物是“超人”：人不是终点，而是一道通往超人的桥梁；超人不是更强地占有一切，而是成为意义的创造者。解决“能定向”。缺它：有力量、有检验，却不知往哪上升。

          配置：权力意志（创造）驱动 → 永恒轮回的肯定（自我确认）维系 → 超人（意义创造）定向。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：重估一切价值。用谱系学把“善／恶”的来历翻出来（谁在什么处境下把它们叫“善”），从源头动手，而不是在旧价值内部修修补补。

          • 底线守护（硬字段）：拒斥否定生命者。凡以贬抑生命、寄望来世、以怨恨为底色的价值，一律排除。排除式红线：以否定生命为前提的，不算价值。

          • 共识凝聚：这一项恰恰是尼采的弱项。他明确不向广场上的群氓（他称之为“市场之蝇”）要共识，改为“对未来的读者说话”——如《查拉图斯特拉如是说》的副题“为一切人又不为任何人”，靠少数自由精神的共鸣来承接。故这一类操作在尼采这里近乎放弃，也构成下面检验中的存疑项。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: '生命靠自身的上升强度存续，不靠外部保证——上帝、道德、来世都不是承重件。旧价值塌了，任务不是去找一个新的外部支柱，而是自己造价值并承受得住：“上帝已死”之后，能上升的是超人，不能上升的是末人。

          检验：三种动能与三类操作的协同——权力意志（突破）、永恒轮回的肯定（稳定）、超人（方向）三项均可指认；三类操作中源头改造（重估价值）与底线守护（拒斥生命否定）可指认，共识凝聚一项偏弱（以少数读者替代共同标准）。故判为动力—规则部分协同，第三类操作存疑（这是尼采方案的真实特点，不是显影失误）。'
    remainder:
      - 【坐标提醒】“权力意志”不可读成“夺取统治权的意志”。把它读成侵占、征服、种族高低的强权论，是后人的政治挪用，不是显影所得——尼采去世后文稿由其妹伊丽莎白接管并整理出版，接受史中长期存在曲解与利用。
      - 永恒轮回的宇宙论论证（世界是否真的无限重复）不予处理，本文只取它作为肯定与检验的功能。
      - 遗稿问题：《权力意志》是笔记的编纂物，选编与排序本身可争议，不当作尼采“体系”的依据。
      - 视角主义的自指难题：“没有事实，只有解释”这句话本身是什么？超出显影。
      - 尼采的诗歌与格言文体、文学性，以及他对女性、民族的具体言论，不在存续结构之内。
