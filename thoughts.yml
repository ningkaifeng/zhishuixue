  - id: N-0013
    num: N-0013
    title: 相对论
    full_title: 相对论——实践学显影
    naming: 相对性存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统相对论研究（从爱丁顿 1920 的验证叙事、莱辛巴赫 1924 的同时性约定论，到派斯 1982 的科学传记、诺顿 1993 的哲学分析）多把相对论读成“时空观的革命”，重心在它推翻了什么；治水学显影补充了存续维度的操作框架——相对论不仅是一次观念革命，也是一套「相对性存续系统」：它要保的不是时空长什么样，是定律对谁成立。
    lead: 爱因斯坦（1879—1955），1905 年连发三篇论文，1915 年完成广义相对论。用五段显影它，会看见一个反直觉的东西：相对论不“相对”。它做的是反过来的事——把一切会因为观察者而变的东西剥掉，找出那个对谁都一样的量。名字叫相对，骨头里是“什么对所有人都一样”。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：物理定律对哪个参照系成立——有没有一个参照系比别人特殊。一旦承认存在一个绝对静止的参照系（以太、绝对空间），这一整套就没立足处：它全部的工作，就是把这个特殊位置从物理学里赶出去。这条线它写在 1905 年那篇论文的开头：凡是力学方程适用的坐标系，对电动力学和光学定律也同样适用。
      - k: ② 把什么当最大威胁
        v: 他要挡的是“两套物理互相拆台”：麦克斯韦的方程给出一个常数光速，牛顿的力学说速度可以相加——两条都成立，就必然有一个特殊的参照系在。可实验找不到它：迈克尔逊—莫雷反复测，测不到地球相对以太的漂移。后果他看在眼里：要么改力学，要么改电动力学，要么承认有个谁也找不到的以太；引力那边更麻烦——牛顿的超距作用要瞬时传递，比光还快，与刚立起来的相对论直接顶上。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“光速有限”：信号最快就是那么快，不可能瞬时到达。正因为要花时间，“同时”才不可能是绝对的——两处同时发生，换一个正在跑的人看，就不同时了。这一条是整个理论的起点。


          稳定性——承载物是“度规”（时空间隔）：不管怎么变换，那个数不动。时间会变慢，长度会缩短，可它们合起来算出的那个间隔，谁都改不了。整个理论能站住，靠的就是这个不动的量。


          方向性——承载物是“相对性原理”：物理定律对任何参照系都该是同一个样子，没有一个比别人特殊。这股劲推着他把物理学里一切“绝对”的东西逐个找出来拆掉。它顺带给出的尺是：谁的方程里藏着一个特殊参照系，谁就没写对。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：把“同时”从直觉换成能测的程序，再据此换掉度量时空的那把尺。两只钟怎么对、光来回一趟算多久，先把它定死；再把绝对时间与绝对空间从前提里拿掉。压力源是“两套物理打架”，动的办法是让两边共用一个能被测量的时空。


          • 底线守护：光速不变，一步不让。任何参照系测到的真空光速都是同一个 c——这条不许破。它一破，整套就退回伽利略变换。而正是这条不让，逼出了那些反直觉的结论：运动的钟会慢，运动的尺会短。


          • 共识凝聚（举证式）：把推论先算成数，摆出去让自然界来判。光线擦过太阳会偏多少、水星近日点每年多进多少、引力场里钟会慢多少，都先写下数，再等观测来对。不要求你信他，只要求你看那个数对不对得上。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 没有绝对的位置，只有不变的关系——站在哪儿、跑多快，看到的时间与长度都会变；不跟着这些变的东西，才是物理定律真正在说的。
    vision:
      - 它把存续画在“定律对哪个参照系成立”，所以看得见参照系之间的平权，看不见微观尺度上的事——量子世界那条路，它没有走进去，爱因斯坦本人到最后也不认那条路的解释。
      - 它看得见引力是时空的弯曲，看不见自己在哪里失效：方程推到奇点就断了，量子引力这一层，它自己知道到头了，未纳入。
      - 它看得见可测的效应，看不见那个常数为什么是那个值——光速不变它当前提用，不解释为什么偏偏是这个数。
    remainder:
      - “等效原理”没进任何一格。它既是把引力与加速度看成同一件事的判断，又是搭广义相对论的做法——先在最简单的加速系里把引力写出来，再推广出去。判断与做法在这一处合成一步，放哪边都少一半。
      - “宇宙常数”哪一格都装不下。它是爱因斯坦自己加进去的，为了保住一个静态的宇宙；观测显示宇宙在膨胀，他把它称作自己最大的错误。它既不是力，也不是动作，是三格之外临时塞进去的一块补丁。
    anchors:
      - k: 关键词
        v: 相对性原理、光速不变、同时性的相对性、洛伦兹变换、时空连续统、等效原理、广义协变性、引力场方程、水星近日点进动、光线偏折、引力红移、以太
      - k: 关键文本
        v: 《论动体的电动力学》（1905）、《物体的惯性同它所含的能量有关吗》（1905）、《广义相对论基础》（1916）、《狭义与广义相对论浅说》（1917）
      - k: 核心争议
        v: 以太是否被彻底排除，还是只是多余；同时性是物理事实还是测量约定（彭加勒、莱辛巴赫）；广义相对论与量子力学如何相容；宇宙常数是否该保留
    category: 解释框架
    border: 物理定律对哪个参照系成立——有没有一个比别人特殊
    flood: 麦克斯韦与牛顿互相拆台，以太又测不到；引力超距传递与相对论直接冲突
    forces: 突破［光速有限］·稳定［度规（时空间隔）］·方向［相对性原理］
    operations: 源改［把同时改成可测程序，再换掉时空的尺］·底线［光速不变］·共识［举证式：先算成数，等观测来对］
    judgment: 没有绝对的位置，只有不变的关系｜相对性存续系统
    note: 归目（后验）＝解释框架；规模＝宇宙；④举证式第三例（供预言）；③按“事实／结构／原则”三型切分，首篇
