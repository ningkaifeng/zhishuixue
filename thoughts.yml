      题材: 西方哲学（政治思想）
      题眼: 当君主随时可能被推翻、名分靠不住时，靠什么把人留在位上
      摘要: 马基雅维利把“保住国家”当作唯一目的，把判断标准换成实效：成了才算数。德能是自己的力，军队与法律是留下的装置，让人怕且不招恨是拢住预期的办法，命运占着另一半。
      边界①: 君主还掌不掌得住这个国家（mantenere lo stato）
      洪水②: 君主守不住国家：意大利的君主轮着被推翻，外族一再打进山南
      三动能③: 突破［德能］·稳定［良好的法律与良好的军队］·方向［实效］
      三操作④: 源改［趁天晴修堤］·底线［不碰财产妻女、不显得轻浮无能］·共识［演给人看：显出仁厚守信虔敬，以代价拢预期］
      判断⑤: 君主的国家不是靠名分保住的，是靠他自己能打、能算、能让人怕
      承重件落点: 制度（主）／个人修养（副）
      三方状况: 文本档
      备注: 归目（后验）＝系统方案；规模＝国家；九篇里唯一“人身存续”（承重押在一个人身上）；共识形态待议（不商量、不供给，只演给人看）
