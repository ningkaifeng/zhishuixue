  - id: N-0015
    num: N-0015
    title: 易经
    full_title: 易经——实践学显影
    naming: 变易存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统易学研究（从王弼 240 年前后《周易注》的扫象言理、程颐 1099 年《伊川易传》的以理释易，到朱熹 1175 年《周易本义》“易本卜筮之书”的还原、顾颉刚 1929 年起古史辨派对卦爻辞的史料化处理）多在象数与义理之间选边，或考订经传的年代层次；治水学显影补充了存续维度的操作框架——它也是一套「变易存续系统」：要保的不是哪个卦说对了，是一个处境在不断变化中还能不能找到自己此刻的位置。
    lead: 《周易》分经与传：经是六十四卦的卦象与卦爻辞，传是后人解经的十篇文字。用五段显影它，会看见一件事被“占卜之书”这层外衣盖住了：它真正在做的，是给“现在站在哪儿、下一步往哪儿”这件事，造一套能反复使用的说法。卦不是答案，是坐标。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一个处境此刻站在什么位置、接下来会往哪儿变——看不看得出这一层，决定它通还是穷。这条线画在“位置”上，不画在“对错”上：同一件事，在这个位置是吉，换个位置就是凶；早一步该动，晚一步就该停。它不问你做得对不对，只问你现在站在哪、这一步该不该迈。这套坐标一立起来，此前那种“事情好坏看运气”的说法就没地方放了——好坏不在事上，在位置上。
      - k: ② 把什么当最大威胁
        v: '它要挡的是“几”看不见。变化不是忽然发生的，是一点点起头的——几者动之微，吉凶的苗头就在那一点微动里。麻烦在于这一点太细：等人看清的时候，动的时机往往已经过去；再过一段就只剩“穷”——路走到尽头，回头来不及。整部书全部的功夫，都下在“还没成形的时候”能不能接住。


          所以它怕的不是做错某一步，是“晚”——判断本身不错，错在开口的时机。这一层它反复讲：该止的时候止，该行的时候行，动静都不失其时，道才光明。反过来说，一步走得再漂亮，晚了就是凶。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“爻”：这套系统里最小的可变单位。六个位置，每一位都能翻——阳翻成阴，阴翻成阳；翻一位，整个卦就变成另一个卦，格局跟着全换。它本来就是用来讲变的：爻者，言乎变者也。换任何一个处境，这个零件照样能动。


          稳定性——承载物是“六十四卦的框”：一套穷尽的形式，任何处境都安得进去，安进去就有名字、有位置，能和先前遇到的处境对上。处境千变万化，这个框不动，所以经验能一层层积下来——上一次这样摆是什么结果，这一次就能拿来比。去掉这个框，每一次都得从零描述，前后没法比，判断也就无从累积。


          方向性——承载物是“时”：不是时钟上的时间，是“该动的那一刻”。这股劲要求的是合于时——时止则止，时行则行。它顺带给出的尺是：做得再对，不合时也不算对；同样一步，早一步是吉，晚一步是凶。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：在微处先动。不等事情穷了再找路，在苗头刚起、还看不出什么的时候就调位置——压力源是“变化已成、来不及”，动的办法是把动作提前到别人还看不见理由的时候。这一处最难，因为它要求在一个还没有证据的时刻下手。


          • 底线守护：不许走到尽头。亢龙有悔——到了最高处还往上，就是过，过了就回不来。整套判断里最硬的一条是这个：宁可差一点，不许过头。守住它，等于守住还有退路的那一步；这一步一丢，后面全是下坡。


          • 共识凝聚（预设式）：靠一套大家都认的程序，不靠说服。五十根蓍草，分二、挂一、揲四、归奇，十八变成一卦——这套走法事先就摆在那里，谁来做都一样。程序走完，结果就成立：不必再争这个卦准不准，因为没人是自己挑的。共识不在结论上，在那套人人认的走法上。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 没有绝对的好坏，只有当下的位置——同一件事，早一步是吉，晚一步是凶。
    vision:
      - 它把存续画在“位置与时机的判断”上，所以看得见该动不动、走得顺不顺，看不见位置本身从哪儿来——制度、资源、技术这些把位置撑起来的东西，它没有位置。位置在它这里是被给定的，不是被造出来的。
      - 它看得见变化有开端，看不见变化的规模与速度——多大的变化、多快，它只给性质不给数量。一场小风波与一次天下大乱，可以用同一个卦，它不区分。
      - 它看得见一个人在某个位置上的取舍，看不见多个人怎么协商分歧——筮给了共同的程序，程序之外谈不拢的地方，它没有话。
    remainder:
      - “中正”没进任何一格。它是一套给爻排位次的判准——二爻五爻为得中，阴阳各居其位为当位；它筛的是“这一爻算不算好”，不决定“什么留得下来”。去掉它，已经立住的判断不会塌，只是新的吉凶排不出来。这是准入，不是留存，三格都不装。
      - “卦为什么能预告”这处跳跃，整套书没有交代。它把“象与事的对应”当既成事实用，从不论证——为什么这一卦就该应这件事，为什么揲蓍得出的结果能对上现实，一个字也没说。这不是它答得不好，是它没有答；这套方案最大的一处未结账在这里。
    anchors:
      - k: 关键词
        v: 变易、爻、卦、时、中正、当位、应、比、几、穷则变、象、辞、大衍之数、十翼
      - k: 关键文本
        v: 《周易》经传（六十四卦卦爻辞、系辞上下、说卦、序卦、杂卦）；马王堆帛书《周易》；王弼《周易注》；程颐《伊川易传》；朱熹《周易本义》
      - k: 核心争议
        v: 经与传的作者与年代；《易》本是卜筮之书还是哲理之书（朱熹与程颐的分歧）；象数与义理两派；卦变说能否成立；十翼中阴阳、五行、气等观念的层次叠压
    category: 辩证方法
