  - id: N-0017
    num: N-0017
    title: 墨子
    full_title: 墨子——实践学显影
    naming: 交利存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统墨学研究（从孙诒让 1894 年《墨子间诂》的文本整理、方授楚 1937 年《墨学源流》的学派考订，到李绍崑 1970 年代以后对墨辩逻辑与科学思想的重估）多在“思想主张”与“学派兴衰”两条线上做，重心是十论说了什么、墨家为何中绝；治水学显影补充了存续维度的操作框架——它也是一套「交利存续系统」：要保的不是哪条主张更有理，是一群没有根基的人还能不能站在一起。
    lead: 墨家是先秦唯一一个把学派办成了组织的。别的学派出书、收徒、游说，墨家出人、出器械、出守城的图纸。用五段显影它，会看见一件被“兼爱”这两个字盖住的事：它不是一套道德主张，是一份让一群没有土地的人在乱世里活下去的章程。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：一群没有土地、没有世袭、手艺在身的人，靠什么活下来，还能不散。这条线一划，亲亲尊尊那一套就用不上了——没有宗族可倚，没有封邑可守，剩下的只有三样：手上的技术、照着做的规矩、算得平的交换。这三样，正是后面三种动能各自的承载物。它不问你出自哪家，只问你还能不能跟这一伙人一起站着。
      - k: ② 把什么当最大威胁
        v: '第一样是“算不平”。这套组织要求人赴汤蹈火、死不旋踵，这个付出高到反常——赴汤蹈火是要死的，死这笔账怎么算都算不平：拿自己的命换别人家的安全，自己家就没了。所以撑住人的不是对等交换，是另一样东西：有鬼神在看着。多占的，鬼神记着；赴死的，鬼神看着。这笔亏账，靠一个看不见的第三方记成了盈。账本是真的，审计的人不在场。


          第二样是两条腿互相吃掉。这套组织还有一条：上之所是必皆是之，上之所非必皆非之。没有宗族可倚，就用绝对服从来替代血缘的权威。可这两条方向相反——账要人自愿，令要人服从；一切以上面为准，“两头都赚”就没了意义，赚不赚由上面说了算。横向的互惠与纵向的服从，在这套章程里从来没有真正并存过。


          第三样是外面打进来。这群人手艺在身、土地全无，是强国眼里现成的目标：打下来添一批百工，打不下来也没什么可赔。攻与守两边都得备着，一天不能松。'
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“守圉之术”：守城的器械与打法。公输盘九设攻城之变，他九次拒之；公输盘的攻械尽了，他的守圉还有余。这一手最硬：它不靠道理服人，靠一件东西挡得住另一件东西。


          稳定性——承载物是“法仪”：一套照着做就成的规矩。为方用矩，为圆用规，直用绳，正用县——不管巧手笨手，照这个做都做得出来。手艺靠天赋就只能传一代，有了法度才能一层层交下去；守城十一篇全是尺寸、人数、埋法，换个人照着也能重来一遍。去掉法仪，每个人只凭自己的手感，做出来的东西接不上手，经验也就断在这一代。


          方向性——承载物是“兴利除害”：凡让天下人得利的就推，凡亏人自肥的就挡。这股劲朝外不朝内——它要的不是这一伙人过得好，是天底下都过得下去。它顺带给出的尺是：看这一件事亏了谁、肥了谁——这把尺就是那笔账的量法；亏人愈多，其不仁愈甚，从偷桃李到攻人国，用的是同一根。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：改那个让人相攻的根——不相爱。天下一切祸乱，他归到这一处：各爱其家、不爱人之家，所以相攻。动的办法是上说下教：对在上者讲非攻之利，对在下者讲兼爱之实，两头一起改。压力源是“爱的分配方式”，动的不是某一次冲突，是冲突赖以发生的那个前提。


          • 底线守护：规矩不能绝，人可以死。孟胜守城，明知必死，仍带一百八十人一同死难，理由是不死则此后求严师者不再找墨者；腹䵍居秦，独子杀人，秦惠王已赦，他仍依墨者之法杀了自己的儿子。这两件事守的都不是城、不是子，是“墨者可以托付”这句话还作不作数。所以这条底线不是有没有人接，是接的人手里还有没有那套规矩——人死了规矩还在，组织就还在；规矩一破，人再多也是散的。


          • 共识凝聚（举证式）：拿三样东西让人自己查。任何主张，上要能对上古代圣王做过的事，下要能对上百姓耳目看到的实情，发出去还要能对上国家百姓的利。三样对不上，说得再好也不算。它不要求你信他，只要求你按这三条去验；验的人可以不同意他，却跳不过这套验法。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 一群人要长久，不靠血缘，不靠恩义，靠一笔算得平的账——可这笔账自己算不平，得有人替它记着。
    vision:
      - 它把存续画在“一个团体怎么活”上，看得见组织内部的账与规矩，看不见这套组织怎么长大——它没有给规模留位置。一个几十人、几百人的团体靠互认与法度能撑住，再往上，靠什么？它没有说。墨家始终是一个团体，没有变成一个国。
      - 它看得见技术在守城上的作用，看不见技术自己要更新——守城十一篇给的是定法，尺寸、人数、埋法全都定死，照着做就能重来，也正因为定死，它没有给“下次改法”留位置。
      - 它看得见账算得平的时候人怎么聚，看不见账算不平之后怎么办——账破了，它只有“非之”，批评那个多占的人，没有第二步：走的人还回不回来，剩下的人怎么补这个缺。
    remainder:
      - 账的担保人靠不住，这一层没进任何一格。天志明鬼把账记平了，可鬼神在不在看、记没记上，谁都验不了。信的人那里，账当场成立；身边出现一个不信的人，账当场作废——而且没有第二步可以补，这套章程只能请人相信鬼神在，不能证明鬼神在。
      - “墨经”六篇是另一根枝。名、辞、说的规则，加上几何、光学、力学的若干条，是这套方案里最硬的部分，可跟组织存续离得最远——它们既不是让人聚起来的账，也不是让手艺传下去的规矩。长在同一棵树上，吸的不是同一条根。
    anchors:
      - k: 关键词
        v: 兼爱、交相利、非攻、尚同、尚贤、节用、节葬、非乐、天志、明鬼、非命、三表、法仪、守圉
      - k: 关键文本
        v: 《墨子》（兼爱上中下、非攻上中下、尚同、尚贤、法仪、非命、公输、备城门以下十一篇、经上下与经说）、《淮南子·泰族训》、《吕氏春秋·去私》《上德》记巨子事、《墨子间诂》
      - k: 核心争议
        v: 墨家出于儒家还是独立起源；十论是否为一套完整纲领；墨辩与名家、印度因明、希腊逻辑的比较；明鬼究竟是宗教主张还是教化手段；墨家中绝的原因（组织形态与大一统不相容、苦行难遵、兼爱之说难行等诸说）
    category: 系统方案
    border: 一群没有土地、没有世袭、手艺在身的人，靠什么活下来、还能不散
    flood: 一、算不平（赴汤蹈火这笔账算不平，靠鬼神记成盈）；二、令与账互相吃掉（尚同vs交利）；三、外面打进来
    forces: 突破［守圉之术］·稳定［法仪］·方向［兴利除害］
