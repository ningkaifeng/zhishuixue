      - q: 佛学显影依据的原典是哪些？
        a: 以《阿含经》（原始佛教根本经典）、《心经》（「色即是空」）、《金刚经》（「法尚应舍，何况非法」）为主体；历史案例取佛陀菩提树下觉悟（缘起法）、僧团结集传法、佛教东传后与儒道融合（禅宗中国化）。显影只取这些文本中关于「如何离苦、如何维持」的结构，不作义理阐释。
        src: 厚度锚点·关键文本；厚度锚点·历史案例
      - q: 「解脱存续系统」这个命名是什么意思？
        a: 这是本显影给佛学取的结构命名。依据第⑤段结构判断「众生因无明执着困于苦；般若照破（突破）/戒律规范（稳定）/涅槃指引（方向）三项均可指认」——存续单位是解脱之道（众生如何离苦得乐的方法与传承），承重件会衰减、会断灭。命名取「解脱」作核心词，后缀「存续系统」为全库统一格式。注意：这里的「存续单位」是方便设施，不是佛学承认的实体。
        src: 正文①；正文⑤；命名
      - q: 为什么把「般若」算作突破性动能？佛学讲「反」，怎么会是「能改变」的力量？
        a: 佛学的表述层满是「反」（反执着、反本质、反意义），但剥开表述层看结构：「反执着」＝般若＝突破性动能，跟变异、变法、兼爱处在同一位置。般若还有一个独特机制——双重反：照破执着之后，连「照破」这一动作本身也破（空亦复空），防止把「空」变成新的执着。关键是不被论述层迷惑，要看表述层之下的结构。
        src: 正文③；备注
      - q: 佛学的「底线守护」守的是什么？「戒是船不是筏」怎么理解？
        a: 守戒律——不造恶业，守住底线。佛学舍的是「对戒的执取」（戒禁取见），不是「戒」本身：戒是船不是筏，船到彼岸才卸，中途卸了就沉。所以底线守护守的是「戒」这个过渡工具，而不是把「守戒」本身当成终极。
        src: 正文④
      - q: 什么是「顽空」？为什么破了执着的人也可能失败？
        a: 佛学认定两层威胁：其一是无明执着——众生把无常执为常、把无我执为我，起贪嗔痴、困于轮回；其二是顽空——即使破掉了执着，若停在「空」上（只反一重、不知空亦复空），「空」本身成了新的执着，解脱之道同样失效。这是佛学独特的失败模式。
        src: 正文②；正文③
      - q: 涅槃是「止息」还是「实有」？无我与轮回矛盾吗？学界有定论吗？
        a: 都没有定论。其一，涅槃是「止息」还是「实有」，长期争论；其二，「无我」与「轮回主体」如何统一，是佛教哲学的核心难题；其三，原始佛教与大乘的分野、大乘各宗（中观/唯识/禅宗/净土）对「空」的不同展开，亦无定论。本显影不裁决这些争论，只提取「解脱存续」的结构。
