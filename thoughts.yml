  - id: N-0005
    num: N-0005
    title: 论语
    full_title: 论语——实践学显影
    naming: 正名存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统论语研究（自何晏《集解》、朱熹《集注》，到近代的经学史与思想史研究）多把《论语》读成一部“伦理教诲集”或“君子修养指南”，重心在“人该成为什么样”；治水学显影补充了存续维度的操作框架——《论语》不只是一套教诲，也是一套「正名存续系统」：它要保的是每个位置上的名与实对得上。
    lead: 《论语》二十篇，由孔子弟子及再传弟子辑录，非孔子手著；多为短章，前后不连属。孔子（前 551—前 479），鲁国陬邑人。用五段显影它，会看见一个反直觉的东西：这部书最要紧的功夫不在“教人做好人”，而在“让每个位置上的名字重新对上它该有的事实”——名一乱，后面全乱。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：名分秩序——每个位置上的名与它该有的事实对不对得上。不是人的善心，不是国的富强，也不是礼器的多少。他把它写在“君君，臣臣，父父，子子”里（《颜渊》），也写在自己被问“奚先”时那句“必也正名乎”里（《子路》）。法家的农战、墨家的兼爱，都不是他要保的东西。
      - k: ② 把什么当最大威胁
        v: 他要挡的是名与实脱开：君不像君、臣不像臣，礼还在，人是拿它当排场用的。“孔子谓季氏：八佾舞于庭，是可忍也，孰不可忍也”（《八佾》）——舞的人没少，乐也没错，错在跳舞的人不配这个数。他给出的后果链写在《子路》：“名不正则言不顺，言不顺则事不成，事不成则礼乐不兴，礼乐不兴则刑罚不中，刑罚不中则民无所措手足。”一条乱，后面跟着全乱。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“学”，但这是三项里最薄的一条。学能让人在旧材料里读出新的东西：“学而时习之”（《学而》）；“温故而知新，可以为师矣”（《为政》）。可他“述而不作，信而好古”（《述而》）——只传述，不创造；能做的只是把旧东西在新处境里重新激活，造不出旧的里面没有的。这套方案的更新能力，就压在这一条薄线上：学不断，礼与仁才有新处境可用；学一断，剩下的就只是照旧例行礼。


          稳定性——承载物是“礼”：一套可重复、可照着做的关系刻度。冠婚丧祭、进退揖让，每一步都有定数，谁在什么位置做什么，不必临时商量。“不学礼，无以立”（《季氏》）；“克己复礼为仁。一日克己复礼，天下归仁焉”（《颜渊》）。


          方向性——承载物是“仁”：什么算好，那把尺。“樊迟问仁。子曰：爱人”（《颜渊》）；“夫仁者，己欲立而立人，己欲达而达人”（《雍也》）；“己所不欲，勿施于人”（《颜渊》）。一个人守礼守得再周全，若没有这一层，礼就是空壳——“人而不仁，如礼何”（《八佾》）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：正名。先把每个位置上的名分理顺，再谈别的——“名不正则言不顺”，往下全塌。落到具体处是“君使臣以礼，臣事君以忠”（《八佾》）：这一句把两边的名分同时说清，不是单方面要求。


          • 底线守护：非礼勿视，非礼勿听，非礼勿言，非礼勿动（《颜渊》）。四句都是排除式的：不做什么，比做什么更清楚。另一道是“君子固穷，小人穷斯滥矣”（《卫灵公》）——穷到极处也不许越过的那条线。


          • 共识凝聚：以德化人，不用命令。“为政以德，譬如北辰，居其所而众星共之”（《为政》）；“君子之德风，小人之德草，草上之风，必偃”（《颜渊》）。再往下是“道之以德，齐之以礼，有耻且格”（《为政》）——让人自己有羞耻心，而不是只怕刑罚。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 秩序能不能立住，看两件事对不对得上：每个位置上的名分是否名副其实，人心里是否有那一层肯；只靠刑罚撑着的秩序，名一乱就散。
    vision:
      - 它把存续画在“名分秩序”上，所以看得见人与人的关系对不对，看不见制度的技术细节：田制怎么分、兵制怎么编、刑律怎么写，它只说“足食足兵”，不说怎么做——这不是它错，只是它不负责。
      - 它看得见在位的人怎样以身作则，看不见不在位的人怎样改变秩序：希望放在君与君子身上，其余的人只能等风来。
      - 它看得见“应该怎样”，看不见“做不到时怎么办”：礼崩了，它仍说“知其不可而为之”，没有给失败留一条路。
    remainder:
      - “仁”卡在方向与稳定之间。作为“什么算好”的判准，它是方向；作为“克己复礼”的工夫，它又是让人站得住的秩序。两格都进得去。
      - “礼”卡在稳定与源头改造之间。作为可重复的秩序，它是稳定；可“正名”要动的正是礼所依托的名分——礼既是修的对象，又是修的工具。
      - “君子”分不清是承载物还是判准。他是理想人格（方向），又是教化的示范手段（操作）。同一个词，两格。
      - “孝弟”卡在共识凝聚与源头改造之间。它是“为仁之本”（从根上培养），又是维系家族秩序的方式（把散的人聚在同一套关系里）。
    anchors:
      - k: 关键词
        v: 仁、礼、正名、君子、小人、孝弟、忠恕、克己复礼、有耻且格、述而不作、温故知新、德风德草、固穷
      - k: 关键文本
        v: 《论语》二十篇，重点在《学而》《为政》《八佾》《里仁》《雍也》《颜渊》《子路》《卫灵公》《季氏》；参《礼记》《孟子》《荀子》；定州汉墓竹简本（1973）
      - k: 核心争议
        v: 成书与篇次（鲁论、齐论、古论之别）；仁有无统一定义；“克己复礼”的解法；“民可使由之，不可使知之”的断句；《论语》与出土文献的关系
    category: 系统方案
    border: 名分秩序（每个位置上的名与它该有的事实对不对得上）
    flood: 名实脱开——君不君、臣不臣，礼只剩排场
    forces: 学（最薄）·礼·仁
    operations: 正名·非礼勿视/听/言/动、君子固穷·以德化人
    judgment: 秩序能不能立住，看名分是否名副其实、人心里是否有那一层肯；只靠刑罚撑着的秩序，名一乱就散｜正名存续系统
    note: 归目（后验）＝系统方案｜据“为政以德，譬如北辰，居其所而众星共之”；定义权＝沿袭×强；突破性最薄
