thoughts:
  - id: X-0001
    num: X-0001
    title: 孙子兵法
    full_title: 孙子兵法——实践学显影
    category: 系统方案
    naming: 先胜存续系统
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统军事学研究（自曹操《孙子略解》以降的注家传统）将《孙子兵法》视为兵家战略经典；治水学显影补充了存续维度的操作框架——《孙子兵法》不仅是一套兵法，也是一套“先立于不败之地”的系统方案。
    lead: 《孙子兵法》十三篇，春秋末期孙武所作，六千余字，被后世奉为兵学圣典。用五段框架显影它，会浮现一个反直觉的事实：这部书真正的重心不在“怎么打赢”，而在“怎么先不输”——它是一套把“存续”摆在“胜利”之前的完整系统方案。
    sections:
      - k: ① 边界画在哪
        v: '孙子兵法把存续单位画在“国与军”这个整体上，不是个人，也不是某一场仗。

          开篇第一句就在定界：“兵者，国之大事，死生之地，存亡之道，不可不察也。”——战争是国家层面的事，关系的是“国”的死生、“国”的存亡。所以衡量一切用兵的标准，不是某位将领的荣辱，也不是某一次战斗的胜负，而是“这个国家、这支军队还存不存在”。

          正因为存续单位是“国与军”整体，孙子才把“不战而屈人之兵”看作最高境界——因为那样保住的不是一场胜仗，而是整个单位的完整。'
      - k: ② 把什么当最大威胁
        v: '孙子认的最大威胁，不是敌人，而是战争本身的耗损。

          他不把“敌人强”当作最大威胁，而是反复警告“战争本身的消耗”才是：“其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足……夫钝兵挫锐，屈力殚货，则诸侯乘其弊而起。”

          于是他把判断倒过来放：“不尽知用兵之害者，则不能尽知用兵之利也”——先看清“打这场仗会耗掉什么”，才谈得上“打这场仗能得到什么”。把“耗损”当作最大威胁，是孙子整套判断的起点。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“奇正”与“诡道”。“兵者，诡道也”“凡战者，以正合，以奇胜”。这是撕开局面、争取主动的那股劲。

          • 稳定性动能——承载物是“庙算”与“军形”。“夫未战而庙算胜者，得算多也”“先为不可胜，以待敌之可胜”“善战者，立于不败之地”。这是先把自己稳住、先立于不败的那股劲。

          • 方向性动能——承载物是“全胜”与“不战而屈人之兵”。“百战百胜，非善之善者也；不战而屈人之兵，善之善者也”“上兵伐谋，其次伐交，其次伐兵，其下攻城”。这是整套系统指出的最高方向——不是打赢，而是让存续本身不被破坏。

          配置的轻重一目了然：稳定性是基座，方向性是最高指向，突破性只是手段。孙子把最多笔墨放在“先不可胜”，把“诡道”始终压在“不败”之下。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：先胜而后求战。“胜兵先胜而后求战，败兵先战而后求胜。”——先把自己改造成“已经不可被战胜”的状态，再谈交战；而不是先打起来再看能不能赢。庙算多算、先为不可胜，都是从源头把胜势造好的操作。

          • 底线守护（硬字段）：慎战。“非利不动，非得不用，非危不战。主不可以怒而兴师，将不可以愠而致战。”——孙子守住的底线是“不轻易开战、不为情绪开战”。这套系统最怕的不是输，而是“怒而兴师”把整个国与军拖进耗损。守住这条底线，是整套方案的红线。

          • 共识凝聚：道。“道者，令民与上同意也，故可以与之死，可以与之生，而不畏危。”“上下同欲者胜。”——把上下的意愿统一成一股，是这套系统能运转起来的凝聚力量。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 系统存续的第一要务，是先把“不败”立在自己手里——先为不可胜，以待敌之可胜。能不能赢，不在自己，在于敌人给不给机会；但能不能不败，完全在自己。
    remainder:
      - 将帅的德性维度：“智、信、仁、勇、严”里的“仁”与“严”，是人格修养，不完全是可功能化的操作；
      - “势”的审美境界：“如转圆石于千仞之山”那种对力量蓄势的审美体认，超出结构提取的范围；
      - 慎战背后的生命伦理：对战争残酷性的悲悯与克制，不只是功利计算；
      - 兵家内部的争论与演变：孙武与孙膑、吴起等兵家的差异，显影取“孙子”一家，不做谱系。
    anchors:
      - k: 关键词
        v: 庙算、奇正、虚实、全胜、慎战、势
      - k: 关键文本
        v: 《始计篇》（五事七计）、《军形篇》（先为不可胜）、《谋攻篇》（不战而屈人之兵）、《虚实篇》（避实击虚）
      - k: 核心争议
        v: 《孙子兵法》的作者与成书年代（孙武作 vs 战国兵家托名，1972 年银雀山汉简出土为佐证）
      - k: 历史案例
        v: 吴宫教战（斩宠妃立军纪）、柏举之战破楚入郢（孙武佐吴伐楚）
    date: '2026-10-27'
    license: CC BY 4.0
    border: 国与军的存亡（国之大事，存续单位＝国家/军队整体）
    flood: 战争本身的耗损与不可控（久战钝兵、攻而不得、胜而师老）
    forces: 突破[奇正、诡道]·稳定[庙算、军形、先为不可胜]·方向[全胜、不战而屈人之兵]
    operations: 源改[先胜而后求战]·底线[慎战：非利不动、非得不用、非危不战]·共识[道：令民与上同意]
    judgment: 先为不可胜，以待敌之可胜（存续第一要务是先立于不败之地）｜先胜存续系统
    note: 第一篇；名取判断核心概念「先胜」（第②级）
    faq:
      - q: 《孙子兵法》最核心的一句话是什么？
        a: 先为不可胜，以待敌之可胜（军形篇）。能不能赢取决于敌人给不给机会，能不能不败则完全在自己。全书把「不败」放在「胜利」之前，这是它的判断起点。
        src: 正文⑤；③稳定性动能
      - q: 「不战而屈人之兵」出自哪一篇？
        a: 谋攻篇。原文「百战百胜，非善之善者也；不战而屈人之兵，善之善者也」。同篇给出用兵次序：上兵伐谋，其次伐交，其次伐兵，其下攻城。
        src: 正文③方向性动能
      - q: 孙子的「五事七计」指什么？
        a: 出自始计篇。五事＝道、天、地、将、法；七计＝主孰有道、将孰有能、天地孰得、法令孰行、兵众孰强、士卒孰练、赏罚孰明。战前据此比较敌我基本条件，即「庙算」。
        src: 厚度锚点·关键文本（原典内容展开）
      - q: 孙子为什么把战争耗损看得比敌人更强更危险？
        a: 作战篇「其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足」，又说「不尽知用兵之害者，则不能尽知用兵之利也」——先算清会耗掉什么，才谈得上能得到什么。
        src: 正文②
      - q: 《孙子兵法》的作者是谁？孙武和孙膑是同一个人吗？
        a: 通行说法为春秋末孙武所作，十三篇。1972 年山东临沂银雀山汉墓同时出土《孙子兵法》与《孙膑兵法》，证明是两书两人；成书年代仍有战国成书的讨论。
        src: 厚度锚点·核心争议
      - q: 「庙算」是什么意思？
        a: 指战前在庙堂上比较敌我条件（五事七计的推演）。「夫未战而庙算胜者，得算多也」——算得多的先有胜势，所以孙子主张「先胜而后求战」。
        src: 正文③④
    deprecated: true
  - id: X-0002
    num: X-0002
    title: 逻辑学
    full_title: 逻辑学——实践学显影
    category: 思维工具
    naming: 形式存续系统
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统逻辑学研究（如 Frege 1879, Russell 1903）将逻辑视为形式系统；治水学显影补充了存续维度的操作框架——逻辑不仅是形式系统，也是思维存续的守护结构。
    lead: 逻辑学，亚里士多德开创，研究“有效推理”的学问。他的逻辑著作被后世编为“工具篇”（Organon），两千余年被称作“一切学问的工具”。它显影出来的，不是某一套治国方案，而是一套保障“思维本身不垮”的工具系统。
    sections:
      - k: ① 边界画在哪
        v: '逻辑学把存续单位画在“思维的形式”上，不是世界、不是国家，而是“思维如何有效推演”。

          它不处理“世界是什么”，只处理“命题与命题之间的推演关系”。逻辑先于任何具体学科——一切学问动工之前，先要有这把工具。

          边界一画清，逻辑学就只管一件事：推理成不成立，与推理的内容是什么无关。'
      - k: ② 把什么当最大威胁
        v: '逻辑学认的最大威胁，不是“结论错”，而是“思维失效”——具体表现为三种：

          • 概念滑动：同一个词，前后含义飘移，推理看似连贯，实则偷换；

          • 自相矛盾：一个命题既真又假，思维在原地自我崩塌；

          • 无效推演：前提与结论之间没有必然联系，推了等于没推。

          即使结论碰巧对了，只要犯了这三样，推理仍不成立。这三种威胁，是逻辑学整套系统要盯住的东西。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“新的推理形式”与“符号化”：从亚里士多德三段论，到弗雷格的谓词逻辑、布尔代数。这股劲一次次把“能推理的范围”往外推。

          • 稳定性动能——承载物是“规则的稳定性”与“形式的可重复性”：规则不随内容变，推理才可靠。

          • 方向性动能——承载物是“真与有效性”：逻辑学追求的不是“说服”，而是“保真”——前提真，则结论必真。

          配置：稳定性是基座（规则先立），方向性是标尺（朝向真），突破性是扩展（不断形式化）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：定义。“把模糊概念变清晰”是逻辑学的起点——先划清一个概念的内涵外延，才谈得上推理。

          • 底线守护（硬字段）：守住思维形式的确定性——概念不许滑动、真假不许两可。三条铁律，三条“不许破”——

          • 同一律守概念：一个概念在同一推理中必须保持同一，不许滑动（防②的概念滑动）；

          • 矛盾律守真假：一个命题不能既真又假，不许自毁（防②的自相矛盾）；

          • 排中律守二值：一个命题要么真要么假，不许含混悬空，推理才有确定起点（防②的无效推演）。

          • 共识凝聚：公理 / 共许前提。推理需要大家共同接受的前提（公理、公设），没有共同的起点，推理无从展开。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 思维存续的第一要务，是形式有效——只要推理的形式对，前提为真则结论必真，与内容是什么无关。
    remainder:
      - “前提真伪”不管：逻辑学只管形式有效，前提真不真交给具体学科；
      - 创造性思维接不住：灵感、类比、直觉、洞察，不是形式推理能覆盖的；
      - 价值维度接不住：逻辑学不回答“该不该”“好不好”，只管“成不成立”；
      - 逻辑学的内部之争：形式逻辑 vs 辩证逻辑、经典逻辑 vs 非经典逻辑，显影取“形式逻辑”主流，不做谱系。
    anchors:
      - k: 关键词
        v: 三段论、矛盾律、有效、形式、真、谬误
      - k: 关键文本
        v: 亚里士多德《工具论》（《范畴篇》《解释篇》《前分析篇》《后分析篇》《论题篇》《辩谬篇》）、《形而上学》（矛盾律）
      - k: 核心争议
        v: 形式逻辑 vs 辩证逻辑；逻辑一元论 vs 多元论（经典 vs 非经典逻辑）
      - k: 历史案例
        v: 欧几里得《几何原本》（公理化演绎体系的典范）、罗素悖论与《数学原理》
    date: '2026-10-27'
    license: CC BY 4.0
    border: 思维的形式（只管推理是否成立，与推理内容无关）
    flood: 思维失效（概念滑动、自相矛盾、无效推演）
    forces: 突破[新推理形式、符号化]·稳定[规则的稳定性、形式的可重复性]·方向[真与有效性]
    operations: 源改[定义]·底线[守住思维形式的确定性：同一律守概念/矛盾律守真假/排中律守二值]·共识[公理、共许前提]
    judgment: 形式有效——形式对、前提真则结论必真，与内容无关｜形式存续系统
    note: 第二篇；归目＝思维工具；名取边界词「形式」（第①级）
    faq:
      - q: 逻辑学的三条基本规律是什么？
        a: 同一律（一个概念在同一推理中必须保持同一）、矛盾律（一个命题不能既真又假）、排中律（一个命题要么真要么假）。三条合起来守住「思维不自我崩塌」。
        src: 正文④底线守护
      - q: 三段论是谁提出的？
        a: 亚里士多德。他的逻辑著作被后世编为《工具论》（Organon），三段论的格与式见《前分析篇》。
        src: 正文③；厚度锚点·关键文本
      - q: 「逻辑是工具」是什么意思？Organon 是什么？
        a: 亚里士多德的逻辑著作被后世编纂为《工具论》（Organon），「工具」一名系后人所加——意思是一切学问动工之前，先要有这把工具，所以逻辑先于任何具体学科。
        src: 正文①；导语
      - q: 形式逻辑和辩证逻辑有什么区别？
        a: 形式逻辑只管推理形式是否有效（前提真则结论必真），不问内容；辩证逻辑把矛盾当作运动的内在动力，不视为必须排除的失效。本文显影取形式逻辑主流，不做谱系。
        src: 厚度锚点·核心争议；正文⑤
      - q: 结论正确、推理无效，算不算成立？
        a: 不算。结论碰巧正确但推理无效，仍然失败。逻辑学管的是「形式有效」——只要推理形式对，前提为真则结论必真，与内容是什么无关。
        src: 正文②⑤
      - q: 布尔和弗雷格对逻辑学做了什么？
        a: 把逻辑符号化、形式化：布尔代数把逻辑运算代数化，弗雷格的谓词逻辑引入量词与谓词分析，使「能推理的范围」从三段论扩张到关系与量化命题。
        src: 正文③突破性动能
    deprecated: true
  - id: X-0003
    num: X-0003
    title: 辩证法
    full_title: 辩证法——实践学显影
    category: 辩证方法
    naming: 扬弃存续系统
    limit: 本文只提取该方案在“系统存续”问题上的判断结构，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统黑格尔研究（如 Charles Taylor 1975《Hegel》）将辩证法视为思辨的哲学方法；治水学显影补充了存续维度的操作框架——辩证法不仅是思维方法，也是“守住精神不僵化”的辩证方法。
    lead: 黑格尔（1770—1831），德国古典哲学集大成者。他以“绝对精神”的自我展开为轴，把整个世界理解为一个自我运动、自我认识的总体过程。用五段框架显影，会看到一套“以扬弃矛盾来保住精神不僵死”的辩证方案。
    sections:
      - k: ① 边界画在哪
        v: '辩证法把存续单位画在“精神”上——不是个人、不是国家，也不只是认识，而是“精神如何自我展开、自我认识、自我实现”的整个运动。

          他有一句总纲：“真理是全体”（Das Wahre ist das Ganze）——任何孤立的部分都是抽象的、不真实的，唯有作为整体的精神，才是真实的存续单位。'
      - k: ② 把什么当最大威胁
        v: '黑格尔认的最大威胁，不是错误，也不是外敌，而是“精神的僵化与分裂”——停留在片面的知性层面，把对立固定化，不肯前进：

          • 僵化：停在正题或反题上，把某一规定绝对化；

          • 分裂：主体与客体、理性与现实的割裂（他批评康德式二元）；

          • 外在化：精神不认识自身，把自身产物当作异己之物。

          三者本质是一个：精神停止了自我运动。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“内在否定性”。矛盾不是要消除的麻烦，而是“一切运动和生命力的根源”，它推动精神否定自身、向前走。

          • 稳定性动能——承载物是“概念的规定性”。每个环节都有确定的规定（Bestimmtheit），体系靠这些规定保持结构，不至于滑成空无。

          • 方向性动能——承载物是“自由”。黑格尔说世界历史是“自由意识的进展”，绝对精神自我实现就是自由的最高形态。

          配置：突破性是引擎（矛盾推动），稳定性是骨架（规定保持），方向性是归宿（自由）。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：辩证法 / 扬弃（Aufhebung）。这是黑格尔最核心的操作——不是消灭矛盾，而是“否定同时保存并提升”，把对立双方带到一个更高的合题里。从内在矛盾出发改造，而不是从外部强加。

          • 底线守护（硬字段）：守住不僵化的红线——任何环节都不得被当作终点，必须始终保留被继续扬弃的可能。

          • 共识凝聚：理性（Vernunft）。用概念把握整体，达到“思有同一”——思维与存在的同一，让分散的规定凝成一个可理解的总体。'
      - k: ⑤ 压成一句什么判断（关键判断结构）
        v: 精神存续的第一要务，是不怕矛盾、在矛盾中前进——精神的生命不是回避否定，而是“承受死亡并在其中保存自身”，通过不断扬弃，在更高环节里既否定又保存。
    remainder:
      - 体系的封闭性：黑格尔的“绝对精神”宣称体系已完成，后世（如波普尔）质疑其封闭、不容未来；
      - 逻各斯中心：以逻辑 / 概念为最高，情感、身体、实践中的非概念维度接不住；
      - 历史的代价：辩证法把历史的苦难纳入“理性的狡黠”，个体苦难是否被“扬弃”合理化，超出结构提取；
      - 黑格尔学派的分裂：老年黑格尔派 vs 青年黑格尔派（含马克思的翻转），显影取“黑格尔本人体系”，不做谱系。
    anchors:
      - k: 关键词
        v: 绝对精神、扬弃、辩证法、矛盾、自由、全体
      - k: 关键文本
        v: 《精神现象学》（主奴辩证法、“真理是全体”）、《逻辑学》（存在论 / 本质论 / 概念论）、《法哲学原理》（“凡是合理的都是现实的”）
      - k: 核心争议
        v: 体系封闭 vs 开放；辩证法是否可“翻转”（马克思）；“理性的狡黠”与历史苦难
      - k: 历史案例
        v: 拿破仑战争中的黑格尔（称拿破仑为“马背上的世界精神”）、柏林大学讲席与普鲁士国家哲学
    date: '2026-10-27'
    license: CC BY 4.0
    border: 精神（绝对精神的自我展开；真理是全体）
    flood: 精神僵化与分裂（僵化、分裂、外在化）
