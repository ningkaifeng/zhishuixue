    faq:
      - q: 尼采显影依据的原典是哪些？
        a: 以《查拉图斯特拉如是说》（1883—1885，超人、末人、永恒轮回）、《快乐的科学》（1882、1887 增订，上帝已死、永恒轮回、amor fati）、《善恶的彼岸》（1886，权力意志）、《论道德的谱系》（1887，怨恨与奴隶道德）、《偶像的黄昏》（1888，重估一切价值）为主体。显影只取这些文本中关于「生命如何上升、如何维持」的结构，不作义理阐释，也不介入尼采思想分期的争论。
        src: 厚度锚点·关键文本
      - q: 「上升存续系统」这个命名是什么意思？
        a: 这是本显影给尼采取的结构命名。依据第⑤段结构判断「生命靠自身的上升强度存续、不靠外部保证」——存续单位是生命力的上升（不是灵魂、理性、来世或共同体），承重件是自我超越的强度，它会衰减、会塌。命名取「上升」作核心词，后缀「存续系统」为全库统一格式。注意：这里的「存续单位」是显影的方便说法，不是尼采本人使用的概念。
        src: 正文①；正文⑤；命名
      - q: 「上帝已死」是尼采本人直接下的断言吗？
        a: 出自《快乐的科学》第 125 节，由「疯子」在市场上向人群宣告，不是尼采以第一人称直接断言；第 108 节另有提及。疯子宣告之后反问「我们岂不正是在把这一切吞下去吗」，结尾说「我来得太早，我的时辰还没到」。学界一般不把它简化为一句无神论口号，而读作对价值根基崩塌的诊断。显影取的是「旧承重件失效」这一层结构，不取反宗教立场。
        src: 厚度锚点·关键文本；备注
      - q: 「权力意志」是尼采自己定稿出版的著作吗？
        a: 不是。以《权力意志》为书名的版本是遗稿编纂本（1901 年初版、1906 年扩编），由妹妹 Elisabeth Förster-Nietzsche 与 Heinrich Köselitz 编成，学界普遍认为编纂带有系统性取舍。这一概念本身散见《查拉图斯特拉如是说》《善恶的彼岸》《快乐的科学》。本显影按「自我超越、创造新价值」这一层结构用法，不采编纂本把它读成一套形而上学的读法，也不取政治强权义。
        src: 厚度锚点·核心争议；正文③；剩余物
      - q: 「永恒轮回」和「amor fati」出自哪里？
        a: 永恒轮回的系统表述首见《快乐的科学》第 341 节「最重的重量」，后在《查拉图斯特拉如是说》展开；amor fati（热爱命运）见《快乐的科学》第 276 节，亦见《瞧，这个人》。显影把两者放进稳定性动能——它不是被动接受命运，而是「愿意重来一次」的自我确认；正因为这种确认完全来自内部、不靠外部秩序，所以它是可塌的。
        src: 厚度锚点·关键文本；正文③
      - q: 为什么把「权力意志」算突破性动能、「永恒轮回的肯定」算稳定动能？
        a: 判据是「靠什么产生改变、靠什么持续」。权力意志的落点是自我超越、创造新价值，直接把「什么算价值」重写，属能改变；永恒轮回的肯定的落点是自我确认，让新价值立住之后不至于四散，属能持续；超人是「人给自己立法」的方向感，属能定向。三者不可互替：只有权力意志会造完就散，只有肯定则守旧，只有超人则悬空。另需区分：稳定不等于外部秩序，尼采的稳定是内在的、可塌的，这正是它与礼制那类稳定动能的分野。
        src: 正文③；备注
