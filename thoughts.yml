    title: 尼采
    full_title: 尼采——实践学显影
    naming: 上升存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统尼采研究（洛维特 1935 的永恒轮回解读、海德格尔 1961 的形而上学解读，到德勒兹 1962 及后现代诸家）多把尼采读成“价值的批判者”“形而上学的爆破手”，重心在“他否定了什么”；治水学显影补充了存续维度的操作框架——尼采不仅是批判者，也是一套「上升存续系统」：它要保的不是人活着，是一条生命还能不能往上走。
    lead: 尼采（1844—1900），德国哲学家、古典语文学家，代表作《查拉图斯特拉如是说》。用五段显影他，会看见一个反直觉的东西：他真正在回答的不是“哪些价值是真的”，而是“一条生命凭什么还在往上走、拿什么才不至于停下来”。他没给人一套新道德，给的是一套自己造价值、并且承受得住自己造出来的东西的结构。
    sections:
      - k: ① 边界画在哪
        v: 系统边界：生命力的上升——这条生命能不能更强、更丰盈、更能越过它此刻的样子。不是灵魂，不是理性，不是来世，也不是共同体。他把这一条写在“人是一种应当被克服的东西”里（《查拉图斯特拉如是说》序言）。
      - k: ② 把什么当最大威胁
        v: 上帝死了——最高价值自行失效，原来撑着人的那几根柱子（道德、来世、理性）都不再管用。后果有两样：人滑进虚无（什么也不值得为之，什么也不值得反对），或者缩进末人（只要舒适与平安，连想往上走的念头都没了）。
      - k: ③ 靠什么推动（三种动能）
        v: '突破性——承载物是“权力意志”：生命自我超越、向外生长、创造新价值的那股力。此处“权力”不是政治统治权，是自我提升的强度。


          稳定性——承载物是“永恒轮回的肯定”（amor fati，热爱命运）：一切价值要过一道追问——你愿意这件事无限重复吗？愿意，才算真肯定。“假如某个恶魔潜入你最孤独的孤独中对你说：‘你现在和过去的生活，将再来一次，再来无数次’……”（《快乐的科学》341）。这一项给的不是外部秩序，而是自我确认——它不约束任何人，只约束自己；只能靠反复肯定维持，一旦不再肯定，什么都不剩。


          方向性——承载物是“超人”：人不是终点，是通往超人的一道桥；超人不是更强地占有一切，是意义的创造者。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：重估一切价值——用谱系学把“善／恶”的来历翻出来，谁在什么处境下把它们叫作善、为什么（《论道德的谱系》1887）。不在旧价值内部修补，直接动源头。


          • 底线守护：拒斥否定生命者——凡以贬抑生命、寄望来世、以怨恨为底色的价值，一律排除。以否定生命为前提的，不算价值。


          • 共识凝聚：本篇未见其承载物。这套方案画在个体生命的上升上，没有为“多人之间怎么办”留位置——不设共同标准、不建共同体、不要求被谁接受。这一层在他的方案里不产生。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 生命力不保存，只周转——它得一次次重新挣出来；停下挣的那一刻，剩下的只是还能撑多久。
    vision:
      - 它把存续画在“生命力的上升”，所以看得见个体的强度与衰败，看不见制度、组织、代际传承——这不是它错，只是它不负责。
      - 它看得见“强者如何不塌”，看不见“平庸者如何也能活”。对大多数人，它给的是要求，不是一个可以走进去的位置。
      - 它看得见价值的来历，看不见价值的公共性：谁能定标准、标准怎么在多人之间被承认，这一层不在它的视野内。
    remainder:
      - “永恒轮回”卡在稳定与方向之间。作为“你愿意这件事无限重复吗”的检验，它是稳定——让造出来的价值站得住；作为热爱命运（amor fati），它是方向——怎么对待自己这一生。两格都进得去。
      - “权力意志”卡在突破与方向之间。作为创造新价值的那股力，它是突破；作为“生命要往上”的指向，它又像方向。归了突破，“往上”那层方向感就被压薄。
      - “末人”分不清是洪水还是判准。它既是“要挡的那件事”的一个形态，又是“什么算没上升”的尺子（拿它跟超人对照着看）。
      - “重估一切价值”卡在源头改造与底线之间。拆旧价值是改源；可拆的标准是“是否否定生命”，那是守界。拆与守在这一处重合。
