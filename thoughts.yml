  - id: X-0010
    num: X-0010
    title: 阴阳五行
    full_title: 阴阳五行——实践学显影
    category: 解释框架
    naming: 平衡存续系统
    limit: 本文只提取该方案在“系统存续”问题上的结构判断，不解释文本本意，不评价思想高低，不处理历史演变与内部争论，不替代原典阅读。显影是入口，不是出口。
    dialogue: 传统学术研究（自《尚书·洪范》《黄帝内经》以降，哲学史／科学史／中医史）将阴阳五行视为中国古代的宇宙观或朴素唯物论；治水学显影补充了存续维度的操作框架——阴阳五行不仅是对世界构成的解释，也是一套“万物关系如何存续”的结构判断。
    lead: 阴阳五行是中国古代最系统的宇宙解释框架，源于先秦，成熟于战国至汉代。它不靠“物质＋定律”解释世界，而靠“阴阳交感＋五行生克”解释万物关系。用五段框架显影它，会浮现一个反直觉的事实：这套框架真正关心的不是“万物是什么”，而是“万物关系如何平衡”——它不描述个体，它描述关系网络。
    sections:
      - k: ① 边界画在哪
        v: '阴阳五行把存续单位画在“万物关系的整体”上——不是某一个具体事物，而是“阴阳交感、五行生克所构成的万物关系整体”。

          它要解释的不是“这个事物是什么”，而是“万物之间如何相互关联、相互制约、相互转化”——一个由阴阳五行关系网络构成的、自我调节的宇宙整体。

          所以存续单位是关系的整体：保住的不是某个个体，而是关系网络的平衡。'
      - k: ② 把什么当最大威胁
        v: '阴阳五行认的最大威胁，是“关系的失衡”——阴阳失调、五行失序：

          • 阴阳失调：阴盛阳衰或阳盛阴衰，乃至“阴阳离决”（《内经》：阴阳离决，精气乃绝）；

          • 五行失序：生克失常——太过则相乘、不及则反侮，某一行过强过弱，破坏生克平衡；

          • 气机壅滞：五行之气不通，升降出入失常。

          三者本质是一个：关系网络的平衡被破坏——阴阳不交、五行不转，整体就崩解。判断的中心是“关系是否平衡”，不是“个体是否完好”。'
      - k: ③ 靠什么推动（三种动能的承载物与配置）
        v: '• 突破性动能——承载物是“阴阳交感”。解决“能改变”：阴阳消长转化，是万物产生和变化的力量。缺它：有秩序有方向，却没有变化之力。

          • 稳定性动能——承载物是“五行生克的秩序”。解决“能持续”：相生相克构成自我调节的平衡系统，让关系网络维持稳态。缺它：有动力有方向，却守不住平衡。

          • 方向性动能——承载物是“五行取象的归类标准”。解决“能定向”：按木火土金水的功能属性给万物定位。缺它：有动力有秩序，却搞不清谁属什么、该往哪配。

          配置：以“平衡”统摄——阴阳交感（动力）驱动 → 五行生克（秩序）维衡 → 取象归类（标准）定方位。'
      - k: ④ 用什么操作（三类规则操作）
        v: '• 源头改造：调和阴阳。作用对象＝压力源（阴阳失衡），动作＝阴盛则抑阴扶阳、阳盛则抑阳扶阴，让阴阳回到交感。

          • 底线守护（硬字段）：抑亢扶弱、守住平衡。作用对象＝系统边界（平衡的底线），动作＝阴阳不得离决、五行不得独亢——某一行过亢则乘其所胜、侮其所不胜，必抑之。

          • 共识凝聚：取象比类。作用对象＝主体间关系（万物之间的对应关系），动作＝按功能属性把万物归入五行、建立天人对应的协同网络。此处“共识”不是意见的共识，而是“万物各归其类、同气相求”的秩序认同——通过取象比类，让万物都能对号入座、各安其位。'
      - k: ⑤ 压成一句什么判断（结构判断）
        v: 万物存续靠关系平衡、不靠孤立自存——阴阳交感、五行生克、各归其类；失衡则病、平衡则安，一切调理都在调关系。
    remainder:
      - 五行的“取象”边界：哪些事物归哪一行，历代有争议（如“土”居中央还是配长夏），显影不处理具体归类；
      - 五德终始说的政治应用：邹衍以五行相克解释朝代更替，属应用衍生，不纳入；
      - 中医的五运六气：五行在医学的具体推演（太过不及、乘侮），属操作手册层；
      - 与现代科学的可检验性：五行是“取象”而非“可证伪命题”，用现代科学标准衡量会失焦——这是两种解释框架的边界，超出显影。
    anchors:
      - k: 关键词
        v: 阴阳、五行、相生相克、取象比类、阴阳离决、五德终始
      - k: 关键文本
        v: 《尚书·洪范》（五行最早系统论述）、《黄帝内经》（“阴阳者，天地之道也”）、《吕氏春秋》《淮南子》、邹衍五德终始说
      - k: 核心争议
        v: 五行是物质还是功能属性（取象）；阴阳五行是否科学；五行配属争议（土居中 vs 配长夏）
      - k: 历史案例
        v: 邹衍五德终始（秦为水德、克周之火德）；中医五行配五脏（肝木、心火、脾土、肺金、肾水）
    date: '2026-11-01'
    license: CC BY 4.0
    border: 万物关系的整体（阴阳交感＋五行生克构成的关系网络，非某个个体）
    flood: 关系失衡（阴阳失调、五行失序——太过相乘/不及反侮、气机壅滞）
    forces: 突破[阴阳交感]·稳定[五行生克的秩序]·方向[五行取象的归类标准]
    operations: 源改[调和阴阳：抑阴扶阳/抑阳扶阴]·底线[抑亢扶弱·守住平衡：阴阳不离决、五行不独亢]·共识[取象比类：万物各归其类、秩序认同]
    judgment: 万物存续靠关系平衡、不靠孤立自存——阴阳交感、五行生克、各归其类；失衡则病、平衡则安，一切调理都在调关系
    note: 第十篇；归目＝解释框架（第四篇·首篇中国解释框架）；名取核心概念「平衡」（第②级）；与易经同用阴阳符号但角度不同（易经=变易/辩证方法，五行=构成/解释框架）；共识凝聚加限定＝秩序认同非意见共识
    faq:
      - q: 「阴阳」和「五行」分别最早见于哪部典籍？何时合流？
        a: 「阴阳」二字连用最早见于《国语·周语》（伯阳父论地震：阳伏而不能出，阴迫而不能烝），作为哲学范畴的系统表述在《周易·系辞》与《黄帝内经》；「五行」最早的系统论述见《尚书·洪范》（水曰润下、火曰炎上、木曰曲直、金曰从革、土爰稼穑），本是治水治土经验中提炼的五类材用。两者原为两套体系，战国至汉（邹衍、董仲舒）才合流为一。
        src: 厚度锚点·关键文本
      - q: 「平衡存续系统」这个命名是怎么取的？
        a: 按显影的命名规则取第⑤段结构判断的核心概念。判断句是「万物存续靠关系平衡」，核心词落在「平衡」；边界词「万物关系」太宽泛、不具区分度，故不用边界词命名，而取核心概念。「平衡」在这套框架里不是静态的均等，而是阴阳交感、五行生克自我维系的动态平衡。
        src: 正文⑤；厚度锚点·关键词
      - q: 五行「相生相克」具体指什么？在显影里对应什么？
        a: 相生＝木生火、火生土、土生金、金生水、水生木（滋养链）；相克＝木克土、土克水、水克火、火克金、金克木（制约链）。显影中它是稳定性动能的承载物——「五行生克的秩序」，让关系网络能自我维持：一味相生则亢（太过），只有相克才拉得住，故必须生克并存。
        src: 正文③稳定性动能
      - q: 五行到底是五种物质，还是五种功能属性？
        a: 这是学界的长期争议。取象说的主流读法是功能属性／关系类型，不是五种实体元素——「金」不必是金属，「土」不必是泥土，而是各自代表的运动趋向与关系角色。显影取功能属性读法，正因如此它才能充当「归类标准」（方向性动能的承载物）：万物各归其类，靠的是属性相似而非质料相同。
        src: 厚度锚点·核心争议；正文③方向性动能
      - q: 邹衍的「五德终始」和五行是什么关系？为什么显影不纳入？
        a: 战国邹衍以五行相克解释王朝更替（如秦自认水德、克周之火德），是五行在政治上的应用衍生，不是框架本身。显影把它列入「剩余物」，因为这是应用推演，超出「存续结构」的提取范围——显影只取框架的结构判断，不取后代的一切用法。
        src: 剩余物；厚度锚点·历史案例
      - q: 同用阴阳符号，为什么《易经》归「辩证方法」、阴阳五行归「解释框架」？
        a: 两者共用阴阳符号，但取的角度不同。《易经》的核心是「变易」——六十四卦讲变化如何来临、人如何因时顺势，属辩证方法；阴阳五行的核心是「构成」——用阴阳交感＋五行生克描述万物由什么样的关系构成，属解释框架。同一套符号可以显影出不同侧面，归目不冲突。
        src: 备注；正文①
